<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Campusora | Join the Community</title>

<style>
:root {
  --bg: #080b18;
  --purple: #925bff;
  --blue: #526dff;
  --cyan: #39d7f5;
  --muted: #788198;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 10%, #29164e 0, transparent 35%),
    radial-gradient(circle at 90% 90%, #102c48 0, transparent 35%),
    var(--bg);
  color: white;
  font-family: "DM Sans", Arial, sans-serif;
}

/* OPENING SCREEN */

.splash {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  background:
    radial-gradient(circle at 10% 10%, #29164e 0, transparent 40%),
    radial-gradient(circle at 90% 90%, #102c48 0, transparent 40%),
    var(--bg);
  transition: opacity .7s ease, visibility .7s ease;
}

.splash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* LOGO BACKGROUND BLENDING
   Keeps the logo colours bright.
   Blends darker background pixels into the page.
*/

.splash-logo,
.brand img {
  display: block;
  object-fit: contain;
  background: transparent;
  border: 0;
  box-shadow: none;
  filter: none;
  mix-blend-mode: lighten;
}

/* OPENING LOGO */

.splash-logo {
  width: min(230px, 68vw);
  max-height: 125px;
  opacity: 0;
  transform: translateY(-100vh);
  animation: campusoraIntro 7.5s cubic-bezier(.2,.75,.25,1) forwards;
}

@keyframes campusoraIntro {
  0% {
    opacity: 0;
    transform: translateY(-100vh) rotate(0deg);
  }

  20% {
    opacity: 1;
    transform: translateY(0) rotate(0deg);
  }

  60% {
    opacity: 1;
    transform: translateY(0) rotate(360deg);
  }

  100% {
    opacity: 1;
    transform: translateY(0) rotate(360deg);
  }
}

.splash-tagline {
  margin-top: 18px;
  color: #e0e5f7;
  font-size: 13px;
  letter-spacing: .3px;
  text-align: center;
}

/* MAIN PAGE */

.page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 14px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .65s ease;
}

.page.show {
  opacity: 1;
  visibility: visible;
}

.container {
  width: 100%;
  max-width: 390px;
}

.brand {
  text-align: center;
  margin-bottom: 13px;
}

.brand img {
  width: 190px;
  max-height: 85px;
  margin: 0 auto;
}

.brand p {
  color: #c0c9df;
  margin-top: 6px;
  font-size: 11px;
}

/* WHITE CARD */

.card {
  width: 100%;
  background: #fff;
  color: #171b2b;
  border-radius: 17px;
  padding: 18px 19px 16px;
  box-shadow: 0 20px 65px rgba(0,0,0,.32);
}

.tabs {
  display: flex;
  gap: 5px;
  padding: 4px;
  border-radius: 10px;
  background: #f0f1f7;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  border: 0;
  border-radius: 8px;
  padding: 9px;
  background: transparent;
  color: #697188;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.tab.active {
  color: white;
  background: linear-gradient(110deg, var(--purple), var(--blue));
}

h2 {
  color: #171b2b;
  font-size: 20px;
  margin-bottom: 5px;
}

.subtitle {
  color: #737b90;
  font-size: 11px;
  line-height: 1.5;
  margin-bottom: 14px;
}

/* INPUTS */

.field {
  margin-bottom: 10px;
  position: relative;
}

label {
  display: block;
  color: #343b50;
  font-size: 11px;
  font-weight: 750;
  margin-bottom: 5px;
}

input {
  display: block;
  width: 100%;
  padding: 10px 11px;
  border: 1px solid #dfe3ed;
  border-radius: 9px;
  outline: none;
  background: white;
  color: #171b2b;
  font-size: 12px;
}

input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(146,91,255,.1);
}

input::placeholder {
  color: #a0a7b8;
}

/* MEMBERSHIP SELECTOR */

.role-select {
  position: relative;
}

.role-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 11px;
  border: 1px solid #dfe3ed;
  border-radius: 9px;
  background: white;
  color: #343b50;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}

.role-trigger:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

.role-trigger .arrow {
  color: #7c8294;
  font-size: 13px;
  transition: transform .2s;
}

.role-select.open .arrow {
  transform: rotate(180deg);
}

.role-menu {
  display: none;
  position: absolute;
  z-index: 30;
  top: calc(100% + 5px);
  left: 0;
  right: 0;
  padding: 5px;
  background: white;
  border: 1px solid #e0e3ed;
  border-radius: 11px;
  box-shadow: 0 12px 30px rgba(25,30,55,.15);
}

.role-select.open .role-menu {
  display: block;
}

.role-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 0;
  border-radius: 8px;
  background: white;
  color: #343b50;
  text-align: left;
  cursor: pointer;
  font-size: 12px;
}

.role-option:hover,
.role-option.active {
  background: #f3efff;
  color: #7040d9;
}

.role-icon {
  width: 27px;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0edff;
  border-radius: 8px;
  font-size: 15px;
}

/* SCHOOL SUGGESTIONS */

.school-results {
  display: none;
  position: absolute;
  z-index: 25;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: 190px;
  overflow-y: auto;
  padding: 5px;
  background: white;
  border: 1px solid #e0e3ed;
  border-radius: 10px;
  box-shadow: 0 12px 30px rgba(25,30,55,.14);
}

.school-results.show {
  display: block;
}

.school-result {
  display: block;
  width: 100%;
  padding: 10px;
  border: 0;
  border-radius: 7px;
  background: white;
  text-align: left;
  color: #343b50;
  cursor: pointer;
}

.school-result:hover {
  background: #f3efff;
}

.school-result strong {
  display: block;
  font-size: 11px;
}

.school-result small {
  display: block;
  margin-top: 3px;
  color: #858ca0;
  font-size: 10px;
}

.school-status {
  color: #858ca0;
  font-size: 10px;
  margin-top: 5px;
}

/* BUTTONS */

.primary-btn {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 12px;
  margin-top: 4px;
  color: white;
  font-size: 13px;
  font-weight: 800;
  background: linear-gradient(110deg, var(--purple), var(--blue));
  cursor: pointer;
}

.primary-btn:disabled {
  opacity: .6;
  cursor: wait;
}

.secondary-btn {
  width: 100%;
  margin-top: 9px;
  padding: 10px;
  border: 1px solid #dfe3ed;
  border-radius: 9px;
  color: #5141a0;
  background: #f7f5ff;
  font-size: 11px;
  font-weight: 750;
  cursor: pointer;
}

/* MESSAGES */

.message {
  display: none;
  padding: 9px 10px;
  border-radius: 8px;
  margin-bottom: 11px;
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.message.success {
  display: block;
  background: #eafaf2;
  border: 1px solid #bcebd0;
  color: #167344;
}

.message.error {
  display: block;
  background: #fff0f1;
  border: 1px solid #ffc9cf;
  color: #b42336;
}

.terms {
  color: #9299a9;
  font-size: 9px;
  line-height: 1.5;
  margin-top: 11px;
  text-align: center;
}

.hidden {
  display: none !important;
}

@media (max-width: 380px) {
  .card {
    padding: 16px 14px;
  }

  h2 {
    font-size: 18px;
  }
}

@media (max-height: 720px) {
  .page {
    align-items: flex-start;
  }

  .container {
    margin: auto 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .splash-logo {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->

<div class="splash" id="splash">

  <img
    src="./campusora-logo.png"
    alt="Campusora"
    class="splash-logo"
    id="splashLogo"
  >

  <p class="splash-tagline">
    Connect with students across campuses
  </p>

</div>

<!-- REGISTRATION AND LOGIN -->

<main class="page" id="mainPage">

  <div class="container">

    <header class="brand">

      <img src="./campusora-logo.png" alt="Campusora">

      <p>Connect with students across campuses</p>

    </header>

    <section class="card">

      <div class="tabs">

        <button type="button" class="tab active" id="signupTab">
          Create account
        </button>

        <button type="button" class="tab" id="loginTab">
          Log in
        </button>

      </div>

      <h2 id="formTitle">Join Campusora 🚀</h2>

      <p class="subtitle" id="formSubtitle">
        Connect with students, alumni and communities across campuses.
      </p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="authForm">

        <div id="signupFields">

          <div class="field">

            <label for="fullName">Full name</label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              maxlength="80"
              required
            >

          </div>

          <div class="field">

            <label for="username">Username</label>

            <input
              type="text"
              id="username"
              placeholder="Choose a username"
              autocomplete="username"
              minlength="3"
              maxlength="24"
              pattern="[A-Za-z0-9_]+"
              title="Use letters, numbers and underscores only."
              required
            >

          </div>

          <div class="field" id="schoolField">

            <label for="school">School or university</label>

            <input
              type="text"
              id="school"
              placeholder="Start typing your school name..."
              autocomplete="off"
              maxlength="120"
              required
            >

            <div class="school-results" id="schoolResults"></div>

            <p class="school-status" id="schoolStatus">
              Type at least 2 letters to find your institution.
            </p>

          </div>

          <div class="field">

            <label for="roleTrigger">I am joining as</label>

            <div class="role-select" id="roleSelect">

              <button
                type="button"
                class="role-trigger"
                id="roleTrigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span id="roleLabel">🎓 Student</span>
                <span class="arrow">▼</span>
              </button>

              <div class="role-menu" id="roleMenu" role="listbox">

                <button
                  type="button"
                  class="role-option active"
                  data-role="student"
                  role="option"
                  aria-selected="true"
                >
                  <span class="role-icon">🎓</span>
                  <span>Student</span>
                </button>

                <button
                  type="button"
                  class="role-option"
                  data-role="alumni"
                  role="option"
                  aria-selected="false"
                >
                  <span class="role-icon">🏅</span>
                  <span>Alumni</span>
                </button>

                <button
                  type="button"
                  class="role-option"
                  data-role="general"
                  role="option"
                  aria-selected="false"
                >
                  <span class="role-icon">🌍</span>
                  <span>General Member</span>
                </button>

              </div>

            </div>

            <input type="hidden" id="role" value="student">

          </div>

        </div>

        <div class="field">

          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>

        <div class="field">

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>

        <button type="submit" class="primary-btn" id="submitBtn">
          Create my account
        </button>

        <button
          type="button"
          id="resendBtn"
          class="secondary-btn hidden"
        >
          Resend confirmation email
        </button>

      </form>

      <p class="terms">
        By joining Campusora, you agree to use the community respectfully
        and follow its rules.
      </p>

    </section>

  </div>

</main>

<script type="module">

import { supabase } from './supabase.js';

/* OPENING ANIMATION */

const splash = document.getElementById('splash');
const mainPage = document.getElementById('mainPage');

setTimeout(() => {

  splash.classList.add('hide');
  mainPage.classList.add('show');

}, 7500);


/* FORM ELEMENTS */

const form = document.getElementById('authForm');
const signupFields = document.getElementById('signupFields');

const signupTab = document.getElementById('signupTab');
const loginTab = document.getElementById('loginTab');

const formTitle = document.getElementById('formTitle');
const formSubtitle = document.getElementById('formSubtitle');

const submitBtn = document.getElementById('submitBtn');
const messageBox = document.getElementById('message');

const passwordInput = document.getElementById('password');
const emailInput = document.getElementById('email');

const resendBtn = document.getElementById('resendBtn');

const schoolInput = document.getElementById('school');
const schoolResults = document.getElementById('schoolResults');
const schoolStatus = document.getElementById('schoolStatus');

const roleInput = document.getElementById('role');
const roleSelect = document.getElementById('roleSelect');
const roleTrigger = document.getElementById('roleTrigger');
const roleLabel = document.getElementById('roleLabel');

let mode = 'signup';
let pendingConfirmationEmail = '';

let selectedInstitutionId = null;
let institutionTimer = null;
let institutionRequest = 0;


/* MEMBERSHIP DROPDOWN */

roleTrigger.addEventListener('click', () => {

  const isOpen = roleSelect.classList.toggle('open');

  roleTrigger.setAttribute('aria-expanded', String(isOpen));

});

document.querySelectorAll('.role-option').forEach(option => {

  option.addEventListener('click', () => {

    document.querySelectorAll('.role-option').forEach(item => {

      item.classList.remove('active');
      item.setAttribute('aria-selected', 'false');

    });

    option.classList.add('active');
    option.setAttribute('aria-selected', 'true');

    roleInput.value = option.dataset.role;

    const icon = option.querySelector('.role-icon').textContent;
    const name = option.querySelector('span:last-child').textContent;

    roleLabel.textContent = icon + ' ' + name;

    roleSelect.classList.remove('open');

    roleTrigger.setAttribute('aria-expanded', 'false');

  });

});

document.addEventListener('click', event => {

  if (!roleSelect.contains(event.target)) {

    roleSelect.classList.remove('open');
    roleTrigger.setAttribute('aria-expanded', 'false');

  }

});


/* SCHOOL AUTOCOMPLETE */

function escapeHTML(value) {

  return String(value ?? '').replace(/[&<>"']/g, char => ({

    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'

  })[char]);

}

function closeSchoolResults() {

  schoolResults.classList.remove('show');
  schoolResults.innerHTML = '';

}

function selectSchool(institution) {

  schoolInput.value = institution.name;

  selectedInstitutionId = institution.id;

  schoolStatus.textContent = 'Selected: ' + institution.name;

  closeSchoolResults();

}

async function searchInstitutions(query) {

  const search = query.trim();

  const requestNumber = ++institutionRequest;

  if (search.length < 2) {

    closeSchoolResults();

    schoolStatus.textContent =
      'Type at least 2 letters to find your institution.';

    return;

  }

  schoolStatus.textContent = 'Searching institutions...';

  schoolResults.innerHTML = '';

  schoolResults.classList.remove('show');

  try {

    const { data, error } = await supabase

      .from('institutions')

      .select('id, name, institution_type, ownership, state')

      .eq('status', 'active')

      .ilike(
        'name',
        '%' + search.replace(/[%_,]/g, '') + '%'
      )

      .order('name')

      .limit(20);

    if (requestNumber !== institutionRequest) return;

    if (error) throw error;

    if (!data || !data.length) {

      schoolStatus.textContent =
        'No matching institution found. Check the spelling or enter your school name.';

      return;

    }

    schoolResults.innerHTML = '';

    data.forEach(institution => {

      const button = document.createElement('button');

      button.type = 'button';

      button.className = 'school-result';

      button.innerHTML = `
        <strong>${escapeHTML(institution.name)}</strong>

        <small>
          ${escapeHTML(
            (institution.institution_type || 'Institution')
              .replaceAll('_', ' ')
          )}

          ${institution.state
            ? ' · ' + escapeHTML(institution.state)
            : ''}
        </small>
      `;

      button.addEventListener('click', () => {

        selectSchool(institution);

      });

      schoolResults.appendChild(button);

    });

    schoolResults.classList.add('show');

    schoolStatus.textContent =
      'Select your school from the suggestions.';

  } catch (error) {

    if (requestNumber !== institutionRequest) return;

    schoolStatus.textContent =
      'School suggestions could not load. You can still enter your school name.';

    console.error('Institution search failed:', error);

  }

}

schoolInput.addEventListener('input', () => {

  selectedInstitutionId = null;

  clearTimeout(institutionTimer);

  institutionTimer = setTimeout(() => {

    searchInstitutions(schoolInput.value);

  }, 250);

});

schoolInput.addEventListener('focus', () => {

  if (schoolInput.value.trim().length >= 2) {

    searchInstitutions(schoolInput.value);

  }

});

document.addEventListener('click', event => {

  if (!document.getElementById('schoolField').contains(event.target)) {

    closeSchoolResults();

  }

});


/* GENERAL FORM FUNCTIONS */

function showMessage(text, type) {

  messageBox.textContent = text;

  messageBox.className = 'message ' + type;

}

function clearMessage() {

  messageBox.textContent = '';

  messageBox.className = 'message';

}

function setMode(newMode) {

  mode = newMode;

  clearMessage();

  resendBtn.classList.add('hidden');

  closeSchoolResults();

  const isSignup = mode === 'signup';

  signupFields.classList.toggle('hidden', !isSignup);

  document.getElementById('fullName').required = isSignup;

  document.getElementById('username').required = isSignup;

  schoolInput.required = isSignup;

  passwordInput.autocomplete = isSignup
    ? 'new-password'
    : 'current-password';

  passwordInput.minLength = isSignup ? 8 : 1;

  signupTab.classList.toggle('active', isSignup);

  loginTab.classList.toggle('active', !isSignup);

  formTitle.textContent = isSignup
    ? 'Join Campusora '
    : 'Welcome back 👋';

  formSubtitle.textContent = isSignup
    ? 'Connect with students, alumni and communities across campuses.'
    : 'Log in to reconnect with your campus community.';

  submitBtn.textContent = isSignup
    ? 'Create my account'
    : 'Log in to Campusora';

}

signupTab.addEventListener('click', () => {

  setMode('signup');

});

loginTab.addEventListener('click', () => {

  setMode('login');

});


/* CHECK URL FOR LOGIN MODE */

const params = new URLSearchParams(window.location.search);

if (params.get('mode') === 'login') {

  setMode('login');

}


/* REGISTRATION AND LOGIN */

form.addEventListener('submit', async event => {

  event.preventDefault();

  clearMessage();

  submitBtn.disabled = true;

  resendBtn.classList.add('hidden');

  const originalMode = mode;

  submitBtn.textContent = mode === 'signup'
    ? 'Creating account...'
    : 'Checking details...';

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  try {

    if (mode === 'signup') {

      const fullName = document.getElementById('fullName')
        .value.trim();

      const username = document.getElementById('username')
        .value.trim()
        .toLowerCase();

      const school = schoolInput.value.trim();

      const role = roleInput.value;

      if (!/^[a-z0-9_]{3,24}$/.test(username)) {

        throw new Error(
          'Your username must be 3–24 characters using letters, numbers or underscores.'
        );

      }

      if (!school) {

        throw new Error('Please enter your school or university.');

      }

      const { data, error } = await supabase.auth.signUp({

        email,

        password,

        options: {

          emailRedirectTo:
            window.location.origin + '/profile-setup.html',

          data: {

            full_name: fullName,

            username,

            school,

            role,

            institution_id: selectedInstitutionId

          }

        }

      });

      if (error) throw error;

      if (data.session && data.user) {

        showMessage(
          'Your account has been created! Taking you to profile setup...',
          'success'
        );

        window.location.replace('./profile-setup.html');

        return;

      }

      pendingConfirmationEmail = email;

      showMessage(
        'Your registration was received. Check your email and tap the confirmation link to continue.',
        'success'
      );

      resendBtn.classList.remove('hidden');

    } else {

      const { data, error } = await supabase.auth.signInWithPassword({

        email,

        password

      });

      if (error) {

        const errorText = (error.message || '').toLowerCase();

        if (
          errorText.includes('invalid login credentials') ||
          errorText.includes('invalid credentials')
        ) {

          throw new Error(
            'Incorrect email or password. Please check your details and try again.'
          );

        }

        throw error;

      }

      if (!data.session || !data.user) {

        throw new Error(
          'Login could not be completed. Please try again.'
        );

      }

      showMessage(
        'Login successful! Welcome back to Campusora.',
        'success'
      );

      window.location.replace('./index.html');

      return;

    }

  } catch (error) {

    showMessage(
      error.message || 'Something went wrong. Please try again.',
      'error'
    );

  } finally {

    submitBtn.disabled = false;

    submitBtn.textContent = originalMode === 'signup'
      ? 'Create my account'
      : 'Log in to Campusora';

  }

});


/* RESEND CONFIRMATION EMAIL */

resendBtn.addEventListener('click', async () => {

  if (!pendingConfirmationEmail) {

    showMessage(
      'Please register first before requesting another confirmation email.',
      'error'
    );

    return;

  }

  resendBtn.disabled = true;

  resendBtn.textContent = 'Sending...';

  try {

    const { error } = await supabase.auth.resend({

      type: 'signup',

      email: pendingConfirmationEmail,

      options: {

        emailRedirectTo:
          window.location.origin + '/profile-setup.html'

      }

    });

    if (error) throw error;

    showMessage(
      'A new confirmation email has been requested. Check your inbox and spam folder.',
      'success'
    );

  } catch (error) {

    showMessage(
      error.message || 'Could not resend the email. Please try again later.',
      'error'
    );

  } finally {

    resendBtn.disabled = false;

    resendBtn.textContent = 'Resend confirmation email';

  }

});

</script>

</body>
              </html>
