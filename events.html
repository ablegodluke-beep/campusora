<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b14">
<title>Campusora | Events</title>

<style>
:root {
  --bg: #0b0b14;
  --card: #151522;
  --pink: #ff91c8;
  --purple: #b7a0ff;
  --text: #f7f4fb;
  --muted: #aaa6bb;
  --border: #292538;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #10101b;
  border-bottom: 1px solid var(--border);
}

nav {
  max-width: 1000px;
  margin: auto;
  padding: 13px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo { font-size: 20px; font-weight: bold; }
.logo span { color: var(--pink); }

.nav-links {
  display: flex;
  gap: 13px;
  flex-wrap: wrap;
}

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
}

.nav-links a.active { color: var(--pink); }

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px 16px 50px;
}

.intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: linear-gradient(110deg, #191424, #141522);
}

.intro h1 { font-size: 23px; margin: 0 0 7px; }
.intro p { color: var(--muted); line-height: 1.5; margin: 0; }
.intro-icon { font-size: 35px; }

.primary {
  border: 0;
  border-radius: 9px;
  background: linear-gradient(110deg, var(--pink), var(--purple));
  color: #1b1224;
  font-weight: bold;
  padding: 10px 13px;
}

.secondary, .small-btn {
  border: 1px solid var(--border);
  background: #211d30;
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
}

.small-btn { font-size: 12px; }
.small-btn.active { color: var(--pink); border-color: var(--pink); }

.search {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: white;
  outline: none;
}

.search:focus, .field:focus { border-color: var(--pink); }

.categories {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 12px 0;
}

.chip {
  white-space: nowrap;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--card);
  padding: 8px 12px;
  border-radius: 25px;
}

.chip.active {
  color: var(--pink);
  border-color: var(--pink);
  background: #211725;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 18px 0 13px;
  gap: 10px;
}

.section-title h2 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.event-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 13px;
}

.poster {
  height: 145px;
  background: linear-gradient(135deg, #32203b, #20203a);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 34px;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body { padding: 12px; }

.badge {
  color: var(--pink);
  background: #291b2c;
  display: inline-block;
  padding: 4px 7px;
  font-size: 10px;
  border-radius: 5px;
}

.card-body h3 {
  margin: 9px 0 7px;
  font-size: 15px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.info {
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.description {
  color: #d0ccdc;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.card-bottom {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.organizer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 11px 0 3px;
}

.avatar {
  width: 31px;
  height: 31px;
  flex: 0 0 31px;
  border-radius: 50%;
  object-fit: cover;
  background: #30243d;
  border: 1px solid var(--border);
}

.organizer-name { font-size: 11px; overflow-wrap: anywhere; }
.organizer-name strong { display: block; font-size: 12px; }
.organizer-name span { color: var(--muted); }

.empty {
  grid-column: 1/-1;
  padding: 30px 15px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.status {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.status.error { color: #ff9aa9; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #000b;
}

.modal.open { display: flex; }

.modal-box {
  background: #151522;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  width: min(100%, 560px);
  max-height: 90vh;
  overflow-y: auto;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 15px;
}

.modal-head h2 { font-size: 19px; margin: 0; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-field.full { grid-column: 1/-1; }

.form-field label {
  font-size: 12px;
  color: var(--muted);
}

.field {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #0e0e18;
  color: var(--text);
  outline: none;
}

.field[type=file] { padding: 8px; }

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

.detail-copy {
  white-space: pre-wrap;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.detail-poster {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 12px;
}

@media(max-width:760px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .intro { align-items: flex-start; }
  .intro h1 { font-size: 20px; }
}

@media(max-width:500px) {
  nav { align-items: flex-start; flex-direction: column; }
  .grid { grid-template-columns: 1fr; }
  .intro { padding: 15px; }
  .intro-icon { display: none; }
  .form-grid { grid-template-columns: 1fr; }
  .form-field.full { grid-column: auto; }
  .modal-box { padding: 15px; }
}
</style>
</head>

<body>
<header>
  <nav>
    <div class="logo">Campus<span>ora</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="messages.html">Messages</a>
      <a class="active" href="events.html">Events</a>
    </div>
  </nav>
</header>

<main>
  <section class="intro">
    <div>
      <h1>Campus events 🎉</h1>
      <p>Discover what is happening around you, meet people, and share your event with the Campusora community.</p>
    </div>
    <div class="intro-icon">🎟️</div>
    <button class="primary" id="createEventBtn" type="button">+ Create event</button>
  </section>

  <input class="search" id="searchInput" type="search"
    placeholder="Search events, locations or schools..." aria-label="Search events">

  <div class="categories" id="categories">
    <button class="chip active" data-category="All" type="button">All</button>
    <button class="chip" data-category="Academic" type="button">Academic</button>
    <button class="chip" data-category="Party" type="button">Party</button>
    <button class="chip" data-category="Sports" type="button">Sports</button>
    <button class="chip" data-category="Career" type="button">Career</button>
    <button class="chip" data-category="Music" type="button">Music</button>
    <button class="chip" data-category="Other" type="button">Other</button>
  </div>

  <div class="section-title">
    <h2>Upcoming events</h2>
    <span class="muted"><span id="eventCount">0</span> events</span>
  </div>

  <div class="grid" id="eventsGrid">
    <div class="empty">Loading events...</div>
  </div>

  <p class="status" id="pageMessage" role="status"></p>

  <section id="myEventsSection" hidden>
    <div class="section-title">
      <h2>My events</h2>
      <span class="muted">Manage events you created</span>
    </div>
    <div class="grid" id="myEventsGrid"></div>
  </section>
</main>

<div class="modal" id="eventModal" role="dialog" aria-modal="true"
  aria-labelledby="eventFormTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="eventFormTitle">Create an event</h2>
      <button class="secondary" id="closeEvent" type="button" aria-label="Close">✕</button>
    </div>

    <form id="eventForm">
      <div class="form-grid">
        <div class="form-field full">
          <label for="title">Event title *</label>
          <input class="field" id="title" maxlength="120" required>
        </div>

        <div class="form-field full">
          <label for="description">Description *</label>
          <textarea class="field" id="description" rows="4" required></textarea>
        </div>

        <div class="form-field">
          <label for="categorySelect">Category</label>
          <select class="field" id="categorySelect">
            <option>Academic</option>
            <option>Party</option>
            <option>Sports</option>
            <option>Career</option>
            <option>Music</option>
            <option selected>Other</option>
          </select>
        </div>

        <div class="form-field">
          <label for="visibility">Who can see it?</label>
          <select class="field" id="visibility">
            <option value="public">Public</option>
            <option value="campus">Campus</option>
            <option value="private">Private</option>
          </select>
        </div>

        <div class="form-field">
          <label for="startTime">Start date and time *</label>
          <input class="field" id="startTime" type="datetime-local" required>
        </div>

        <div class="form-field">
          <label for="endTime">End date and time</label>
          <input class="field" id="endTime" type="datetime-local">
        </div>

        <div class="form-field">
          <label for="location">Location</label>
          <input class="field" id="location" placeholder="Venue or online">
        </div>

        <div class="form-field">
          <label for="institution">School / institution</label>
          <input class="field" id="institution" placeholder="Your school">
        </div>

        <div class="form-field">
          <label for="priceType">Entry</label>
          <select class="field" id="priceType">
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="form-field">
          <label for="ticketUrl">Ticket URL (optional)</label>
          <input class="field" id="ticketUrl" type="url" placeholder="https://...">
        </div>

        <div class="form-field full">
          <label for="onlineUrl">Online meeting URL (optional)</label>
          <input class="field" id="onlineUrl" type="url" placeholder="https://...">
        </div>

        <div class="form-field full">
          <label for="poster">Event poster (JPG, PNG or WebP, max 5 MB)</label>
          <input class="field" id="poster" type="file"
            accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="form-field full">
          <label class="check-row">
            <input id="isOnline" type="checkbox"> This is an online event
          </label>
        </div>
      </div>

      <p class="status" id="formMessage"></p>

      <div class="form-actions">
        <button class="secondary" id="cancelForm" type="button">Close</button>
        <button class="primary" id="submitEvent" type="submit">Publish event</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="detailModal" role="dialog" aria-modal="true"
  aria-labelledby="detailTitle">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="detailTitle">Event details</h2>
      <button class="secondary" id="closeDetail" type="button" aria-label="Close">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let currentUser = null;
let profile = null;
let events = [];
let myEvents = [];
let interests = new Set();
let organizers = {};
let interestCounts = {};
let selectedCategory = 'All';
let editingEventId = null;

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function safeURL(value) {
  if (!value) return '';
  try {
    const url = new URL(value);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}

function setMessage(text, isError = false) {
  $('pageMessage').textContent = text;
  $('pageMessage').classList.toggle('error', isError);
}

function dateText(value) {
  if (!value) return 'Date to be announced';

  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'Date to be announced';

  return new Intl.DateTimeFormat(undefined, {
    dateStyle: 'medium',
    timeStyle: 'short'
  }).format(date);
}

function localDateValue(value) {
  const date = new Date(value);
  date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
  return date.toISOString().slice(0, 16);
}

function getOrganizer(event) {
  return organizers[event.organizer_id] || {};
}

function organizerHTML(event) {
  const person = getOrganizer(event);
  const name = person.full_name || person.username || 'Campusora member';
  const avatar = safeURL(person.avatar_url);

  return `
    <div class="organizer">
      ${avatar
        ? `<img class="avatar" src="${escapeHTML(avatar)}" alt="">`
        : `<div class="avatar" aria-hidden="true"></div>`}
      <div class="organizer-name">
        <strong>${escapeHTML(name)}</strong>
        <span>Event organizer</span>
      </div>
    </div>`;
}

function allVisibleEvents() {
  return [...new Map(
    [...events, ...myEvents].map(event => [event.id, event])
  ).values()];
}

function matching(list) {
  const query = $('searchInput').value.trim().toLowerCase();

  return list.filter(event => {
    const categoryOK =
      selectedCategory === 'All' || event.category === selectedCategory;

    const searchable = [
      event.title,
      event.description,
      event.location,
      event.category,
      event.institution
    ].filter(Boolean).join(' ').toLowerCase();

    return categoryOK && searchable.includes(query);
  });
}

function eventCard(event, manage = false) {
  const poster = safeURL(event.poster_url);
  const interested = interests.has(event.id);
  const cancelled = event.status === 'cancelled';

  return `
    <article class="event-card">
      <div class="poster">
        ${poster
          ? `<img src="${escapeHTML(poster)}"
              alt="${escapeHTML(event.title)}" loading="lazy">`
          : '🎟️'}
      </div>

      <div class="card-body">
        <span class="badge">
          ${escapeHTML(event.category || 'Other')}
          · ${escapeHTML(event.visibility || 'public')}
        </span>

        <h3>${escapeHTML(event.title)}</h3>

        <div class="info">
          📅 ${escapeHTML(dateText(event.start_time))}<br>
          📍 ${escapeHTML(event.location || (event.is_online ? 'Online' : 'Location TBA'))}
          ${event.institution
            ? `<br>🎓 ${escapeHTML(event.institution)}`
            : ''}
          ${cancelled ? '<br>⚠️ Cancelled' : ''}
        </div>

        ${organizerHTML(event)}

        <p class="description">
          ${escapeHTML((event.description || '').slice(0, 100))}
          ${(event.description || '').length > 100 ? '…' : ''}
        </p>

        <div class="card-bottom">
          ${!manage && !cancelled
            ? `<button class="small-btn ${interested ? 'active' : ''}"
                type="button" data-interest="${escapeHTML(event.id)}">
                ${interested ? '♥ Interested' : '♡ Interested'}
                ${interestCounts[event.id] !== undefined
                  ? ` (${interestCounts[event.id]})`
                  : ''}
              </button>`
            : ''}

          <button class="small-btn" type="button"
            data-details="${escapeHTML(event.id)}">Details</button>

          <button class="small-btn" type="button"
            data-share="${escapeHTML(event.id)}">Share ↗</button>

          ${manage
            ? `<button class="small-btn" type="button"
                data-edit="${escapeHTML(event.id)}">Edit</button>
               ${!cancelled
                 ? `<button class="small-btn" type="button"
                     data-cancel="${escapeHTML(event.id)}">Cancel</button>`
                 : ''}`
            : ''}
        </div>
      </div>
    </article>`;
}

function render() {
  const upcoming = matching(events);

  $('eventCount').textContent = upcoming.length;
  $('eventsGrid').innerHTML = upcoming.length
    ? upcoming.map(event => eventCard(event)).join('')
    : '<div class="empty">No upcoming events found. Try another search or create an event.</div>';

  const mine = matching(myEvents);

  $('myEventsSection').hidden = !currentUser || myEvents.length === 0;
  $('myEventsGrid').innerHTML = mine.length
    ? mine.map(event => eventCard(event, true)).join('')
    : '<div class="empty">You have no events matching this search.</div>';
}

async function loadUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error) console.warn('Could not check signed-in user:', error.message);

  currentUser = data?.user || null;

  if (!currentUser) return;

  const { data: person, error: profileError } = await supabase
    .from('profiles')
    .select('id,username,full_name,avatar_url,school')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (!profileError && person) profile = person;

  const { data: myInterests, error: interestError } = await supabase
    .from('event_interests')
    .select('event_id')
    .eq('user_id', currentUser.id);

  if (!interestError && myInterests) {
    interests = new Set(myInterests.map(row => row.event_id));
  }
}

async function loadProfiles(list) {
  const ids = [...new Set(
    list.map(event => event.organizer_id).filter(Boolean)
  )];

  if (!ids.length) return;

  const { data, error } = await supabase
    .from('profiles')
    .select('id,username,full_name,avatar_url,school')
    .in('id', ids);

  if (error) {
    console.warn('Organizer profiles could not be loaded:', error.message);
    return;
  }

  (data || []).forEach(person => {
    organizers[person.id] = person;
  });
}

async function loadInterestCounts(list) {
  const ids = [...new Set(list.map(event => event.id))];
  if (!ids.length) return;

  // Optional Supabase function. The rest of the page still works if absent.
  const { data, error } = await supabase.rpc(
    'get_event_interest_counts',
    { event_ids: ids }
  );

  if (error) {
    console.info('Optional interest-count function is not configured yet.');
    return;
  }

  (data || []).forEach(row => {
    interestCounts[row.event_id] = Number(row.interest_count) || 0;
  });
}

async function loadEvents() {
  setMessage('Loading events…');

  try {
    const now = new Date().toISOString();

    const { data, error } = await supabase
      .from('events')
      .select('*')
      .eq('status', 'published')
      .in('visibility', ['public', 'campus'])
      .gte('start_time', now)
      .order('start_time', { ascending: true });

    if (error) throw error;

    events = data || [];
    myEvents = [];

    if (currentUser) {
      const { data: mine, error: mineError } = await supabase
        .from('events')
        .select('*')
        .eq('organizer_id', currentUser.id)
        .order('start_time', { ascending: true });

      if (!mineError) myEvents = mine || [];
    }

    const combined = allVisibleEvents();

    await Promise.all([
      loadProfiles(combined),
      loadInterestCounts(combined)
    ]);

    render();

    setMessage(events.length
      ? 'Events are up to date.'
      : 'No public or campus upcoming events yet. Be the first to create one!');
  } catch (error) {
    console.error('Loading events failed:', error);

    setMessage(
      'Could not load events. Check your Supabase connection and table permissions.',
      true
    );

    $('eventsGrid').innerHTML =
      '<div class="empty">Events could not load. Please check your connection and try again.</div>';
  }
}

function openCreateForm() {
  if (!currentUser) {
    alert('Please sign in to create an event.');
    return;
  }

  editingEventId = null;
  $('eventForm').reset();
  $('eventFormTitle').textContent = 'Create an event';
  $('submitEvent').textContent = 'Publish event';
  $('formMessage').textContent = '';
  $('institution').value = profile?.school || '';
  $('eventModal').classList.add('open');
}

function openEditForm(id) {
  const event = myEvents.find(item => item.id === id);

  if (!event || event.organizer_id !== currentUser?.id) {
    alert('You can only edit your own events.');
    return;
  }

  editingEventId = id;
  $('eventForm').reset();

  $('eventFormTitle').textContent = 'Edit event';
  $('submitEvent').textContent = 'Save changes';
  $('formMessage').textContent = 'Leave poster empty to keep the current poster.';

  $('title').value = event.title || '';
  $('description').value = event.description || '';
  $('categorySelect').value = event.category || 'Other';
  $('visibility').value = event.visibility || 'public';
  $('startTime').value = localDateValue(event.start_time);
  $('endTime').value = event.end_time ? localDateValue(event.end_time) : '';
  $('location').value = event.location || '';
  $('institution').value = event.institution || '';
  $('priceType').value = event.price_type || 'free';
  $('ticketUrl').value = event.ticket_url || '';
  $('onlineUrl').value = event.online_url || '';
  $('isOnline').checked = !!event.is_online;

  $('eventModal').classList.add('open');
}

function openDetails(id) {
  const event = allVisibleEvents().find(item => item.id === id);
  if (!event) return;

  const poster = safeURL(event.poster_url);
  const ticket = safeURL(event.ticket_url);
  const meeting = safeURL(event.online_url);

  $('detailTitle').textContent = event.title || 'Event details';

  $('detailContent').innerHTML = `
    ${poster
      ? `<img class="detail-poster"
          src="${escapeHTML(poster)}" alt="${escapeHTML(event.title)}">`
      : ''}

    ${organizerHTML(event)}

    <p><strong>Category:</strong> ${escapeHTML(event.category || 'Other')}</p>
    <p><strong>Starts:</strong> ${escapeHTML(dateText(event.start_time))}</p>

    ${event.end_time
      ? `<p><strong>Ends:</strong> ${escapeHTML(dateText(event.end_time))}</p>`
      : ''}

    <p><strong>Location:</strong>
      ${escapeHTML(event.location || (event.is_online ? 'Online' : 'To be announced'))}
    </p>

    ${event.institution
      ? `<p><strong>Institution:</strong> ${escapeHTML(event.institution)}</p>`
      : ''}

    <p><strong>Entry:</strong>
      ${event.price_type === 'paid' ? 'Paid' : 'Free'}
    </p>

    <p class="detail-copy">${escapeHTML(event.description || 'No description provided.')}</p>

    ${ticket
      ? `<p><a href="${escapeHTML(ticket)}" target="_blank"
          rel="noopener noreferrer">🎟️ Get tickets</a></p>`
      : ''}

    ${meeting
      ? `<p><a href="${escapeHTML(meeting)}" target="_blank"
          rel="noopener noreferrer">💻 Join online event</a></p>`
      : ''}
  `;

  $('detailModal').classList.add('open');
}

async function toggleInterest(id) {
  if (!currentUser) {
    alert('Please sign in first.');
    return;
  }

  try {
    if (interests.has(id)) {
      const { error } = await supabase
        .from('event_interests')
        .delete()
        .eq('event_id', id)
        .eq('user_id', currentUser.id);

      if (error) throw error;

      interests.delete(id);

      if (interestCounts[id] !== undefined) {
        interestCounts[id] = Math.max(0, interestCounts[id] - 1);
      }
    } else {
      const { error } = await supabase
        .from('event_interests')
        .insert({
          event_id: id,
          user_id: currentUser.id
        });

      if (error) throw error;

      interests.add(id);

      if (interestCounts[id] !== undefined) {
        interestCounts[id] += 1;
      }
    }

    render();
  } catch (error) {
    console.error(error);
    alert('Could not update your interest. Check your sign-in and Supabase permissions.');
  }
}

async function shareEvent(id) {
  const event = allVisibleEvents().find(item => item.id === id);
  if (!event) return;

  const url = new URL(location.href);
  url.searchParams.set('event', id);

  try {
    if (navigator.share) {
      await navigator.share({
        title: event.title,
        text: `Check out ${event.title} on Campusora`,
        url: url.href
      });
    } else if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(url.href);
      alert('Event link copied!');
    } else {
      prompt('Copy this event link:', url.href);
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      prompt('Copy this event link:', url.href);
    }
  }
}

async function cancelEvent(id) {
  const event = myEvents.find(item => item.id === id);

  if (!event || event.organizer_id !== currentUser?.id) {
    alert('You can only cancel your own events.');
    return;
  }

  if (!confirm(`Cancel "${event.title}"?`)) return;

  const { error } = await supabase
    .from('events')
    .update({
      status: 'cancelled',
      updated_at: new Date().toISOString()
    })
    .eq('id', id)
    .eq('organizer_id', currentUser.id);

  if (error) {
    console.error(error);
    alert('Could not cancel event. Check your Supabase update policy.');
    return;
  }

  await loadEvents();
  alert('Event cancelled.');
}

async function saveEvent(e) {
  e.preventDefault();

  if (!currentUser) {
    alert('Please sign in first.');
    return;
  }

  const title = $('title').value.trim();
  const description = $('description').value.trim();
  const start = new Date($('startTime').value);
  const endValue = $('endTime').value;
  const end = endValue ? new Date(endValue) : null;

  if (!title || !description || !$('startTime').value) {
    alert('Fill in the title, description and start date.');
    return;
  }

  if (Number.isNaN(start.getTime()) || start <= new Date()) {
    alert('Choose a valid future start date and time.');
    return;
  }

  if (end && (Number.isNaN(end.getTime()) || end <= start)) {
    alert('The end date must be after the start date.');
    return;
  }

  const ticketUrl = $('ticketUrl').value.trim();
  const onlineUrl = $('onlineUrl').value.trim();

  if (ticketUrl && !safeURL(ticketUrl)) {
    alert('Enter a valid ticket link beginning with https://');
    return;
  }

  if (onlineUrl && !safeURL(onlineUrl)) {
    alert('Enter a valid meeting link beginning with https://');
    return;
  }

  const file = $('poster').files[0];

  if (file && !['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    alert('Use a JPG, PNG or WebP poster.');
    return;
  }

  if (file && file.size > 5 * 1024 * 1024) {
    alert('Poster must be 5 MB or smaller.');
    return;
  }

  const existing = editingEventId
    ? myEvents.find(item => item.id === editingEventId)
    : null;

  const button = $('submitEvent');
  button.disabled = true;
  button.textContent = 'Saving…';
  $('formMessage').textContent = '';

  try {
    let posterUrl = existing?.poster_url || null;

    if (file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

      const { error: uploadError } = await supabase.storage
        .from('event-posters')
        .upload(path, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type
        });

      if (uploadError) throw uploadError;

      posterUrl = supabase.storage
        .from('event-posters')
        .getPublicUrl(path).data.publicUrl;
    }

    const payload = {
      title,
      description,
      category: $('categorySelect').value,
      start_time: start.toISOString(),
      end_time: end ? end.toISOString() : null,
      location: $('location').value.trim() || null,
      institution: $('institution').value.trim() || null,
      visibility: $('visibility').value,
      price_type: $('priceType').value,
      ticket_url: ticketUrl || null,
      online_url: onlineUrl || null,
      is_online: $('isOnline').checked,
      poster_url: posterUrl,
      updated_at: new Date().toISOString()
    };

    let result;

    if (editingEventId) {
      result = await supabase
        .from('events')
        .update(payload)
        .eq('id', editingEventId)
        .eq('organizer_id', currentUser.id);
    } else {
      result = await supabase
        .from('events')
        .insert({
          ...payload,
          organizer_id: currentUser.id,
          status: 'published'
        });
    }

    if (result.error) throw result.error;

    $('eventModal').classList.remove('open');
    $('eventForm').reset();
    editingEventId = null;

    await loadEvents();

    alert(existing ? 'Event updated successfully!' : 'Event published successfully!');
  } catch (error) {
    console.error('Could not save event:', error);

    $('formMessage').textContent =
      `Could not save event: ${error.message || 'Check your Supabase settings and permissions.'}`;
  } finally {
    button.disabled = false;
    button.textContent = editingEventId ? 'Save changes' : 'Publish event';
  }
}

// Main buttons
$('createEventBtn').addEventListener('click', openCreateForm);

$('closeEvent').addEventListener('click', () => {
  $('eventModal').classList.remove('open');
});

$('cancelForm').addEventListener('click', () => {
  $('eventModal').classList.remove('open');
});

$('closeDetail').addEventListener('click', () => {
  $('detailModal').classList.remove('open');
});

$('eventForm').addEventListener('submit', saveEvent);

$('searchInput').addEventListener('input', render);

// Category filters
document.querySelectorAll('[data-category]').forEach(button => {
  button.addEventListener('click', () => {
    selectedCategory = button.dataset.category;

    document.querySelectorAll('[data-category]').forEach(item => {
      item.classList.toggle('active', item === button);
    });

    render();
  });
});

// Event card buttons
document.addEventListener('click', async e => {
  const interest = e.target.closest('[data-interest]');
  const details = e.target.closest('[data-details]');
  const share = e.target.closest('[data-share]');
  const edit = e.target.closest('[data-edit]');
  const cancel = e.target.closest('[data-cancel]');

  if (interest) await toggleInterest(interest.dataset.interest);
  else if (details) openDetails(details.dataset.details);
  else if (share) await shareEvent(share.dataset.share);
  else if (edit) openEditForm(edit.dataset.edit);
  else if (cancel) await cancelEvent(cancel.dataset.cancel);
});

// Close modals by tapping outside or pressing Escape
['eventModal', 'detailModal'].forEach(id => {
  $(id).addEventListener('click', e => {
    if (e.target.id === id) $(id).classList.remove('open');
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    $('eventModal').classList.remove('open');
    $('detailModal').classList.remove('open');
  }
});

// Start the Events page
async function start() {
  try {
    await loadUser();
    await loadEvents();

    const sharedId = new URLSearchParams(location.search).get('event');

    if (sharedId && allVisibleEvents().some(event => event.id === sharedId)) {
      openDetails(sharedId);
    }
  } catch (error) {
    console.error(error);
    setMessage(
      'Campusora could not start. Check your Supabase configuration.',
      true
    );
  }
}

start();
</script>
