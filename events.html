<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b14">
<title>Campusora | Events</title>

<style>
:root {
  --bg: #0b0b14;
  --card: #151522;
  --pink: #ff91c8;
  --purple: #b7a0ff;
  --text: #f7f4fb;
  --muted: #aaa6bb;
  --border: #292538;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px Arial, sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

header {
  border-bottom: 1px solid var(--border);
  background: #10101b;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  max-width: 1000px;
  margin: auto;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo {
  font-size: 19px;
  font-weight: bold;
}

.logo span { color: var(--pink); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 14px;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
}

nav a.active { color: var(--pink); }

button.primary {
  border: 0;
  border-radius: 9px;
  background: linear-gradient(110deg,var(--pink),var(--purple));
  color: #1b1224;
  font-weight: bold;
  padding: 9px 12px;
}

button.secondary {
  border: 1px solid var(--border);
  background: #1b1928;
  color: var(--text);
  border-radius: 9px;
  padding: 8px 11px;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px 16px 40px;
}

.intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 19px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: linear-gradient(110deg,#191424,#141522);
}

.intro h1 {
  font-size: 22px;
  margin: 0 0 7px;
  font-weight: 700;
}

.intro p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.intro-icon {
  font-size: 33px;
  flex-shrink: 0;
}

.search {
  width: 100%;
  margin-top: 20px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: white;
  outline: none;
}

.search:focus, .field:focus { border-color: var(--pink); }

.categories {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 12px 0;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar { display: none; }

.chip {
  white-space: nowrap;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--card);
  padding: 8px 12px;
  border-radius: 25px;
}

.chip.active {
  color: var(--pink);
  border-color: var(--pink);
  background: #211725;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 17px 0 13px;
}

.section-title h2 {
  font-size: 16px;
  margin: 0;
}

.muted { color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 13px;
}

.event-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 13px;
}

.poster {
  height: 135px;
  background: linear-gradient(135deg,#32203b,#20203a);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 32px;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body { padding: 12px; }

.badge {
  color: var(--pink);
  background: #291b2c;
  display: inline-block;
  padding: 4px 7px;
  font-size: 10px;
  border-radius: 5px;
}

.card-body h3 {
  margin: 9px 0 7px;
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.info {
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.description {
  color: #d0ccdc;
  font-size: 12px;
  line-height: 1.5;
}

.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  margin-top: 12px;
}

.small-btn {
  background: #211d30;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 11px;
}

.small-btn.active {
  color: var(--pink);
  border-color: var(--pink);
}

.empty {
  grid-column: 1/-1;
  padding: 30px 15px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.status {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
}

.status.error { color: #ff9aa9; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #000b;
}

.modal.open { display: flex; }

.modal-box {
  background: #151522;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  width: min(100%,520px);
  max-height: 90vh;
  overflow-y: auto;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.modal-head h2 { font-size: 17px; margin: 0; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-field { min-width: 0; }
.form-field.full { grid-column: 1/-1; }

label {
  display: block;
  font-size: 12px;
  margin-bottom: 6px;
  color: #d5d0e2;
}

.field {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0c0c17;
  color: white;
  outline: none;
}

textarea.field {
  min-height: 85px;
  resize: vertical;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0;
  color: var(--muted);
}

#formMessage {
  font-size: 12px;
  margin: 10px 0;
  color: #ff9aa9;
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 11px;
}

@media(max-width:700px) {
  main { padding: 15px 12px 30px; }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 9px;
  }

  .poster { height: 105px; }
  .card-body { padding: 9px; }
  .card-body h3 { font-size: 12px; }
  .description { font-size: 11px; }
  .card-bottom { flex-wrap: wrap; }
  .small-btn { padding: 6px; font-size: 10px; }
  .intro h1 { font-size: 19px; }
}

@media(max-width:400px) {
  nav { padding: 12px 10px; }
  .logo { font-size: 17px; }
  .nav-links { gap: 8px; }
  nav a { font-size: 11px; }
  .nav-links a:nth-child(2),
  .nav-links a:nth-child(3) { display: none; }
  .intro { padding: 14px; }
  .intro-icon { font-size: 26px; }
  .grid { gap: 8px; }
}
</style>
</head>

<body>

<header>
  <nav>
    <div class="logo">Campus<span>ora</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="messages.html">Messages</a>
      <a href="marketplace.html">Market</a>
      <a href="events.html" class="active">Events</a>
      <button class="primary" id="openCreate">+ Create</button>
    </div>
  </nav>
</header>

<main>
  <section class="intro">
    <div>
      <h1>Campus Events 💗</h1>
      <p>Find events. Meet people. Join in.</p>
    </div>
    <div class="intro-icon">🎟️</div>
  </section>

  <input
    class="search"
    id="searchInput"
    type="search"
    placeholder="Search events or locations..."
    aria-label="Search events"
  >

  <div class="categories" id="categories">
    <button class="chip active" data-category="All">All</button>
    <button class="chip" data-category="Academic">Academic</button>
    <button class="chip" data-category="Technology">Tech</button>
    <button class="chip" data-category="Business">Business</button>
    <button class="chip" data-category="Career">Career</button>
    <button class="chip" data-category="Sports">Sports</button>
    <button class="chip" data-category="Entertainment">Fun</button>
    <button class="chip" data-category="Social">Social</button>
    <button class="chip" data-category="Other">Other</button>
  </div>

  <div class="section-title">
    <h2>Upcoming events</h2>
    <span class="muted" id="eventCount"></span>
  </div>

  <div id="pageMessage" class="status">Connecting...</div>

  <div class="grid" id="eventsGrid">
    <div class="empty">Loading events...</div>
  </div>
</main>

<footer>Campusora · Your campus community</footer>

<div class="modal" id="createModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Create an event</h2>
      <button class="secondary" id="closeModal" type="button">✕</button>
    </div>

    <form id="eventForm">
      <div class="form-grid">
        <div class="form-field full">
          <label for="eventTitle">Event name *</label>
          <input class="field" id="eventTitle" maxlength="150" required>
        </div>

        <div class="form-field full">
          <label for="eventDescription">Description *</label>
          <textarea class="field" id="eventDescription" maxlength="5000"
            placeholder="What's happening?" required></textarea>
        </div>

        <div class="form-field">
          <label for="eventCategory">Category</label>
          <select class="field" id="eventCategory">
            <option>Academic</option>
            <option>Technology</option>
            <option>Business</option>
            <option>Career</option>
            <option>Sports</option>
            <option>Entertainment</option>
            <option>Social</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-field">
          <label for="eventVisibility">Audience</label>
          <select class="field" id="eventVisibility">
            <option value="public">Public</option>
            <option value="campus">Campus</option>
            <option value="private">Private</option>
          </select>
        </div>

        <div class="form-field">
          <label for="startTime">Starts *</label>
          <input class="field" id="startTime" type="datetime-local" required>
        </div>

        <div class="form-field">
          <label for="endTime">Ends *</label>
          <input class="field" id="endTime" type="datetime-local" required>
        </div>

        <div class="form-field full">
          <label for="eventLocation">Location</label>
          <input class="field" id="eventLocation" maxlength="250"
            placeholder="Where is it happening?">
        </div>

        <div class="form-field full">
          <label for="eventInstitution">School</label>
          <input class="field" id="eventInstitution" maxlength="250"
            placeholder="Your school">
        </div>

        <div class="form-field">
          <label for="eventPrice">Entry</label>
          <select class="field" id="eventPrice">
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="form-field">
          <label for="eventPoster">Poster (optional)</label>
          <input class="field" id="eventPoster" type="file"
            accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="form-field full" id="ticketField" hidden>
          <label for="ticketUrl">Ticket link *</label>
          <input class="field" id="ticketUrl" type="url"
            placeholder="https://...">
        </div>

        <div class="form-field full">
          <label for="onlineUrl">Meeting link (optional)</label>
          <input class="field" id="onlineUrl" type="url"
            placeholder="https://...">
        </div>
      </div>

      <label class="check-row">
        <input id="isOnline" type="checkbox">
        Online event
      </label>

      <div id="formMessage" hidden></div>

      <button class="primary" id="submitEvent" type="submit"
        style="width:100%">Publish event</button>
    </form>
  </div>
</div>

<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let events = [];
let currentUser = null;
let interests = new Set();
let category = 'All';

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function safeURL(value) {
  if (!value) return '';
  try {
    const url = new URL(value);
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch {
    return '';
  }
}

function dateText(value) {
  return new Intl.DateTimeFormat(undefined, {
    day:'numeric',
    month:'short',
    year:'numeric',
    hour:'numeric',
    minute:'2-digit'
  }).format(new Date(value));
}

function message(text, error = false) {
  $('pageMessage').textContent = text;
  $('pageMessage').classList.toggle('error', error);
}

function filteredEvents() {
  const q = $('searchInput').value.trim().toLowerCase();

  return events.filter(e => {
    const categoryMatch = category === 'All' || e.category === category;
    const words = [
      e.title, e.description, e.location, e.category, e.institution
    ].filter(Boolean).join(' ').toLowerCase();

    return categoryMatch && words.includes(q);
  });
}

function render() {
  const list = filteredEvents();

  $('eventCount').textContent = list.length;

  if (!list.length) {
    $('eventsGrid').innerHTML = `
      <div class="empty">
        <p>No upcoming events yet.</p>
        <button class="primary" data-create>+ Create event</button>
      </div>`;
    return;
  }

  $('eventsGrid').innerHTML = list.map(e => {
    const poster = safeURL(e.poster_url);

    return `
      <article class="event-card">
        <div class="poster">
          ${poster
            ? `<img src="${escapeHTML(poster)}" alt="${escapeHTML(e.title)}" loading="lazy">`
            : '🎟️'}
        </div>

        <div class="card-body">
          <span class="badge">${escapeHTML(e.category || 'Other')}</span>
          <h3>${escapeHTML(e.title)}</h3>

          <div class="info">
            📅 ${escapeHTML(dateText(e.start_time))}<br>
            📍 ${escapeHTML(e.location || (e.is_online ? 'Online' : 'TBA'))}
            ${e.institution ? `<br>🎓 ${escapeHTML(e.institution)}` : ''}
          </div>

          <p class="description">
            ${escapeHTML((e.description || '').slice(0,90))}
            ${(e.description || '').length > 90 ? '…' : ''}
          </p>

          <div class="card-bottom">
            <button class="small-btn ${interests.has(e.id) ? 'active' : ''}"
              data-interest="${e.id}">
              ${interests.has(e.id) ? '♥ Interested' : '♡ Interested'}
            </button>

            <button class="small-btn" data-share="${e.id}">Share ↗</button>
          </div>
        </div>
      </article>`;
  }).join('');
}

async function loadEvents() {
  message('Loading events...');

  try {
    const { data, error } = await supabase
      .from('events')
      .select('*')
      .eq('status', 'published')
      .eq('visibility', 'public')
      .gte('start_time', new Date().toISOString())
      .order('start_time', { ascending:true });

    if (error) throw error;

    events = data || [];
    render();

    message(events.length
      ? 'Events are up to date.'
      : 'No public upcoming events yet. Be the first to create one!');
  } catch (error) {
    console.error(error);
    message('Could not load events. Check Supabase settings.', true);
    $('eventsGrid').innerHTML = `
      <div class="empty">Events could not load. Please try again later.</div>`;
  }
}

async function loadUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error || !data.user) return;

  currentUser = data.user;

  const { data: rows, error: interestError } = await supabase
    .from('event_interests')
    .select('event_id')
    .eq('user_id', currentUser.id);

  if (!interestError && rows) {
    interests = new Set(rows.map(row => row.event_id));
  }
}

async function toggleInterest(id) {
  if (!currentUser) {
    alert('Please sign in first.');
    return;
  }

  try {
    if (interests.has(id)) {
      const { error } = await supabase
        .from('event_interests')
        .delete()
        .eq('event_id', id)
        .eq('user_id', currentUser.id);

      if (error) throw error;
      interests.delete(id);
    } else {
      const { error } = await supabase
        .from('event_interests')
        .insert({ event_id:id, user_id:currentUser.id });

      if (error) throw error;
      interests.add(id);
    }

    render();
  } catch (error) {
    console.error(error);
    alert('Could not update your interest. Please try again.');
  }
}

async function shareEvent(id) {
  const e = events.find(item => item.id === id);
  if (!e) return;

  const url = new URL(location.href);
  url.searchParams.set('event', id);

  try {
    if (navigator.share) {
      await navigator.share({
        title:e.title,
        text:`Check out ${e.title} on Campusora`,
        url:url.href
      });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(url.href);
      alert('Event link copied!');
    } else {
      prompt('Copy event link:', url.href);
    }
  } catch (error) {
    if (error.name !== 'AbortError') alert('Sharing failed.');
  }
}

function openModal() {
  $('createModal').classList.add('open');
  $('formMessage').hidden = true;
}

function closeModal() {
  $('createModal').classList.remove('open');
}

$('openCreate').addEventListener('click', openModal);
$('closeModal').addEventListener('click', closeModal);

$('createModal').addEventListener('click', e => {
  if (e.target === $('createModal')) closeModal();
});

$('categories').addEventListener('click', e => {
  const button = e.target.closest('[data-category]');
  if (!button) return;

  category = button.dataset.category;

  document.querySelectorAll('.chip').forEach(chip => {
    chip.classList.toggle('active', chip === button);
  });

  render();
});

$('searchInput').addEventListener('input', render);

$('eventPrice').addEventListener('change', () => {
  $('ticketField').hidden = $('eventPrice').value !== 'paid';
});

document.addEventListener('click', e => {
  const interest = e.target.closest('[data-interest]');
  const share = e.target.closest('[data-share]');
  const create = e.target.closest('[data-create]');

  if (interest) toggleInterest(interest.dataset.interest);
  if (share) shareEvent(share.dataset.share);
  if (create) openModal();
});

$('eventForm').addEventListener('submit', async e => {
  e.preventDefault();

  const formMessage = $('formMessage');
  const submit = $('submitEvent');

  function formError(text) {
    formMessage.textContent = text;
    formMessage.hidden = false;
  }

  if (!currentUser) {
    formError('Please sign in to create an event.');
    return;
  }

  const title = $('eventTitle').value.trim();
  const description = $('eventDescription').value.trim();
  const start = new Date($('startTime').value);
  const end = new Date($('endTime').value);
  const file = $('eventPoster').files[0];

  if (!title || !description) {
    formError('Enter the event name and description.');
    return;
  }

  if (!$('startTime').value || !$('endTime').value ||
      isNaN(start.getTime()) || isNaN(end.getTime()) || end <= start) {
    formError('Check the start and end times.');
    return;
  }

  if (start <= new Date()) {
    formError('Choose a future start time.');
    return;
  }

  if (file && file.size > 5 * 1024 * 1024) {
    formError('Poster must be 5 MB or smaller.');
    return;
  }

  if (file && !['image/jpeg','image/png','image/webp'].includes(file.type)) {
    formError('Use a JPG, PNG, or WebP poster.');
    return;
  }

  const rawTicket = $('ticketUrl').value.trim();
  const rawOnline = $('onlineUrl').value.trim();
  const ticket = safeURL(rawTicket);
  const online = safeURL(rawOnline);

  if ($('eventPrice').value === 'paid' && !ticket) {
    formError('Add a valid ticket link for paid events.');
    return;
  }

  if (rawOnline && !online) {
    formError('Enter a valid meeting link.');
    return;
  }

  submit.disabled = true;
  submit.textContent = 'Publishing...';
  formMessage.hidden = true;

  let path = null;

  try {
    let posterUrl = null;

    if (file) {
      const ext = file.type === 'image/png' ? 'png'
        : file.type === 'image/webp' ? 'webp' : 'jpg';

      path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;

      const { error } = await supabase.storage
        .from('event-posters')
        .upload(path, file, { contentType:file.type });

      if (error) throw error;

      posterUrl = supabase.storage
        .from('event-posters')
        .getPublicUrl(path).data.publicUrl;
    }

    const { error } = await supabase.from('events').insert({
      organizer_id:currentUser.id,
      title,
      description,
      category:$('eventCategory').value,
      poster_url:posterUrl,
      start_time:start.toISOString(),
      end_time:end.toISOString(),
      location:$('eventLocation').value.trim() || null,
      institution:$('eventInstitution').value.trim() || null,
      is_online:$('isOnline').checked,
      online_url:online || null,
      visibility:$('eventVisibility').value,
      price_type:$('eventPrice').value,
      ticket_url:ticket || null,
      status:'published'
    });

    if (error) throw error;

    $('eventForm').reset();
    $('ticketField').hidden = true;
    closeModal();
    await loadEvents();
    alert('Event published!');
  } catch (error) {
    console.error(error);

    if (path) {
      await supabase.storage.from('event-posters')
        .remove([path]);
    }

    formError('Could not publish. Check your connection and Supabase permissions.');
  } finally {
    submit.disabled = false;
    submit.textContent = 'Publish event';
  }
});

async function initialize() {
  try {
    await loadUser();
    await loadEvents();
  } catch (error) {
    console.error(error);
    message('Could not connect to Campusora.', true);
  }
}

initialize();
</script>
</body>
                                       </html>
