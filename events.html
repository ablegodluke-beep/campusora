<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b14">
<title>Campusora | Events</title>

<style>
:root {
  --bg: #0b0b14;
  --card: #151522;
  --pink: #ff91c8;
  --purple: #b7a0ff;
  --text: #f7f4fb;
  --muted: #aaa6bb;
  --border: #292538;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px Arial, sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

header {
  border-bottom: 1px solid var(--border);
  background: #10101b;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  max-width: 1000px;
  margin: auto;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.logo { font-size: 19px; font-weight: bold; }
.logo span { color: var(--pink); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 14px;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
}

nav a.active { color: var(--pink); }

button.primary {
  border: 0;
  border-radius: 9px;
  background: linear-gradient(110deg, var(--pink), var(--purple));
  color: #1b1224;
  font-weight: bold;
  padding: 9px 12px;
}

button.secondary {
  border: 1px solid var(--border);
  background: #1b1928;
  color: var(--text);
  border-radius: 9px;
  padding: 8px 11px;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px 16px 40px;
}

.intro {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 19px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: linear-gradient(110deg, #191424, #141522);
}

.intro h1 { font-size: 22px; margin: 0 0 7px; }
.intro p { margin: 0; color: var(--muted); line-height: 1.5; }
.intro-icon { font-size: 33px; }

.search {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: white;
  outline: none;
}

.search:focus, .field:focus { border-color: var(--pink); }

.categories {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 12px 0;
}

.chip {
  white-space: nowrap;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--card);
  padding: 8px 12px;
  border-radius: 25px;
}

.chip.active {
  color: var(--pink);
  border-color: var(--pink);
  background: #211725;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 17px 0 13px;
  gap: 10px;
}

.section-title h2 { font-size: 16px; margin: 0; }
.muted { color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.event-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 13px;
}

.poster {
  height: 135px;
  background: linear-gradient(135deg, #32203b, #20203a);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 32px;
}

.poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body { padding: 12px; }

.badge {
  color: var(--pink);
  background: #291b2c;
  display: inline-block;
  padding: 4px 7px;
  font-size: 10px;
  border-radius: 5px;
}

.card-body h3 {
  margin: 9px 0 7px;
  font-size: 14px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.info {
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.description {
  color: #d0ccdc;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.card-bottom {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.small-btn {
  background: #211d30;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 7px 9px;
  border-radius: 7px;
  font-size: 11px;
}

.small-btn.active {
  color: var(--pink);
  border-color: var(--pink);
}

.organizer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 11px 0 3px;
}

.avatar {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 50%;
  object-fit: cover;
  background: #30243d;
  border: 1px solid var(--border);
}

.organizer-name { font-size: 11px; overflow-wrap: anywhere; }
.organizer-name strong { display: block; font-size: 12px; }
.organizer-name span { color: var(--muted); }

.empty {
  grid-column: 1/-1;
  padding: 30px 15px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.status { margin-top: 12px; font-size: 12px; color: var(--muted); }
.status.error, #formMessage { color: #ff9aa9; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #000b;
}

.modal.open { display: flex; }

.modal-box {
  background: #151522;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  width: min(100%, 560px);
  max-height: 90vh;
  overflow-y: auto;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.modal-head h2 { font-size: 17px; margin: 0; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-field { min-width: 0; }
.form-field.full { grid-column: 1/-1; }

label {
  display: block;
  font-size: 12px;
  margin-bottom: 6px;
  color: #d5d0e2;
}

.field {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0c0c17;
  color: white;
  outline: none;
}

textarea.field { min-height: 85px; resize: vertical; }

.check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0;
  color: var(--muted);
}

#formMessage { font-size: 12px; margin: 10px 0; }

.detail-text {
  white-space: pre-wrap;
  line-height: 1.6;
  color: #d0ccdc;
  overflow-wrap: anywhere;
}

.detail-poster {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 12px;
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  font-size: 11px;
}

@media(max-width:700px) {
  main { padding: 15px 12px 30px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .poster { height: 105px; }
  .card-body { padding: 9px; }
  .card-body h3 { font-size: 12px; }
  .description { font-size: 11px; }
  .small-btn { padding: 6px; font-size: 10px; }
  .intro h1 { font-size: 19px; }
}

@media(max-width:400px) {
  nav { padding: 12px 10px; }
  .logo { font-size: 17px; }
  .nav-links { gap: 8px; }
  nav a { font-size: 11px; }
  .nav-links a:nth-child(2),
  .nav-links a:nth-child(3) { display: none; }
  .intro { padding: 14px; }
  .intro-icon { font-size: 26px; }
  .grid { gap: 8px; }
}
</style>
</head>

<body>
<header>
<nav>
  <div class="logo">Campus<span>ora</span></div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="messages.html">Messages</a>
    <a href="marketplace.html">Market</a>
    <a href="events.html" class="active">Events</a>
    <button class="primary" id="openCreate">+ Create</button>
  </div>
</nav>
</header>

<main>
  <section class="intro">
    <div>
      <h1>Campus Events 💗</h1>
      <p>Find events. Meet people. Join in.</p>
    </div>
    <div class="intro-icon">🎟️</div>
  </section>

  <input class="search" id="searchInput" type="search"
    placeholder="Search events or locations..." aria-label="Search events">

  <div class="categories" id="categories">
    <button class="chip active" data-category="All">All</button>
    <button class="chip" data-category="Academic">Academic</button>
    <button class="chip" data-category="Technology">Tech</button>
    <button class="chip" data-category="Business">Business</button>
    <button class="chip" data-category="Career">Career</button>
    <button class="chip" data-category="Sports">Sports</button>
    <button class="chip" data-category="Entertainment">Fun</button>
    <button class="chip" data-category="Social">Social</button>
    <button class="chip" data-category="Other">Other</button>
  </div>

  <div class="section-title">
    <h2>Upcoming events</h2>
    <span class="muted" id="eventCount"></span>
  </div>

  <div id="pageMessage" class="status">Connecting...</div>
  <div class="grid" id="eventsGrid">
    <div class="empty">Loading events...</div>
  </div>

  <div class="section-title" id="myEventsHeading" hidden>
    <h2>My events</h2>
    <span class="muted">Manage your events</span>
  </div>
  <div class="grid" id="myEventsGrid"></div>
</main>

<footer>Campusora · Your campus community</footer>

<div class="modal" id="createModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="formTitle">Create an event</h2>
      <button class="secondary" id="closeModal" type="button">✕</button>
    </div>

    <form id="eventForm">
      <div class="form-grid">
        <div class="form-field full">
          <label for="eventTitle">Event name *</label>
          <input class="field" id="eventTitle" maxlength="150" required>
        </div>

        <div class="form-field full">
          <label for="eventDescription">Description *</label>
          <textarea class="field" id="eventDescription" maxlength="5000"
            placeholder="What's happening?" required></textarea>
        </div>

        <div class="form-field">
          <label for="eventCategory">Category</label>
          <select class="field" id="eventCategory">
            <option>Academic</option>
            <option>Technology</option>
            <option>Business</option>
            <option>Career</option>
            <option>Sports</option>
            <option>Entertainment</option>
            <option>Social</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-field">
          <label for="eventVisibility">Audience</label>
          <select class="field" id="eventVisibility">
            <option value="public">Public</option>
            <option value="campus">Campus</option>
            <option value="private">Private</option>
          </select>
        </div>

        <div class="form-field">
          <label for="startTime">Starts *</label>
          <input class="field" id="startTime" type="datetime-local" required>
        </div>

        <div class="form-field">
          <label for="endTime">Ends *</label>
          <input class="field" id="endTime" type="datetime-local" required>
        </div>

        <div class="form-field full">
          <label for="eventLocation">Location</label>
          <input class="field" id="eventLocation" maxlength="250"
            placeholder="Where is it happening?">
        </div>

        <div class="form-field full">
          <label for="eventInstitution">School</label>
          <input class="field" id="eventInstitution" maxlength="250"
            placeholder="Your school">
        </div>

        <div class="form-field">
          <label for="eventPrice">Entry</label>
          <select class="field" id="eventPrice">
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="form-field">
          <label for="eventPoster">Poster (optional)</label>
          <input class="field" id="eventPoster" type="file"
            accept="image/jpeg,image/png,image/webp">
        </div>

        <div class="form-field full" id="ticketField" hidden>
          <label for="ticketUrl">Ticket link *</label>
          <input class="field" id="ticketUrl" type="url" placeholder="https://...">
        </div>

        <div class="form-field full">
          <label for="onlineUrl">Meeting link (optional)</label>
          <input class="field" id="onlineUrl" type="url" placeholder="https://...">
        </div>
      </div>

      <label class="check-row">
        <input id="isOnline" type="checkbox"> Online event
      </label>

      <div id="formMessage" hidden></div>
      <button class="primary" id="submitEvent" type="submit" style="width:100%">
        Publish event
      </button>
    </form>
  </div>
</div>

<div class="modal" id="detailModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Event details</h2>
      <button class="secondary" id="closeDetail" type="button">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>
  </div>

  <script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let events = [];
let myEvents = [];
let currentUser = null;
let profile = null;
let interests = new Set();
let counts = {};
let organizers = {};
let category = 'All';
let editingEventId = null;

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;',
    '"':'&quot;', "'":'&#39;'
  })[c]);
}

function safeURL(value) {
  if (!value) return '';
  try {
    const u = new URL(value);
    return ['https:', 'http:'].includes(u.protocol) ? u.href : '';
  } catch {
    return '';
  }
}

function dateText(value) {
  return new Intl.DateTimeFormat(undefined, {
    day: 'numeric',
    month: 'short',
    year: 'numeric',
    hour: 'numeric',
    minute: '2-digit'
  }).format(new Date(value));
}

function localDateValue(value) {
  const d = new Date(value);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

function message(text, error = false) {
  $('pageMessage').textContent = text;
  $('pageMessage').classList.toggle('error', error);
}

function organizerFor(event) {
  return organizers[event.organizer_id] || {
    full_name: 'Campusora member',
    username: '',
    avatar_url: ''
  };
}

function organizerHTML(event) {
  const p = organizerFor(event);
  const name = p.full_name || p.username || 'Campusora member';
  const avatar = safeURL(p.avatar_url);

  return `
    <div class="organizer">
      ${avatar
        ? `<img class="avatar" src="${escapeHTML(avatar)}" alt="">`
        : `<div class="avatar" style="display:flex;align-items:center;justify-content:center">👤</div>`
      }
      <div class="organizer-name">
        <strong>${escapeHTML(name)}</strong>
        <span>Event organizer</span>
      </div>
    </div>`;
}

function filtered(list) {
  const q = $('searchInput').value.trim().toLowerCase();

  return list.filter(event => {
    const categoryMatch =
      category === 'All' || event.category === category;

    const words = [
      event.title,
      event.description,
      event.location,
      event.category,
      event.institution
    ].filter(Boolean).join(' ').toLowerCase();

    return categoryMatch && words.includes(q);
  });
}

function cardHTML(event, manage = false) {
  const poster = safeURL(event.poster_url);
  const interested = interests.has(event.id);
  const count = counts[event.id] ?? 0;

  return `
    <article class="event-card">
      <div class="poster">
        ${poster
          ? `<img src="${escapeHTML(poster)}" alt="${escapeHTML(event.title)}" loading="lazy">`
          : '🎟️'}
      </div>

      <div class="card-body">
        <span class="badge">
          ${escapeHTML(event.category || 'Other')}
          · ${escapeHTML(event.visibility || 'public')}
        </span>

        <h3>${escapeHTML(event.title)}</h3>

        <div class="info">
          📅 ${escapeHTML(dateText(event.start_time))}<br>
          📍 ${escapeHTML(event.location || (event.is_online ? 'Online' : 'TBA'))}
          ${event.institution
            ? `<br>🎓 ${escapeHTML(event.institution)}`
            : ''}
          <br>❤️ ${count} interested
          ${event.status === 'cancelled' ? '<br>⚠️ Cancelled' : ''}
        </div>

        ${organizerHTML(event)}

        <p class="description">
          ${escapeHTML((event.description || '').slice(0, 95))}
          ${(event.description || '').length > 95 ? '…' : ''}
        </p>

        <div class="card-bottom">
          ${!manage && event.status !== 'cancelled'
            ? `<button class="small-btn ${interested ? 'active' : ''}"
                data-interest="${escapeHTML(event.id)}">
                ${interested ? '♥ Interested' : '♡ Interested'}
              </button>`
            : ''}

          <button class="small-btn" data-details="${escapeHTML(event.id)}">
            Details
          </button>

          <button class="small-btn" data-share="${escapeHTML(event.id)}">
            Share ↗
          </button>

          ${manage
            ? `<button class="small-btn" data-edit="${escapeHTML(event.id)}">Edit</button>
               ${event.status !== 'cancelled'
                 ? `<button class="small-btn" data-cancel="${escapeHTML(event.id)}">Cancel</button>`
                 : ''}`
            : ''}
        </div>
      </div>
    </article>`;
}

function render() {
  const list = filtered(events);
  $('eventCount').textContent = list.length;

  $('eventsGrid').innerHTML = list.length
    ? list.map(event => cardHTML(event)).join('')
    : `<div class="empty">No matching upcoming events. Try another search or create one.</div>`;

  const mine = filtered(myEvents);

  $('myEventsHeading').hidden = !currentUser || myEvents.length === 0;

  $('myEventsGrid').innerHTML = mine
    .map(event => cardHTML(event, true))
    .join('');
}

async function loadProfiles(rows) {
  const ids = [...new Set(rows.map(e => e.organizer_id).filter(Boolean))];

  if (!ids.length) return;

  try {
    const { data, error } = await supabase
      .from('profiles')
      .select('id,username,full_name,avatar_url,school')
      .in('id', ids);

    if (error) {
      console.warn('Could not load organizer profiles:', error.message);
      return;
    }

    (data || []).forEach(p => {
      organizers[p.id] = p;
    });
  } catch (error) {
    console.warn(error);
  }
}

async function loadCounts(rows) {
  const ids = [...new Set(rows.map(e => e.id))];
  if (!ids.length) return;

  try {
    const { data, error } = await supabase.rpc(
      'get_event_interest_counts',
      { event_ids: ids }
    );

    if (error) {
      console.warn('Interest counts unavailable:', error.message);
      return;
    }

    (data || []).forEach(row => {
      counts[row.event_id] = Number(row.interest_count) || 0;
    });
  } catch (error) {
    console.warn(error);
  }
}

async function loadEvents() {
  message('Loading events...');

  try {
    const now = new Date().toISOString();

    const { data, error } = await supabase
      .from('events')
      .select('*')
      .eq('status', 'published')
      .in('visibility', ['public', 'campus'])
      .gte('start_time', now)
      .order('start_time', { ascending: true });

    if (error) throw error;

    events = data || [];
    myEvents = [];

    if (currentUser) {
      const { data: mine, error: mineError } = await supabase
        .from('events')
        .select('*')
        .eq('organizer_id', currentUser.id)
        .order('start_time', { ascending: true });

      if (!mineError) myEvents = mine || [];
    }

    const all = [
      ...new Map([...events, ...myEvents].map(e => [e.id, e])).values()
    ];

    await Promise.all([
      loadProfiles(all),
      loadCounts(all)
    ]);

    render();

    message(events.length
      ? 'Events are up to date.'
      : 'No public or campus upcoming events yet. Be the first to create one!');
  } catch (error) {
    console.error(error);
    message('Could not load events. Check Supabase settings and permissions.', true);
    $('eventsGrid').innerHTML =
      '<div class="empty">Events could not load. Please try again later.</div>';
  }
}

async function loadUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error || !data.user) return;

  currentUser = data.user;

  const { data: p, error: profileError } = await supabase
    .from('profiles')
    .select('id,username,full_name,avatar_url,school')
    .eq('id', currentUser.id)
    .maybeSingle();

  if (!profileError && p) profile = p;

  const { data: rows, error: interestError } = await supabase
    .from('event_interests')
    .select('event_id')
    .eq('user_id', currentUser.id);

  if (!interestError && rows) {
    interests = new Set(rows.map(row => row.event_id));
  }
}

async function toggleInterest(id) {
  if (!currentUser) {
    alert('Please sign in first.');
    return;
  }

  try {
    if (interests.has(id)) {
      const { error } = await supabase
        .from('event_interests')
        .delete()
        .eq('event_id', id)
        .eq('user_id', currentUser.id);

      if (error) throw error;

      interests.delete(id);
      counts[id] = Math.max(0, (counts[id] || 0) - 1);
    } else {
      const { error } = await supabase
        .from('event_interests')
        .insert({
          event_id: id,
          user_id: currentUser.id
        });

      if (error) throw error;

      interests.add(id);
      counts[id] = (counts[id] || 0) + 1;
    }

    render();
  } catch (error) {
    console.error(error);
    alert('Could not update your interest. Please try again.');
  }
}

async function shareEvent(id) {
  const event = [...events, ...myEvents].find(item => item.id === id);
  if (!event) return;

  const url = new URL(location.href);
  url.searchParams.set('event', id);

  try {
    if (navigator.share) {
      await navigator.share({
        title: event.title,
        text: `Check out ${event.title} on Campusora`,
        url: url.href
      });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(url.href);
      alert('Event link copied!');
    } else {
      prompt('Copy event link:', url.href);
    }
  } catch (error) {
    if (error.name !== 'AbortError') alert('Sharing failed.');
  }
}

// Open the form for a new event

    return;
  }

  editingEventId = null;
  $('eventForm').reset();

  $('eventFormTitle').textContent = 'Create an event';

// Edit an existing event
function openEditForm(id) {
  const event = myEvents.find(item => item.id === id);

  if (!event || event.organizer_id !== currentUser?.id) {
    alert('You can only edit your own events.');
    return;
  }

  editingEventId = id;

  $('eventFormTitle').textContent = 'Edit event';
  $('submitEvent').textContent = 'Save changes';

  $('title').value = event.title || '';
  $('description').value = event.description || '';
  $('categorySelect').value = event.category || 'Other';
  $('startTime').value = localDateValue(event.start_time);
  $('endTime').value = event.end_time
    ? localDateValue(event.end_time)
    : '';
  $('location').value = event.location || '';
  $('institution').value = event.institution || '';
  $('visibility').value = event.visibility || 'public';
  $('priceType').value = event.price_type || 'free';
  $('ticketUrl').value = event.ticket_url || '';
  $('onlineUrl').value = event.online_url || '';
  $('isOnline').checked = !!event.is_online;

  $('eventModal').classList.add('show');

// Cancel one of your events
async function cancelEvent(id) {
  const event = myEvents.find(item => item.id === id);

  if (!event || event.organizer_id !== currentUser?.id) {
    alert('You can only cancel your own events.');
    return;
  }

  if (!confirm(`Cancel "${event.title}"?`)) return;

  const { error } = await supabase
    .from('events')
    .update({
      status: 'cancelled',
      updated_at: new Date().toISOString()
    })
    .eq('id', id)
    .eq('organizer_id', currentUser.id);

  if (error) {
    console.error(error);
    alert('Could not cancel the event. Check your Supabase permissions.');
    return;
  }

  alert('Event cancelled.');
  await loadEvents();
}

// Create or update an event
async function saveEvent(e) {
  e.preventDefault();

  if (!currentUser) {
    alert('Please sign in first.');
    return;
  }

  const title = $('title').value.trim();
  const description = $('description').value.trim();
  const startValue = $('startTime').value;
  const endValue = $('endTime').value;

  if (!title || !description || !startValue) {
    alert('Please fill in the event title, description and start date.');
    return;
  }

  const start = new Date(startValue);
  const end = endValue ? new Date(endValue) : null;

  if (Number.isNaN(start.getTime()) || start <= new Date()) {
    alert('Choose a valid future start date and time.');
    return;
  }

  if (end && (Number.isNaN(end.getTime()) || end <= start)) {
    alert('The end date and time must be after the start date.');
    return;
  }

  const ticketUrl = $('ticketUrl').value.trim();
  const onlineUrl = $('onlineUrl').value.trim();

  if (ticketUrl && !safeURL(ticketUrl)) {
    alert('Please enter a valid ticket URL beginning with https://');
    return;
  }

  if (onlineUrl && !safeURL(onlineUrl)) {
    alert('Please enter a valid online meeting URL beginning with https://');
    return;
  }

  const posterFile = $('poster').files[0];
  let posterUrl = '';

  if (posterFile) {
    const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];

    if (!allowedTypes.includes(posterFile.type)) {
      alert('Please upload a JPG, PNG or WebP image.');
      return;
    }

    if (posterFile.size > 5 * 1024 * 1024) {
      alert('The poster must be smaller than 5 MB.');
      return;
    }
  }

  const oldEvent = editingEventId
    ? myEvents.find(item => item.id === editingEventId)
    : null;

  posterUrl = oldEvent?.poster_url || '';

  $('submitEvent').disabled = true;
  $('submitEvent').textContent = 'Saving...';

  try {
    // Upload a new poster if the user selected one
    if (posterFile) {
      const extension = posterFile.name.split('.').pop().toLowerCase();
      const path = `${currentUser.id}/${crypto.randomUUID()}.${extension}`;

      const { error: uploadError } = await supabase.storage
        .from('event-posters')
        .upload(path, posterFile, {
          cacheControl: '3600',
          upsert: false,
          contentType: posterFile.type
        });

      if (uploadError) throw uploadError;

      const { data: publicData } = supabase.storage
        .from('event-posters')
        .getPublicUrl(path);

      posterUrl = publicData.publicUrl;
    }

    const eventData = {
      title,
      description,
      category: $('categorySelect').value,
      start_time: start.toISOString(),
      end_time: end ? end.toISOString() : null,
      location: $('location').value.trim(),
      institution: $('institution').value.trim(),
      visibility: $('visibility').value,
      price_type: $('priceType').value,
      ticket_url: ticketUrl || null,
      online_url: onlineUrl || null,
      is_online: $('isOnline').checked,
      poster_url: posterUrl || null,
      updated_at: new Date().toISOString()
    };

    let result;

    if (editingEventId) {
      result = await supabase
        .from('events')
        .update(eventData)
        .eq('id', editingEventId)
        .eq('organizer_id', currentUser.id);
    } else {
      result = await supabase
        .from('events')
        .insert({
          ...eventData,
          organizer_id: currentUser.id,
          status: 'published'
        });
    }

    if (result.error) throw result.error;

    $('eventModal').classList.remove('show');
    $('eventForm').reset();

    alert(editingEventId
      ? 'Your event has been updated!'
      : 'Your event has been published!');

    editingEventId = null;

    await loadEvents();

  } catch (error) {
    console.error('Saving event failed:', error);
    alert('Could not save your event. Check your internet connection and Supabase settings.');
  } finally {
    $('submitEvent').disabled = false;
    $('submitEvent').textContent = editingEventId
      ? 'Save changes'
      : 'Publish event';
  }
}

// Handle buttons inside event cards
document.addEventListener('click', async e => {
  const interestButton = e.target.closest('[data-interest]');
  const detailButton = e.target.closest('[data-details]');
  const shareButton = e.target.closest('[data-share]');
  const editButton = e.target.closest('[data-edit]');
  const cancelButton = e.target.closest('[data-cancel]');

  if (interestButton) {
    await toggleInterest(interestButton.dataset.interest);
  }

  if (detailButton) {
    openDetails(detailButton.dataset.details);
  }

  if (shareButton) {
    await shareEvent(shareButton.dataset.share);
  }

  if (editButton) {
    openEditForm(editButton.dataset.edit);
  }

  if (cancelButton) {
    await cancelEvent(cancelButton.dataset.cancel);
  }
});

['eventModal', 'detailModal'].forEach(id => {

    if (e.target.id === id) {

    }
  });
});

// Start Campusora Events
async function startEventsPage() {
  try {
    await loadUser();
    await loadEvents();

    // Open a shared event automatically if its ID is in the URL
    const sharedEventId = new URLSearchParams(location.search).get('event');

    if (sharedEventId) {
      const event = [...events, ...myEvents]
        .find(item => item.id === sharedEventId);

      if (event) openDetails(sharedEventId);
    }
  } catch (error) {
    console.error(error);
    message('Something went wrong while starting the events page.', true);
  }
}

startEventsPage();
