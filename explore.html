<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Explore | Campusora</title>

<link rel="stylesheet" href="./shared-nav.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080b18;
  --panel:#11162a;
  --panel2:#171d35;
  --border:#252d49;
  --text:#f4f6ff;
  --muted:#9ca8c8;
  --purple:#8957ff;
  --blue:#477bff;
  --cyan:#45e0e5;
  --green:#36d99a;
  --gradient:linear-gradient(120deg,#8957ff,#477bff,#45e0e5);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  background:
    radial-gradient(circle at 90% 0%,#17183a 0,transparent 32%),
    var(--bg);
  color:var(--text);
  font-family:"DM Sans",Arial,sans-serif;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

a {
  color:inherit;
  text-decoration:none;
}

/* TOP PROGRESS */

#pageProgress {
  position:fixed;
  top:0;
  left:0;
  width:0;
  height:3px;
  opacity:0;
  z-index:999999;
  background:var(--gradient);
  box-shadow:0 0 10px #477bff80;
  transition:width .3s ease,opacity .3s ease;
  pointer-events:none;
}

#pageProgress.active {
  width:85%;
  opacity:1;
  animation:progressMove 1.1s ease-in-out infinite alternate;
}

#pageProgress.complete {
  width:100%;
  opacity:0;
}

@keyframes progressMove {
  from {width:65%}
  to {width:90%}
}

/* PAGE */

.page {
  width:100%;
  max-width:850px;
  margin:auto;
  padding:20px 15px 40px;
}

.heading {
  margin-bottom:18px;
}

.heading h1 {
  font-size:23px;
  font-weight:900;
  letter-spacing:-.6px;
}

/* SEARCH */

.search-area {
  display:flex;
  gap:8px;
  margin-bottom:17px;
}

.search-box {
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
}

.search-box:focus-within {
  border-color:var(--purple);
  box-shadow:0 0 0 3px #8957ff18;
}

.search-icon {
  color:var(--cyan);
  font-size:20px;
}

.search-box input {
  width:100%;
  min-width:0;
  padding:13px 0;
  color:var(--text);
  background:transparent;
  border:0;
  outline:none;
  font-size:13px;
}

.search-box input::placeholder {
  color:#7783a3;
}

.search-btn {
  border:0;
  border-radius:11px;
  padding:0 17px;
  color:white;
  font-size:11px;
  font-weight:800;
  background:linear-gradient(120deg,var(--purple),var(--blue));
}

/* STATUS */

.status-message {
  display:none;
  padding:11px 13px;
  margin-bottom:13px;
  border-radius:10px;
  background:#45e0e510;
  border:1px solid #45e0e530;
  color:var(--cyan);
  font-size:12px;
  line-height:1.6;
}

.status-message.error {
  color:#ff9bab;
  background:#ff647c10;
  border-color:#ff647c35;
}

/* TABS */

.tabs {
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--border);
  margin-bottom:18px;
}

.tab {
  flex:1;
  padding:12px 10px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
  font-size:12px;
  font-weight:800;
}

.tab.active {
  color:white;
  background:#8957ff16;
  border-bottom-color:var(--purple);
}

/* SECTION HEADER */

.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-heading h2 {
  font-size:15px;
  font-weight:800;
}

.refresh-btn {
  flex-shrink:0;
  color:var(--cyan);
  background:#45e0e508;
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 10px;
  font-size:10px;
  font-weight:700;
}

/* HORIZONTAL ROW LISTS */

.list {
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:11px 12px;
  background:linear-gradient(145deg,#141a30,#0f1426);
  border:1px solid var(--border);
  border-radius:13px;
  transition:border-color .2s;
}

.row:hover {
  border-color:#51458a;
}

.avatar {
  width:43px;
  height:43px;
  flex-shrink:0;
  object-fit:cover;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  border:2px solid #ffffff17;
}

.row-info {
  flex:1;
  min-width:0;
}

.row-name {
  font-size:12px;
  font-weight:800;
  line-height:1.45;
  overflow-wrap:anywhere;
}

.row-username {
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
  overflow-wrap:anywhere;
}

.row-detail {
  color:#c3cce3;
  font-size:10px;
  margin-top:4px;
  line-height:1.45;
  overflow-wrap:anywhere;
}

.row-actions {
  display:flex;
  align-items:center;
  gap:6px;
  flex-shrink:0;
}

.action-btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:33px;
  padding:0 11px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.follow-btn,
.join-btn {
  color:white;
  background:linear-gradient(120deg,var(--purple),var(--blue));
  border:0;
}

.message-btn,
.leave-btn {
  color:var(--cyan);
  background:#45e0e510;
  border:1px solid #45e0e540;
}

.action-btn:disabled {
  opacity:.6;
  cursor:wait;
}

/* COMMUNITY ICON */

.community-icon {
  width:43px;
  height:43px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,#7544e933,#45e0e51c);
  border:1px solid #ffffff12;
  font-size:20px;
}

.community-description {
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  margin-top:4px;
  overflow-wrap:anywhere;
}

/* EMPTY / LOADING */

.message-box {
  width:100%;
  padding:30px 15px;
  text-align:center;
  background:var(--panel);
  border:1px dashed #303958;
  border-radius:13px;
}

.message-icon {
  font-size:25px;
  margin-bottom:9px;
}

.message-box h3 {
  font-size:13px;
  margin-bottom:6px;
}

.message-box p {
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.hidden {
  display:none !important;
}

/* MOBILE */

@media(max-width:520px) {
  .page {
    padding:16px 11px 30px;
  }

  .heading h1 {
    font-size:21px;
  }

  .search-box {
    padding:0 9px;
  }

  .search-box input {
    font-size:12px;
  }

  .search-btn {
    padding:0 12px;
    font-size:10px;
  }

  .row {
    gap:8px;
    padding:10px 9px;
  }

  .avatar,
  .community-icon {
    width:38px;
    height:38px;
  }

  .row-name {
    font-size:11px;
  }

  .row-username,
  .row-detail,
  .community-description {
    font-size:9px;
  }

  .row-actions {
    gap:5px;
  }

  .action-btn {
    min-height:31px;
    padding:0 8px;
    font-size:9px;
  }
}

@media(max-width:360px) {
  .row {
    flex-wrap:wrap;
  }

  .row-info {
    width:calc(100% - 52px);
  }

  .row-actions {
    width:100%;
    padding-left:46px;
  }

  .row-actions .action-btn {
    flex:1;
  }
}
</style>
</head>

<body>

<div id="pageProgress"></div>

<main class="page">
  <form class="search-area" id="searchForm">
    <label class="search-box">
      <span class="search-icon">⌕</span>
      <input
        id="searchInput"
        type="search"
        placeholder="Search people or communities..."
        autocomplete="off"
      >
    </label>

    <button class="search-btn" type="submit">Search</button>
  </form>

  <div id="statusMessage" class="status-message"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="people">
      👥 People
    </button>

    <button class="tab" data-tab="communities">
      🏫 Communities
    </button>
  </nav>

  <!-- PEOPLE -->

  <section id="peopleSection">

    <div class="section-heading">
      <h2>People</h2>

      <button class="refresh-btn" onclick="loadPeople()">
        ↻ Refresh
      </button>
    </div>

    <div id="peopleList" class="list">
      <div class="message-box">
        <div class="message-icon">⏳</div>
        <h3>Loading members...</h3>
        <p>Finding people on Campusora.</p>
      </div>
    </div>

  </section>

  <!-- COMMUNITIES -->

  <section id="communitiesSection" class="hidden">

    <div class="section-heading">
      <h2>Communities</h2>

      <button class="refresh-btn" onclick="loadCommunities()">
        ↻ Refresh
      </button>
    </div>

    <div id="communitiesList" class="list">
      <div class="message-box">
        <div class="message-icon">⏳</div>
        <h3>Loading communities...</h3>
        <p>Finding communities to explore.</p>
      </div>
    </div>

  </section>

</main>

<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let currentUser = null;
let currentTab = 'people';
let searchTerm = '';

let people = [];
let communities = [];

let followingIds = new Set();
let joinedCommunityIds = new Set();

let loadingPeople = false;
let loadingCommunities = false;

/* HELPERS */

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, character => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[character]);
}

function safeURL(value = '') {
  try {
    const url = new URL(value, window.location.origin);

    if (
      url.protocol === 'https:' ||
      url.protocol === 'http:'
    ) {
      return url.href;
    }

    return '';
  } catch {
    return '';
  }
}

function avatarHTML(url, name) {
  const safeImage = safeURL(url);

  const fallback =
    'https://ui-avatars.com/api/?name=' +
    encodeURIComponent(name || 'Campusora Member') +
    '&background=252044&color=ffffff&size=100';

  return `
    <img
      class="avatar"
      src="${escapeHTML(safeImage || fallback)}"
      alt="${escapeHTML(name || 'Member')}"
      loading="lazy"
      onerror="this.onerror=null;this.src='${fallback}'"
    >
  `;
}

function showMessage(message, isError = false) {
  const box = $('statusMessage');

  box.textContent = message;
  box.classList.toggle('error', isError);
  box.style.display = 'block';

  if (!isError) {
    setTimeout(() => {
      box.style.display = 'none';
    }, 3500);
  }
}

function showEmpty(containerId, icon, title, description) {
  $(containerId).innerHTML = `
    <div class="message-box">
      <div class="message-icon">${icon}</div>
      <h3>${escapeHTML(title)}</h3>
      <p>${escapeHTML(description)}</p>
    </div>
  `;
}

function matchesSearch(values) {
  if (!searchTerm) return true;

  return values.some(value =>
    String(value || '').toLowerCase().includes(searchTerm)
  );
}

/* TABS */

document.querySelectorAll('.tab').forEach(button => {
  button.addEventListener('click', () => {
    currentTab = button.dataset.tab;

    document.querySelectorAll('.tab').forEach(tab => {
      tab.classList.toggle('active', tab === button);
    });

    $('peopleSection').classList.toggle(
      'hidden',
      currentTab !== 'people'
    );

    $('communitiesSection').classList.toggle(
      'hidden',
      currentTab !== 'communities'
    );

    renderCurrentTab();
  });
});

/* SEARCH */

$('searchForm').addEventListener('submit', event => {
  event.preventDefault();

  searchTerm = $('searchInput').value.trim().toLowerCase();

  renderCurrentTab();
});

$('searchInput').addEventListener('input', () => {
  searchTerm = $('searchInput').value.trim().toLowerCase();

  renderCurrentTab();
});

function renderCurrentTab() {
  if (currentTab === 'people') renderPeople();
  if (currentTab === 'communities') renderCommunities();
}

/* LOAD PEOPLE */

window.loadPeople = loadPeople;

async function loadPeople() {
  if (loadingPeople) return;

  loadingPeople = true;

  showEmpty(
    'peopleList',
    '⏳',
    'Loading members...',
    'Please wait.'
  );

  try {
    const { data, error } = await supabase
      .from('profiles')
      .select(
        'id, username, full_name, bio, avatar_url, school, role, created_at'
      )
      .order('created_at', { ascending: false })
      .limit(100);

    if (error) throw error;

    let loadedPeople = data || [];

    if (currentUser) {
      const { data: followsData, error: followsError } =
        await supabase
          .from('follows')
          .select('following_id')
          .eq('follower_id', currentUser.id);

      if (followsError) throw followsError;

      followingIds = new Set(
        (followsData || []).map(item => item.following_id)
      );

      /* Exclude own profile and people already followed */

      people = loadedPeople.filter(person =>
        person.id !== currentUser.id &&
        !followingIds.has(person.id)
      );

    } else {
      people = loadedPeople;
    }

    renderPeople();

  } catch (error) {
    console.error('Explore people error:', error);

    showEmpty(
      'peopleList',
      '⚠️',
      'Could not load members',
      'Check your internet connection and try refreshing.'
    );

  } finally {
    loadingPeople = false;
  }
}

/* RENDER PEOPLE */

function renderPeople() {
  const list = $('peopleList');

  const filtered = people.filter(person =>
    matchesSearch([
      person.full_name,
      person.username,
      person.school,
      person.role,
      person.bio
    ])
  );

  if (!filtered.length) {
    showEmpty(
      'peopleList',
      '👥',
      'No people found',
      searchTerm
        ? 'Try another name, username or school.'
        : 'There are no new people to discover right now.'
    );

    return;
  }

  list.innerHTML = filtered.map(person => {
    const name =
      person.full_name ||
      person.username ||
      'Campusora Member';

    return `
      <article class="row">

        ${avatarHTML(person.avatar_url, name)}

        <div class="row-info">

          <a
            class="row-name"
            href="profile.html?id=${encodeURIComponent(person.id)}"
          >
            ${escapeHTML(name)}
          </a>

          <div class="row-username">
            @${escapeHTML(person.username || 'member')}
          </div>

          <div class="row-detail">
            🏫 ${escapeHTML(person.school || 'School not added')}
          </div>

        </div>

        <div class="row-actions">

          <button
            class="action-btn follow-btn"
            data-follow-id="${escapeHTML(person.id)}"
          >
            + Follow
          </button>

          <a
            class="action-btn message-btn"
            href="messages.html?user=${encodeURIComponent(person.id)}"
          >
            Message
          </a>

        </div>

      </article>
    `;
  }).join('');

  list.querySelectorAll('[data-follow-id]').forEach(button => {
    button.addEventListener('click', () => {
      toggleFollow(button.dataset.followId, button);
    });
  });
}

/* FOLLOW */

async function toggleFollow(profileId, button) {
  if (!currentUser) {
    showMessage(
      'Please log in before following members.',
      true
    );
    return;
  }

  if (profileId === currentUser.id) return;

  if (followingIds.has(profileId)) return;

  button.disabled = true;

  try {
    const { error } = await supabase
      .from('follows')
      .insert({
        follower_id: currentUser.id,
        following_id: profileId
      });

    if (error) throw error;

    followingIds.add(profileId);

    /* Remove followed person from discovery */

    people = people.filter(person =>
      person.id !== profileId
    );

    renderPeople();

    showMessage('You are now following this member.');

  } catch (error) {
    console.error('Follow error:', error);

    showMessage(
      error.message ||
      'Could not follow this member. Please try again.',
      true
    );

    button.disabled = false;
  }
}

/* LOAD COMMUNITIES */

window.loadCommunities = loadCommunities;

async function loadCommunities() {
  if (loadingCommunities) return;

  loadingCommunities = true;

  showEmpty(
    'communitiesList',
    '⏳',
    'Loading communities...',
    'Please wait.'
  );

  try {
    const { data, error } = await supabase
      .from('communities')
      .select('id, name, description, school, created_by')
      .order('name', { ascending: true })
      .limit(100);

    if (error) throw error;

    communities = data || [];

    if (currentUser) {
      const { data: membershipData, error: membershipError } =
        await supabase
          .from('community_members')
          .select('community_id')
          .eq('user_id', currentUser.id);

      if (membershipError) throw membershipError;

      joinedCommunityIds = new Set(
        (membershipData || []).map(item => item.community_id)
      );
    }

    renderCommunities();

  } catch (error) {
    console.error('Explore communities error:', error);

    showEmpty(
      'communitiesList',
      '⚠️',
      'Could not load communities',
      'Check your internet connection and try refreshing.'
    );

  } finally {
    loadingCommunities = false;
  }
}

/* RENDER COMMUNITIES */

function renderCommunities() {
  const list = $('communitiesList');

  const filtered = communities.filter(community =>
    matchesSearch([
      community.name,
      community.description,
      community.school
    ])
  );

  if (!filtered.length) {
    showEmpty(
      'communitiesList',
      '🏫',
      'No communities found',
      searchTerm
        ? 'Try another school or keyword.'
        : 'Communities will appear here when they are created.'
    );

    return;
  }

  list.innerHTML = filtered.map(community => {
    const joined = joinedCommunityIds.has(community.id);

    return `
      <article class="row">

        <div class="community-icon">
          🏫
        </div>

        <div class="row-info">

          <div class="row-name">
            ${escapeHTML(community.name || 'Campus Community')}
          </div>

          <div class="row-detail">
            ${escapeHTML(community.school || 'Open community')}
          </div>

          <p class="community-description">
            ${escapeHTML(
              community.description ||
              'Connect with people and share ideas in this community.'
            )}
          </p>

        </div>

        <div class="row-actions">

          <button
            class="action-btn ${joined ? 'leave-btn' : 'join-btn'}"
            data-community-id="${escapeHTML(community.id)}"
          >
            ${joined ? '✓ Joined' : '+ Join'}
          </button>

        </div>

      </article>
    `;
  }).join('');

  list.querySelectorAll('[data-community-id]').forEach(button => {
    button.addEventListener('click', () => {
      toggleCommunity(
        button.dataset.communityId,
        button
      );
    });
  });
}

/* JOIN / LEAVE COMMUNITY */

async function toggleCommunity(communityId, button) {
  if (!currentUser) {
    showMessage(
      'Please log in before joining a community.',
      true
    );
    return;
  }

  button.disabled = true;

  try {
    if (joinedCommunityIds.has(communityId)) {

      const { error } = await supabase
        .from('community_members')
        .delete()
        .eq('community_id', communityId)
        .eq('user_id', currentUser.id);

      if (error) throw error;

      joinedCommunityIds.delete(communityId);

      showMessage('You left the community.');

    } else {

      const { error } = await supabase
        .from('community_members')
        .insert({
          community_id: communityId,
          user_id: currentUser.id
        });

      if (error) throw error;

      joinedCommunityIds.add(communityId);

      showMessage('You joined the community!');
    }

    renderCommunities();

  } catch (error) {
    console.error('Community membership error:', error);

    showMessage(
      error.message ||
      'Could not update membership. Please try again.',
      true
    );

    button.disabled = false;
  }
}

/* BACK BUTTON */

window.goBack = function() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
};

/* INITIALIZATION */

async function initExplore() {
  const progress = $('pageProgress');

  progress.classList.remove('complete');
  progress.classList.add('active');

  try {
    const { data, error } = await supabase.auth.getSession();

    if (error) throw error;

    currentUser = data?.session?.user || null;

  } catch (error) {
    console.error('Session check error:', error);
    currentUser = null;
  }

  try {
    await Promise.all([
      loadPeople(),
      loadCommunities()
    ]);

  } finally {
    progress.classList.remove('active');
    progress.classList.add('complete');

    setTimeout(() => {
      progress.classList.remove('complete');
    }, 400);
  }
}

initExplore();

</script>

<script src="./shared-nav.js"></script>

</body>
</html>
