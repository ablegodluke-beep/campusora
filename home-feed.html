<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<title>Your Feed | Campusora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared-nav.css">

<style>
:root{
  --bg:#080b18;
  --surface:#101426;
  --surface2:#171c32;
  --border:rgba(255,255,255,.085);
  --text:#f5f6ff;
  --muted:#929bb6;
  --purple:#925bff;
  --blue:#526dff;
  --cyan:#39d7f5;
  --gradient:linear-gradient(120deg,#925bff,#526dff,#39d7f5);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  padding-bottom:100px;
  overflow-x:hidden;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

#pageProgress{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0;
  z-index:20000;
  background:var(--gradient);
  box-shadow:0 0 12px #925bff80;
  transition:width .25s;
}

#pageProgress.loading{
  width:75%;
  animation:progress 1.2s ease-in-out infinite alternate;
}

#pageProgress.done{width:100%}

@keyframes progress{
  from{width:15%}
  to{width:90%}
}

.page{
  width:min(100%,760px);
  margin:auto;
  padding:12px 12px 30px;
}

.main-feed{min-width:0}

/* FEED HEADING */

.feed-heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin:3px 0 11px;
}

.feed-heading h1{
  margin:0;
  font-size:29px;
  line-height:1.15;
  letter-spacing:-1px;
  font-weight:800;
}

.feed-heading p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.filter-wrap{
  position:relative;
  flex:0 0 auto;
}

.filter-button{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:105px;
  justify-content:space-between;
  padding:9px 11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
  color:#e5e5ff;
  font-size:11px;
  font-weight:700;
}

.filter-button span:last-child{
  color:#a995ff;
  font-size:12px;
}

.filter-menu{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 7px);
  z-index:100;
  width:155px;
  padding:5px;
  border:1px solid #343052;
  border-radius:12px;
  background:#151a30;
  box-shadow:0 12px 30px #0009;
}

.filter-menu.open{display:grid}

.filter-option{
  padding:10px;
  border:0;
  border-radius:8px;
  text-align:left;
  background:transparent;
  color:#c8cde1;
  font-size:11px;
}

.filter-option:hover,
.filter-option.active{
  background:#8b63ff22;
  color:white;
}

/* CAMPUS MOMENTS */

.section-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px;
  margin-bottom:9px;
}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
}

.section-heading h2{
  margin:0;
  font-size:13px;
  font-weight:800;
}

.section-heading a{
  color:#b49cff;
  font-size:10px;
  font-weight:700;
}

.moment-list{
  display:flex;
  align-items:flex-start;
  gap:11px;
  overflow-x:auto;
  padding:2px 1px 3px;
  scrollbar-width:none;
}

.moment-list::-webkit-scrollbar{display:none}

.moment{
  flex:0 0 55px;
  width:55px;
  min-width:55px;
  padding:0;
  border:0;
  background:none;
  text-align:center;
}

.moment-ring{
  width:53px;
  height:53px;
  padding:2px;
  border-radius:50%;
  background:var(--gradient);
  margin:0 auto 5px;
}

.moment-ring img{
  width:100%;
  height:100%;
  border:2px solid var(--surface);
  border-radius:50%;
  object-fit:cover;
}

.moment-name{
  display:block;
  font-size:9px;
  color:#cbd0e3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.moment.add .moment-ring{
  display:grid;
  place-items:center;
  background:#202944;
  border:1px dashed #8c76cf;
  color:#c2aaff;
  font-size:25px;
}

/* COMPOSER */

.composer{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px;
  margin-bottom:10px;
}

.composer-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:9px;
}

.composer-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  object-fit:cover;
  background:#252c46;
}

.composer-input{
  flex:1;
  min-width:0;
  min-height:39px;
  display:flex;
  align-items:center;
  padding:9px 13px;
  border-radius:22px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:#aeb6d0;
  font-size:11px;
}

.composer-input:active{
  border-color:var(--purple);
}

.composer-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:7px;
}

.composer-action{
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  border:1px solid transparent;
  border-radius:9px;
  background:var(--surface2);
  color:#c5cbe0;
  font-size:10px;
  font-weight:700;
  transition:.18s;
}

.composer-action:active{transform:scale(.97)}
.composer-action .icon{font-size:15px}
.composer-action.photo .icon{color:#54d69b}
.composer-action.video .icon{color:#53baff}
.composer-action.poll .icon{color:#b795ff}
.composer-action.question .icon{color:#f4bd67}

/* POSTS */

.post{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:9px;
  overflow:hidden;
}

.post-header{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 11px 8px;
}

.post-user{
  flex:1;
  min-width:0;
}

.post-name{
  font-size:11px;
  font-weight:800;
}

.post-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.post-badge{
  display:inline-block;
  margin-left:4px;
  padding:2px 5px;
  border-radius:5px;
  background:#8b63ff22;
  color:#c4aaff;
  font-size:8px;
}

.more-wrap{position:relative}

.more-btn{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#aab2cb;
  font-size:21px;
}

.post-menu{
  display:none;
  position:absolute;
  top:30px;
  right:0;
  z-index:50;
  width:145px;
  padding:5px;
  border:1px solid #383454;
  border-radius:10px;
  background:#171c32;
  box-shadow:0 10px 25px #0009;
}

.post-menu.open{display:block}

.post-menu button{
  display:flex;
  width:100%;
  align-items:center;
  gap:8px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#ff929e;
  text-align:left;
  font-size:11px;
  font-weight:700;
}

.post-menu button:hover{background:#ff52651a}

.repost-label{
  padding:7px 11px 0;
  color:#a995ff;
  font-size:9px;
  font-weight:700;
}

.post-body{padding:0 11px 10px}

.post-body p{
  margin:0 0 9px;
  color:#e2e5f4;
  font-size:12px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-image{
  width:100%;
  max-height:460px;
  border-radius:9px;
  object-fit:contain;
  background:#080b18;
  cursor:zoom-in;
}

/* FULL-SCREEN POST IMAGE VIEWER */

.photo-viewer{
  position:fixed;
  inset:0;
  z-index:30000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.96);
}

.photo-viewer.show{display:flex}

.photo-viewer img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

.post-video{
  width:100%;
  max-height:460px;
  display:block;
  background:#000;
  border-radius:9px;
  object-fit:contain;
}

.post-stats{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 11px;
  color:var(--muted);
  font-size:9px;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin:0 7px;
  padding:4px 0;
  border-top:1px solid var(--border);
}

.post-action{
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px 2px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#b3bad0;
  font-size:10px;
  font-weight:700;
}

.post-action span{font-size:14px}
.post-action:hover{background:#ffffff09}
.post-action.liked{color:#ff739b}
.post-action.reposted{color:#b49cff}

/* COMMENTS */

.comment-area{
  display:none;
  padding:10px;
  border-top:1px solid var(--border);
}

.comment-area.open{display:block}

.comment-form{
  display:flex;
  gap:7px;
}

.comment-form textarea{
  flex:1;
  min-width:0;
  min-height:38px;
  max-height:100px;
  resize:vertical;
  padding:9px 11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface2);
  color:white;
  font-size:11px;
}

.comment-form button{
  padding:0 12px;
  border:0;
  border-radius:9px;
  background:var(--gradient);
  color:white;
  font-size:10px;
  font-weight:800;
}

.comment-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.comment{
  display:flex;
  align-items:flex-start;
  gap:7px;
}

.comment .avatar{
  width:29px;
  height:29px;
  flex-basis:29px;
}

.comment-main{
  flex:1;
  min-width:0;
  padding:8px;
  border-radius:10px;
  background:var(--surface2);
}

.comment-main strong{font-size:10px}

.comment-main p{
  margin:4px 0;
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.comment-actions{
  display:flex;
  gap:12px;
}

.small-action{
  border:0;
  padding:0;
  background:none;
  color:var(--muted);
  font-size:9px;
}

.reply-form{
  display:none;
  gap:6px;
  margin-top:7px;
}

.reply-form.open{display:flex}
.reply-form textarea{min-height:32px}

/* SHARE PANEL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:15000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#000b;
  backdrop-filter:blur(7px);
}

.modal-backdrop.show{display:flex}

.share-modal{
  width:min(100%,390px);
  max-height:85vh;
  overflow-y:auto;
  padding:15px;
  border:1px solid #383454;
  border-radius:16px;
  background:#11182d;
  box-shadow:0 20px 60px #0009;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.modal-head h3{
  margin:0;
  font-size:14px;
}

.modal-close{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#ffffff0c;
  color:white;
  font-size:18px;
}

.share-options{
  display:grid;
  gap:8px;
}

.share-option{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#171d33;
  color:white;
  text-align:left;
}

.share-option:hover{
  border-color:#8060df;
  background:#211b3c;
}

.share-option-icon{
  width:39px;
  height:39px;
  flex:0 0 39px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#805bff20;
  color:#c6adff;
  font-size:19px;
}

.share-option strong{
  display:block;
  font-size:11px;
}

.share-option small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.share-list{
  display:none;
  margin-top:12px;
}

.share-list.show{display:block}

.share-search{
  width:100%;
  padding:10px 11px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface2);
  color:white;
  font-size:11px;
}

.share-results{
  display:grid;
  gap:5px;
  max-height:260px;
  overflow-y:auto;
}

.share-person{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:8px;
  border:0;
  border-radius:9px;
  background:#ffffff06;
  color:white;
  text-align:left;
}

.share-person:hover{background:#805bff20}

.share-person img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.share-person span{
  flex:1;
  font-size:11px;
}

.share-person small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

/* EMPTY FEED AND NOTICES */

.empty-feed{
  padding:25px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.empty-feed strong{
  display:block;
  color:white;
  font-size:13px;
  margin-bottom:5px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  z-index:20000;
  max-width:calc(100% - 30px);
  padding:10px 14px;
  border:1px solid #51417e;
  border-radius:10px;
  background:#25223a;
  color:white;
  font-size:11px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,12px);
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* NAVIGATION */

.campusora-topnav{
  z-index:12000!important;
  pointer-events:auto!important;
}

.campusora-topnav button,
.campusora-topnav a,
.campusora-mainnav a,
.campusora-mainnav button{
  pointer-events:auto!important;
}

.campusora-mainnav{z-index:12000!important}

.campusora-topnav.nav-hidden,
.campusora-mainnav.nav-hidden{
  pointer-events:none!important;
}

/* RESPONSIVE */

@media(max-width:480px){
  .page{padding:10px 9px 25px}
  .feed-heading h1{font-size:27px}
  .section-card{padding:10px}
  .composer{padding:10px}
  .post{border-radius:11px}
}

@media(max-width:350px){
  .feed-heading h1{font-size:24px}
  .filter-button{min-width:94px;padding:8px}
  .composer-action{font-size:9px}
  .post-action{font-size:9px}
}
</style>
</head>

<body>

<div id="pageProgress"></div>

<main class="page">
  <div class="main-feed">

    <section class="feed-heading">
      <div>
        <h1>Your feed🌟</h1>
        <p>What's happening around your world</p>
      </div>

      <div class="filter-wrap">
        <button class="filter-button" id="filterButton" type="button">
          <span id="filterLabel">For You</span>
          <span>⌄</span>
        </button>

        <div class="filter-menu" id="filterMenu">
          <button class="filter-option active" data-filter="for-you" type="button">For You</button>
          <button class="filter-option" data-filter="popular" type="button">Popular</button>
          <button class="filter-option" data-filter="campus" type="button">My Campus</button>
        </div>
      </div>
    </section>

    <!-- CAMPUS MOMENTS -->
    <section class="section-card">
      <div class="section-heading">
        <h2>Campus Moments</h2>
        <a href="campus-moments.html">See all</a>
      </div>

      <div class="moment-list" id="momentList">
        <a class="moment add" href="campus-moments.html">
          <div class="moment-ring">+</div>
          <span class="moment-name">Add Moment</span>
        </a>
      </div>
    </section>

    <!-- COMPOSER NOW COMES DIRECTLY AFTER CAMPUS MOMENTS -->
    <section class="composer">
      <div class="composer-title">What's happening in your campus?</div>

      <div class="composer-top">
        <a id="myProfileLink" href="profile.html">
          <img id="composerAvatar" class="avatar" alt="Your profile">
        </a>

        <a href="create-post.html" class="composer-input">
          Share something with Campusora...
        </a>
      </div>

      <div class="composer-actions">
        <a class="composer-action photo" href="create-post.html">
          <span class="icon">▧</span> Photo
        </a>

        <a class="composer-action video" href="create-post.html">
          <span class="icon">▶</span> Video
        </a>

        <a class="composer-action poll" href="create-post.html?type=poll">
          <span class="icon">▤</span> Poll
        </a>

        <a class="composer-action question" href="create-post.html?type=question">
          <span class="icon">?</span> Questions
        </a>
      </div>
    </section>

    <!-- POSTS APPEAR BELOW THE COMPOSER -->
    <section id="feed">
      <div class="empty-feed">
        <strong>Loading your feed...</strong>
        Getting your Campusora posts.
      </div>
    </section>

  </div>
</main>

<!-- SHARE PANEL -->

<div class="modal-backdrop" id="shareBackdrop">
  <section class="share-modal">
    <div class="modal-head">
      <h3>Share this post</h3>
      <button class="modal-close" id="closeShare" type="button">×</button>
    </div>

    <div class="share-options">
      <button class="share-option" data-share-type="profile" type="button">
        <span class="share-option-icon">◉</span>
        <span>
          <strong>Share to Profile</strong>
          <small>Publish this post on your profile.</small>
        </span>
      </button>

      <button class="share-option" data-share-type="message" type="button">
        <span class="share-option-icon">✉</span>
        <span>
          <strong>Share as Message</strong>
          <small>Choose a person to send this post to.</small>
        </span>
      </button>

      <button class="share-option" data-share-type="community" type="button">
        <span class="share-option-icon">♧</span>
        <span>
          <strong>Share to Communities</strong>
          <small>Choose a community to share this post with.</small>
        </span>
      </button>
    </div>

    <div class="share-list" id="shareList">
      <input class="share-search" id="shareSearch"
        placeholder="Search people or communities...">
      <div class="share-results" id="shareResults"></div>
    </div>
  </section>
</div>

<!-- FULL-SCREEN IMAGE VIEWER -->
<div class="photo-viewer" id="photoViewer">
  <img id="photoViewerImage" src="" alt="Full-screen post image">
</div>

<div id="toast" class="toast"></div>

<script src="./shared-nav.js"></script>

<script type="module">
import {supabase} from "./supabase.js";

const $=id=>document.getElementById(id);

const feed=$("feed");
const progress=$("pageProgress");
const momentList=$("momentList");
const shareBackdrop=$("shareBackdrop");
const shareList=$("shareList");
const shareResults=$("shareResults");

let currentUser=null;
let currentProfile=null;
let activeFeed="for-you";
let shareItem=null;
let loading=false;
let currentItems=[];
let profileCache=new Map();

const fallbackAvatar=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='#252c46'/><circle cx='50' cy='36' r='18' fill='#9ca8ca'/><path d='M15 95 Q15 62 50 62 Q85 62 85 95' fill='#9ca8ca'/></svg>"
);

function esc(value=""){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function avatar(url){return url||fallbackAvatar}

function profileURL(id){
 return "profile.html?id="+encodeURIComponent(id);
}

function timeAgo(value){
 if(!value)return "Recently";

 const seconds=Math.max(
  0,
  Math.floor((Date.now()-new Date(value).getTime())/1000)
 );

 if(seconds<60)return "Just now";
 if(seconds<3600)return Math.floor(seconds/60)+"m ago";
 if(seconds<86400)return Math.floor(seconds/3600)+"h ago";
 if(seconds<604800)return Math.floor(seconds/86400)+"d ago";

 return new Date(value).toLocaleDateString();
}

function toast(message){
 $("toast").textContent=message;
 $("toast").classList.add("show");

 clearTimeout(toast.timer);

 toast.timer=setTimeout(
  ()=>$("toast").classList.remove("show"),
  2600
 );
}

function startProgress(){
 progress.className="loading";
}

function finishProgress(){
 progress.className="done";

 setTimeout(()=>{
  progress.className="";
 },350);
}

function showEmpty(title,message,retry=false){
 feed.innerHTML=`
  <div class="empty-feed">
   <strong>${esc(title)}</strong>
   ${esc(message)}
   ${retry?'<br><button class="filter-button" id="retryFeed" type="button">Try Again</button>':""}
  </div>`;

 $("retryFeed")?.addEventListener("click",loadFeed);
}

/* USER */

async function loadMyProfile(){
 const {data:{session},error}=await supabase.auth.getSession();

 if(error)throw error;

 currentUser=session?.user||null;

 if(!currentUser){
  $("composerAvatar").src=fallbackAvatar;
  return;
 }

 const {data,error:profileError}=await supabase
  .from("profiles")
  .select("id,username,full_name,avatar_url,school,role,institution_id")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(profileError)throw profileError;

 currentProfile=data;

 if(data)profileCache.set(currentUser.id,data);

 const image=avatar(data?.avatar_url);

 $("composerAvatar").src=image;
 $("myProfileLink").href=profileURL(currentUser.id);
}

/* PROFILES */

async function getProfiles(ids){
 const missing=[...new Set(ids.filter(Boolean))]
  .filter(id=>!profileCache.has(id));

 if(missing.length){
  const {data,error}=await supabase
   .from("profiles")
   .select("id,username,full_name,avatar_url,role,school")
   .in("id",missing);

  if(error)throw error;

  (data||[]).forEach(p=>profileCache.set(p.id,p));
 }

 return profileCache;
}

/* SPONSORED CONTENT */

async function fetchSponsored(){
 const now=new Date().toISOString();

 const results=[];

 const [business,campaign]=await Promise.allSettled([
  supabase.from("campusora_business_promotions")
   .select("*")
   .eq("status","active")
   .lte("start_at",now)
   .gte("end_at",now)
   .order("priority",{ascending:false})
   .limit(4),

  supabase.from("sponsored_campaigns")
   .select("*")
   .eq("status","active")
   .eq("payment_verified",true)
   .or(`ends_at.is.null,ends_at.gte.${now}`)
   .limit(4)
 ]);

 if(business.status==="fulfilled"&&!business.value.error){
  (business.value.data||[]).forEach(data=>{
   results.push({kind:"business-ad",data});
  });
 }

 if(campaign.status==="fulfilled"&&!campaign.value.error){
  (campaign.value.data||[]).forEach(data=>{
   results.push({kind:"campaign-ad",data});
  });
 }

 return results;
}

/* SUPPORTING DATA
   These counts are supplementary. If one supporting table fails,
   the actual posts should still be displayed.
*/

async function safeQuery(promise){
 try{
  const result=await promise;

  if(result.error){
   console.warn("Supporting feed data:",result.error);
   return [];
  }

  return result.data||[];
 }catch(error){
  console.warn("Supporting feed data:",error);
  return [];
 }
}

async function supporting(items){
 const posts=items
  .filter(x=>x.kind==="post")
  .map(x=>x.data);

 const videos=items
  .filter(x=>x.kind==="video")
  .map(x=>x.data);

 const postIds=posts.map(x=>x.id);
 const videoIds=videos.map(x=>x.id);

 const userIds=[...new Set([
  ...posts.map(x=>x.user_id),
  ...videos.map(x=>x.user_id)
 ])];

 const requests=[
  userIds.length
   ?safeQuery(
     supabase.from("profiles")
      .select("id,username,full_name,avatar_url,role,school")
      .in("id",userIds)
    )
   :Promise.resolve([]),

  postIds.length
   ?safeQuery(
     supabase.from("likes")
      .select("post_id,user_id")
      .in("post_id",postIds)
    )
   :Promise.resolve([]),

  postIds.length
   ?safeQuery(
     supabase.from("comments")
      .select("id,post_id,user_id,content,created_at,parent_comment_id")
      .in("post_id",postIds)
      .order("created_at")
    )
   :Promise.resolve([]),

  postIds.length
   ?safeQuery(
     supabase.from("post_reposts")
      .select("post_id,user_id")
      .in("post_id",postIds)
    )
   :Promise.resolve([]),

  videoIds.length
   ?safeQuery(
     supabase.from("spotlight_video_reposts")
      .select("video_id,user_id")
      .in("video_id",videoIds)
    )
   :Promise.resolve([])
 ];

 const [
  profiles,
  likes,
  comments,
  reposts,
  videoReposts
 ]=await Promise.all(requests);

 profiles.forEach(p=>profileCache.set(p.id,p));

 return {
  profiles:profileCache,
  likes,
  comments,
  reposts,
  videoReposts
 };
}

/* FEED RANKING */

function rankItems(items,extra){
 const counts={};

 extra.likes.forEach(x=>{
  counts[x.post_id]=(counts[x.post_id]||0)+2;
 });

 extra.comments.forEach(x=>{
  counts[x.post_id]=(counts[x.post_id]||0)+4;
 });

 extra.reposts.forEach(x=>{
  counts[x.post_id]=(counts[x.post_id]||0)+6;
 });

 return items.map(item=>{
  const date=new Date(item.data.created_at||Date.now()).getTime();
  const age=Math.max(1,(Date.now()-date)/3600000);
  const id=item.data.id;
  const engagement=counts[id]||0;
  const freshness=1/Math.pow(age+2,.65);

  let score=freshness;

  if(item.kind==="post"){
   score+=engagement*freshness;
  }

  if(activeFeed==="popular"){
   score+=engagement*0.5;
  }

  return {...item,score};

 }).sort((a,b)=>{
  if(activeFeed==="for-you"||activeFeed==="popular"){
   return b.score-a.score;
  }

  return new Date(b.data.created_at)-new Date(a.data.created_at);
 });
}

/* COMMENTS */

function renderComments(comments,profiles,postId){
 const roots=comments.filter(
  x=>x.post_id===postId&&!x.parent_comment_id
 );

 function one(c){
  const p=profiles.get(c.user_id)||{};

  const replies=comments.filter(
   x=>x.parent_comment_id===c.id
  );

  return `
   <div class="comment">
    <a href="${profileURL(c.user_id)}">
     <img class="avatar"
      src="${esc(avatar(p.avatar_url))}" alt="">
    </a>

    <div class="comment-main">
     <a href="${profileURL(c.user_id)}">
      <strong>${esc(p.full_name||p.username||"Member")}</strong>
     </a>

     <p>${esc(c.content)}</p>

     <div class="comment-actions">
      <button class="small-action"
       data-comment-action="reply"
       data-comment-id="${esc(c.id)}"
       type="button">Reply</button>

      ${currentUser?.id===c.user_id
       ?`<button class="small-action"
          data-comment-action="delete"
          data-comment-id="${esc(c.id)}"
          type="button">Delete</button>`
       :""}
     </div>

     <form class="reply-form" data-parent-id="${esc(c.id)}">
      <textarea name="content"
       placeholder="Write a reply..." required></textarea>
      <button class="small-action" type="submit">Send</button>
     </form>

     ${replies.map(one).join("")}
    </div>
   </div>`;
 }

 return roots.map(one).join("")||
  '<small class="post-meta">No comments yet. Start the conversation.</small>';
}

/* MAIN FEED LOADER */

async function loadFeed(){
 if(loading)return;

 loading=true;
 startProgress();

 try{
  if(!currentUser&&currentProfile===null){
   await loadMyProfile();
  }

  if(activeFeed==="campus"&&!currentProfile?.institution_id){
   currentItems=[];
   showEmpty(
    "My Campus",
    "Select your institution in your profile to see campus posts."
   );
   return;
  }

  /*
   * Load normal posts separately.
   * A Spotlight or advertising error must not hide normal posts.
   */

  const postResult=await fetchPosts();

  let posts=postResult||[];
  let videos=[];
  let ads=[];

  const secondary=await Promise.allSettled([
   fetchVideos(),
   fetchSponsored()
  ]);

  if(secondary[0].status==="fulfilled"){
   videos=secondary[0].value||[];
  }else{
   console.warn("Spotlight videos could not load:",secondary[0].reason);
  }

  if(secondary[1].status==="fulfilled"){
   ads=secondary[1].value||[];
  }else{
   console.warn("Sponsored content could not load:",secondary[1].reason);
  }

  let items=[
   ...posts.map(data=>({kind:"post",data})),
   ...videos.map(data=>({kind:"video",data})),
   ...ads
  ];

  if(!items.length){
   currentItems=[];
   showEmpty(
    "Your feed is waiting for its first post!",
    "Share something with Campusora to get the conversation started."
   );
   return;
  }

  /*
   * Supporting data is optional.
   * If likes, comments or repost counts fail,
   * posts will still be displayed.
   */

  const normal=items.filter(
   x=>x.kind==="post"||x.kind==="video"
  );

  const extra=await supporting(normal);

  items=rankItems(items,extra);

  currentItems=items;

  feed.innerHTML=items.map(item=>{
   if(item.kind==="post")return renderPost(item,extra);
   if(item.kind==="video")return renderVideo(item,extra);
   if(item.kind==="business-ad")return renderBusinessAd(item.data);
   if(item.kind==="campaign-ad")return renderCampaignAd(item.data);

   return "";
  }).join("");

 }catch(error){
  console.error("Feed error:",error);

  showEmpty(
   "We couldn't load your feed",
   error.message||"Check your connection and try again.",
   true
  );

 }finally{
  loading=false;
  finishProgress();
 }
}

/* LIKE */

async function toggleLike(postId){
 if(!currentUser){
  return toast("Please log in to react.");
 }

 const {data:existing,error:findError}=await supabase
  .from("likes")
  .select("id")
  .eq("post_id",postId)
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(findError){
  console.error(findError);
  return toast("Could not update reaction.");
 }

 const result=existing
  ?await supabase.from("likes")
    .delete()
    .eq("post_id",postId)
    .eq("user_id",currentUser.id)
  :await supabase.from("likes")
    .insert({
     post_id:postId,
     user_id:currentUser.id
    });

 if(result.error){
  console.error(result.error);
  return toast("Could not update reaction.");
 }

 await loadFeed();
}

  return toast("Please log in to share.");
 }

 shareList.classList.add("show");
 shareResults.innerHTML='<div class="empty-feed">Loading...</div>';

 try{
  if(mode==="message"){
   const {data,error}=await supabase
    .from("profiles")
    .select("id,username,full_name,avatar_url,school")
    .neq("id",currentUser.id)
    .order("full_name")
    .limit(100);

   if(error)throw error;

   shareResults.innerHTML=(data||[]).map(p=>`
    <button class="share-person"
     data-target-id="${esc(p.id)}"
     type="button">

     <img src="${esc(avatar(p.avatar_url))}" alt="">

     <span>
      ${esc(p.full_name||p.username||"Campusora member")}
      <small>${esc(p.school||"Campusora member")}</small>
     </span>

     <small>Send →</small>
    </button>
   `).join("")||'<div class="empty-feed">No members found.</div>';
  }

  if(mode==="community"){
   const {data,error}=await supabase
    .from("communities")
    .select("id,name,school,description")
    .order("name")
    .limit(100);

   if(error)throw error;

   shareResults.innerHTML=(data||[]).map(c=>`
    <button class="share-person"
     data-community-id="${esc(c.id)}"
     type="button">

     <span class="share-option-icon">♧</span>

     <span>
      ${esc(c.name||"Campus community")}
      <small>${esc(c.school||c.description||"Community")}</small>
     </span>

     <small>Share →</small>
    </button>
   `).join("")||'<div class="empty-feed">No communities found.</div>';
  }

 }catch(error){
  console.error(error);

  shareResults.innerHTML=
   '<div class="empty-feed">Could not load sharing options. Please try again.</div>';
 }
}

/* SHARE TO PROFILE */

async function shareToProfile(){
 if(!currentUser||!shareItem)return;

 const link=shareItem.kind==="video"
  ?new URL("spotlight.html#"+shareItem.id,location.href).href
  :new URL("home-feed.html#post-"+shareItem.id,location.href).href;

 const content="Shared from Campusora:\n"+link;

 const {error}=await supabase
  .from("posts")
  .insert({
   user_id:currentUser.id,
   content,
   post_type:"shared",
   audience:"public"
  });

 if(error){
  console.error(error);
  return toast("Could not share to your profile.");
 }

 closeShare();

 toast("Shared to your profile.");

 await loadFeed();
}

/* SHARE AS MESSAGE */

async function shareToMessage(targetId){
 if(!currentUser||!shareItem)return;

 if(targetId===currentUser.id){
  return toast("You cannot message yourself.");
 }

 const {data:conversationId,error:conversationError}=await supabase.rpc(
  "start_direct_conversation",
  {target_user_id:targetId}
 );

 if(conversationError||!conversationId){
  console.error(conversationError);
  return toast("Could not open this conversation.");
 }

 const link=shareItem.kind==="video"
  ?new URL("spotlight.html#"+shareItem.id,location.href).href
  :new URL("home-feed.html#post-"+shareItem.id,location.href).href;

 const {error}=await supabase
  .from("messages")
  .insert({
   conversation_id:conversationId,
   sender_id:currentUser.id,
   content:"Check out this Campusora post: "+link
  });

 if(error){
  console.error(error);
  return toast("Message could not be sent. Open the chat to continue.");
 }

 closeShare();

 toast("Post sent as a message.");
}

/* SHARE TO COMMUNITY */

async function shareToCommunity(communityId){
 if(!currentUser||!shareItem)return;

 const link=shareItem.kind==="video"
  ?new URL("spotlight.html#"+shareItem.id,location.href).href
  :new URL("home-feed.html#post-"+shareItem.id,location.href).href;

 const content="Shared with this community:\n"+link;

 const {error}=await supabase
  .from("posts")
  .insert({
   user_id:currentUser.id,
   content,
   post_type:"shared",
   audience:"public",
   community_id:communityId
  });

 if(error){
  console.error(error);
  return toast("Could not share to this community.");
 }

 closeShare();

 toast("Shared to community.");
}

/* SHARE BUTTON EVENTS */

document.querySelectorAll("[data-share-type]").forEach(button=>{
 button.addEventListener("click",()=>{
  const mode=button.dataset.shareType;

  if(mode==="profile"){
   shareToProfile();
   return;
  }

  loadShareTargets(mode);
 });
});

shareResults.addEventListener("click",event=>{
 const person=event.target.closest("[data-target-id]");
 const community=event.target.closest("[data-community-id]");

 if(person){
  shareToMessage(person.dataset.targetId);
 }

 if(community){
  shareToCommunity(community.dataset.communityId);
 }
});

$("shareSearch").addEventListener("input",()=>{
 const term=$("shareSearch").value.toLowerCase();

 shareResults.querySelectorAll(".share-person").forEach(row=>{
  row.hidden=!row.textContent.toLowerCase().includes(term);
 });
});

/* FEED BUTTON EVENTS */

feed.addEventListener("click",async event=>{
 const button=event.target.closest("[data-action]");

 if(!button)return;

 const post=button.closest("[data-post-id]");
 const video=button.closest("[data-video-id]");
 const action=button.dataset.action;

 if(action==="like"&&post){
  return toggleLike(post.dataset.postId);
 }

 if(action==="repost"&&post){
  return toggleRepost(post.dataset.postId);
 }

 if(action==="video-repost"&&video){
  return toggleVideoRepost(video.dataset.videoId);
 }

 if(action==="comments"&&post){
  $("comments-"+post.dataset.postId)?.classList.toggle("open");
  return;
 }

 if(action==="share"&&post){
  return openShare({
   kind:"post",
   id:post.dataset.postId
  });
 }

 if(action==="video-share"&&video){
  return openShare({
   kind:"video",
   id:video.dataset.videoId
  });
 }

 if(action==="menu"&&post){
  const menu=button.parentElement.querySelector(".post-menu");

  document.querySelectorAll(".post-menu.open").forEach(x=>{
   if(x!==menu)x.classList.remove("open");
  });

  menu.classList.toggle("open");
  return;
 }

 if(action==="delete"&&post){
  return deletePost(post.dataset.postId);
 }

 const commentAction=event.target.closest("[data-comment-action]");

 if(commentAction){
  const type=commentAction.dataset.commentAction;
  const id=commentAction.dataset.commentId;

  if(type==="reply"){
   const form=commentAction
    .closest(".comment-main")
    .querySelector(":scope > .reply-form");

   form?.classList.toggle("open");
   form?.querySelector("textarea")?.focus();
  }

  if(type==="delete"){
   if(!currentUser)return;

   const {error}=await supabase
    .from("comments")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

   if(error){
    console.error(error);
    return toast("Could not delete comment.");
   }

   await loadFeed();
  }
 }
});

/* COMMENT AND REPLY SUBMISSION */

feed.addEventListener("submit",async event=>{
 const form=event.target.closest(".comment-form,.reply-form");

 if(!form)return;

 event.preventDefault();

 if(!currentUser){
  return toast("Please log in to comment.");
 }

 const content=form.elements.content.value.trim();

 if(!content)return;

 const post=form.closest("[data-post-id]");
 const postId=post?.dataset.postId;

 if(!postId)return;

 const values={
  post_id:postId,
  user_id:currentUser.id,
  content
 };

 if(form.classList.contains("reply-form")){
  values.parent_comment_id=form.dataset.parentId;
 }

 const {error}=await supabase
  .from("comments")
  .insert(values);

 if(error){
  console.error(error);
  return toast("Could not publish your comment.");
 }

 await loadFeed();

 $("comments-"+postId)?.classList.add("open");
});

/* FEED FILTER */

$("filterButton").addEventListener("click",()=>{
 $("filterMenu").classList.toggle("open");
});

document.querySelectorAll(".filter-option").forEach(button=>{
 button.addEventListener("click",()=>{
  activeFeed=button.dataset.filter;

  $("filterLabel").textContent=button.textContent;
  $("filterMenu").classList.remove("open");

  document.querySelectorAll(".filter-option").forEach(x=>{
   x.classList.remove("active");
  });

  button.classList.add("active");

  loadFeed();
 });
});

document.addEventListener("click",event=>{
 if(!event.target.closest(".filter-wrap")){
  $("filterMenu").classList.remove("open");
 }

 if(!event.target.closest(".more-wrap")){
  document.querySelectorAll(".post-menu.open").forEach(x=>{
   x.classList.remove("open");
  });
 }
});

/* FULL-SCREEN IMAGE VIEWER BEHAVIOUR */

const photoViewer=$("photoViewer");
const photoViewerImage=$("photoViewerImage");

document.addEventListener("click",event=>{
 const image=event.target.closest(".post-image");

 if(image){
  photoViewerImage.src=image.src;
  photoViewer.classList.add("show");
  document.body.style.overflow="hidden";
  return;
 }

 if(event.target===photoViewer){
  photoViewer.classList.remove("show");
  photoViewerImage.src="";
  document.body.style.overflow="";
 }
});

document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&photoViewer.classList.contains("show")){
  photoViewer.classList.remove("show");
  photoViewerImage.src="";
  document.body.style.overflow="";
 }
});

/* SHARED NAVIGATION SCROLL BEHAVIOUR */

(function(){
 let timer=null;
 let previous=window.scrollY;

 function showNav(){
  document.querySelector(".campusora-topnav")
   ?.classList.remove("nav-hidden");

  document.querySelector(".campusora-mainnav")
   ?.classList.remove("nav-hidden");
 }

 function hideNav(){
  document.querySelector(".campusora-topnav")
   ?.classList.add("nav-hidden");

  document.querySelector(".campusora-mainnav")
   ?.classList.add("nav-hidden");
 }

 window.addEventListener("scroll",()=>{
  const current=window.scrollY;

  if(Math.abs(current-previous)>1){
   hideNav();

   clearTimeout(timer);

   timer=setTimeout(showNav,350);
  }

  previous=current;
 },{passive:true});

 showNav();
})();

/* START PAGE */

async function startPage(){
 startProgress();

 try{
  await loadMyProfile();

  /*
   * The feed and moments load independently.
   * A moments error must not stop posts from appearing.
   */

  await Promise.allSettled([
   loadFeed(),
   loadMoments()
  ]);

 }catch(error){
  console.error("Campusora page error:",error);

  showEmpty(
   "Campusora could not load",
   error.message||"Please refresh and try again.",
   true
  );

 }finally{
  finishProgress();
 }
}

startPage();

</script>
