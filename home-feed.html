<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
  <link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./campusora-logo.png">
<title>Your Feed | Campusora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared-nav.css">

<style>
:root{
  --bg:#080b18;
  --surface:#101426;
  --surface2:#171c32;
  --border:rgba(255,255,255,.085);
  --text:#f5f6ff;
  --muted:#929bb6;
  --purple:#925bff;
  --blue:#526dff;
  --cyan:#39d7f5;
  --gradient:linear-gradient(120deg,#925bff,#526dff,#39d7f5);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{
  padding-top:62px;
  padding-bottom:100px;
  overflow-x:hidden;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

#pageProgress{
  position:fixed;
  top:var(--campusora-topnav-height, 56px);
  left:0;
  height:3px;
  width:0;
  z-index:20000;
  background:var(--gradient);
  box-shadow:0 0 12px #925bff80;
  transition:width .25s;
}
#pageProgress.loading{
  width:75%;
  animation:progress 1.2s ease-in-out infinite alternate;
}

#pageProgress.done{width:100%}

@keyframes progress{
  from{width:15%}
  to{width:90%}
}

.page{
  width:min(100%,760px);
  margin:auto;
  padding:4px 12px 30px;
}

.main-feed{min-width:0}

/* FEED HEADING */

.feed-heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  margin:0 0 11px;
}

.feed-heading h1{
  margin:0;
  font-size:29px;
  line-height:1.15;
  letter-spacing:-1px;
  font-weight:800;
}

.feed-heading p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.filter-wrap{
  position:relative;
  flex:0 0 auto;
}

.filter-button{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:105px;
  justify-content:space-between;
  padding:9px 11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
  color:#e5e5ff;
  font-size:11px;
  font-weight:700;
}

.filter-button span:last-child{
  color:#a995ff;
  font-size:12px;
}

.filter-menu{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 7px);
  z-index:100;
  width:155px;
  padding:5px;
  border:1px solid #343052;
  border-radius:12px;
  background:#151a30;
  box-shadow:0 12px 30px #0009;
}

.filter-menu.open{display:grid}

.filter-option{
  padding:10px;
  border:0;
  border-radius:8px;
  text-align:left;
  background:transparent;
  color:#c8cde1;
  font-size:11px;
}

.filter-option:hover,
.filter-option.active{
  background:#8b63ff22;
  color:white;
}

/* CAMPUS MOMENTS */

.moments-strip{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 12px;
  padding:3px 0 7px;
}

.moment-list{
  display:flex;
  align-items:flex-start;
  gap:11px;
  flex:1;
  min-width:0;
  overflow-x:auto;
  padding:2px 1px 3px;
  scrollbar-width:none;
}

.moment-list::-webkit-scrollbar{
  display:none;
}

.moment{
  flex:0 0 55px;
  width:55px;
  min-width:55px;
  padding:0;
  border:0;
  background:none;
  text-align:center;
  text-decoration:none;
}

.moment-ring{
  width:53px;
  height:53px;
  padding:2px;
  border-radius:50%;
  background:var(--gradient);
  margin:0 auto 5px;
}

.moment-ring img{
  width:100%;
  height:100%;
  border:2px solid #0b1020;
  border-radius:50%;
  object-fit:cover;
}

.moment-name{
  display:block;
  font-size:9px;
  color:#cbd0e3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.moment.add .moment-ring{
  display:grid;
  place-items:center;
  background:var(--gradient);
  border:0;
  color:white;
  font-size:27px;
  font-weight:400;
}

.moment.add .moment-name{
  color:#d6c9ff;
}

.moments-see-all{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:3px;
  color:#b49cff;
  font-size:10px;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
}

.moments-see-all span{
  font-size:16px;
}

/* COMPOSER */

/* COMPOSER */

.composer{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  padding:11px;
  margin-bottom:10px;
}

.composer-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:9px;
}

.composer-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border-radius:50%;
  object-fit:cover;
  background:#252c46;
}

.composer-input{
  flex:1;
  min-width:0;
  min-height:39px;
  display:flex;
  align-items:center;
  padding:9px 13px;
  border-radius:22px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:#aeb6d0;
  font-size:11px;
}

.composer-input:active{
  border-color:var(--purple);
}

.composer-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:7px;
}

.composer-action{
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  border:1px solid transparent;
  border-radius:9px;
  background:var(--surface2);
  color:#c5cbe0;
  font-size:10px;
  font-weight:700;
  transition:.18s;
}

.composer-action:active{transform:scale(.97)}
.composer-action .icon{font-size:15px}
.composer-action.photo .icon{color:#54d69b}
.composer-action.video .icon{color:#53baff}
.composer-action.poll .icon{color:#b795ff}
.composer-action.question .icon{color:#f4bd67}

  /* COMPACT BUSINESS PROMOTION */

.business-promo{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:9px; 
  overflow:hidden;
}

.business-promo-header{
  padding:10px 11px 5px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.business-promo-name{
  font-size:11px;
  font-weight:800;
}

.business-promo-label{
  font-size:8px;
  font-weight:800;
  color:#c4aaff;
  background:#8b63ff22;
  padding:3px 6px;
  border-radius:5px;
}

.business-promo-title{
  padding:0 11px;
  margin:2px 0 7px;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
  color:#fff;
}

.business-promo-description{
  padding:0 11px;
  margin:0 0 9px;
  color:#c6cce0;
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.business-promo-media{
  width:100%;
  display:block;
  max-height:380px;
  object-fit:contain;
  background:#05070e;
}

.business-promo-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:9px 11px 11px;
}

.business-promo-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-height:32px;
  padding:7px 12px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  border:1px solid var(--border);
  background:var(--surface2);
  color:white;
}

.business-promo-btn.whatsapp{
  background:#168b50;
  border-color:#168b50;
  color:white;
}

.business-promo-btn.website{
  background:var(--gradient);
  border:0;
}

.business-promo-btn.social{
  background:#242c49;
}

@media(max-width:480px){
  .business-promo{border-radius:11px}
  .business-promo-media{max-height:320px}
}

/* POSTS */

.post{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  margin-bottom:9px;
  overflow:hidden;
}

.post-header{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 11px 2px;
}

.post-user{
  flex:1;
  min-width:0;
}

.post-name{
  font-size:11px;
  font-weight:800;
}

.post-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.post-badge{
  display:inline-block;
  margin-left:4px;
  padding:2px 5px;
  border-radius:5px;
  background:#8b63ff22;
  color:#c4aaff;
  font-size:8px;
}

.more-wrap{position:relative}

.more-btn{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#aab2cb;
  font-size:21px;
}

.post-menu{
  display:none;
  position:absolute;
  top:30px;
  right:0;
  z-index:50;
  width:145px;
  padding:5px;
  border:1px solid #383454;
  border-radius:10px;
  background:#171c32;
  box-shadow:0 10px 25px #0009;
}

.post-menu.open{display:block}

.post-menu button{
  display:flex;
  width:100%;
  align-items:center;
  gap:8px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#ff929e;
  text-align:left;
  font-size:11px;
  font-weight:700;
}

.post-menu button:hover{background:#ff52651a}

.repost-label{
  padding:7px 11px 0;
  color:#a995ff;
  font-size:9px;
  font-weight:700;
}

.post-body{
  padding:0 11px 10px;
  margin-top:-3px;
}

.post-body p{
  margin:0;
  color:#e2e5f4;
  font-size:12px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-body p.post-text-collapsed{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:5;
  line-clamp:5;
  overflow:hidden;
}
  /* SEE MORE / SEE LESS BUTTON */

.post-see-more{
  display:inline-block;
  margin-top:5px;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  color:#a995ff;
  font-size:12px;
  font-weight:700;
  line-height:1.4;
  cursor:pointer;
  box-shadow:none;
  appearance:none;
  -webkit-appearance:none;
}

.post-see-more:hover{
  color:#c4b5fd;
  background:transparent;
}

.post-see-more:focus{
  outline:none;
  background:transparent;
}
/* COMPACT TEXT-ONLY POSTS */

.post:not(:has(.post-image-grid)):not(:has(.post-video)):not(:has(.shared-post-card)) .post-body{
  padding-bottom:3px;
  min-height:0;
}

.post:not(:has(.post-image-grid)):not(:has(.post-video)):not(:has(.shared-post-card)) .post-body p{
  min-height:0;
  margin:0;
}

.post:not(:has(.post-image-grid)):not(:has(.post-video)):not(:has(.shared-post-card)) .post-stats{
  padding-top:5px;
  padding-bottom:6px;
}
  
  /* SHARED POST CARD */

.shared-post-card{
  margin-top:5px;
  padding:10px;
  border:1px solid rgba(160,145,255,.22);
  border-radius:12px;
  background:rgba(255,255,255,.025);
  overflow:hidden;
}

.shared-post-author{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px;
}

.shared-post-author img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.shared-post-author strong{
  display:block;
  color:#f1f1ff;
  font-size:12px;
}

.shared-post-author small{
  display:block;
  color:#9299b3;
  font-size:10px;
  margin-top:2px;
}

.shared-post-content{
  color:#e2e5f4;
  font-size:12px;
  line-height:1.55;
  overflow-wrap:anywhere;
  margin-bottom:5px;
}

.shared-post-images{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
  margin-top:5px;
  overflow:hidden;
  border-radius:8px;
}

.shared-post-images img{
  width:100%;
  height:130px;
  object-fit:cover;
}

.shared-post-images img:only-child{
  grid-column:1/-1;
  height:auto;
  max-height:350px;
}

.shared-post-video{
  width:100%;
  max-height:350px;
  margin-top:5px;
  border-radius:8px;
  background:#000;
}

.shared-post-unavailable{
  color:#aab0c7;
  font-size:12px;
}
/* COMPACT SOCIAL PHOTO COLLAGE */

.post-image-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,88px);
  gap:4px;
  width:100%;
  height:180px;
margin-top:0;
  overflow:hidden;
  border-radius:9px;
}

.post-image-grid .post-image {
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  object-fit:cover;
  background:#080b18;
  cursor:pointer;
}

/* ONE PHOTO */

.post-image-grid.single {
  display:block;
  height:180px;
}

.post-image-grid.single .post-image {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* THREE PHOTOS */

.post-image-grid.count-3 {
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.post-image-grid.count-3 .post-image:first-child {
  grid-row:span 2;
}

/* FIVE PHOTOS */

.post-image-grid.count-5 {
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(2,88px);
}

.post-image-grid.count-5 .post-image:first-child {
  grid-column:span 2;
  grid-row:span 2;
}

@media(max-width:480px) {
  .post-image-grid,
  .post-image-grid.count-5 {
    height:180px;
    grid-template-rows:repeat(2,88px);
  }
}
.post-video{
  width:100%;
  max-height:460px;
  display:block;
  background:#000;
  border-radius:9px;
  object-fit:contain;
}

.post-stats{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 11px;
  color:var(--muted);
  font-size:9px;
}

.post-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin:0 7px;
  padding:4px 0;
  border-top:1px solid var(--border);
}

.post-action{
  min-width:0;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:5px 2px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#b3bad0;
  font-size:10px;
  font-weight:700;
}

.post-action span{font-size:14px}
.post-action:hover{background:#ffffff09}
.post-action.liked{color:#ff739b}
.post-action.reposted{color:#b49cff}

/* COMMENTS */

.comment-area{
  display:none;
  padding:10px;
  border-top:1px solid var(--border);
}

.comment-area.open{display:block}

.comment-form{
  display:flex;
  gap:7px;
}

.comment-form textarea{
  flex:1;
  min-width:0;
  min-height:38px;
  max-height:100px;
  resize:vertical;
  padding:9px 11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface2);
  color:white;
  font-size:11px;
}

.comment-form button{
  padding:0 12px;
  border:0;
  border-radius:9px;
  background:var(--gradient);
  color:white;
  font-size:10px;
  font-weight:800;
}

.comment-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.comment{
  display:flex;
  align-items:flex-start;
  gap:7px;
}

.comment .avatar{
  width:29px;
  height:29px;
  flex-basis:29px;
}

.comment-main{
  flex:1;
  min-width:0;
  padding:8px;
  border-radius:10px;
  background:var(--surface2);
}

.comment-main strong{font-size:10px}

.comment-main p{
  margin:4px 0;
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.comment-actions{
  display:flex;
  gap:12px;
}

.small-action{
  border:0;
  padding:0;
  background:none;
  color:var(--muted);
  font-size:9px;
}

.reply-form{
  display:none;
  gap:6px;
  margin-top:7px;
}

.reply-form.open{display:flex}
.reply-form textarea{min-height:32px}

/* SHARE PANEL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:15000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#000b;
  backdrop-filter:blur(7px);
}

.modal-backdrop.show{display:flex}

.share-modal{
  width:min(100%,390px);
  max-height:85vh;
  overflow-y:auto;
  padding:15px;
  border:1px solid #383454;
  border-radius:16px;
  background:#11182d;
  box-shadow:0 20px 60px #0009;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.modal-head h3{
  margin:0;
  font-size:14px;
}

.modal-close{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#ffffff0c;
  color:white;
  font-size:18px;
}

.share-options{
  display:grid;
  gap:8px;
}

.share-option{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#171d33;
  color:white;
  text-align:left;
}

.share-option:hover{
  border-color:#8060df;
  background:#211b3c;
}

.share-option-icon{
  width:39px;
  height:39px;
  flex:0 0 39px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#805bff20;
  color:#c6adff;
  font-size:19px;
}

.share-option strong{
  display:block;
  font-size:11px;
}

.share-option small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.share-list{
  display:none;
  margin-top:12px;
}

.share-list.show{display:block}

.share-search{
  width:100%;
  padding:10px 11px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface2);
  color:white;
  font-size:11px;
}

.share-results{
  display:grid;
  gap:5px;
  max-height:260px;
  overflow-y:auto;
}

.share-person{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:8px;
  border:0;
  border-radius:9px;
  background:#ffffff06;
  color:white;
  text-align:left;
}

.share-person:hover{background:#805bff20}

.share-person img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
}

.share-person span{
  flex:1;
  font-size:11px;
}

.share-person small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

/* EMPTY FEED AND NOTICES */

.empty-feed{
  padding:25px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.empty-feed strong{
  display:block;
  color:white;
  font-size:13px;
  margin-bottom:5px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  z-index:20000;
  max-width:calc(100% - 30px);
  padding:10px 14px;
  border:1px solid #51417e;
  border-radius:10px;
  background:#25223a;
  color:white;
  font-size:11px;

<script type="module">
import {supabase} from "./supabase.js";

const $=id=>document.getElementById(id);

let activeFeed="for-you";
let shareItem=null;
let loading=false;
let currentItems=[]; // FIX: declared before use
  const FEED_PAGE_SIZE = 30;

let postOffset = 0;
let hasMorePosts = true;
let loadingMorePosts = false;
let refreshingFeed = false;
let profileCache=new Map();

const fallbackAvatar=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(
"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='#252c46'/><circle cx='50' cy='36' r='18' fill='#9ca8ca'/><path d='M15 95 Q15 62 50 62 Q85 62 85 95' fill='#9ca8ca'/></svg>"
);

function esc(value=""){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}
function linkifyText(value=""){
  const text=String(value)
    .replace(/\r\n?/g,"\n")
    .replace(/[ \t]*\n+[ \t]*/g," ")
    .trim();

  const pattern=/https?:\/\/[^\s<]+|www\.[^\s<]+/gi;

  let output="";
  let lastIndex=0;

  for(const match of text.matchAll(pattern)){
    let url=match[0];
    let trailing="";

    while(/[.,!?;:)\]}]$/.test(url)){
      trailing=url.slice(-1)+trailing;
      url=url.slice(0,-1);
    }

    output+=esc(text.slice(lastIndex,match.index));

    if(!url){
      output+=esc(trailing);
      lastIndex=match.index+match[0].length;
      continue;
    }

    const href=url.toLowerCase().startsWith("www.")
      ?"https://"+url
      :url;

    output+='<a class="post-link" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>'+esc(trailing);

    lastIndex=match.index+match[0].length;
  }

  output+=esc(text.slice(lastIndex));
  return output;
}

function avatar(url){return url||fallbackAvatar}

function profileURL(id){
 return "profile.html?id="+encodeURIComponent(id);
}

function timeAgo(value){
 if(!value)return "Recently";

 const seconds=Math.max(
  0,
  Math.floor((Date.now()-new Date(value).getTime())/1000)
 );

 if(seconds<60)return "Just now";
 if(seconds<3600)return Math.floor(seconds/60)+"m ago";
 if(seconds<86400)return Math.floor(seconds/3600)+"h ago";
 if(seconds<604800)return Math.floor(seconds/86400)+"d ago";

 return new Date(value).toLocaleDateString();
}

function toast(message){
 $("toast").textContent=message;
 $("toast").classList.add("show");

 clearTimeout(toast.timer);

 toast.timer=setTimeout(
  ()=>$("toast").classList.remove("show"),
  2600
 );
}

function startProgress(){
 progress.className="loading";
}

function finishProgress(){
 progress.className="done";

 setTimeout(()=>{
  progress.className="";
 },350);
}

 feed.innerHTML=`

 $("retryFeed")?.addEventListener("click",loadFeed);
}

/* USER */

async function loadMyProfile(){
 const {data:{session},error}=await supabase.auth.getSession();

 if(error)throw error;

 currentUser=session?.user||null;

 if(!currentUser){
  $("composerAvatar").src=fallbackAvatar;
  return;
 }

 const {data,error:profileError}=await supabase
  .from("profiles")
  .select("id,username,full_name,avatar_url,school,role,institution_id")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(profileError)throw profileError;

 currentProfile=data;

 if(data)profileCache.set(currentUser.id,data);

 const image=avatar(data?.avatar_url);

 $("composerAvatar").src=image;
 $("myProfileLink").href=profileURL(currentUser.id);
}

/* PROFILES */

async function getProfiles(ids){
 const missing=[...new Set(ids.filter(Boolean))]
  .filter(id=>!profileCache.has(id));

 if(missing.length){
  const {data,error}=await supabase
   .from("profiles")
   .select("id,username,full_name,avatar_url,role,school")
   .in("id",missing);

  if(error)throw error;

  (data||[]).forEach(p=>profileCache.set(p.id,p));
 }

 return profileCache;
}
async function loadMoments(){

 const addButton=`
  <a class="moment add" href="campus-moments.html?create=1">
   <div class="moment-ring">+</div>
   <span class="moment-name">Add Story</span>
  </a>`;

 if(!currentUser){

 }

 const {data:follows,error:followError}=await supabase
  .from("follows")
  .select("following_id")
  .eq("follower_id",currentUser.id);

 if(followError)throw followError;

 const followedIds=(follows||[]).map(row=>row.following_id);

 const {data:official,error:officialError}=await supabase

function rankItems(items,extra){

  const counts={};

  extra.likes.forEach(x=>{
    counts[x.post_id]=(counts[x.post_id]||0)+2;
  });

  extra.comments.forEach(x=>{
    counts[x.post_id]=(counts[x.post_id]||0)+4;
  });

  extra.reposts.forEach(x=>{
    counts[x.post_id]=(counts[x.post_id]||0)+6;
  });

  return items.map(item=>{

    const date=new Date(item.data.created_at||Date.now()).getTime();
    const age=Math.max(1,(Date.now()-date)/3600000);
    const id=item.data.id;
    const engagement=counts[id]||0;
    const freshness=1/Math.pow(age+2,.65);

    let score=freshness;

    if(item.kind==="post"){
      score+=engagement*freshness;
    }

    if(activeFeed==="popular"){
      score+=engagement*0.5;
    }

    return {...item,score};

  }).sort((a,b)=>{

    if(a.isOfficial!==b.isOfficial){
      return a.isOfficial?-1:1;
    }

    // Popular remains engagement-based.
    if(activeFeed==="popular"){
      return b.score-a.score;
    }

    // For You and My Campus show newest posts first.
    const dateA=new Date(a.data.created_at||0).getTime();
    const dateB=new Date(b.data.created_at||0).getTime();

    return dateB-dateA;

  });
}

function updatePostTextControls(){
  feed.querySelectorAll(".post-body p.post-text-collapsed").forEach(text=>{
    const button=text.nextElementSibling;

    if(!button || !button.classList.contains("post-see-more")) return;

    text.classList.remove("post-text-collapsed");
    const fullHeight=text.getBoundingClientRect().height;

    text.classList.add("post-text-collapsed");
    const collapsedHeight=text.getBoundingClientRect().height;

    if(fullHeight <= collapsedHeight + 2){
      text.classList.remove("post-text-collapsed");
      button.remove();
    }
  });

 officialPosts.map(post=>post.id)
);
    
    postOffset = posts.length;
    hasMorePosts = posts.length === FEED_PAGE_SIZE;

    let videos = [];
    let ads = [];

    const secondary = await Promise.allSettled([
      fetchVideos(),
      fetchSponsored()
    ]);

    if(secondary[0].status === "fulfilled"){
      videos = secondary[0].value || [];
    }

    if(secondary[1].status === "fulfilled"){
      ads = secondary[1].value || [];
    }
    let items = [
      ...officialPosts.map(data=>({
        kind:"post",
        data,
        isOfficial:true
      })),

      ...posts
        .filter(post=>!officialIds.has(post.id))
        .map(data=>({kind:"post",data})),

      ...videos.map(data=>({kind:"video",data})),
      ...ads
    ];

    if(!items.length){

      currentItems = [];

      showEmpty(
        "Your feed is waiting for its first post!",
        "Share something with Campusora to get the conversation started."
      );

      return;
    }

    const normal = items.filter(
      x => x.kind === "post" || x.kind === "video"
    );

    const extra = await supporting(normal);

    items = rankItems(items,extra);

    currentItems = items;

    feed.innerHTML = items.map(item => {

      if(item.kind === "post") return renderPost(item,extra);

      if(item.kind === "video") return renderVideo(item,extra);

      if(item.kind === "business-ad") return renderBusinessAd(item.data);

      if(item.kind === "campaign-ad") return renderCampaignAd(item.data);

      return "";

    }).join("");
    requestAnimationFrame(updatePostTextControls);

    if(hasMorePosts){
      feed.insertAdjacentHTML(
        "beforeend",
        '<div id="feedMoreStatus" class="feed-more-status">Scroll down to load more posts</div>'
      );
    }

  }catch(error){

    console.error("Feed error:",error);

    showEmpty(
      "We couldn't load your feed",
      error.message || "Check your connection and try again.",
      true
    );

  }finally{

    loading = false;

    finishProgress();
  }
}
  /* INFINITE FEED SCROLLING */

async function loadMorePosts(){

  if(loading || loadingMorePosts || !hasMorePosts) return;

  loadingMorePosts = true;

  const status = $("feedMoreStatus");

  if(status){
    status.textContent = "Loading more posts...";
  }

  try{

    const posts = await fetchPosts(postOffset);

    if(!posts.length){

      hasMorePosts = false;

      if(status){
        status.textContent = "You're all caught up.";
      }

      return;
    }

    postOffset += posts.length;

    hasMorePosts = posts.length === FEED_PAGE_SIZE;

    const existingIds = new Set(
      currentItems
        .filter(item => item.kind === "post")
        .map(item => item.data.id)
    );

    const newPosts = posts.filter(
      post => !existingIds.has(post.id)
    );

    if(newPosts.length){

      const items = newPosts.map(data => ({
        kind:"post",
        data
      }));

      const extra = await supporting(items);

      const ranked = rankItems(items,extra);

      currentItems.push(...ranked);

      feed.insertAdjacentHTML(
        "beforeend",
        ranked.map(item => renderPost(item,extra)).join("")
      );
    }
        // Keep the loading message below all posts.
    const feedStatus = $("feedMoreStatus");
    requestAnimationFrame(updatePostTextControls);

    if(feedStatus){
      feed.appendChild(feedStatus);
                      }

    const updatedStatus = $("feedMoreStatus");

    if(updatedStatus){

      updatedStatus.textContent = hasMorePosts
        ? "Scroll down to load more posts"
        : "You're all caught up.";
    }

  }catch(error){

    console.error("Could not load more posts:",error);

    toast("Could not load more posts. Please try again.");

  }finally{

    loadingMorePosts = false;
  }
}

window.addEventListener("scroll",()=>{

  const nearBottom =
    window.innerHeight + window.scrollY >=
    document.documentElement.scrollHeight - 700;

  if(nearBottom){
    loadMorePosts();
  }

},{passive:true});

  /* AUTOMATIC NEW POST REFRESH */

async function refreshNewPosts(){

  if(
    document.hidden ||
    loading ||
    loadingMorePosts ||
    refreshingFeed
  ) return;

  refreshingFeed = true;

  try{

    const latestPosts = await fetchPosts(0);

    const existingIds = new Set(
      currentItems
        .filter(item => item.kind === "post")
        .map(item => item.data.id)
    );

    const newPosts = latestPosts.filter(
      post => !existingIds.has(post.id)
    );

    if(!newPosts.length) return;

    const items = newPosts.map(data => ({
      kind:"post",
      data
    }));

    const extra = await supporting(items);

    const ranked = rankItems(items,extra);

    postOffset += newPosts.length;

    hasMorePosts = latestPosts.length === FEED_PAGE_SIZE;

    currentItems.unshift(...ranked);

    feed.querySelector(".empty-feed")?.remove();

        feed.insertAdjacentHTML(
      "afterbegin",
      ranked.map(item => renderPost(item,extra)).join("")
    );

    requestAnimationFrame(updatePostTextControls);

  }catch(error){

    console.warn("Background feed refresh:",error);

  }finally{

    refreshingFeed = false;
  }
}

setInterval(refreshNewPosts,60000);

/* FULL-SCREEN SWIPEABLE POST IMAGE VIEWER */

(function(){

  const viewer = document.getElementById("imageViewer");
  const viewerImage = document.getElementById("imageViewerImage");
  const backButton = document.getElementById("imageViewerBack");

  if(!viewer || !viewerImage || !backButton) return;

  let images = [];
  let currentIndex = 0;
  let startX = 0;
  let startY = 0;

  function showImage(index){

    if(index < 0 || index >= images.length) return;

    currentIndex = index;

    viewerImage.style.opacity = "0";

    const nextSrc = images[currentIndex];

    const preload = new Image();

    preload.onload = function(){
      viewerImage.src = nextSrc;
      viewerImage.style.opacity = "1";
    };

    preload.onerror = function(){
      viewerImage.src = nextSrc;
      viewerImage.style.opacity = "1";
    };

    preload.src = nextSrc;
  }

  function openImageViewer(clickedImage){

    const grid = clickedImage.closest(".post-image-grid");

    if(!grid) return;

    images = Array.from(
      grid.querySelectorAll(".post-image")
    ).map(image => image.currentSrc || image.src);

    currentIndex = Array.from(
      grid.querySelectorAll(".post-image")
    ).indexOf(clickedImage);

    if(!images.length || currentIndex < 0) return;

    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden","false");

    document.body.classList.add("image-viewer-active");

    showImage(currentIndex);
  }

  function closeImageViewer(){

    viewer.classList.remove("open");
    viewer.setAttribute("aria-hidden","true");

    viewerImage.src = "";
    images = [];
    currentIndex = 0;

    document.body.classList.remove("image-viewer-active");
  }

  function nextImage(){
    if(currentIndex < images.length - 1){
      showImage(currentIndex + 1);
    }
  }

  function previousImage(){
    if(currentIndex > 0){
      showImage(currentIndex - 1);
    }
  }

  /* OPEN PHOTO */

  document.addEventListener("click",function(event){

    const image = event.target.closest(".post-image");

    if(image){
      event.preventDefault();
      openImageViewer(image);
    }

  });

  /* SWIPE LEFT AND RIGHT */

  viewer.addEventListener("touchstart",function(event){

    if(!viewer.classList.contains("open")) return;

    const touch = event.changedTouches[0];

    startX = touch.clientX;
    startY = touch.clientY;

  },{passive:true});

  viewer.addEventListener("touchend",function(event){

    if(!viewer.classList.contains("open")) return;

    const touch = event.changedTouches[0];

    const differenceX = touch.clientX - startX;
    const differenceY = touch.clientY - startY;

    if(Math.abs(differenceX) < 50) return;

    if(Math.abs(differenceX) <= Math.abs(differenceY)) return;

    if(differenceX < 0){
      nextImage();
    }else{
      previousImage();
    }

  },{passive:true});

  /* KEYBOARD NAVIGATION */

  document.addEventListener("keydown",function(event){

    if(!viewer.classList.contains("open")) return;

    if(event.key === "ArrowRight"){
      nextImage();
    }

    if(event.key === "ArrowLeft"){
      previousImage();
    }

    if(event.key === "Escape"){
      closeImageViewer();
    }

  });

  /* BACK BUTTON */

  backButton.addEventListener("click",function(event){
    event.stopPropagation();
    closeImageViewer();
  });

  /* TAP OUTSIDE TO CLOSE */

  viewer.addEventListener("click",function(event){

    if(event.target === viewer){
      closeImageViewer();
    }

  });

})();

function campusoraDecodeKey(value) {
  const padding = "=".repeat((4 - value.length % 4) % 4);

  const base64 = (value + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  return Uint8Array.from(
    atob(base64),
    character => character.charCodeAt(0)
  );
}

  if (
    !("serviceWorker" in navigator) ||
    !("PushManager" in window) ||
    !("Notification" in window) ||
    Notification.permission !== "granted"
  ) {
    return;
  }

  const { data, error } = await supabase.auth.getSession();

  if (error || !data.session) return;

  const registration = await navigator.serviceWorker.ready;

  let subscription = await registration.pushManager.getSubscription();

  if (!subscription) {
    subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: campusoraDecodeKey(
        CAMPUSORA_VAPID_PUBLIC_KEY
      )
    });
  }

  const response = await fetch("/api/push?action=subscribe", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${data.session.access_token}`
    },
    body: JSON.stringify({
      subscription: subscription.toJSON()
    })
  });

  if (!response.ok) {
    throw new Error("Could not register this device.");
  }

  return true;
}

async function campusoraStartPush() {
  if (
    !("Notification" in window) ||
    !("serviceWorker" in navigator) ||
    !("PushManager" in window)
  ) {
    return;
  }

  if (Notification.permission === "granted") {
    try {
      await campusoraRegisterPush();
    } catch (error) {
      console.error("Campusora push registration:", error);
    }

    return;
  }

  if (Notification.permission === "denied") return;

  const dismissed = Number(
    localStorage.getItem("campusoraPushPromptDismissed") || 0
  );

  const sevenDays = 7 * 24 * 60 * 60 * 1000;

  if (dismissed && Date.now() - dismissed < sevenDays) return;

  campusoraPushPrompt();
}
/* START PAGE */

async function startPage(){
 startProgress();

 try{
  await loadMyProfile();
   campusoraStartPush();

  /*
   * The feed and moments load independently.
   * A moments error must not stop posts from appearing.
   */

  await Promise.allSettled([
   loadFeed(),
   loadMoments()
  ]);

 }catch(error){
  console.error("Campusora page error:",error);

  showEmpty(
   "Campusora could not load",
   error.message||"Please refresh and try again.",
   true
  );

 }finally{
  finishProgress();
 }
}

startPage();
