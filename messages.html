<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Chats | Campusora</title>
<link rel="stylesheet" href="./shared-nav.css">

<style>
:root{
  --bg:#080b18;
  --panel:#101426;
  --panel2:#171d33;
  --border:#252d48;
  --text:#fff;
  --muted:#929bb7;
  --purple:#9065ff;
  --blue:#548bff;
  --cyan:#38d9ff;
  --green:#40dfa0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;
  min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.page{
  width:100%;
  max-width:none;
  margin:0;
  padding:0;
}

.messaging{
  height:100dvh;
  min-height:0;
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px 50px #0003;
}

.inbox{
  min-width:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--border);
}

.inbox-head{
  padding:19px 16px 12px;
  border-bottom:1px solid var(--border);
}

.inbox-title{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
}

.inbox-count{
  color:var(--muted);
  font-size:11px;
  margin-left:5px;
}

.inbox-tabs{
  display:flex;
  gap:20px;
  margin-top:17px;
}

.inbox-tab{
  background:none;
  border:0;
  color:var(--muted);
  padding:7px 0;
  font-size:12px;
  font-weight:700;
  position:relative;
}

.inbox-tab.active{color:#c8b7ff}

.inbox-tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  border-radius:5px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
}

.conversation-list{
  flex:1;
  min-height:0;
  overflow:auto;
}

.conversation{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 14px;
  border:0;
  border-bottom:1px solid #202842;
  background:transparent;
  color:white;
  text-align:left;
  transition:.18s;
}

.conversation:hover{background:#171d32}
.conversation.active{background:#272044}

.avatar{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:linear-gradient(135deg,#7952ee,#2689ee);
  border:1px solid #51477c;
  color:white;
  font-weight:800;
  font-size:14px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conv-main{flex:1;min-width:0}

.conv-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.conv-name{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  font-size:12px;
  font-weight:800;
  min-width:0;
}

.conv-time{
  color:#78819e;
  font-size:9px;
  white-space:nowrap;
}

.conv-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-top:5px;
}

.conv-preview{
  color:#aab3ce;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.unread-count{
  min-width:18px;
  height:18px;
  padding:0 5px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:white;
  font-size:10px;
  font-weight:800;
}

.role-badge{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 7px;
  border-radius:20px;
    font-size:9px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  border:1px solid #51427d;
  background:#30234d;
  color:#d4c4ff;
}

.role-badge.student{
  background:#172d50;
  border-color:#315b91;
  color:#9bc8ff;
}

.role-badge.alumni{
  background:#253a31;
  border-color:#39745b;
  color:#8de7b8;
}

.role-badge.general{
  background:#30234d;
  border-color:#51427d;
  color:#d4c4ff;
}

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.chat-head{
  min-height:70px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--border);
}

.back-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:28px;
  flex-shrink:0;
  padding:0;
  border:0;
  background:none;
  color:white;
  font-size:20px;
  line-height:1;
}

.chat-avatar-link{
  display:block;
  flex-shrink:0;
  border-radius:50%;
}

.chat-avatar-link .avatar{
  width:43px;
  height:43px;
}

.chat-person{
  flex:1;
  min-width:0;
}

.chat-name-link{
  display:inline-flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  color:white;
  font-size:13px;
  font-weight:800;
}

.chat-name-link:hover{color:#c8b7ff}

.chat-status{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.chat-tools{
  display:none;
  gap:7px;
}

.chat-tools button{
  width:33px;
  height:33px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:white;
}

.messages-area{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:radial-gradient(ellipse at 50% 0%,#29204a30,transparent 65%);
}

.date-label{
  text-align:center;
  color:#8992ad;
  font-size:10px;
  margin:8px 0;
}

.message-row{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  max-width:82%;
  animation:pop .18s ease;
}

.message-row.mine{
  align-self:flex-end;
  align-items:flex-end;
}

.message-bubble{
  padding:10px 13px;
  border:1px solid #303956;
  border-radius:14px 14px 14px 4px;
  background:#202943;
  color:#fff;
  font-size:13px;
  line-height:1.55;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.message-row.mine .message-bubble{
  background:linear-gradient(135deg,#6340a5,#365cbb);
  border-color:#7554c4;
  border-radius:14px 14px 4px 14px;
}

.message-row.pending .message-bubble{
  border:1px dashed #e5a64b;
  background:#3a2b22;
}

.message-meta{
  display:flex;
  gap:5px;
  align-items:center;
  margin:4px 4px 0;
  color:#8992ad;
  font-size:9px;
}

.message-status{color:var(--cyan)}
.pending-status{color:#ffc16a}

.message-actions{
  position:relative;
  display:flex;
  align-items:center;
  gap:5px;
}

.message-menu-button{
  border:0;
  background:transparent;
  color:#aab3ce;
  font-size:17px;
  padding:0 4px;
}

.message-menu{
  position:absolute;
  right:0;
  bottom:22px;
  z-index:20;
  width:145px;
  padding:5px;
  background:#202943;
  border:1px solid #3b4565;
  border-radius:10px;
  box-shadow:0 8px 25px #0008;
}

.message-menu button{
  display:block;
  width:100%;
  padding:9px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:white;
  text-align:left;
  font-size:11px;
}

.message-menu button:hover{background:#343c5b}
.message-menu .delete-option{color:#ff8585}

.chat-empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
}

.chat-empty-icon{
  width:55px;
  height:55px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:#211b3a;
  border:1px solid #45376c;
  color:#c4adff;
  font-size:24px;
  margin-bottom:14px;
}

.chat-empty h3{font-size:15px;margin-bottom:7px}

.chat-empty p{
  max-width:260px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.composer{
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:9px;
  background:#101426;
  border-top:1px solid var(--border);
}

.composer textarea{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:120px;
  resize:none;
  border:1px solid #303956;
  border-radius:13px;
  background:#1a2138;
  color:white;
  padding:12px;
  outline:none;
  font-size:13px;
  line-height:1.4;
}

.composer textarea::placeholder{color:#8992ad}
.composer textarea:focus{border-color:#8061df}

.send-btn{
  width:42px;
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:white;
  font-size:18px;
}

.send-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.phone-warning{
  display:none;
  padding:0 13px 10px;
  background:#101426;
  color:#ffb6b6;
  font-size:10px;
  font-style:italic;
  line-height:1.5;
}

.phone-warning.show{display:block}

.panel-message{
  padding:24px 14px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,12px);
  background:#25223a;
  border:1px solid #51417e;
  color:white;
  padding:11px 15px;
  border-radius:11px;
  font-size:11px;
  z-index:9999;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:calc(100% - 28px);
  text-align:center;
}

.toast.show{opacity:1;transform:translate(-50%,0)}

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#000b;
}

.modal-backdrop.show{display:flex}

.premium-modal{
  width:min(100%,390px);
  padding:22px;
  border:1px solid #493d75;
  border-radius:18px;
  background:#11162b;
  box-shadow:0 20px 70px #0009;
}

.premium-modal h2{
  font-size:19px;
  margin-bottom:8px;
}

.premium-modal p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin-bottom:17px;
}

.premium-plan{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px;
  margin-top:9px;
  border:1px solid #39415f;
  border-radius:12px;
  background:#1b2340;
  color:white;
  text-align:left;
}

.premium-plan:hover{
  border-color:var(--purple);
  background:#292044;
}

.premium-plan strong{font-size:13px}
  .premium-plan span{
  color:#c6b5ff;
  font-weight:800;
  font-size:13px;
}

.modal-cancel{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:1px solid #39415f;
  border-radius:10px;
  background:transparent;
  color:#aab3ce;
}

@keyframes pop{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:800px){
  .page{padding:0}
  .messaging{grid-template-columns:260px minmax(0,1fr)}
}

@media(max-width:560px){
  .page{padding:0}
  .messaging{
    height:100dvh;
    min-height:0;
    display:block;
    border:0;
    border-radius:0;
  }
  .inbox{height:100%;border:0}
  .inbox-head{padding:15px 15px 10px}
  .conversation{padding:13px 14px}
  .chat{display:none;height:100%;width:100%}
  .messaging.chat-open .inbox{display:none}
  .messaging.chat-open .chat{display:flex}
  .back-btn{display:flex}
  .chat-head{min-height:64px;padding:9px 10px}
  .messages-area{padding:14px 11px}
  .message-row{max-width:88%}
  .composer{padding:9px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
    /* Mobile full-screen chat and keyboard positioning */
@media(max-width:560px){
  html,
  body{
    width:100%;
    height:100%;
    min-height:0;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  .page{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
  }

  .messaging{
    position:fixed;
    top:var(--visual-viewport-top, 0px);
    left:0;
    right:0;
    width:100%;
    height:var(--visual-viewport-height, 100dvh);
    min-height:0;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    overflow:hidden;
  }

  .messaging.chat-open .chat{
    height:100%;
    min-height:0;
    display:flex;
    overflow:hidden;
  }

  .chat{
    min-height:0;
    height:100%;
  }

  .messages-area{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
  }

  .composer{
    flex:0 0 auto;
    order:3;
    margin:0;
    padding-bottom:max(9px, env(safe-area-inset-bottom));
  }

  .phone-warning{
    order:2;
    flex:0 0 auto;
  }
}
/* =========================================
   CAMPUSORA MESSAGES — PHONE FIT
========================================= */

/* Inbox: fit between the shared top and bottom navigation */
body.has-shared-nav:not(.chat-mode) .page{
  width:100%;
  height:calc(100dvh - 49px);
  margin:0;
  padding:0;
}

body.has-shared-nav:not(.chat-mode) .messaging{
  position:relative;
  width:100%;
  height:calc(100dvh - 125px);
  min-height:0;
  margin:0;
  border-radius:0;
}

/* Hide shared navigation only inside an open conversation */
body.chat-mode .campusora-topnav,
body.chat-mode .campusora-mainnav,
body.chat-mode .campusora-create-overlay{
  display:none!important;
}

body.chat-mode{
  overflow:hidden!important;
}

body.chat-mode .page{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

/* Fit chat to the actual visible phone screen */
body.chat-mode .messaging{
  position:fixed;
  top:var(--visual-viewport-top, 0px);
  left:0;
  right:0;
  bottom:auto;
  width:100%;
  height:var(--visual-viewport-height, 100dvh);
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  border-radius:0;
  overflow:hidden;
  z-index:10001;
}

/* Keep the person's name and back button visible */
body.chat-mode .chat{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
}

body.chat-mode .chat-head{
  display:flex;
  flex:0 0 auto;
  min-height:64px;
  padding:9px 10px;
  position:relative;
  z-index:5;
}

/* Only the messages should scroll */
body.chat-mode .messages-area{
  flex:1 1 0;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
}

/* Keep the message box above the Android keyboard */
body.chat-mode .composer{
  flex:0 0 auto;
  order:3;
  margin:0;
  padding:9px;
  padding-bottom:max(9px, env(safe-area-inset-bottom));
  position:relative;
  z-index:5;
}

body.chat-mode .phone-warning{
  flex:0 0 auto;
  order:2;
}

@media(max-width:560px){
  body.has-shared-nav:not(.chat-mode) .messaging{
    display:block;
  }

  body.has-shared-nav:not(.chat-mode) .inbox{
    height:100%;
  }

  body.chat-mode .chat-head{
    min-height:64px;
  }

  body.chat-mode .messages-area{
    padding:12px 10px;
  }
}
</style>
</head>

<body>

<div class="page">
<main class="messaging" id="messaging">

<section class="inbox">
  <div class="inbox-head">
    <h1 class="inbox-title">
      Chats
      <span class="inbox-count" id="totalCount"></span>
    </h1>

    <div class="inbox-tabs">
      <button class="inbox-tab active" data-inbox-filter="all">
        Messages
      </button>

      <button class="inbox-tab" data-inbox-filter="unread">
        Message Requests
      </button>
    </div>
  </div>

  <div class="conversation-list" id="conversationList">
    <div class="panel-message">Loading your conversations...</div>
  </div>
</section>

<section class="chat" id="chatPanel">

<header class="chat-head">
  <button class="back-btn" id="backBtn" aria-label="Back to chats">‹</button>

  <a href="#" class="chat-avatar-link" id="chatAvatarLink">
    <div class="avatar" id="chatAvatar">C</div>
  </a>

  <div class="chat-person">
    <a href="#" class="chat-name-link" id="chatNameLink">
      <span id="chatName">Your messages</span>
      <span id="chatRole"></span>
    </a>
    <div class="chat-status" id="chatStatus">Choose a conversation</div>
  </div>

  <div class="chat-tools">
    <button id="refreshBtn" title="Refresh messages">↻</button>
  </div>
</header>
  
<div class="messages-area" id="messagesArea" hidden></div>

<form class="composer" id="messageForm" hidden>
    <textarea
    id="messageInput"
    maxlength="5000"
    rows="1"
    placeholder="Write a message..."
    aria-label="Write a message"
  ></textarea>

  <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">➤</button>
</form>

<div class="phone-warning" id="phoneWarning">
  Sharing phone numbers is currently restricted on Campusora
</div>

</section>
</main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="premiumModal">
  <div class="premium-modal">
    <h2>Upgrade to Premium</h2>
    <p>
      Choose a Premium plan to continue
    </p>

    <button class="premium-plan" data-premium-plan="monthly">
      <strong>Monthly Premium</strong>
      <span>₦2,000 / 30 days</span>
    </button>

    <button class="premium-plan" data-premium-plan="permanent">
      <strong>Permanent Premium</strong>
      <span>₦10,000</span>
    </button>

    <button class="modal-cancel" id="closePremiumModal">Not now</button>
  </div>
</div>


<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);
  // Keep the chat fitted to the actual visible phone screen,
// including when the Android keyboard opens.
function updateChatViewport(){
  const viewport = window.visualViewport;

  if (!viewport) return;

  document.documentElement.style.setProperty(
    '--visual-viewport-height',
    viewport.height + 'px'
  );

  document.documentElement.style.setProperty(
    '--visual-viewport-top',
    viewport.offsetTop + 'px'
  );
}

if (window.visualViewport) {
  updateChatViewport();

  window.visualViewport.addEventListener(
    'resize',
    updateChatViewport
  );

  window.visualViewport.addEventListener(
    'scroll',
    updateChatViewport
  );
}

window.addEventListener('resize', updateChatViewport);

let me = null;
let conversations = [];
let currentConversation = null;
let currentOtherUser = null;
let currentMessages = [];
let currentPendingMessages = [];
let chatHistoryLoaded = false;
let currentFilter = 'all';
let realtimeMessages = null;
let realtimeInbox = null;
let messagePoll = null;
let refreshInterval = null;
let profileCache = new Map();
let sending = false;
let loadingMessages = false;
let messageLoadToken = 0;
let editingMessageId = null;
let pendingPremiumMessageId = null;
  // =====================================
// CAMPUSORA LOCAL MESSAGE CACHE
// =====================================

function inboxCacheKey() {
  return me ? `campusora_inbox_${me.id}` : null;
}

function chatCacheKey(id) {
  return me ? `campusora_chat_${me.id}_${id}` : null;
}

function saveInboxCache() {
  try {
    const key = inboxCacheKey();
    if (!key) return;

    localStorage.setItem(
      key,
      JSON.stringify(conversations.slice(0, 100))
    );
  } catch (error) {
    console.warn('Inbox cache could not be saved:', error);
  }
}

function restoreInboxCache() {
  try {
    const key = inboxCacheKey();
    if (!key) return;

    const saved = localStorage.getItem(key);
    if (!saved) return;

    const cached = JSON.parse(saved);

    if (!Array.isArray(cached)) return;

    conversations = cached;

// Restore names and profile pictures from the saved inbox.
cached.forEach(conversation => {
  if (conversation.otherProfile?.id) {
    profileCache.set(
      conversation.otherProfile.id,
      conversation.otherProfile
    );
  }
});

renderInbox();

let campusoraChatDBPromise = null;

function openCampusoraChatDB() {
  if (campusoraChatDBPromise) {
    return campusoraChatDBPromise;
  }

  campusoraChatDBPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB is not supported.'));
      return;
    }

    const request = indexedDB.open(
      'campusora-chat-history',
      1
    );

    request.onupgradeneeded = event => {
      const db = event.target.result;

      if (!db.objectStoreNames.contains('chats')) {
        db.createObjectStore('chats', {
          keyPath: 'key'
        });
      }
    };

    request.onsuccess = () => {
      resolve(request.result);
    };

    request.onerror = () => {
      reject(request.error);
    };
  });

  return campusoraChatDBPromise;
}

async function saveChatCacheToDB(id, messages) {
  if (!me || !id || !Array.isArray(messages)) return;

  try {
    const db = await openCampusoraChatDB();

    await new Promise((resolve, reject) => {
      const transaction = db.transaction(
        'chats',
        'readwrite'
      );

      transaction.objectStore('chats').put({
        key: `${me.id}_${id}`,
        user_id: me.id,
        conversation_id: id,
        messages: messages.slice(-100),
        updated_at: Date.now()
      });

      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });

  } catch (error) {
    console.warn('IndexedDB chat save:', error);
  }
}

async function restoreChatCacheFromDB(id) {
  if (!me || !id) return null;

  try {
    const db = await openCampusoraChatDB();

    const result = await new Promise((resolve, reject) => {
      const transaction = db.transaction(
        'chats',
        'readonly'
      );

      const request = transaction
        .objectStore('chats')
        .get(`${me.id}_${id}`);

      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });

    if (
      result &&
      result.user_id === me.id &&
      Array.isArray(result.messages)
    ) {
      return result.messages;
    }

  } catch (error) {
    console.warn('IndexedDB chat restore:', error);
  }

  return null;
}

function saveChatCache(id, messages = currentMessages) {
  if (!id || !Array.isArray(messages)) return;

  const safeMessages = messages.slice(-100);

  // Fast local cache.
  try {
    const key = chatCacheKey(id);

    if (key) {
      localStorage.setItem(
        key,
        JSON.stringify(safeMessages)
      );
    }
  } catch (error) {
    console.warn('Local chat cache:', error);
  }

  // Durable phone storage.
  saveChatCacheToDB(id, safeMessages);
}

function restoreChatCache(id) {
  try {
    const key = chatCacheKey(id);
    if (!key) return null;

    const saved = localStorage.getItem(key);

    if (!saved) return null;

    const messages = JSON.parse(saved);

    return Array.isArray(messages) ? messages : null;

  } catch (error) {
    console.warn('Local chat restore:', error);
    return null;
  }
}

function initials(name = 'C') {

function roleBadge(role) {

function ago(value) {
  if (!value) return '';

  const date = new Date(value);
  const sec = Math.max(0,Math.floor((Date.now()-date.getTime())/1000));

  if (sec < 60) return 'now';
  if (sec < 3600) return Math.floor(sec/60)+'m';
  if (sec < 86400) return Math.floor(sec/3600)+'h';
  if (sec < 604800) return Math.floor(sec/86400)+'d';

  return date.toLocaleDateString(undefined,{
    month:'short',
    day:'numeric'
  });
}

function unreadCount(conversation) {
  if (!conversation.lastMessage) return 0;

  return conversation.lastMessage.sender_id !== me.id &&
    (!conversation.lastReadAt ||
    new Date(conversation.lastMessage.created_at) >
    new Date(conversation.lastReadAt)) ? 1 : 0;
}

  async function preloadInboxChats(items, loadToken) {
  const ownerId = me?.id;
  if (!ownerId || !items.length) return;

  const queue = items.filter(conversation => {
    const readyKey =
      `campusora_chat_ready_${ownerId}_${conversation.id}`;

    let ready = null;

    try {
      ready = JSON.parse(localStorage.getItem(readyKey) || 'null');
    } catch (error) {
      ready = null;
    }

    const cached = restoreChatCache(conversation.id);

    const cachedLastId = cached?.length
      ? cached[cached.length - 1].id
      : null;

    const inboxLastId = conversation.lastMessage?.id || null;

    // Skip conversations whose complete cache is already current.
    return !(
      ready &&
      cached !== null &&
      ready.latestId === cachedLastId &&
      (!inboxLastId || ready.latestId === inboxLastId)
    );
  });

  if (!queue.length) return;

  const results = new Map();
  let nextIndex = 0;

  async function worker() {
    while (nextIndex < queue.length) {
      const conversation = queue[nextIndex++];

      if (me?.id !== ownerId) return;

      try {
        const { data, error } = await supabase
          .from('messages')
          .select('id,conversation_id,sender_id,content,created_at,deleted_at')
          .eq('conversation_id', conversation.id)
          .is('deleted_at', null)
          .order('created_at', { ascending: false })
          .limit(100);

        if (error) {
          console.warn(
            'Chat preload failed:',
            conversation.id,
            error
          );
          continue;
        }

        const messages = (data || []).reverse();

        // Do not replace an existing cache with an unexpected empty result.
        if (!messages.length && conversation.lastMessage) {
          continue;
        }

        saveChatCache(conversation.id, messages);

        const readyKey =
          `campusora_chat_ready_${ownerId}_${conversation.id}`;

        localStorage.setItem(
          readyKey,
          JSON.stringify({
            latestId: messages.length
              ? messages[messages.length - 1].id
              : null
          })
        );

        results.set(conversation.id, messages);

      } catch (error) {
        console.warn('Chat preload error:', error);
      }
    }
  }
// Prepare twelve conversations simultaneously.
await Promise.all(
  Array.from(
    { length: Math.min(12, queue.length) },
    () => worker()
  )
);

  if (
    me?.id !== ownerId ||
    loadToken !== window.campusoraInboxToken ||
    !results.size
  ) {
    return;
  }

  // Update inbox previews using the preloaded messages.
  conversations = conversations.map(c => {
    if (!results.has(c.id)) return c;

    const messages = results.get(c.id);

    return {
      ...c,
      lastMessage: messages.length
        ? messages[messages.length - 1]
        : null
    };
  });

  conversations.sort((a, b) =>
    new Date(b.lastMessage?.created_at || b.created_at) -
    new Date(a.lastMessage?.created_at || a.created_at)
  );

  renderInbox();
  saveInboxCache();
}

  const {data,error} = await supabase
    .from('campusora_pending_messages')
    .select('id,conversation_id,user_id,content,created_at,sent_at')
    .eq('conversation_id',id)
    .eq('user_id',me.id)
    .is('sent_at',null)
    .order('created_at',{ascending:true});

  if (error) {
    console.warn('Pending messages:',error.message);
    currentPendingMessages = [];
    return;
  }

  currentPendingMessages = data || [];
}
  async function markConversationRead(id) {
  const now = new Date().toISOString();

  const {error} = await supabase
    .from('conversation_members')
    .update({last_read_at:now})
    .eq('conversation_id',id)
    .eq('user_id',me.id);

  if (error) console.warn('Read status:',error.message);

  const c = conversations.find(item => item.id === id);
  if (c) c.lastReadAt = now;

  renderInbox();
}

function setupMessageRealtime(id) {
  if (realtimeMessages) {
    supabase.removeChannel(realtimeMessages);
    realtimeMessages = null;
  }

  realtimeMessages = supabase
    .channel('campusora-chat-' + id)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages',
      filter:`conversation_id=eq.${id}`
    },async payload => {
      if (currentConversation?.id !== id) return;

      if (!currentMessages.some(m => m.id === payload.new.id)) {
        currentMessages.push(payload.new);
        renderMessages();

        if (payload.new.sender_id !== me.id) {
          await markConversationRead(id);
        }

        await loadInbox();
      }
    })
    .subscribe();
}

function containsPhoneNumber(text) {
  const candidates = String(text || '').match(
    /(?:\+?\d[\d\s().-]{8,}\d)/g
  ) || [];

  return candidates.some(candidate => {
    let digits = candidate.replace(/\D/g,'');

    if (digits.startsWith('234')) {
      digits = '0' + digits.slice(3);
    }

    return digits.length === 11 && /^0[789][01]\d{8}$/.test(digits);
  });
}

function checkMessageInput() {
  const text = $('messageInput').value;
  const restricted = containsPhoneNumber(text);

  $('sendBtn').disabled = restricted || !text.trim() || sending;
  $('phoneWarning').classList.toggle('show',restricted);

  return !restricted;
}

async function savePendingMessage(content) {
  const {data,error} = await supabase
    .from('campusora_pending_messages')
    .insert({
      conversation_id:currentConversation.id,
      user_id:me.id,
      content
    })
    .select('id,conversation_id,user_id,content,created_at,sent_at')
    .single();

  if (error) {
    console.error('Save pending message:',error);
    toast('The message could not be saved. Please try again.');
    return false;
  }

  currentPendingMessages.push(data);
  renderMessages();
  return true;
}

function openPremiumModal(pendingId = null) {
  pendingPremiumMessageId = pendingId;
  $('premiumModal').classList.add('show');
}

function closePremiumModal() {
  $('premiumModal').classList.remove('show');
}

async function startPremiumPayment(planType) {
  const {data:{session},error:sessionError} = await supabase.auth.getSession();

  if (sessionError || !session?.access_token) {
    toast('Please sign in again.');
    return;
  }

  const buttons = document.querySelectorAll('[data-premium-plan]');
  buttons.forEach(button => button.disabled = true);

  try {
    const response = await fetch('/api/premium/initialize',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + session.access_token
      },
      body:JSON.stringify({
        plan_type:planType,
        return_to:'messages.html'
      })
    });

    const result = await response.json();

    if (!response.ok || !result.authorization_url) {
      throw new Error(result.error || result.message || 'Payment could not be started.');
    }

    window.location.href = result.authorization_url;
  } catch(error) {
    console.error('Premium payment:',error);
    toast(error.message || 'Could not start Premium payment.');
    buttons.forEach(button => button.disabled = false);
  }
}

async function verifyPremiumPayment() {
  const params = new URLSearchParams(window.location.search);
  const paymentFlag = params.get('premium_payment');
  const reference = params.get('reference') || params.get('trxref');

  if (paymentFlag !== '1' || !reference) return;

  const {data:{session}} = await supabase.auth.getSession();

  if (!session?.access_token) {
    toast('Please sign in again to confirm your payment.');
    return;
  }

  toast('Confirming your Premium payment...');

  try {
    const response = await fetch('/api/premium/verify',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + session.access_token
      },
      body:JSON.stringify({reference})
    });

    const result = await response.json();

    if (!response.ok || result.success !== true) {
      throw new Error(result.error || result.message || 'Payment verification failed.');
    }

    window.history.replaceState({},'',window.location.pathname);

    await loadInbox();

    if (currentConversation) {
      await loadMessages(currentConversation.id);
    }

    const sent = Number(result.resent_count || 0);

    if (sent > 0) {
      toast(`Premium activated. ${sent} saved message(s) sent.`);
    } else {
      toast('Premium activated successfully.');
    }

  } catch(error) {
    console.error('Payment verification:',error);
    toast(error.message || 'Could not verify payment. Please refresh.');
  }
}

function resetMessageEditor() {
  editingMessageId = null;
  $('sendBtn').textContent = '➤';
  $('sendBtn').setAttribute('aria-label','Send message');
}

async function sendMessage(event) {
  event.preventDefault();

  if (sending || !currentConversation || !me) return;

  const input = $('messageInput');
  const content = input.value.trim();

  if (!content) return;

  if (!checkMessageInput()) {
    toast('Sharing phone numbers is currently restricted on Campusora.');
    return;
  }

  sending = true;
  $('sendBtn').disabled = true;

  if (editingMessageId) {
    const messageId = editingMessageId;
    const {data,error} = await supabase
      .from('messages')
      .update({content})
      .eq('id',messageId)
      .eq('sender_id',me.id)
      .select('id,conversation_id,sender_id,content,created_at,deleted_at')
      .single();

    sending = false;
    $('sendBtn').disabled = false;

    if (error) {
      console.error('Edit message:',error);
      toast('Message could not be edited. Please try again.');
      checkMessageInput();
      return;
    }

    currentMessages = currentMessages.map(m =>
      String(m.id) === String(messageId) ? data : m
    );

    input.value = '';
    input.style.height = '42px';
    $('phoneWarning').classList.remove('show');
    resetMessageEditor();
    renderMessages();
    toast('Message updated.');
    await loadInbox();
    input.focus();
    checkMessageInput();
    return;
  }

  const {data,error} = await supabase
    .from('messages')
    .insert({
      conversation_id:currentConversation.id,
      sender_id:me.id,
      content
    })
    .select('id,conversation_id,sender_id,content,created_at,deleted_at')
    .single();

  sending = false;

  if (error) {
    console.error('Send message:',error);

    if (String(error.message || '').includes('MESSAGE_PREMIUM_REQUIRED')) {
      const saved = await savePendingMessage(content);

      if (saved) {
        input.value = '';
        input.style.height = '42px';
        $('phoneWarning').classList.remove('show');
        openPremiumModal(currentPendingMessages.at(-1)?.id || null);
      }

      checkMessageInput();
      return;
    }

    toast('Message could not be sent. Check your connection.');
    checkMessageInput();
    return;
  }

  input.value = '';
  input.style.height = '42px';
  $('phoneWarning').classList.remove('show');
  $('sendBtn').disabled = false;

  if (!currentMessages.some(m => m.id === data.id)) {
    currentMessages.push(data);
    renderMessages();
  }

  await loadInbox();
  input.focus();
  checkMessageInput();
}

function editMessage(messageId) {
  const message = currentMessages.find(m => String(m.id) === String(messageId));

  if (!message || message.sender_id !== me.id) return;

  editingMessageId = message.id;

  const input = $('messageInput');
  input.value = message.content;
  input.style.height = '42px';
  input.style.height = Math.min(input.scrollHeight,120) + 'px';

  $('sendBtn').textContent = '✓';
  $('sendBtn').setAttribute('aria-label','Save edited message');
  $('sendBtn').disabled = false;

  document.querySelectorAll('.message-menu').forEach(item => {
    item.hidden = true;
  });

  requestAnimationFrame(() => {
    input.focus();
    input.setSelectionRange(input.value.length,input.value.length);
    input.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
}

async function deleteMessage(messageId) {
  const message = currentMessages.find(m => String(m.id) === String(messageId));

  if (!message || message.sender_id !== me.id) return;

  const {data,error} = await supabase
    .from('messages')
    .delete()
    .eq('id',messageId)
    .eq('sender_id',me.id)
    .select('id')
    .single();

  if (error || !data) {
    console.error('Delete message:',error);
    toast('Message could not be deleted.');
    return;
  }

  currentMessages = currentMessages.filter(
    m => String(m.id) !== String(messageId)
  );

  renderMessages();
  await loadInbox();
  toast('Message deleted.');
}

function setupInboxRealtime() {
  if (realtimeInbox) supabase.removeChannel(realtimeInbox);

  realtimeInbox = supabase
    .channel('campusora-inbox-' + me.id)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages'
    },payload => {
      if (conversations.some(c => c.id === payload.new.conversation_id)) {
        loadInbox();
      }
    })
    .subscribe();
}

function setupEvents() {
  $('conversationList').addEventListener('click',async event => {
    const button = event.target.closest('[data-conversation]');
    if (!button) return;
    await openConversation(button.dataset.conversation);
  });

  document.querySelectorAll('[data-inbox-filter]').forEach(button => {
    button.addEventListener('click',() => {
      currentFilter = button.dataset.inboxFilter;

      document.querySelectorAll('[data-inbox-filter]').forEach(tab => {
        tab.classList.toggle('active',tab === button);
      });

      renderInbox();
    });
  });

  $('messagesArea').addEventListener('click',async event => {
    const menuButton = event.target.closest('[data-message-menu]');
    const editButton = event.target.closest('[data-edit-message]');
    const deleteButton = event.target.closest('[data-delete-message]');

    if (menuButton) {
      const id = menuButton.dataset.messageMenu;
      const menu = $('menu-' + id);
      const wasHidden = menu.hidden;

      document.querySelectorAll('.message-menu').forEach(item => {
        item.hidden = true;
      });

      menu.hidden = !wasHidden;
      return;
    }

    if (editButton) {
      await editMessage(editButton.dataset.editMessage);
      return;
    }

    if (deleteButton) {
      await deleteMessage(deleteButton.dataset.deleteMessage);
      return;
    }

    document.querySelectorAll('.message-menu').forEach(item => {
      item.hidden = true;
    });
  });

  $('messageForm').addEventListener('submit',sendMessage);

  $('messageInput').addEventListener('input',event => {
    const input = event.target;
    input.style.height = '42px';
    input.style.height = Math.min(input.scrollHeight,120) + 'px';
    checkMessageInput();
  });

  $('messageInput').addEventListener('keydown',event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      $('messageForm').requestSubmit();
    }
  });

  $('backBtn').addEventListener('click',() => {
    $('messaging').classList.remove('chat-open');
    document.body.classList.remove('chat-mode');
  });

  $('refreshBtn').addEventListener('click',async () => {
    if (currentConversation) {
      await loadMessages(currentConversation.id,true);
    }

    await loadInbox();
    toast('Messages refreshed');
  });

  $('closePremiumModal').addEventListener('click',closePremiumModal);

  $('premiumModal').addEventListener('click',event => {
    if (event.target === $('premiumModal')) closePremiumModal();
  });

  document.querySelectorAll('[data-premium-plan]').forEach(button => {
    button.addEventListener('click',() => {
      startPremiumPayment(button.dataset.premiumPlan);
    });
  });
}

async function startConversation(userId) {
  if (!userId || userId === me.id) {
    toast('You cannot message yourself.');
    return false;
  }

  const {data:conversationId,error} = await supabase.rpc(
    'start_direct_conversation',
    {target_user_id:userId}
  );

  if (error || !conversationId) {
    console.error('Start conversation:',error);
    toast(error?.message || 'Could not open conversation.');
    return false;
  }

  await loadInbox();

  const conversation = conversations.find(
    c => String(c.id) === String(conversationId)
  );

  if (!conversation) {
    toast('Conversation could not be loaded. Check permissions.');
    return false;
  }

  await openConversation(conversation.id);
  return true;
}

async function initialize() {
  setupEvents();

  // Read the saved login session from this phone first.
  const { data, error } = await supabase.auth.getSession();

  const session = data?.session;

  if (error || !session?.user) {
    $('conversationList').innerHTML = `
      <div class="panel-message">
        Sign in to use Campusora messages.<br><br>
        <a href="auth.html" style="color:#b8a2ff">Sign in →</a>
      </div>`;

    $('welcomeState').querySelector('h3').textContent =
      'Sign in to connect';

    $('welcomeState').querySelector('p').textContent =
      'Sign in to message students, alumni, and other Campusora members.';

    $('messageForm').hidden = true;
    return;
  }

  me = session.user;

  // SHOW SAVED CONVERSATIONS IMMEDIATELY.
  restoreInboxCache();

  // Start realtime updates.
  setupInboxRealtime();

  // Refresh inbox without blocking the page.
  loadInbox().catch(error => {
    console.error('Inbox refresh:', error);
  });

  // Verify the session with Supabase in the background.
  supabase.auth.getUser().then(({ error }) => {
    if (error) {
      console.warn('Background session verification:', error);
    }
  });

  const params = new URLSearchParams(window.location.search);
  const targetUserId = params.get('user');
  const productName = params.get('product');

  if (targetUserId) {
    if (targetUserId === me.id) {
      toast('You cannot message yourself.');
    } else {
      const opened = await startConversation(targetUserId);

      if (opened && productName) {
        const input = $('messageInput');

        if (!input.value.trim()) {
          input.value =
            `Hi! I'm interested in your product "${productName}". Is it still available?`;

          input.focus();
          checkMessageInput();
        }
      }
    }

    window.history.replaceState({}, '', window.location.pathname);
  }

  if (refreshInterval) clearInterval(refreshInterval);

  refreshInterval = setInterval(() => {
    loadInbox();

    if (currentConversation) {
      loadMessages(currentConversation.id);
    }
  }, 30000);

  verifyPremiumPayment().catch(error => {
    console.error('Premium payment verification:', error);
  });
}

window.addEventListener('beforeunload',() => {
  if (realtimeMessages) supabase.removeChannel(realtimeMessages);
  if (realtimeInbox) supabase.removeChannel(realtimeInbox);
  if (messagePoll) clearInterval(messagePoll);
  if (refreshInterval) clearInterval(refreshInterval);
});

initialize().catch(error => {
  console.error('Campusora messages initialization failed:',error);
  toast('Messages could not be initialized. Please refresh.');
});
</script>
