<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Messages | Campusora</title>

<link rel="stylesheet" href="shared-nav.css">

<style>
:root {
  --bg:#080b18;
  --panel:#101426;
  --panel2:#171d33;
  --border:#252d48;
  --text:#ffffff;
  --muted:#929bb7;
  --purple:#9065ff;
  --blue:#548bff;
  --cyan:#38d9ff;
  --green:#40dfa0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;
  min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.page{
  max-width:1150px;
  margin:auto;
  padding:18px 14px 30px;
}

.messaging{
  height:min(760px,calc(100dvh - 115px));
  min-height:460px;
  display:grid;
  grid-template-columns:310px minmax(0,1fr);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px 50px #0003;
}

.inbox{
  min-width:0;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--border);
}

.inbox-head{
  padding:19px 16px 12px;
  border-bottom:1px solid var(--border);
}

.inbox-title{
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
}

.inbox-count{
  color:var(--muted);
  font-size:11px;
  margin-left:5px;
}

.inbox-tabs{
  display:flex;
  gap:20px;
  margin-top:17px;
}

.inbox-tab{
  background:none;
  border:0;
  color:var(--muted);
  padding:7px 0;
  font-size:12px;
  font-weight:700;
  position:relative;
}

.inbox-tab.active{color:#c8b7ff}

.inbox-tab.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  border-radius:5px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
}

.conversation-list{
  flex:1;
  min-height:0;
  overflow:auto;
}

.conversation{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 14px;
  border:0;
  border-bottom:1px solid #202842;
  background:transparent;
  color:white;
  text-align:left;
  transition:.18s;
}

.conversation:hover{background:#171d32}
.conversation.active{background:#272044}

.avatar{
  width:45px;
  height:45px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:linear-gradient(135deg,#7952ee,#2689ee);
  border:1px solid #51477c;
  color:white;
  font-weight:800;
  font-size:14px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.conv-main{flex:1;min-width:0}

.conv-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.conv-name{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  font-size:12px;
  font-weight:800;
  min-width:0;
}

.conv-time{
  color:#78819e;
  font-size:9px;
  white-space:nowrap;
}

.conv-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-top:5px;
}

.conv-preview{
  color:#aab3ce;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.unread-count{
  min-width:18px;
  height:18px;
  padding:0 5px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:white;
  font-size:10px;
  font-weight:800;
}

.role-badge{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 7px;
  border-radius:20px;
  font-size:9px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
  border:1px solid #51427d;
  background:#30234d;
  color:#d4c4ff;
}

.role-badge.student{
  background:#172d50;
  border-color:#315b91;
  color:#9bc8ff;
}

.role-badge.alumni{
  background:#253a31;
  border-color:#39745b;
  color:#8de7b8;
}

.role-badge.general{
  background:#30234d;
  border-color:#51427d;
  color:#d4c4ff;
}

.chat{
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}

.chat-head{
  min-height:70px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--border);
}

.back-btn{
  display:none;
  border:0;
  background:none;
  color:white;
  font-size:24px;
}

.chat-avatar-link{
  display:block;
  flex-shrink:0;
  border-radius:50%;
}

.chat-avatar-link .avatar{
  width:43px;
  height:43px;
}

.chat-person{
  flex:1;
  min-width:0;
}

.chat-name-link{
  display:inline-flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  color:white;
  font-size:13px;
  font-weight:800;
}

.chat-name-link:hover{color:#c8b7ff}

.chat-status{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.chat-tools{
  display:flex;
  gap:7px;
}

.chat-tools button{
  width:33px;
  height:33px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:white;
}

.messages-area{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:
    radial-gradient(ellipse at 50% 0%,#29204a30,transparent 65%);
}

.date-label{
  text-align:center;
  color:#8992ad;
  font-size:10px;
  margin:8px 0;
}

.message-row{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  max-width:82%;
  animation:pop .18s ease;
}

.message-row.mine{
  align-self:flex-end;
  align-items:flex-end;
}

.message-bubble{
  padding:10px 13px;
  border:1px solid #303956;
  border-radius:14px 14px 14px 4px;
  background:#202943;
  color:#fff;
  font-size:13px;
  line-height:1.55;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.message-row.mine .message-bubble{
  background:linear-gradient(135deg,#6340a5,#365cbb);
  border-color:#7554c4;
  border-radius:14px 14px 4px 14px;
  color:#fff;
}

.message-meta{
  display:flex;
  gap:5px;
  align-items:center;
  margin:4px 4px 0;
  color:#8992ad;
  font-size:9px;
}

.message-status{color:var(--cyan)}

.chat-empty{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
}

.chat-empty-icon{
  width:55px;
  height:55px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:#211b3a;
  border:1px solid #45376c;
  color:#c4adff;
  font-size:24px;
  margin-bottom:14px;
}

.chat-empty h3{font-size:15px;margin-bottom:7px}

.chat-empty p{
  max-width:260px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.composer{
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:9px;
  background:#101426;
  border-top:1px solid var(--border);
}

.composer textarea{
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:120px;
  resize:none;
  border:1px solid #303956;
  border-radius:13px;
  background:#1a2138;
  color:white;
  padding:12px;
  outline:none;
  font-size:13px;
  line-height:1.4;
}

.composer textarea::placeholder{color:#8992ad}
.composer textarea:focus{border-color:#8061df}

.send-btn{
  width:42px;
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--purple),var(--blue));
  color:white;
  font-size:18px;
}

.send-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.phone-warning{
  display:none;
  padding:0 13px 10px;
  background:#101426;
  color:#ffb6b6;
  font-size:10px;
  font-style:italic;
  line-height:1.5;
}

.phone-warning.show{display:block}

.panel-message{
  padding:24px 14px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,12px);
  background:#25223a;
  border:1px solid #51417e;
  color:white;
  padding:11px 15px;
  border-radius:11px;
  font-size:11px;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:calc(100% - 28px);
  text-align:center;
}

.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes pop{
  from{opacity:0;transform:translateY(4px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:800px){
  .page{padding:12px 8px}
  .messaging{grid-template-columns:260px minmax(0,1fr)}
}

@media(max-width:560px){
  .page{padding:0}
  .messaging{
    height:calc(100dvh - 75px);
    min-height:400px;
    display:block;
    border:0;
    border-radius:0;
  }

  .inbox{height:100%;border:0}
  .inbox-head{padding:15px 15px 10px}
  .conversation{padding:13px 14px}
  .chat{display:none;height:100%;width:100%}
  .messaging.chat-open .inbox{display:none}
  .messaging.chat-open .chat{display:flex}
  .back-btn{display:block}
  .chat-head{min-height:64px;padding:9px 10px}
  .messages-area{padding:14px 11px}
  .message-row{max-width:88%}
  .composer{padding:9px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="page">

  <main class="messaging" id="messaging">

    <section class="inbox">

      <div class="inbox-head">
        <h1 class="inbox-title">
          Messages
          <span class="inbox-count" id="totalCount"></span>
        </h1>

        <div class="inbox-tabs">
          <button class="inbox-tab active" data-inbox-filter="all">
            All chats
          </button>

          <button class="inbox-tab" data-inbox-filter="unread">
            Unread
          </button>
        </div>
      </div>

      <div class="conversation-list" id="conversationList">
        <div class="panel-message">Loading your conversations...</div>
      </div>

    </section>

    <section class="chat" id="chatPanel">

      <header class="chat-head">

        <button class="back-btn" id="backBtn" aria-label="Back to chats">
          ‹
        </button>

        <a href="#" class="chat-avatar-link" id="chatAvatarLink">
          <div class="avatar" id="chatAvatar">C</div>
        </a>

        <div class="chat-person">
          <a href="#" class="chat-name-link" id="chatNameLink">
            <span id="chatName">Your messages</span>
            <span id="chatRole"></span>
          </a>

          <div class="chat-status" id="chatStatus">
            Choose a conversation
          </div>
        </div>

        <div class="chat-tools">
          <button id="refreshBtn" title="Refresh messages">↻</button>
        </div>

      </header>

      <div class="chat-empty" id="welcomeState">
        <div class="chat-empty-icon">✉</div>
        <h3>Your campus connections</h3>
        <p>
          Message friends, meet students from other campuses,
          and keep your conversations going on Campusora.
        </p>
      </div>

      <div class="messages-area" id="messagesArea" hidden></div>

      <form class="composer" id="messageForm" hidden>
        <textarea
          id="messageInput"
          maxlength="5000"
          rows="1"
          placeholder="Write a message..."
          aria-label="Write a message"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          type="submit"
          aria-label="Send message"
        >➤</button>
      </form>

      <div class="phone-warning" id="phoneWarning">
        Sharing phone numbers is currently restricted on Campusora
      </div>

    </section>

  </main>

</div>

<div class="toast" id="toast"></div>

<script src="shared-nav.js"></script>

<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let me = null;
let conversations = [];
let currentConversation = null;
let currentOtherUser = null;
let currentMessages = [];
let currentFilter = 'all';
let realtimeMessages = null;
let realtimeInbox = null;
let messagePoll = null;
let refreshInterval = null;
let profileCache = new Map();
let sending = false;
let loadingMessages = false;

function esc(value = '') {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function initials(name = 'C') {
  return name.trim().split(/\s+/).filter(Boolean).slice(0,2)
    .map(p => p[0]).join('').toUpperCase() || 'C';
}

function avatarHTML(profile) {
  const name = profile?.full_name || profile?.username || 'Member';

  if (profile?.avatar_url) {
    return `<img src="${esc(profile.avatar_url)}" alt="">`;
  }

  return esc(initials(name));
}

function profileName(profile) {
  return profile?.full_name || profile?.username || 'Campusora member';
}

function profileURL(profile) {
  if (!profile) return '#';

  return profile.username
    ? `profile.html?username=${encodeURIComponent(profile.username)}`
    : `profile.html?id=${encodeURIComponent(profile.id)}`;
}

function roleBadge(role) {
  const value = String(role || '').toLowerCase();

  if (value.includes('student')) {
    return '<span class="role-badge student">Student</span>';
  }

  if (value.includes('alumni')) {
    return '<span class="role-badge alumni">Alumni</span>';
  }

  return '<span class="role-badge general">General Member</span>';
}

function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');

  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'),3000);
}

function ago(value) {
  if (!value) return '';

  const date = new Date(value);
  const sec = Math.max(0,Math.floor((Date.now()-date.getTime())/1000));

  if (sec < 60) return 'now';
  if (sec < 3600) return Math.floor(sec/60)+'m';
  if (sec < 86400) return Math.floor(sec/3600)+'h';
  if (sec < 604800) return Math.floor(sec/86400)+'d';

  return date.toLocaleDateString(undefined,{
    month:'short',
    day:'numeric'
  });
}

function unreadCount(conversation) {
  if (!conversation.lastMessage) return 0;

  return conversation.lastMessage.sender_id !== me.id &&
    (!conversation.lastReadAt ||
    new Date(conversation.lastMessage.created_at) >
    new Date(conversation.lastReadAt)) ? 1 : 0;
}

async function getProfiles(ids) {
  const unique = [...new Set(ids.filter(Boolean))];
  const missing = unique.filter(id => !profileCache.has(id));

  if (!missing.length) return;

  const {data,error} = await supabase
    .from('profiles')
    .select('id,username,full_name,avatar_url,school,role')
    .in('id',missing);

  if (error) {
    console.warn('Profile lookup:',error.message);
    return;
  }

  (data || []).forEach(profile => profileCache.set(profile.id,profile));
}

async function loadInbox() {
  const list = $('conversationList');

  const {data:members,error} = await supabase
    .from('conversation_members')
    .select('conversation_id,user_id,last_read_at,joined_at')
    .eq('user_id',me.id);

  if (error) {
    console.error('Inbox members:',error);
    list.innerHTML = '<div class="panel-message">Could not load chats. Please refresh.</div>';
    return;
  }

  if (!members?.length) {
    conversations = [];
    renderInbox();
    return;
  }

  const ids = members.map(m => m.conversation_id);

  const {data:convRows,error:convError} = await supabase
    .from('conversations')
    .select('id,created_by,is_group,group_name,created_at')
    .in('id',ids);

  if (convError) {
    console.error('Conversation lookup:',convError);
    list.innerHTML = '<div class="panel-message">Could not load conversations.</div>';
    return;
  }

  const {data:allMembers,error:memberError} = await supabase
    .from('conversation_members')
    .select('conversation_id,user_id,last_read_at,joined_at')
    .in('conversation_id',ids);

  if (memberError) console.warn(memberError.message);

  const participantIds = [
    ...new Set((allMembers || []).map(m => m.user_id))
  ];

  await getProfiles(participantIds);

  const {data:messageRows,error:messageError} = await supabase
    .from('messages')
    .select('id,conversation_id,sender_id,content,created_at,deleted_at')
    .in('conversation_id',ids)
    .is('deleted_at',null)
    .order('created_at',{ascending:false})
    .limit(Math.min(500,ids.length * 30));

  if (messageError) console.warn(messageError.message);

  conversations = (convRows || []).map(c => {
    const myMembership = members.find(m => m.conversation_id === c.id);

    const participants = (allMembers || []).filter(
      m => m.conversation_id === c.id
    );

    const other = participants.find(m => m.user_id !== me.id);

    const last = (messageRows || []).find(
      m => m.conversation_id === c.id
    ) || null;

    return {
      ...c,
      participants,
      otherUserId:other?.user_id || null,
      otherProfile:other ? profileCache.get(other.user_id) : null,
      lastMessage:last,
      lastReadAt:myMembership?.last_read_at || null
    };
  }).sort((a,b) =>
    new Date(b.lastMessage?.created_at || b.created_at) -
    new Date(a.lastMessage?.created_at || a.created_at)
  );

  renderInbox();
}

function renderInbox() {
  const list = $('conversationList');

  let items = conversations;

  if (currentFilter === 'unread') {
    items = conversations.filter(c => unreadCount(c) > 0);
  }

  $('totalCount').textContent = conversations.length
    ? `(${conversations.length})`
    : '';

  if (!items.length) {
    list.innerHTML = `<div class="panel-message">${
      currentFilter === 'unread'
        ? 'You have no unread messages.'
        : 'No conversations yet. Visit a member profile and tap Message to start a conversation.'
    }</div>`;
    return;
  }

  list.innerHTML = items.map(c => {
    const profile = c.otherProfile;
    const name = c.is_group
      ? c.group_name || 'Group chat'
      : profileName(profile);

    const last = c.lastMessage;
    const preview = last
      ? (last.sender_id === me.id ? 'You: ' : '') + last.content
      : 'Start a conversation';

    const count = unreadCount(c);
    const selected = currentConversation?.id === c.id;

    return `
      <button class="conversation ${selected ? 'active' : ''}"
        data-conversation="${esc(c.id)}">

        <div class="avatar">${avatarHTML(profile)}</div>

        <div class="conv-main">
          <div class="conv-top">
            <span class="conv-name">
              ${esc(name)}
              ${!c.is_group ? roleBadge(profile?.role) : ''}
            </span>
            <span class="conv-time">${ago(last?.created_at || c.created_at)}</span>
          </div>

          <div class="conv-bottom">
            <span class="conv-preview">${esc(preview)}</span>
            ${count ? `<span class="unread-count">${count}</span>` : ''}
          </div>
        </div>
      </button>
    `;
  }).join('');
}

function openProfile(profile) {
  if (!profile) return;
  window.location.href = profileURL(profile);
}

function updateChatHeader(profile,conversation) {
  const avatar = $('chatAvatar');

  avatar.innerHTML = avatarHTML(profile);

  $('chatAvatarLink').href = profileURL(profile);
  $('chatNameLink').href = profileURL(profile);

  $('chatName').textContent = conversation.is_group
    ? conversation.group_name || 'Group chat'
    : profileName(profile);

  $('chatRole').innerHTML = conversation.is_group
    ? ''
    : roleBadge(profile?.role);

  $('chatStatus').textContent =
    profile?.school || 'Campusora member';
}

async function openConversation(id) {
  const conversation = conversations.find(
    c => String(c.id) === String(id)
  );

  if (!conversation) {
    toast('Conversation could not be found.');
    return;
  }

  currentConversation = conversation;

  currentOtherUser = conversation.otherUserId
    ? profileCache.get(conversation.otherUserId) || null
    : null;

  if (!conversation.is_group && !currentOtherUser) {
    await getProfiles([conversation.otherUserId]);
    currentOtherUser = profileCache.get(conversation.otherUserId) || null;
  }

  updateChatHeader(currentOtherUser,conversation);

  $('messaging').classList.add('chat-open');
  $('welcomeState').hidden = true;
  $('messagesArea').hidden = false;
  $('messageForm').hidden = false;

  $('messagesArea').innerHTML =
    '<div class="panel-message">Loading messages...</div>';

  await loadMessages(id,true);
  await markConversationRead(id);

  setupMessageRealtime(id);

  if (messagePoll) clearInterval(messagePoll);

  messagePoll = setInterval(() => {
    if (currentConversation?.id === id) {
      loadMessages(id,false);
    }
  },10000);
}

function renderMessages() {
  const area = $('messagesArea');

  if (!currentMessages.length) {
    area.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">✦</div>
        <h3>Say hello 👋</h3>
        <p>Your conversation starts here. Send the first message.</p>
      </div>`;
    return;
  }

  let previousDate = '';
  const output = [];

  currentMessages.forEach(m => {
    const date = new Date(m.created_at);
    const dateKey = date.toDateString();

    if (dateKey !== previousDate) {
      output.push(`<div class="date-label">${
        dateKey === new Date().toDateString()
          ? 'Today'
          : esc(date.toLocaleDateString(undefined,{
              month:'short',
              day:'numeric',
              year:'numeric'
            }))
      }</div>`);

      previousDate = dateKey;
    }

    const mine = m.sender_id === me.id;
    const messageText = m.deleted_at
      ? 'This message was deleted'
      : m.content;

    output.push(`
      <div class="message-row ${mine ? 'mine' : ''}"
        data-message="${esc(m.id)}">

        <div class="message-bubble">${esc(messageText)}</div>

        <div class="message-meta">
          ${ago(m.created_at)}
          ${mine ? '<span class="message-status">✓</span>' : ''}
        </div>
      </div>
    `);
  });

  area.innerHTML = output.join('');
  area.scrollTop = area.scrollHeight;
}

async function loadMessages(id,showLoading = false) {
  if (loadingMessages && showLoading) return;
  if (showLoading) loadingMessages = true;

  const {data,error} = await supabase
    .from('messages')
    .select('id,conversation_id,sender_id,content,created_at,deleted_at')
    .eq('conversation_id',id)
    .order('created_at',{ascending:true})
    .limit(300);

  if (showLoading) loadingMessages = false;

  if (error) {
    console.error('Load messages:',error);

    if (currentConversation?.id === id) {
      $('messagesArea').innerHTML =
        '<div class="panel-message">Could not load messages. Please retry.</div>';
    }
    return;
  }

  if (currentConversation?.id !== id) return;

  currentMessages = data || [];
  renderMessages();
}

async function markConversationRead(id) {
  const now = new Date().toISOString();

  const {error} = await supabase
    .from('conversation_members')
    .update({last_read_at:now})
    .eq('conversation_id',id)
    .eq('user_id',me.id);

  if (error) console.warn('Read status:',error.message);

  const c = conversations.find(item => item.id === id);
  if (c) c.lastReadAt = now;

  renderInbox();
}

function setupMessageRealtime(id) {
  if (realtimeMessages) {
    supabase.removeChannel(realtimeMessages);
    realtimeMessages = null;
  }

  realtimeMessages = supabase
    .channel('campusora-chat-' + id)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages',
      filter:`conversation_id=eq.${id}`
    },async payload => {
      if (currentConversation?.id !== id) return;

      if (!currentMessages.some(m => m.id === payload.new.id)) {
        currentMessages.push(payload.new);
        renderMessages();

        if (payload.new.sender_id !== me.id) {
          await markConversationRead(id);
        }

        await loadInbox();
      }
    })
    .subscribe();
}

/*
 * Detect Nigerian mobile numbers in common formats.
 * Examples:
 * 08012345678
 * 080 1234 5678
 * 080-1234-5678
 * +2348012345678
 * 2348012345678
 */
function containsPhoneNumber(text) {
  const candidates = String(text || '').match(
    /(?:\+?\d[\d\s().-]{8,}\d)/g
  ) || [];

  return candidates.some(candidate => {
    let digits = candidate.replace(/\D/g,'');

    if (digits.startsWith('234')) {
      digits = '0' + digits.slice(3);
    }

    if (
      digits.length === 11 &&
      /^0[789][01]\d{8}$/.test(digits)
    ) {
      return true;
    }

    return false;
  });
}

function checkMessageInput() {
  const text = $('messageInput').value;
  const restricted = containsPhoneNumber(text);

  $('sendBtn').disabled = restricted || !text.trim() || sending;
  $('phoneWarning').classList.toggle('show',restricted);

  return !restricted;
}

async function sendMessage(event) {
  event.preventDefault();

  if (sending || !currentConversation || !me) return;

  const input = $('messageInput');
  const content = input.value.trim();

  if (!content) return;

  if (!checkMessageInput()) {
    toast('Sharing phone numbers is currently restricted on Campusora.');
    return;
  }

  sending = true;
  $('sendBtn').disabled = true;

  const {data,error} = await supabase
    .from('messages')
    .insert({
      conversation_id:currentConversation.id,
      sender_id:me.id,
      content
    })
    .select('id,conversation_id,sender_id,content,created_at,deleted_at')
    .single();

  sending = false;

  if (error) {
    console.error('Send message:',error);
    toast('Message could not be sent. Check your connection.');
    checkMessageInput();
    return;
  }

  input.value = '';
  input.style.height = '42px';
  $('phoneWarning').classList.remove('show');
  $('sendBtn').disabled = false;

  if (!currentMessages.some(m => m.id === data.id)) {
    currentMessages.push(data);
    renderMessages();
  }

  await loadInbox();
  input.focus();
}

function setupInboxRealtime() {
  if (realtimeInbox) {
    supabase.removeChannel(realtimeInbox);
  }

  realtimeInbox = supabase
    .channel('campusora-inbox-' + me.id)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'messages'
    },payload => {
      if (conversations.some(
        c => c.id === payload.new.conversation_id
      )) {
        loadInbox();
      }
    })
    .subscribe();
}

function setupEvents() {
  $('conversationList').addEventListener('click',async event => {
    const button = event.target.closest('[data-conversation]');
    if (!button) return;

    await openConversation(button.dataset.conversation);
  });

  document.querySelectorAll('[data-inbox-filter]').forEach(button => {
    button.addEventListener('click',() => {
      currentFilter = button.dataset.inboxFilter;

      document.querySelectorAll('[data-inbox-filter]').forEach(tab => {
        tab.classList.toggle('active',tab === button);
      });

      renderInbox();
    });
  });

  $('messageForm').addEventListener('submit',sendMessage);

  $('messageInput').addEventListener('input',event => {
    const input = event.target;
    input.style.height = '42px';
    input.style.height = Math.min(input.scrollHeight,120) + 'px';
    checkMessageInput();
  });

  $('messageInput').addEventListener('keydown',event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      $('messageForm').requestSubmit();
    }
  });

  $('backBtn').addEventListener('click',() => {
    $('messaging').classList.remove('chat-open');
  });

  $('refreshBtn').addEventListener('click',async () => {
    if (currentConversation) {
      await loadMessages(currentConversation.id,true);
    }

    await loadInbox();
    toast('Messages refreshed');
  });
}

async function startConversation(userId) {
  if (!userId || userId === me.id) {
    toast('You cannot message yourself.');
    return false;
  }

  const {data:conversationId,error} = await supabase.rpc(
    'start_direct_conversation',
    {target_user_id:userId}
  );

  if (error || !conversationId) {
    console.error('Start conversation:',error);
    toast(error?.message || 'Could not open conversation.');
    return false;
  }

  await loadInbox();

  const conversation = conversations.find(
    c => String(c.id) === String(conversationId)
  );

  if (!conversation) {
    toast('Conversation could not be loaded. Check permissions.');
    return false;
  }

  await openConversation(conversation.id);
  return true;
}

async function initialize() {
  setupEvents();

  const {data,error} = await supabase.auth.getUser();

  if (error || !data?.user) {
    $('conversationList').innerHTML = `
      <div class="panel-message">
        Sign in to use Campusora messages.<br><br>
        <a href="auth.html" style="color:#b8a2ff">Sign in →</a>
      </div>`;

    $('welcomeState').querySelector('h3').textContent =
      'Sign in to connect';

    $('welcomeState').querySelector('p').textContent =
      'Sign in to message students, alumni, and other Campusora members.';

    $('messageForm').hidden = true;
    return;
  }

  me = data.user;

  await loadInbox();
  setupInboxRealtime();

  const params = new URLSearchParams(window.location.search);
  const targetUserId = params.get('user');
  const productName = params.get('product');

  if (targetUserId) {
    if (targetUserId === me.id) {
      toast('You cannot message yourself.');
    } else {
      const opened = await startConversation(targetUserId);

      if (opened && productName) {
        const input = $('messageInput');

        if (!input.value.trim()) {
          input.value =
            `Hi! I'm interested in your product "${productName}". Is it still available?`;

          input.focus();
          checkMessageInput();
        }
      }
    }

    window.history.replaceState({},'',window.location.pathname);
  }

  refreshInterval = setInterval(async () => {
    await loadInbox();

    if (currentConversation) {
      await loadMessages(currentConversation.id);
    }
  },30000);
}

window.addEventListener('beforeunload',() => {
  if (realtimeMessages) supabase.removeChannel(realtimeMessages);
  if (realtimeInbox) supabase.removeChannel(realtimeInbox);
  if (messagePoll) clearInterval(messagePoll);
  if (refreshInterval) clearInterval(refreshInterval);
});

initialize().catch(error => {
  console.error('Campusora messages initialization failed:',error);
  toast('Messages could not be initialized. Please refresh.');
});
</script>
