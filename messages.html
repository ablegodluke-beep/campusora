<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Chats | Campusora</title>
<link rel="stylesheet" href="./shared-nav.css">

<style>
:root{
--bg:#080b18;
--panel:#101426;
--panel2:#171d33;
--border:#252d48;
--text:#fff;
--muted:#929bb7;
--purple:#9065ff;
--blue:#548bff;
--cyan:#38d9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
background:var(--bg);
color:var(--text);
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
font-size:13px;
min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:none;margin:0;padding:0}
.messaging{
height:100dvh;
min-height:0;
display:grid;
grid-template-columns:310px minmax(0,1fr);
background:var(--panel);
border:1px solid var(--border);
border-radius:16px;
overflow:hidden;
box-shadow:0 15px 50px #0003;
}
.inbox{
min-width:0;
display:flex;
flex-direction:column;
border-right:1px solid var(--border);
}
.inbox-head{
padding:19px 16px 12px;
border-bottom:1px solid var(--border);
}
.inbox-title{font-size:19px;font-weight:800}
.inbox-count{color:var(--muted);font-size:11px;margin-left:5px}
.inbox-tabs{display:flex;gap:20px;margin-top:17px}
.inbox-tab{
background:none;
border:0;
color:var(--muted);
padding:7px 0;
font-size:12px;
font-weight:700;
position:relative;
}
.inbox-tab.active{color:#c8b7ff}
.inbox-tab.active:after{
content:"";
position:absolute;
left:0;right:0;bottom:-1px;
height:2px;
border-radius:5px;
background:linear-gradient(90deg,var(--purple),var(--blue));
}
.conversation-list{flex:1;min-height:0;overflow:auto}
.conversation{
width:100%;
display:flex;
align-items:center;
gap:11px;
padding:13px 14px;
border:0;
border-bottom:1px solid #202842;
background:transparent;
color:white;
text-align:left;
}
.conversation:hover{background:#171d32}
.conversation.active{background:#272044}
.avatar{
width:45px;height:45px;
flex-shrink:0;
border-radius:50%;
display:grid;
place-items:center;
overflow:hidden;
background:linear-gradient(135deg,#7952ee,#2689ee);
border:1px solid #51477c;
color:white;
font-weight:800;
font-size:14px;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.conv-main{flex:1;min-width:0}
.conv-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:6px;
}
.conv-name{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:5px;
font-size:12px;
font-weight:800;
min-width:0;
}
.conv-time{color:#78819e;font-size:9px;white-space:nowrap}
.conv-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:7px;
margin-top:5px;
}
.conv-preview{
color:#aab3ce;
font-size:11px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}
.unread-count{
min-width:18px;height:18px;
padding:0 5px;
display:grid;
place-items:center;
border-radius:20px;
background:linear-gradient(135deg,var(--purple),var(--blue));
color:white;
font-size:10px;
font-weight:800;
}
.role-badge{
display:inline-flex;
align-items:center;
gap:3px;
padding:3px 7px;
border-radius:20px;
font-size:9px;
line-height:1;
font-weight:800;
white-space:nowrap;
border:1px solid #51427d;
background:#30234d;
color:#d4c4ff;
}
.role-badge.student{background:#172d50;border-color:#315b91;color:#9bc8ff}
.role-badge.alumni{background:#253a31;border-color:#39745b;color:#8de7b8}
.role-badge.general{background:#30234d;border-color:#51427d;color:#d4c4ff}
.chat{
min-width:0;
display:flex;
flex-direction:column;
position:relative;
}
.chat-head{
min-height:70px;
padding:10px 16px;
display:flex;
align-items:center;
gap:11px;
border-bottom:1px solid var(--border);
}
.back-btn{
display:flex;
align-items:center;
justify-content:center;
width:22px;height:28px;
flex-shrink:0;
padding:0;
border:0;
background:none;
color:white;
font-size:20px;
}
.chat-avatar-link{display:block;flex-shrink:0;border-radius:50%}
.chat-avatar-link .avatar{width:43px;height:43px}
.chat-person{flex:1;min-width:0}
.chat-name-link{
display:inline-flex;
align-items:center;
flex-wrap:wrap;
gap:7px;
color:white;
font-size:13px;
font-weight:800;
}
.chat-name-link:hover{color:#c8b7ff}
.chat-status{color:var(--muted);font-size:10px;margin-top:4px}
.chat-tools{
display:flex;
align-items:center;
gap:5px;
flex-shrink:0;
}

.chat-tools button{
width:30px;
height:30px;
display:grid;
place-items:center;
border:1px solid var(--border);
border-radius:9px;
background:var(--panel2);
color:white;
font-size:14px;
padding:0;
}
  .call-picker{
  position:absolute;
  top:62px;
  right:12px;
  z-index:100;
  width:220px;
  padding:15px;
  border:1px solid #514477;
  border-radius:17px;
  background:linear-gradient(145deg,#1b2040,#111629);
  box-shadow:0 15px 45px #0009;
  animation:pop .18s ease;
}

.call-picker[hidden]{display:none}

.call-picker h3{
  font-size:14px;
  margin-bottom:5px;
}

.call-picker p{
  color:var(--muted);
  font-size:10px;
  margin-bottom:13px;
}

.call-choice{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  margin-top:8px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#202943;
  color:white;
  text-align:left;
}

.call-choice:hover{
  border-color:var(--purple);
  background:#292448;
}

.call-choice-icon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#392b62;
  font-size:17px;
}

.call-choice strong{
  display:block;
  font-size:12px;
}

.call-choice small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.call-picker-close{
  position:absolute;
  top:10px;
  right:11px;
  border:0;
  background:none;
  color:#aeb6ce;
  font-size:19px;
}
.messages-area{
flex:1;
min-height:0;
overflow-y:auto;
padding:18px;
display:flex;
flex-direction:column;
gap:10px;
background:radial-gradient(ellipse at 50% 0%,#29204a30,transparent 65%);
}
.date-label{text-align:center;color:#8992ad;font-size:10px;margin:8px 0}
.message-row{
display:flex;
flex-direction:column;
align-items:flex-start;
max-width:82%;
animation:pop .18s ease;
}
.message-row.mine{align-self:flex-end;align-items:flex-end}
.message-bubble{
padding:10px 13px;
border:1px solid #303956;
border-radius:14px 14px 14px 4px;
background:#202943;
color:#fff;
font-size:13px;
line-height:1.55;
overflow-wrap:anywhere;
white-space:pre-wrap;
}
.message-row.mine .message-bubble{
background:linear-gradient(135deg,#6340a5,#365cbb);
border-color:#7554c4;
border-radius:14px 14px 4px 14px;
}
.message-row.pending .message-bubble{
border:1px dashed #e5a64b;
background:#3a2b22;
}
.message-meta{
display:flex;
gap:5px;
align-items:center;
margin:4px 4px 0;
color:#8992ad;
font-size:9px;
}
.message-status{color:var(--cyan)}
.pending-status{color:#ffc16a}
  .pending-premium-card{
  width:min(310px,calc(100% - 8px));
  margin:9px 0 5px auto;
  padding:13px;
  border:1px solid #59458f;
  border-radius:14px;
  background:linear-gradient(145deg,#211a3b,#151d35 75%);
  box-shadow:0 8px 24px #0003;
}

.message-row:not(.mine) .pending-premium-card{
  margin-left:0;
  margin-right:auto;
}
  .reply-preview-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 13px;
  background:#191d35;
  border-top:1px solid var(--border);
  border-left:3px solid var(--purple);
}
.reply-preview-bar[hidden]{display:none}
.reply-preview-bar div{min-width:0;display:flex;flex-direction:column;gap:3px}
.reply-preview-bar strong{font-size:10px;color:#c8b7ff}
.reply-preview-bar span{font-size:11px;color:#aab3ce;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-preview-bar button{border:0;background:none;color:white;font-size:20px}
.message-reply-context{
  padding:7px 9px;
  margin-bottom:7px;
  border-left:3px solid #b49aff;
  background:#101426;
  border-radius:6px;
  font-size:10px;
  color:#c5cce0;
}
.message-media{
  display:block;
  max-width: min(260px, 100%);
  max-height:300px;
  border-radius:10px;
  margin-top:5px;
}
.message-media video{width:100%;max-height:300px;border-radius:10px}

.pending-premium-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  font-size:12px;
  font-weight:800;
  color:#fff;
}

.pending-premium-icon{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#39295e;
  color:#d5c4ff;
  font-size:15px;
}

.pending-premium-card p{
  font-size:10px;
  line-height:1.6;
  color:#c2c8dc;
  margin:0 0 11px;
}

.pending-premium-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:7px;
}

.pending-premium-actions button{
  width:100%;
  padding:10px 11px;
  border:1px solid #65519a;
  border-radius:9px;
  background:linear-gradient(110deg,#7650d9,#426ee5);
  color:#fff;
  font-size:11px;
  font-weight:800;
  text-align:left;
}

.pending-premium-actions button.secondary{
  background:#202943;
  border-color:#394766;
}

.pending-premium-actions button:disabled{
  opacity:.5;
  cursor:wait;
}
.message-actions{position:relative;display:flex;align-items:center;gap:5px}
.message-menu-button{
border:0;
background:transparent;
color:#aab3ce;
font-size:17px;
padding:0 4px;
}
.message-menu{
position:absolute;
right:0;bottom:22px;
z-index:20;
width:145px;
padding:5px;
background:#202943;
border:1px solid #3b4565;
border-radius:10px;
box-shadow:0 8px 25px #0008;
}
.message-menu button{
display:block;
width:100%;
padding:9px;
border:0;
border-radius:7px;
background:transparent;
color:white;
text-align:left;
font-size:11px;
}
.message-menu button:hover{background:#343c5b}
.message-menu .delete-option{color:#ff8585}
.chat-empty{
flex:1;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:25px;
}
.chat-empty-icon{
width:55px;height:55px;
border-radius:18px;
display:grid;
place-items:center;
background:#211b3a;
border:1px solid #45376c;
color:#c4adff;
font-size:24px;
margin-bottom:14px;
}
.chat-empty h3{font-size:15px;margin-bottom:7px}
.chat-empty p{
max-width:260px;
color:var(--muted);
font-size:11px;
line-height:1.7;
}
.composer{
padding:12px;
display:flex;
align-items:flex-end;
gap:9px;
background:#101426;
border-top:1px solid var(--border);
}
.composer textarea{
flex:1;
min-width:0;
min-height:42px;
max-height:120px;
resize:none;
border:1px solid #303956;
border-radius:13px;
background:#1a2138;
color:white;
padding:12px;
outline:none;
font-size:13px;
line-height:1.4;
}
.composer textarea::placeholder{color:#8992ad}
.composer textarea:focus{border-color:#8061df}
  .composer-tool{
width:38px;
height:42px;
flex-shrink:0;
border:1px solid var(--border);
border-radius:12px;
background:#1a2138;
color:#c8b7ff;
font-size:17px;
display:grid;
place-items:center;
}

.composer-tool:disabled{
opacity:.45;
}
.send-btn{
width:42px;height:42px;
flex-shrink:0;
border:0;
border-radius:13px;
background:linear-gradient(135deg,var(--purple),var(--blue));
color:white;
font-size:18px;
}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.phone-warning{
display:none;
padding:0 13px 10px;
background:#101426;
color:#ffb6b6;
font-size:10px;
font-style:italic;
line-height:1.5;
}
.phone-warning.show{display:block}
.panel-message{
padding:24px 14px;
text-align:center;
color:var(--muted);
font-size:11px;
line-height:1.7;
}
.toast{
position:fixed;
bottom:25px;left:50%;
transform:translate(-50%,12px);
background:#25223a;
border:1px solid #51417e;
color:white;
padding:11px 15px;
border-radius:11px;
font-size:11px;
z-index:9999;
opacity:0;
pointer-events:none;
transition:.2s;
max-width:calc(100% - 28px);
text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{
position:fixed;
inset:0;
z-index:5000;
display:none;
align-items:center;
justify-content:center;
padding:18px;
background:#000b;
}
.modal-backdrop.show{display:flex}
.premium-modal{
width:min(100%,390px);
padding:22px;
border:1px solid #493d75;
border-radius:18px;
background:#11162b;
box-shadow:0 20px 70px #0009;
}
.premium-modal h2{font-size:19px;margin-bottom:8px}
.premium-modal p{
color:var(--muted);
font-size:12px;
line-height:1.6;
margin-bottom:17px;
}
.premium-plan{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:14px;
margin-top:9px;
border:1px solid #39415f;
border-radius:12px;
background:#1b2340;
color:white;
text-align:left;
}
.premium-plan:hover{border-color:var(--purple);background:#292044}
.premium-plan strong{font-size:13px}
.premium-plan span{color:#c6b5ff;font-weight:800;font-size:13px}
.modal-cancel{
width:100%;
margin-top:12px;
padding:11px;
border:1px solid #39415f;
border-radius:10px;
background:transparent;
color:#aab3ce;
}
@keyframes pop{
from{opacity:0;transform:translateY(4px)}
to{opacity:1;transform:translateY(0)}
}
@media(max-width:800px){
.page{padding:0}
.messaging{grid-template-columns:260px minmax(0,1fr)}
}
@media(max-width:560px){
html,body{
width:100%;
height:100%;
min-height:0;
margin:0;
padding:0;
overflow:hidden;
}
.page{width:100%;height:100%;margin:0;padding:0}
.messaging{
position:fixed;
top:var(--visual-viewport-top,0px);
left:0;right:0;
width:100%;
height:var(--visual-viewport-height,100dvh);
min-height:0;
display:block;
margin:0;
padding:0;
border:0;
border-radius:0;
overflow:hidden;
}
.inbox{height:100%;border:0}
.inbox-head{padding:15px 15px 10px}
.conversation{padding:13px 14px}
.chat{display:none;height:100%;width:100%}
.messaging.chat-open .inbox{display:none}
.messaging.chat-open .chat{display:flex}
.back-btn{display:flex}
.chat-head{min-height:64px;padding:9px 10px}
.messages-area{padding:14px 11px;flex:1 1 auto;min-height:0;overflow-y:auto}
.message-row{max-width:88%}
.composer{padding:9px;flex:0 0 auto}
.phone-warning{flex:0 0 auto}
}
body.has-shared-nav:not(.chat-mode) .page{
width:100%;
height:calc(100dvh - 49px);
margin:0;
padding:0;
}
body.has-shared-nav:not(.chat-mode) .messaging{
position:relative;
width:100%;
height:calc(100dvh - 125px);
min-height:0;
margin:0;
border-radius:0;
}
body.chat-mode{
overflow:hidden!important;
}
body.chat-mode .campusora-topnav,
body.chat-mode .campusora-mainnav,
body.chat-mode .campusora-create-overlay{
display:none!important;
}
body.chat-mode .page{
width:100%;
height:100%;
margin:0;
padding:0;
}
body.chat-mode .messaging{
position:fixed;
top:var(--visual-viewport-top,0px);
left:0;right:0;
bottom:auto;
width:100%;
height:var(--visual-viewport-height,100dvh);
min-height:0;
margin:0;
padding:0;
border:0;
border-radius:0;
overflow:hidden;
z-index:10001;
}
body.chat-mode .chat{
display:flex;
flex-direction:column;
width:100%;
height:100%;
min-height:0;
overflow:hidden;
}
body.chat-mode .chat-head{
display:flex;
flex:0 0 auto;
min-height:64px;
padding:9px 10px;
position:relative;
z-index:5;
}
body.chat-mode .messages-area{
flex:1 1 0;
min-height:0;
overflow-y:auto;
overscroll-behavior:contain;
}
body.chat-mode .composer{
flex:0 0 auto;
order:3;
margin:0;
padding:9px;
padding-bottom:max(9px,env(safe-area-inset-bottom));
position:relative;
z-index:5;
}
body.chat-mode .phone-warning{flex:0 0 auto;order:2}
@media(max-width:560px){
body.has-shared-nav:not(.chat-mode) .messaging{display:block}
body.has-shared-nav:not(.chat-mode) .inbox{height:100%}
body.chat-mode .chat-head{min-height:64px}
body.chat-mode .messages-area{padding:12px 10px}
}
  .call-backdrop{
  position:fixed;
  inset:0;
  z-index:20000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#050713ed;
}
.call-backdrop[hidden]{display:none}
.call-card{
  width:min(100%,430px);
  padding:17px;
  border:1px solid #514477;
  border-radius:20px;
  background:#111629;
  box-shadow:0 20px 70px #000b;
}
.call-card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}
.call-card-head strong{font-size:16px}
.call-card-head p{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}
.call-card-head button{
  border:0;
  background:none;
  color:white;
  font-size:25px;
}
.call-video-stage{
  position:relative;
  width:100%;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:15px;
  background:#080b18;
}
#remoteCallVideo{
  width:100%;
  height:300px;
  object-fit:contain;
}
#localCallVideo{
  position:absolute;
  right:10px;
  bottom:10px;
  width:95px;
  height:125px;
  object-fit:cover;
  border:2px solid #a58aff;
  border-radius:12px;
  background:#202943;
}
.call-audio-avatar{
  position:absolute;
  width:75px;
  height:75px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#30234d;
  font-size:28px;
}
.call-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:17px;
}
.call-actions[hidden]{display:none}
.call-actions button{
  flex:1;
  padding:12px 8px;
  border:1px solid #394766;
  border-radius:12px;
  background:#202943;
  color:white;
  font-size:11px;
  font-weight:800;
}
.call-actions .call-accept{
  background:#238c60;
  border-color:#238c60;
}
.call-actions .call-decline{
  background:#b83d55;
  border-color:#b83d55;
}
</style>
</head>

<body>
<div class="page">
<main class="messaging" id="messaging">

<section class="inbox">
<div class="inbox-head">
<h1 class="inbox-title">
Chats <span class="inbox-count" id="totalCount"></span>
</h1>
<div class="inbox-tabs">
<button class="inbox-tab active" data-inbox-filter="all">Messages</button>
<button class="inbox-tab" data-inbox-filter="unread">Message Requests</button>
</div>
</div>

<div class="conversation-list" id="conversationList">
<div class="panel-message">Your conversations will appear here.</div>
</div>
</section>

<section class="chat" id="chatPanel">

let callRealtime=null;
let callRealtimeReady=Promise.resolve();
let activeCall=null;
let incomingCall=null;
let liveKitRoom=null;
let connectingCallId=null;
let callEnding=false;
let callRingTimeout=null;
let callResultTimeout=null;  

function showCallScreen(title,status){
  $('callOverlay').hidden=false;
  $('callTitle').textContent=title;
  $('callStatus').textContent=status;
}

function hideCallScreen(){
  $('callOverlay').hidden=true;
  $('incomingCallActions').hidden=true;
  $('activeCallActions').hidden=true;
  $('remoteCallVideo').srcObject=null;
  $('localCallVideo').srcObject=null;
  $('callAudioSink').innerHTML='';
  $('callAudioAvatar').hidden=false;
}

function setupCallRealtime(){
  if(!me?.id)return;

  if(callRealtime)supabase.removeChannel(callRealtime);

  callRealtimeReady=new Promise(resolve=>{
    callRealtime=supabase
      .channel('campusora-calls-'+me.id)
      .on('postgres_changes',{
        event:'*',
        schema:'public',
        table:'call_invitations'
      },payload=>{
        handleCallUpdate(payload.new);
      })
      .subscribe(status=>{
        if(status==='SUBSCRIBED')resolve(true);
      });

    setTimeout(()=>resolve(false),10000);
  });
}

async function handleCallUpdate(call){
  if(!call||!me?.id)return;
if(
  call.receiver_id===me.id&&
  call.status==='ringing'&&
  new Date(call.expires_at)>new Date()&&
  !activeCall&&
  !incomingCall
){
    incomingCall=call;

    const {data}=await supabase
      .from('profiles')
      .select('id,username,full_name,avatar_url,school')
      .eq('id',call.caller_id)
      .maybeSingle();

    const callerName=data?.full_name||data?.username||'Campusora member';

    $('callTitle').textContent=callerName;
    $('callStatus').textContent=
      call.call_type==='video'
      ?'Incoming video call...'
      :'Incoming audio call...';

    $('incomingCallActions').hidden=false;
    $('activeCallActions').hidden=true;
    $('callOverlay').hidden=false;
    $('callAudioAvatar').hidden=false;

    return;
  }

  if(
    activeCall&&
    call.id===activeCall.id
  ){
    if(call.status==='accepted'){
  if(callRingTimeout){
    clearTimeout(callRingTimeout);
    callRingTimeout=null;
  }

  connectLiveKitCall(call);
}
if(
  ['declined','cancelled','missed','ended'].includes(call.status)
){
  if(callRingTimeout){
    clearTimeout(callRingTimeout);
    callRingTimeout=null;
  }

  if(callResultTimeout){
    clearTimeout(callResultTimeout);
  }

  let resultMessage='Call ended.';

  if(call.status==='declined'){
    resultMessage='Call declined.';
  }else if(call.status==='missed'){
    resultMessage='No answer. Call missed.';
  }else if(call.status==='cancelled'){
    resultMessage='Call cancelled.';
  }

  $('callStatus').textContent=resultMessage;

  $('incomingCallActions').hidden=true;
  $('activeCallActions').hidden=true;

  toast(resultMessage);

  callResultTimeout=setTimeout(()=>{
    if(activeCall?.id===call.id){
      finishCall(false);
    }
  },2200);
}
  }
}

async function startCampusoraCall(callType){
  if(!me?.id||!currentConversation){
    toast('Open a conversation first.');
    return;
  }

  if(currentConversation.is_group){
    toast('Calls are currently available for one-to-one chats.');
    return;
  }

  if(activeCall||incomingCall){
    toast('You already have an active call.');
    return;
  }

  const receiverId=currentConversation.otherUserId;

  if(!receiverId||receiverId===me.id){
    toast('This member cannot receive the call.');
    return;
  }

  await callRealtimeReady;

  const {data,error}=await supabase
    .from('call_invitations')
    .insert({
      conversation_id:currentConversation.id,
      caller_id:me.id,
      receiver_id:receiverId,
      call_type:callType,
      status:'ringing'
    })
    .select('*')
    .single();

  if(error||!data){
    console.error('Call invitation:',error);
    toast('Could not start the call. Please try again.');
    return;
  }

  activeCall=data;
callEnding=false;

if(callRingTimeout)clearTimeout(callRingTimeout);

callRingTimeout=setTimeout(async()=>{
  if(!activeCall||activeCall.id!==data.id)return;

  const {data:missedData,error:missedError}=await supabase
    .from('call_invitations')
    .update({status:'missed'})
    .eq('id',data.id)
    .eq('status','ringing')
    .select('id,status')
    .maybeSingle();

  if(missedError){
    console.warn('Missed call update:',missedError);
  }

  if(missedData?.status==='missed'){
    await handleCallUpdate({
      ...data,
      status:'missed'
    });
  }
},45000);

  showCallScreen(
    currentOtherUser?.full_name||
    currentOtherUser?.username||
    'Campusora member',
    callType==='video'?'Calling...':'Audio calling...'
  );

  $('incomingCallActions').hidden=true;
  $('activeCallActions').hidden=true;
  $('callAudioAvatar').hidden=false;
}

async function acceptCampusoraCall(){
  if(!incomingCall)return;

  const call=incomingCall;
  activeCall=call;
  incomingCall=null;

  $('incomingCallActions').hidden=true;
  $('callStatus').textContent='Connecting...';

  const {data,error}=await supabase
    .from('call_invitations')
    .update({
      status:'accepted',
      answered_at:new Date().toISOString()
    })
    .eq('id',call.id)
    .eq('status','ringing')
    .select('*')
    .maybeSingle();

  if(error||!data){
    console.error('Accept call:',error);
    activeCall=null;
    hideCallScreen();
    toast('This call is no longer available.');
    return;
  }

  activeCall=data;
  connectLiveKitCall(data);
}

async function declineCampusoraCall(){
  if(!incomingCall)return;

  const call=incomingCall;
  incomingCall=null;

  await supabase
    .from('call_invitations')
    .update({status:'declined'})
    .eq('id',call.id)
    .eq('status','ringing');

  hideCallScreen();
}

async function connectLiveKitCall(call){
 if(!call||connectingCallId===call.id||liveKitRoom)return;

  connectingCallId=call.id;
  activeCall=call;

  try{
    if(!window.LivekitClient){
      throw new Error('Calling library did not load. Refresh the page.');
    }

    const {data:sessionData}=await supabase.auth.getSession();
    const accessToken=sessionData?.session?.access_token;

    if(!accessToken){
      throw new Error('Your login session has expired.');
    }

    $('callStatus').textContent='Preparing secure connection...';

    const response=await fetch('/api/livekit/token',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+accessToken
      },
      body:JSON.stringify({
        conversation_id:call.conversation_id,
        call_invitation_id:call.id
      })
    });

    const tokenData=await response.json();

    if(!response.ok){
      throw new Error(tokenData.error||'Could not connect the call.');
    }

    const room=new LivekitClient.Room({
      adaptiveStream:true,
      dynacast:true
    });

    liveKitRoom=room;

    room.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      (track)=>{
        if(track.kind==='video'){
          const element=track.attach();
          $('remoteCallVideo').replaceWith(element);
          element.id='remoteCallVideo';
          element.autoplay=true;
          element.playsInline=true;
          $('callAudioAvatar').hidden=true;
        }

        if(track.kind==='audio'){
          const element=track.attach();
          $('callAudioSink').appendChild(element);
          element.play().catch(()=>{});
        }
      }
    );

    room.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      (track)=>{
        track.detach().forEach(element=>element.remove());
      }
    );

    room.on(
      LivekitClient.RoomEvent.Disconnected,
      ()=>{
        if(activeCall?.id===call.id){
          finishCall(false);
        }
      }
    );

    await room.connect(
      tokenData.server_url,
      tokenData.participant_token
    );

    if(call.call_type==='video'){
      await room.localParticipant.enableCameraAndMicrophone();

      const cameraTrack=room.localParticipant
        .getTrackPublication(
          LivekitClient.Track.Source.Camera
        )?.track;

      if(cameraTrack){
        const element=cameraTrack.attach();
        $('localCallVideo').replaceWith(element);
        element.id='localCallVideo';
        element.muted=true;
        element.autoplay=true;
        element.playsInline=true;
      }
    }else{
      await room.localParticipant.setMicrophoneEnabled(true);
      $('localCallVideo').hidden=true;
    }

    $('callStatus').textContent='Connected';
    $('incomingCallActions').hidden=true;
    $('activeCallActions').hidden=false;

  }catch(error){
    console.error('LiveKit connection:',error);
    toast(error.message||'Call connection failed.');
    await finishCall(true);
  }finally{
    connectingCallId=null;
  }
}

async function finishCall(updateDatabase=true){
  if(callEnding)return;
callEnding=true;
  
if(callRingTimeout){
  clearTimeout(callRingTimeout);
  callRingTimeout=null;
}

if(callResultTimeout){
  clearTimeout(callResultTimeout);
  callResultTimeout=null;
}

  const call=activeCall||incomingCall;

  activeCall=null;
  incomingCall=null;
  connectingCallId=null;

  if(liveKitRoom){
    try{
      await liveKitRoom.disconnect();
    }catch(error){
      console.warn('Call disconnect:',error);
    }
    liveKitRoom=null;
  }

  if(updateDatabase&&call?.id){
    await supabase
      .from('call_invitations')
      .update({
        status:'ended',
        ended_at:new Date().toISOString()
      })
      .eq('id',call.id)
      .in('status',['ringing','accepted']);
  }

  hideCallScreen();
  callEnding=false;
}
function withTimeout(promise,ms,label){
let timer;
return Promise.race([
Promise.resolve(promise),
new Promise((resolve,reject)=>{
timer=setTimeout(()=>reject(new Error(label||'Request timed out')),ms);
})
]).finally(()=>clearTimeout(timer));
}

function esc(value){
return String(value??'').replace(/[&<>"']/g,char=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[char]));
}

let campusoraChatDBPromise=null;

function openCampusoraChatDB(){
if(campusoraChatDBPromise)return campusoraChatDBPromise;
campusoraChatDBPromise=new Promise((resolve,reject)=>{
if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}
const request=indexedDB.open('campusora-chat-history',1);
request.onupgradeneeded=event=>{
const db=event.target.result;
if(!db.objectStoreNames.contains('chats')){
db.createObjectStore('chats',{keyPath:'key'});
}
};
request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
return campusoraChatDBPromise;
}

async function saveChatCacheToDB(id,messages){
if(!me||!id||!Array.isArray(messages))return;
try{
const db=await openCampusoraChatDB();
await new Promise((resolve,reject)=>{
const tx=db.transaction('chats','readwrite');
tx.objectStore('chats').put({
key:`${me.id}_${id}`,
user_id:me.id,
conversation_id:id,
messages:messages.slice(-100),
updated_at:Date.now()
});
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
tx.onabort=()=>reject(tx.error);
});
}catch(error){console.warn('IndexedDB chat save:',error);}
}

async function restoreChatCacheFromDB(id){
if(!me||!id)return null;
try{
const db=await openCampusoraChatDB();
const result=await new Promise((resolve,reject)=>{
const tx=db.transaction('chats','readonly');
const request=tx.objectStore('chats').get(`${me.id}_${id}`);
request.onsuccess=()=>resolve(request.result||null);
request.onerror=()=>reject(request.error);
});
if(result&&result.user_id===me.id&&Array.isArray(result.messages)){
return result.messages;
}
}catch(error){console.warn('IndexedDB chat restore:',error);}
return null;
}

function saveChatCache(id,messages=currentMessages){
if(!id||!Array.isArray(messages))return;
const safe=messages.slice(-100);
try{
const key=chatCacheKey(id);
if(key)localStorage.setItem(key,JSON.stringify(safe));
}catch(error){console.warn('Local chat save:',error);}
saveChatCacheToDB(id,safe);
}

function restoreChatCache(id){
try{
const key=chatCacheKey(id);
if(!key)return null;
const saved=localStorage.getItem(key);
if(!saved)return null;
const messages=JSON.parse(saved);
return Array.isArray(messages)?messages:null;
}catch(error){console.warn('Local chat restore:',error);return null;}
}

return name.trim().split(/\s+/).filter(Boolean).slice(0,2)
.map(p=>p[0]).join('').toUpperCase()||'C';
}

function profileName(profile){

function profileURL(profile,fallbackId=null){

function roleBadge(role){

if(value.includes('student'))return '<span class="role-badge student">Student</span>';

function toast(message){
const el=$('toast');
el.textContent=message;
el.classList.add('show');
clearTimeout(toast.timer);
toast.timer=setTimeout(()=>el.classList.remove('show'),3000);
}
function ago(value){
if(!value)return '';
const date=new Date(value);
const sec=Math.max(0,Math.floor((Date.now()-date.getTime())/1000));
if(sec<60)return 'now';
if(sec<3600)return Math.floor(sec/60)+'m';
if(sec<86400)return Math.floor(sec/3600)+'h';
if(sec<604800)return Math.floor(sec/86400)+'d';
return date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function unreadCount(conversation){
if(!conversation.lastMessage)return 0;
return conversation.lastMessage.sender_id!==me.id&&
(!conversation.lastReadAt||
new Date(conversation.lastMessage.created_at)>new Date(conversation.lastReadAt))?1:0;
}
  async function getProfiles(ids){
const unique=[...new Set(ids.filter(Boolean))];
const missing=unique.filter(id=>!profileCache.has(id));
if(!missing.length)return;
try{
const {data,error}=await withTimeout(
supabase.from('profiles')
.select('id,username,full_name,avatar_url,school,role')
.in('id',missing),
8000,
'Profile request timed out'
);
if(error){console.warn('Profile lookup:',error.message);return;}
(data||[]).forEach(p=>profileCache.set(p.id,p));
}catch(error){console.warn('Profile lookup:',error);}
}

async function preloadInboxChats(items,loadToken){
const ownerId=me?.id;
if(!ownerId||!items.length)return;

const queue=items.filter(c=>{
const readyKey=`campusora_chat_ready_${ownerId}_${c.id}`;
let ready=null;
try{ready=JSON.parse(localStorage.getItem(readyKey)||'null');}catch(e){}
const cached=restoreChatCache(c.id);
const cachedLastId=cached?.length?cached[cached.length-1].id:null;
const inboxLastId=c.lastMessage?.id||null;
return !(ready&&cached!==null&&ready.latestId===cachedLastId&&
(!inboxLastId||ready.latestId===inboxLastId));
});

if(!queue.length)return;

const results=new Map();
let nextIndex=0;

async function worker(){
while(nextIndex<queue.length){
const c=queue[nextIndex++];
if(me?.id!==ownerId)return;
try{
const {data,error}=await withTimeout(
supabase.from('messages')
.select('id,conversation_id,sender_id,content,created_at,deleted_at')
.eq('conversation_id',c.id)
.is('deleted_at',null)
.order('created_at',{ascending:false})
.limit(100),
10000,
'Chat preload timed out'
);
if(error){console.warn('Chat preload:',error);continue;}
const messages=(data||[]).reverse();
if(!messages.length&&c.lastMessage)continue;

saveChatCache(c.id,messages);

localStorage.setItem(
`campusora_chat_ready_${ownerId}_${c.id}`,
JSON.stringify({latestId:messages.length?messages[messages.length-1].id:null})
);
results.set(c.id,messages);
}catch(error){console.warn('Chat preload error:',error);}
}
}

await Promise.all(Array.from({length:Math.min(6,queue.length)},()=>worker()));

if(me?.id!==ownerId||loadToken!==window.campusoraInboxToken||!results.size)return;

conversations=conversations.map(c=>{
if(!results.has(c.id))return c;
const messages=results.get(c.id);
return {...c,lastMessage:messages.length?messages[messages.length-1]:null};
});
conversations.sort((a,b)=>
new Date(b.lastMessage?.created_at||b.created_at)-
new Date(a.lastMessage?.created_at||a.created_at)
);
renderInbox();
saveInboxCache();
}

async function loadInbox(){
if(!me?.id)return;

const loadToken=(window.campusoraInboxToken||0)+1;
window.campusoraInboxToken=loadToken;
const ownerId=me.id;

// The saved inbox remains visible while all network requests run.
try{
const {data:preparedInbox,error:preparedError}=await withTimeout(
supabase.rpc('get_my_inbox_previews'),
4500,
'Inbox preview timed out'
);

if(!preparedError&&Array.isArray(preparedInbox)&&
loadToken===window.campusoraInboxToken&&me?.id===ownerId){

conversations=preparedInbox.map(item=>{
if(item.otherProfile?.id)profileCache.set(item.otherProfile.id,item.otherProfile);
return {
...item,
participants:Array.isArray(item.participants)?item.participants:[],
lastMessage:item.lastMessage||null,
lastReadAt:item.lastReadAt||null
};
});

conversations.sort((a,b)=>
new Date(b.lastMessage?.created_at||b.created_at)-
new Date(a.lastMessage?.created_at||a.created_at)
);

renderInbox();
saveInboxCache();

// Prepare the messages before the user opens each chat.
preloadInboxChats(conversations.slice(),loadToken).catch(console.warn);
return;
}

if(preparedError)console.warn('Prepared inbox:',preparedError);
}catch(error){
console.warn('Prepared inbox unavailable; using direct loader:',error);
}

if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;

let membersResult;
try{
membersResult=await withTimeout(
supabase.from('conversation_members')
.select('conversation_id,user_id,last_read_at,joined_at')
.eq('user_id',ownerId),
8000,
'Conversation list timed out'
);
}catch(error){
console.warn('Conversation list request:',error);
return;
}

if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;

const {data:members,error}=membersResult;
if(error){
console.error('Inbox members:',error);
return;
}

if(!members?.length){
conversations=[];
renderInbox();
saveInboxCache();
return;
}

const ids=members.map(m=>m.conversation_id);

let results;
try{
results=await withTimeout(
Promise.all([
supabase.from('conversations')
.select('id,created_by,is_group,group_name,created_at')
.in('id',ids),
supabase.from('conversation_members')
.select('conversation_id,user_id,last_read_at,joined_at')
.in('conversation_id',ids)
]),
10000,
'Conversation details timed out'
);
}catch(error){
console.warn('Conversation details:',error);
return;
}

if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;

const [conversationResult,memberResult]=results;

if(conversationResult.error){
console.error('Conversation lookup:',conversationResult.error);
return;
}

const convRows=conversationResult.data||[];
const allMembers=memberResult.data||[];
if(memberResult.error)console.warn('Inbox participants:',memberResult.error);

const cachedConversations=conversations;

conversations=convRows.map(c=>{
const myMembership=members.find(m=>m.conversation_id===c.id);
const participants=allMembers.filter(m=>m.conversation_id===c.id);
const other=participants.find(m=>m.user_id!==ownerId);
const old=cachedConversations.find(x=>x.id===c.id);

return {
...c,
participants,
otherUserId:other?.user_id||null,
otherProfile:other
?(profileCache.get(other.user_id)||old?.otherProfile||null)
:null,
lastMessage:old?.lastMessage||null,
lastReadAt:myMembership?.last_read_at||null
};
});

// Show the list now; message previews and profile information update afterwards.
renderInbox();
saveInboxCache();

const refreshList=conversations.slice();
let next=0;

async function refreshLatest(){
while(next<refreshList.length){
if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;
const c=refreshList[next++];
try{
const {data,error}=await withTimeout(
supabase.from('messages')
.select('id,conversation_id,sender_id,content,created_at,deleted_at')
.eq('conversation_id',c.id)
.is('deleted_at',null)
.order('created_at',{ascending:false})
.limit(1),
7000,
'Latest message timed out'
);
if(error)continue;
if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;
const latest=data?.[0]||null;
conversations=conversations.map(item=>
item.id===c.id?{...item,lastMessage:latest}:item
);
conversations.sort((a,b)=>
new Date(b.lastMessage?.created_at||b.created_at)-
new Date(a.lastMessage?.created_at||a.created_at)
);
renderInbox();
saveInboxCache();
}catch(error){console.warn('Latest message:',error);}
}
}

const latestLoading=Promise.all(
Array.from({length:Math.min(6,refreshList.length)},()=>refreshLatest())
);

const profileLoading=getProfiles(allMembers.map(m=>m.user_id));

await Promise.all([latestLoading,profileLoading]);

if(loadToken!==window.campusoraInboxToken||me?.id!==ownerId)return;

conversations=conversations.map(c=>({
...c,
otherProfile:c.otherUserId
?profileCache.get(c.otherUserId)||c.otherProfile
:null
}));

conversations.sort((a,b)=>
new Date(b.lastMessage?.created_at||b.created_at)-
new Date(a.lastMessage?.created_at||a.created_at)
);

renderInbox();
saveInboxCache();

preloadInboxChats(conversations.slice(),loadToken).catch(console.warn);
}

currentMessages=chatHistoryLoaded
?savedMessages
:conversation.lastMessage?[conversation.lastMessage]:[];

currentPendingMessages=[];
renderMessages();

// Recover IndexedDB history if localStorage has no copy.
if(savedMessages===null){
restoreChatCacheFromDB(id).then(cached=>{

currentMessages=cached;
chatHistoryLoaded=true;

}).catch(console.warn);

// Start realtime and fetch the latest messages immediately in the background.

messagePoll=setInterval(()=>{
if(currentConversation?.id===id)loadMessages(id,false);
},10000);

markConversationRead(id).catch(console.warn);
}
  function renderMessages(){
  if(currentConversation&&me&&chatHistoryLoaded){
    saveChatCache(currentConversation.id);
  }

  const area=$('messagesArea');
  const previousTop=area.scrollTop;
  const wasNearBottom=!area.dataset.rendered||
    area.scrollHeight-area.scrollTop-area.clientHeight<100;

  const combined=[
    ...currentMessages.map(m=>({...m,_pending:false})),
    ...currentPendingMessages.map(m=>({
      ...m,
      id:'pending-'+m.id,
      sender_id:me.id,
      created_at:m.created_at,
      _pending:true
    }))
  ].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

  if(!combined.length){
    area.innerHTML=`
      <div class="chat-empty">
        <div class="chat-empty-icon">✦</div>
        <h3>Say hello 👋</h3>
        <p>Your conversation starts here. Send the first message.</p>
      </div>`;

    area.dataset.rendered='1';
    return;
  }

  let previousDate='';
  const output=[];

  combined.forEach(m=>{
    const date=new Date(m.created_at);
    const dateKey=date.toDateString();

    if(dateKey!==previousDate){
      output.push(`<div class="date-label">${
        dateKey===new Date().toDateString()
        ?'Today'
        :esc(date.toLocaleDateString(undefined,{
          month:'short',
          day:'numeric',
          year:'numeric'
        }))
      }</div>`);

      previousDate=dateKey;
    }

    if(m.deleted_at&&!m._pending)return;

    const mine=m.sender_id===me.id;
    let actions='';

    if(mine&&!m._pending&&!m.deleted_at){
      actions=`
        <div class="message-actions">
          <button class="message-menu-button"
            data-message-menu="${esc(m.id)}"
            aria-label="Message options">⋮</button>

          <div class="message-menu"
            id="menu-${esc(m.id)}" hidden>

            <button data-edit-message="${esc(m.id)}">
              Edit Message
            </button>

            <button class="delete-option"
              data-delete-message="${esc(m.id)}">
              Delete Message
            </button>
          </div>
        </div>`;
    }

    let replyHtml='';

    if(m.reply_to_id){
      const original=currentMessages.find(
        item=>String(item.id)===String(m.reply_to_id)
      );

      const replyName=original
        ?(original.sender_id===me.id?'You':'Message')
        :'Original message';

      const replyText=original
        ?(original.content||original.attachment_type||'Media')
        :'This message may no longer be available';

      replyHtml=`
        <div class="message-reply-context">
          <strong>${esc(replyName)}</strong><br>
          ${esc(replyText)}
        </div>`;
    }

    let mediaHtml='';

    if(m.attachment_path){
      const mediaUrl=messageMediaUrls.get(m.attachment_path);

      if(!mediaUrl){
        mediaHtml=`
          <div class="message-media-placeholder">
            Loading ${m.attachment_type==='video'?'video':'photo'}...
          </div>`;
      }else if(m.attachment_type==='image'){
        mediaHtml=`
          <img class="message-media"
            src="${esc(mediaUrl)}"
            alt="${esc(m.attachment_name||'Shared photo')}"
            loading="lazy">`;
      }else if(m.attachment_type==='video'){
        mediaHtml=`
          <video class="message-media"
            controls
            playsinline
            preload="metadata">
            <source src="${esc(mediaUrl)}">
            Your browser cannot play this video.
          </video>`;
      }
    }

    const textContent=m.attachment_path&&
      (m.content==='Photo'||m.content==='Video')
      ?''
      :esc(m.content||'');

    output.push(`
      <div class="message-row ${mine?'mine':''} ${m._pending?'pending':''}"
        data-message="${esc(m.id)}">

        <div class="message-bubble">
          ${replyHtml}
          ${mediaHtml}
          ${textContent}
        </div>

        <div class="message-meta">
          ${ago(m.created_at)}
          ${m._pending
            ?'<span class="pending-status">Not sent</span>'
            :mine?'<span class="message-status">✓</span>':''}
          ${actions}
        </div>

        ${m._pending?`
          <div class="pending-premium-card">

            <div class="pending-premium-title">
              <span class="pending-premium-icon">✦</span>
              Message not sent
            </div>

            <p>
              Subscribe to Premium to continue sending
              messages on Campusora.
            </p>

            <div class="pending-premium-actions">

              <button type="button"
                data-premium-plan="monthly">
                Subscribe monthly
                <span>₦2,000 / 30 days</span>
              </button>

              <button type="button"
                class="secondary"
                data-premium-plan="permanent">
                Get permanent Premium
                <span>₦10,000 · One-time</span>
              </button>

            </div>
          </div>
        `:''}

      </div>
    `);
  });

  area.innerHTML=output.join('');
  area.dataset.rendered='1';

  requestAnimationFrame(()=>{
    if(wasNearBottom){
      area.scrollTop=area.scrollHeight;
    }else{
      area.scrollTop=previousTop;
    }
  });
}

  // Refresh server messages without showing a loading screen.
async function loadMessages(id,showLoading=false){
const loadToken=++messageLoadToken;
loadingMessages=true;

try{
const {data,error}=await withTimeout(
supabase.from('messages')
.select('id,conversation_id,sender_id,content,created_at,deleted_at,attachment_path,attachment_type,attachment_name,attachment_size,media_duration_seconds,is_view_once,reply_to_id')
.eq('conversation_id',id)
.is('deleted_at',null)
.order('created_at',{ascending:false})
.limit(100),
10000,
'Message refresh timed out'
);

if(error){
console.error('Load messages:',error);
return;
}

if(currentConversation?.id!==id||loadToken!==messageLoadToken)return;

const fresh=(data||[]).reverse();

// Merge the server response with any locally displayed messages.
// This avoids briefly removing messages already on the screen.
const merged=new Map();
currentMessages.forEach(m=>merged.set(String(m.id),m));
fresh.forEach(m=>merged.set(String(m.id),m));

currentMessages=Array.from(merged.values())
.filter(m=>!m.deleted_at)
.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))
.slice(-100);

chatHistoryLoaded=true;
renderMessages();
hydrateMessageMedia().catch(console.warn);

loadPendingMessages(id).then(()=>{
if(currentConversation?.id===id&&loadToken===messageLoadToken){
renderMessages();
}
}).catch(console.warn);

}catch(error){
console.warn('Message refresh:',error);
}finally{
if(loadToken===messageLoadToken)loadingMessages=false;
}
}

function setupMessageRealtime(id){
if(realtimeMessages){
supabase.removeChannel(realtimeMessages);
realtimeMessages=null;
}

realtimeMessages=supabase
.channel('campusora-chat-'+id)
.on('postgres_changes',{
event:'INSERT',
schema:'public',
table:'messages',
filter:`conversation_id=eq.${id}`
},async payload=>{
if(currentConversation?.id!==id)return;

if(!currentMessages.some(m=>String(m.id)===String(payload.new.id))){
currentMessages.push(payload.new);
currentMessages.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
chatHistoryLoaded=true;
renderMessages();

if(payload.new.sender_id!==me.id){
markConversationRead(id).catch(console.warn);
}
}
loadInbox().catch(console.warn);
})
.subscribe();
}

function containsPhoneNumber(text){
const candidates=String(text||'').match(/(?:\+?\d[\d\s().-]{8,}\d)/g)||[];
return candidates.some(candidate=>{
let digits=candidate.replace(/\D/g,'');
if(digits.startsWith('234'))digits='0'+digits.slice(3);
return digits.length===11&&/^0[789][01]\d{8}$/.test(digits);
});
}

function checkMessageInput(){
const text=$('messageInput').value;
const restricted=containsPhoneNumber(text);
$('sendBtn').disabled=restricted||!text.trim()||sending||!authReady;
$('phoneWarning').classList.toggle('show',restricted);
return !restricted;
}

async function hydrateMessageMedia(){
  if(!currentConversation)return;

  const conversationId=currentConversation.id;

  const items=currentMessages.filter(m=>m.attachment_path);

  await Promise.all(items.map(async message=>{
    const path=message.attachment_path;
    if(messageMediaUrls.has(path))return;

    const {data,error}=await supabase.storage
      .from('campusora-chat-media')
      .createSignedUrl(path,300);

    if(!error&&data?.signedUrl){
      messageMediaUrls.set(path,data.signedUrl);
    }
  }));

  if(currentConversation?.id===conversationId){
    renderMessages();
  }
}

async function sendChatAttachment(file){
  if(!file||!currentConversation||!me||!authReady||sending)return;

  const isImage=file.type.startsWith('image/');
  const isVideo=file.type.startsWith('video/');

  if(!isImage&&!isVideo){
    toast('Choose an image or video.');
    return;
  }

  if(file.size>100*1024*1024){
    toast('This file is larger than the 100MB limit.');
    return;
  }

  sending=true;
  $('attachBtn').disabled=true;

  const conversationId=currentConversation.id;
  const extension=(file.name.split('.').pop()||'file').replace(/[^a-z0-9]/gi,'');
  const path=`${conversationId}/${me.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

  try{
    const {error:uploadError}=await supabase.storage
      .from('campusora-chat-media')
      .upload(path,file,{
        contentType:file.type,
        upsert:false
      });

    if(uploadError)throw uploadError;

    const {data,error}=await supabase
      .from('messages')
      .insert({
        conversation_id:conversationId,
        sender_id:me.id,
        content:isImage?'Photo':'Video',
        attachment_path:path,
        attachment_type:isImage?'image':'video',
        attachment_name:file.name,
        attachment_size:file.size,
        reply_to_id:selectedReply?.id||null
      })
      .select('id,conversation_id,sender_id,content,created_at,deleted_at,attachment_path,attachment_type,attachment_name,attachment_size,reply_to_id')
      .single();

    if(error){
      await supabase.storage.from('campusora-chat-media').remove([path]);

      if(String(error.message||'').includes('MESSAGE_PREMIUM_REQUIRED')){
        toast('Premium is required to send messages now.');
        return;
      }

      throw error;
    }

    currentMessages.push(data);
    chatHistoryLoaded=true;
    clearReply();
    renderMessages();
    await hydrateMessageMedia();
    saveChatCache(conversationId);
    loadInbox().catch(console.warn);
    toast('Media sent.');
  }catch(error){
    console.error('Media upload:',error);
    toast('Could not send this file. Please try again.');
  }finally{
    sending=false;
    $('attachBtn').disabled=false;
    $('chatMediaInput').value='';
  }
}
function resetMessageEditor(){
editingMessageId=null;
$('sendBtn').textContent='➤';
$('sendBtn').setAttribute('aria-label','Send message');
}

async function sendMessage(event){
event.preventDefault();
if(sending||!currentConversation||!me||!authReady)return;

const input=$('messageInput');
const content=input.value.trim();
if(!content)return;

if(!checkMessageInput()){
toast('Sharing phone numbers is currently restricted on Campusora.');
return;
}

sending=true;
$('sendBtn').disabled=true;

if(editingMessageId){
const messageId=editingMessageId;
const {data,error}=await supabase
.from('messages')
.update({content})
.eq('id',messageId)
.eq('sender_id',me.id)
.select('id,conversation_id,sender_id,content,created_at,deleted_at,attachment_path,attachment_type,attachment_name,attachment_size,media_duration_seconds,is_view_once,reply_to_id')
.single();

sending=false;
$('sendBtn').disabled=false;

if(error){
console.error('Edit message:',error);
toast('Message could not be edited. Please try again.');
checkMessageInput();
return;
}

currentMessages=currentMessages.map(m=>
String(m.id)===String(messageId)?data:m
);
input.value='';
input.style.height='42px';
$('phoneWarning').classList.remove('show');
resetMessageEditor();
renderMessages();
toast('Message updated.');
loadInbox().catch(console.warn);
input.focus();
checkMessageInput();
return;
}

const {data,error}=await supabase
.from('messages')
.insert({
  conversation_id:currentConversation.id,
  sender_id:me.id,
  content,
  reply_to_id:selectedReply?.id||null
})
.select('id,conversation_id,sender_id,content,created_at,deleted_at,attachment_path,attachment_type,attachment_name,attachment_size,media_duration_seconds,is_view_once,reply_to_id')
.single();

sending=false;

if(error){
console.error('Send message:',error);

if(String(error.message||'').includes('MESSAGE_PREMIUM_REQUIRED')){
const saved=await savePendingMessage(content);
if(saved){
input.value='';
input.style.height='42px';
$('phoneWarning').classList.remove('show');
  pendingPremiumMessageId=currentPendingMessages.at(-1)?.id||null;
renderMessages();
}
checkMessageInput();
return;
}

toast('Message could not be sent. Check your connection.');
checkMessageInput();
return;
}

input.value='';
input.style.height='42px';
$('phoneWarning').classList.remove('show');
  clearReply();
$('sendBtn').disabled=false;

if(!currentMessages.some(m=>String(m.id)===String(data.id))){
currentMessages.push(data);
chatHistoryLoaded=true;
renderMessages();
}

saveChatCache(currentConversation.id);
loadInbox().catch(console.warn);
input.focus();
checkMessageInput();
}

function editMessage(messageId){
const message=currentMessages.find(m=>String(m.id)===String(messageId));
if(!message||message.sender_id!==me.id)return;

editingMessageId=message.id;
const input=$('messageInput');
input.value=message.content;
input.style.height='42px';
input.style.height=Math.min(input.scrollHeight,120)+'px';

$('sendBtn').textContent='✓';
$('sendBtn').setAttribute('aria-label','Save edited message');
$('sendBtn').disabled=false;

document.querySelectorAll('.message-menu').forEach(item=>item.hidden=true);

requestAnimationFrame(()=>{
input.focus();
input.setSelectionRange(input.value.length,input.value.length);
input.scrollIntoView({block:'nearest',behavior:'smooth'});
});
}

async function deleteMessage(messageId){
const message=currentMessages.find(m=>String(m.id)===String(messageId));
if(!message||message.sender_id!==me.id)return;

const {data,error}=await supabase
.from('messages')
.delete()
.eq('id',messageId)
.eq('sender_id',me.id)
.select('id')
.single();

if(error||!data){
console.error('Delete message:',error);
toast('Message could not be deleted.');
return;
}

currentMessages=currentMessages.filter(m=>String(m.id)!==String(messageId));
renderMessages();
saveChatCache(currentConversation.id);
loadInbox().catch(console.warn);
toast('Message deleted.');
}

function setupInboxRealtime(){
if(realtimeInbox)supabase.removeChannel(realtimeInbox);

realtimeInbox=supabase
.channel('campusora-inbox-'+me.id)
.on('postgres_changes',{
event:'INSERT',
schema:'public',
table:'messages'
},()=>{
// Refresh the list even if this is a newly created conversation.
loadInbox().catch(console.warn);
})
.subscribe();
}

function setupEvents(){
  // Open the phone gallery.
$('attachBtn').addEventListener('click',()=>{
  $('chatMediaInput').click();
});
  
// Open call selection panel.
$('callMenuBtn').addEventListener('click',()=>{
  if(!currentConversation){
    toast('Choose a conversation first.');
    return;
  }

  $('callPicker').hidden=!$('callPicker').hidden;
});

// Close call selection panel.
$('closeCallPicker').addEventListener('click',()=>{
  $('callPicker').hidden=true;
});

// Start the selected audio or video call.
document.querySelectorAll('[data-call-type]').forEach(button=>{
  button.addEventListener('click',()=>{
    const callType=button.dataset.callType;
    $('callPicker').hidden=true;
    startCampusoraCall(callType);
  });
});

// Accept incoming call.
$('acceptCallBtn').addEventListener('click',()=>{
  acceptCampusoraCall();
});

// Decline incoming call.
$('declineCallBtn').addEventListener('click',()=>{
  declineCampusoraCall();
});

// Close or end call.
$('closeCallScreen').addEventListener('click',()=>{
  if(incomingCall){
    declineCampusoraCall();
  }else{
    finishCall(true);
  }
});

$('endCallBtn').addEventListener('click',()=>{
  finishCall(true);
});

// Mute and unmute microphone.
$('muteCallBtn').addEventListener('click',async()=>{
  if(!liveKitRoom)return;

  const enabled=!liveKitRoom.localParticipant.isMicrophoneEnabled;

  await liveKitRoom.localParticipant.setMicrophoneEnabled(enabled);

  $('muteCallBtn').textContent=enabled?'🎙 Mute':'🔇 Unmute';
});

// Turn camera on and off.
$('cameraCallBtn').addEventListener('click',async()=>{
  if(!liveKitRoom)return;

  const enabled=!liveKitRoom.localParticipant.isCameraEnabled;

  await liveKitRoom.localParticipant.setCameraEnabled(enabled);

  $('cameraCallBtn').textContent=enabled?'▣ Camera Off':'▣ Camera On';
});
// Upload the selected picture or video.
$('chatMediaInput').addEventListener('change',event=>{
  const file=event.target.files?.[0];
  if(file)sendChatAttachment(file);
});

// Cancel a reply.
$('cancelReplyBtn').addEventListener('click',clearReply);

// Swipe a message sideways to reply.
let replySwipeStart=null;

$('messagesArea').addEventListener('touchstart',event=>{
  const row=event.target.closest('.message-row[data-message]');

  if(!row||row.classList.contains('pending'))return;

  if(event.target.closest('button,a,video'))return;

  const touch=event.touches[0];

  replySwipeStart={
    id:row.dataset.message,
    x:touch.clientX,
    y:touch.clientY,
    row
  };
},{passive:true});

$('messagesArea').addEventListener('touchend',event=>{
  if(!replySwipeStart)return;

  const touch=event.changedTouches[0];
  const dx=touch.clientX-replySwipeStart.x;
  const dy=touch.clientY-replySwipeStart.y;

  if(
    Math.abs(dx)>65&&
    Math.abs(dy)<55&&
    replySwipeStart.row.isConnected
  ){
    chooseReply(replySwipeStart.id);
  }

  replySwipeStart=null;
},{passive:true});

$('messagesArea').addEventListener('touchcancel',()=>{
  replySwipeStart=null;
},{passive:true});
$('conversationList').addEventListener('click',event=>{
const button=event.target.closest('[data-conversation]');
if(!button)return;
openConversation(button.dataset.conversation);
});

document.querySelectorAll('[data-inbox-filter]').forEach(button=>{
button.addEventListener('click',()=>{
currentFilter=button.dataset.inboxFilter;
document.querySelectorAll('[data-inbox-filter]').forEach(tab=>{
tab.classList.toggle('active',tab===button);
});
renderInbox();
});
});

$('messagesArea').addEventListener('click',event=>{

const premiumButton=event.target.closest('[data-premium-plan]');

if(premiumButton){
  startPremiumPayment(premiumButton.dataset.premiumPlan);
  return;
}

const menuButton=event.target.closest('[data-message-menu]');
const editButton=event.target.closest('[data-edit-message]');
const deleteButton=event.target.closest('[data-delete-message]');

if(menuButton){
const menu=$('menu-'+menuButton.dataset.messageMenu);
if(!menu)return;
const wasHidden=menu.hidden;
document.querySelectorAll('.message-menu').forEach(item=>item.hidden=true);
menu.hidden=!wasHidden;
return;
}
if(editButton){editMessage(editButton.dataset.editMessage);return;}
if(deleteButton){deleteMessage(deleteButton.dataset.deleteMessage);return;}
document.querySelectorAll('.message-menu').forEach(item=>item.hidden=true);
});

$('messageForm').addEventListener('submit',sendMessage);

$('messageInput').addEventListener('input',event=>{
const input=event.target;
input.style.height='42px';
input.style.height=Math.min(input.scrollHeight,120)+'px';
checkMessageInput();
});

$('messageInput').addEventListener('keydown',event=>{
if(event.key==='Enter'&&!event.shiftKey){
event.preventDefault();
$('messageForm').requestSubmit();
}
});

$('backBtn').addEventListener('click',()=>{
$('messaging').classList.remove('chat-open');
document.body.classList.remove('chat-mode');
});

$('refreshBtn').addEventListener('click',()=>{
if(currentConversation)loadMessages(currentConversation.id,false);
loadInbox().catch(console.warn);
toast('Refreshing messages...');
});

$('closePremiumModal').addEventListener('click',closePremiumModal);

$('premiumModal').addEventListener('click',event=>{
if(event.target===$('premiumModal'))closePremiumModal();
});

document.querySelectorAll('[data-premium-plan]').forEach(button=>{
button.addEventListener('click',()=>{
startPremiumPayment(button.dataset.premiumPlan);
});
});
}

async function startConversation(userId){
if(!userId||userId===me.id){
toast('You cannot message yourself.');
return false;
}

const {data:conversationId,error}=await supabase.rpc(
'start_direct_conversation',
{target_user_id:userId}
);

if(error||!conversationId){
console.error('Start conversation:',error);
toast(error?.message||'Could not open conversation.');
return false;
}

await loadInbox();

const conversation=conversations.find(c=>String(c.id)===String(conversationId));
if(!conversation){
toast('Conversation could not be loaded. Check permissions.');
return false;
}

await openConversation(conversation.id);
return true;
}

// Called after Supabase has confirmed the saved login session.
function activateAuthenticatedUser(user){
if(!user?.id)return;

const changedUser=me?.id!==user.id;
me=user;
authReady=true;

if(changedUser||!conversations.length){
restoreInboxCache();
}

setupInboxRealtime();
  // Activate incoming and outgoing call notifications.
setupCallRealtime();

supabase
  .from('call_invitations')
  .select('*')
  .eq('receiver_id',me.id)
  .eq('status','ringing')
  .gt('expires_at',new Date().toISOString())
  .order('created_at',{ascending:false})
  .limit(1)
  .maybeSingle()
  .then(({data,error})=>{
    if(error)console.warn('Pending call check:',error);
    if(data)handleCallUpdate(data);
  });

// Background refresh. It never blocks the visible inbox.
loadInbox().catch(error=>console.warn('Inbox refresh:',error));

if(refreshInterval)clearInterval(refreshInterval);
refreshInterval=setInterval(()=>{
loadInbox().catch(console.warn);
if(currentConversation)loadMessages(currentConversation.id,false);
},30000);

const params=new URLSearchParams(window.location.search);
const targetUserId=params.get('user');
const productName=params.get('product');

if(targetUserId){
if(targetUserId===me.id){
toast('You cannot message yourself.');
}else{
startConversation(targetUserId).then(opened=>{
if(opened&&productName){
const input=$('messageInput');
if(!input.value.trim()){
input.value=`Hi! I'm interested in your product "${productName}". Is it still available?`;
input.focus();
checkMessageInput();
}
}
}).catch(console.warn);
}
window.history.replaceState({},'',window.location.pathname);
}

verifyPremiumPayment().catch(error=>{
console.error('Premium payment verification:',error);
});

checkMessageInput();
}

// Restore the local inbox before waiting for Supabase authentication.
async function initialize(){
setupEvents();

const cachedUser=readCachedAuthUser();

if(cachedUser?.id){
me=cachedUser;
restoreInboxCache();
}

// Do not let authentication initialization hold the screen forever.
const sessionRequest=supabase.auth.getSession();

try{
const result=await withTimeout(
sessionRequest,
8000,
'Authentication is taking longer than expected'
);

const session=result?.data?.session;

if(session?.user){
activateAuthenticatedUser(session.user);
return;
}

if(!me?.id){
$('conversationList').innerHTML=`
<div class="panel-message">
Sign in to use Campusora messages.<br><br>
<a href="auth.html" style="color:#b8a2ff">Sign in →</a>
</div>`;
return;
}

}catch(error){
console.warn('Initial session check:',error);
}

// If auth takes longer, keep the saved inbox visible.
// Activate normal database messaging when the session eventually returns.
sessionRequest.then(result=>{
const session=result?.data?.session;
if(session?.user){
activateAuthenticatedUser(session.user);
}else if(!me?.id){
$('conversationList').innerHTML=`
<div class="panel-message">
Sign in to use Campusora messages.<br><br>
<a href="auth.html" style="color:#b8a2ff">Sign in →</a>
</div>`;
}
}).catch(error=>console.warn('Delayed session check:',error));
}

document.addEventListener('visibilitychange',()=>{
if(document.visibilityState!=='visible'||!authReady)return;
loadInbox().catch(console.warn);
if(currentConversation)loadMessages(currentConversation.id,false);
});

window.addEventListener('beforeunload',()=>{
if(realtimeMessages)supabase.removeChannel(realtimeMessages);
if(realtimeInbox)supabase.removeChannel(realtimeInbox);
if(messagePoll)clearInterval(messagePoll);
if(refreshInterval)clearInterval(refreshInterval);
});

initialize().catch(error=>{
console.error('Campusora messages initialization failed:',error);
toast('Messages could not be initialized. Please refresh.');
});

</script>
