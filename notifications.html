<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Notifications | Campusora</title>

<link rel="stylesheet" href="shared-nav.css">

<style>
:root {
  --bg:#080b18;
  --panel:#101426;
  --panel2:#171d33;
  --border:#252d48;
  --text:#fff;
  --muted:#929bb7;
  --purple:#9065ff;
  --blue:#548bff;
  --cyan:#38d9ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;
  min-height:100vh;
}

button{font:inherit;cursor:pointer}

.page{
  max-width:850px;
  margin:0 auto;
  padding:25px 14px 50px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.page-title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.page-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.mark-all-btn{
  background:transparent;
  border:1px solid #51417e;
  color:#c4adff;
  padding:9px 12px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.mark-all-btn:hover{
  background:#292044;
  border-color:var(--purple);
}

.mark-all-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.tabs{
  display:flex;
  gap:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}

.tab{
  background:none;
  border:0;
  color:var(--muted);
  padding:10px 2px;
  font-size:12px;
  font-weight:700;
  position:relative;
}

.tab.active{color:#c8b7ff}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  border-radius:5px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
}

.notification-list{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  overflow:hidden;
}

.section-label{
  padding:12px 14px 7px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.notification{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:14px;
  position:relative;
  border-bottom:1px solid #222a40;
  cursor:pointer;
  transition:background .18s;
}

.notification:last-child{border-bottom:0}
.notification:hover{background:#171d32}

.notification.unread{
  background:linear-gradient(90deg,#49327624,#101426);
}

.notification.unread::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:var(--purple);
}

.notification-avatar{
  position:relative;
  flex-shrink:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7952ee,#2689ee);
  border:1px solid #51417e;
  color:white;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.type-icon{
  position:absolute;
  right:-3px;
  bottom:-3px;
  width:19px;
  height:19px;
  border-radius:50%;
  border:2px solid var(--panel);
  display:grid;
  place-items:center;
  font-size:10px;
  color:white;
}

.type-like{background:#e84d84}
.type-comment{background:#588cff}
.type-reply{background:#9065ff}
.type-follow{background:#22b78c}
.type-community_join{background:#d99b32}
.type-gift{background:linear-gradient(135deg,#9065ff,#e84d84)}

.notification-body{
  flex:1;
  min-width:0;
}

.notification-text{
  font-size:12px;
  line-height:1.6;
  color:#d0d6e8;
  overflow-wrap:anywhere;
}

.notification-text strong{
  color:white;
  font-weight:800;
}

.notification-time{
  color:#818ba8;
  font-size:10px;
  margin-top:5px;
}

.notification-dot{
  width:7px;
  height:7px;
  flex-shrink:0;
  margin-top:7px;
  border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 9px #38d9ff66;
}

.notification-preview{
  color:#aab3ce;
  font-size:11px;
  margin-top:6px;
  padding:7px 9px;
  background:#171d33;
  border-radius:7px;
  border-left:2px solid #6552a0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.empty-state{
  padding:55px 16px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  width:49px;
  height:49px;
  display:grid;
  place-items:center;
  margin:0 auto 13px;
  border:1px solid #393151;
  border-radius:15px;
  background:#201a35;
  color:#c4adff;
  font-size:22px;
}

.empty-state h3{
  color:#e7e4ff;
  font-size:14px;
  margin-bottom:6px;
}

.empty-state p{
  font-size:11px;
  line-height:1.7;
}

.loading{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  padding:45px 10px;
  color:var(--muted);
  font-size:11px;
}

.spinner{
  width:16px;
  height:16px;
  border:2px solid #36314f;
  border-top-color:var(--purple);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translate(-50%,12px);
  background:#25223a;
  border:1px solid #51417e;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-size:11px;
  z-index:999;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  max-width:calc(100% - 30px);
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:600px){
  .page{padding:19px 0 35px}

  .page-head{padding:0 13px}

  .page-title{font-size:19px}

  .page-subtitle{font-size:10px}

  .mark-all-btn{
    padding:8px 9px;
    font-size:10px;
  }

  .tabs{padding:0 14px}

  .notification-list{
    border-radius:0;
    border-left:0;
    border-right:0;
  }

  .notification{padding:13px}

  .avatar{
    width:39px;
    height:39px;
  }

  .notification-text{font-size:12px}
  .section-label{padding-left:13px}

  .toast{bottom:20px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<main class="page">

  <header class="page-head">
    <div>
      <h1 class="page-title">Notifications</h1>
      <p class="page-subtitle">
        Your latest activity on Campusora
      </p>
    </div>

    <button class="mark-all-btn" id="markAllBtn">
      Mark all as read
    </button>
  </header>

  <div class="tabs" id="filterTabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="unread">Unread</button>
  </div>

  <section class="notification-list" id="notificationList">
    <div class="loading">
      <span class="spinner"></span>
      Loading notifications...
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="shared-nav.js"></script>

<script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);

let currentUser = null;
let notifications = [];
let activeFilter = 'all';
let realtimeChannel = null;
let refreshTimer = null;

const profileCache = new Map();
const postCache = new Map();
const communityCache = new Map();
const giftCache = new Map();

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');

  clearTimeout(toast.timer);
  toast.timer = setTimeout(
    () => el.classList.remove('show'),2600
  );
}

function initials(name = 'C') {
  return String(name).trim().split(/\s+/)
    .filter(Boolean).slice(0,2)
    .map(part => part[0]).join('').toUpperCase() || 'C';
}

function avatarHTML(profile) {
  const name = profile?.full_name || profile?.username || 'Member';

  if (profile?.avatar_url) {
    return `<div class="avatar">
      <img src="${escapeHTML(profile.avatar_url)}" alt="">
    </div>`;
  }

  return `<div class="avatar">${escapeHTML(initials(name))}</div>`;
}

function timeAgo(value) {
  const date = new Date(value);

  if (Number.isNaN(date.getTime())) return 'Recently';

  const seconds = Math.max(
    0,Math.floor((Date.now()-date.getTime())/1000)
  );

  if (seconds < 45) return 'Just now';
  if (seconds < 3600) return Math.floor(seconds/60)+'m ago';
  if (seconds < 86400) return Math.floor(seconds/3600)+'h ago';
  if (seconds < 604800) return Math.floor(seconds/86400)+'d ago';

  return date.toLocaleDateString(undefined,{
    month:'short',
    day:'numeric'
  });
}

function actorName(profile) {
  return profile?.full_name ||
    profile?.username ||
    'A Campusora member';
}

function giftDetails(n) {
  const known = {
    rose:{name:'Rose',icon:'🌹'},
    love:{name:'Love',icon:'❤️'},
    golden_star:{name:'Golden Star',icon:'⭐'},
    diamond:{name:'Diamond',icon:'💎'},
    royal_crown:{name:'Royal Crown',icon:'👑'},
    premium_heart:{name:'Premium Heart',icon:'💖'}
  };

  const gift = giftCache.get(n.gift_id);

  return {
    name:gift?.name || known[n.gift_id]?.name || 'a gift',
    icon:known[n.gift_id]?.icon || '🎁'
  };
}

function notificationMessage(n,actor) {
  const name = `<strong>${escapeHTML(actorName(actor))}</strong>`;

  switch(n.type) {
    case 'like':
      return `${name} liked your post ❤️`;

    case 'comment':
      return `${name} commented on your post 💬`;

    case 'reply':
      return `${name} replied to a comment ↩️`;

    case 'follow':
      return `${name} started following you 👤`;

    case 'community_join':
      return `${name} joined your community 🏫`;

    case 'gift': {
      const gift = giftDetails(n);
      return `${name} sent you ${escapeHTML(gift.name)} ${gift.icon}`;
    }

    default:
      return `${name} interacted with you`;
  }
}

function iconFor(type) {
  return {
    like:'♥',
    comment:'●',
    reply:'↩',
    follow:'+',
    community_join:'⌂',
    gift:'🎁'
  }[type] || '•';
}

async function loadRelatedData() {
  const actorIds = [...new Set(
    notifications.map(n=>n.actor_id).filter(Boolean)
  )];

  const postIds = [...new Set(
    notifications.map(n=>n.post_id).filter(Boolean)
  )];

  const communityIds = [...new Set(
    notifications.map(n=>n.community_id).filter(Boolean)
  )];

  const giftIds = [...new Set(
    notifications.filter(n=>n.type==='gift'&&n.gift_id)
      .map(n=>n.gift_id)
  )];

  const tasks = [];

  const missingActors = actorIds.filter(id=>!profileCache.has(id));
  const missingPosts = postIds.filter(id=>!postCache.has(id));
  const missingCommunities = communityIds.filter(id=>!communityCache.has(id));
  const missingGifts = giftIds.filter(id=>!giftCache.has(id));

  if(missingActors.length){
    tasks.push(
      supabase.from('profiles')
        .select('id,username,full_name,avatar_url,school,role')
        .in('id',missingActors)
        .then(({data,error})=>{
          if(error){console.warn(error.message);return;}
          (data||[]).forEach(p=>profileCache.set(p.id,p));
        })
    );
  }

  if(missingPosts.length){
    tasks.push(
      supabase.from('posts')
        .select('id,content,user_id')
        .in('id',missingPosts)
        .then(({data,error})=>{
          if(error){console.warn(error.message);return;}
          (data||[]).forEach(p=>postCache.set(p.id,p));
        })
    );
  }

  if(missingCommunities.length){
    tasks.push(
      supabase.from('communities')
        .select('id,name')
        .in('id',missingCommunities)
        .then(({data,error})=>{
          if(error){console.warn(error.message);return;}
          (data||[]).forEach(c=>communityCache.set(c.id,c));
        })
    );
  }

  if(missingGifts.length){
    tasks.push(
      supabase.from('campusora_gift_catalog')
        .select('id,name')
        .in('id',missingGifts)
        .then(({data,error})=>{
          if(error){console.warn(error.message);return;}
          (data||[]).forEach(g=>giftCache.set(g.id,g));
        })
    );
  }

  await Promise.all(tasks);
}

function notificationTarget(n) {
  if(n.post_id){
    return `index.html?post=${encodeURIComponent(n.post_id)}`;
  }

  if(n.community_id){
    return `communities.html?id=${encodeURIComponent(n.community_id)}`;
  }

  if(n.actor_id){
    const profile = profileCache.get(n.actor_id);

    return profile?.username
      ? `profile.html?username=${encodeURIComponent(profile.username)}`
      : `profile.html?id=${encodeURIComponent(n.actor_id)}`;
  }

  return 'notifications.html';
}

function renderNotification(n) {
  const actor = profileCache.get(n.actor_id);
  const post = postCache.get(n.post_id);
  const community = communityCache.get(n.community_id);
  const gift = n.type==='gift' ? giftDetails(n) : null;

  let preview = '';

  if(post?.content){
    preview = `<div class="notification-preview">
      ${escapeHTML(post.content.slice(0,110))}
    </div>`;
  }else if(community?.name){
    preview = `<div class="notification-preview">
      Community: ${escapeHTML(community.name)}
    </div>`;
  }else if(gift){
    preview = `<div class="notification-preview">
      Gift received: ${escapeHTML(gift.name)} ${gift.icon}
    </div>`;
  }

  const unread = !n.is_read;

  return `
    <article class="notification ${unread?'unread':''}"
      data-id="${escapeHTML(n.id)}"
      tabindex="0"
      role="button">

      <div class="notification-avatar">
        ${avatarHTML(actor)}
        <span class="type-icon type-${escapeHTML(n.type)}">
          ${iconFor(n.type)}
        </span>
      </div>

      <div class="notification-body">
        <div class="notification-text">
          ${notificationMessage(n,actor)}
        </div>
        ${preview}
        <div class="notification-time">
          ${timeAgo(n.created_at)}
        </div>
      </div>

      ${unread?'<span class="notification-dot"></span>':''}
    </article>
  `;
}

function render() {
  const list = $('notificationList');

  let filtered = notifications;

  if(activeFilter==='unread'){
    filtered = notifications.filter(n=>!n.is_read);
  }

  $('markAllBtn').style.display =
    notifications.some(n=>!n.is_read) ? 'inline-block':'none';

  if(!filtered.length){
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <h3>${activeFilter==='unread'
          ? 'No unread notifications'
          : 'You’re all caught up'}</h3>
        <p>${activeFilter==='unread'
          ? 'You have read all your notifications.'
          : 'When people interact with you on Campusora, their activity will appear here.'}</p>
      </div>`;
    return;
  }

  const today = [];
  const earlier = [];
  const now = new Date();

  filtered.forEach(n=>{
    const date = new Date(n.created_at);

    if(!Number.isNaN(date.getTime()) &&
      date.toDateString()===now.toDateString()){
      today.push(n);
    }else{
      earlier.push(n);
    }
  });

  list.innerHTML =
    (today.length
      ? `<div class="section-label">Today</div>${today.map(renderNotification).join('')}`
      :'')+
    (earlier.length
      ? `<div class="section-label">Earlier</div>${earlier.map(renderNotification).join('')}`
      :'');
}

async function loadNotifications(showLoading=false) {
  if(!currentUser)return;

  if(showLoading){
    $('notificationList').innerHTML =
      '<div class="loading"><span class="spinner"></span> Loading notifications...</div>';
  }

  const {data,error} = await supabase
    .from('notifications')
    .select('id,recipient_id,actor_id,type,post_id,comment_id,community_id,gift_id,is_read,created_at')
    .eq('recipient_id',currentUser.id)
    .order('created_at',{ascending:false})
    .limit(100);

  if(error){
    console.error(error);

    $('notificationList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">!</div>
        <h3>Could not load notifications</h3>
        <p>Please check your connection and try again.</p>
        <button class="mark-all-btn" id="retryBtn">Try again</button>
      </div>`;

    $('retryBtn')?.addEventListener('click',()=>loadNotifications(true));
    return;
  }

  notifications=data||[];

  await loadRelatedData();
  render();
}

async function markRead(id) {
  const item=notifications.find(n=>n.id===id);

  if(!item||item.is_read)return;

  const {error}=await supabase
    .from('notifications')
    .update({is_read:true})
    .eq('id',id)
    .eq('recipient_id',currentUser.id);

  if(error){
    console.warn(error.message);
    return;
  }

  item.is_read=true;
  render();
}

async function markAllRead() {
  if(!currentUser)return;

  const unread=notifications.filter(n=>!n.is_read);
  if(!unread.length)return;

  $('markAllBtn').disabled=true;

  const {error}=await supabase
    .from('notifications')
    .update({is_read:true})
    .eq('recipient_id',currentUser.id)
    .eq('is_read',false);

  $('markAllBtn').disabled=false;

  if(error){
    console.error(error);
    toast('Could not mark notifications as read.');
    return;
  }

  notifications.forEach(n=>n.is_read=true);

  render();
  toast('All notifications marked as read.');
}

async function openNotification(id) {
  const item=notifications.find(n=>n.id===id);
  if(!item)return;

  await markRead(id);
  window.location.href=notificationTarget(item);
}

function setupRealtime() {
  if(realtimeChannel){
    supabase.removeChannel(realtimeChannel);
  }

  realtimeChannel=supabase
    .channel('campusora-notifications-'+currentUser.id)
    .on('postgres_changes',{
      event:'INSERT',
      schema:'public',
      table:'notifications',
      filter:`recipient_id=eq.${currentUser.id}`
    },async payload=>{
      if(notifications.some(n=>n.id===payload.new.id))return;

      notifications.unshift(payload.new);
      notifications=notifications.slice(0,100);

      await loadRelatedData();
      render();

      const actor=profileCache.get(payload.new.actor_id);

      toast(`New activity from ${actorName(actor)}`);
    })
    .subscribe();
}

function setupEvents() {
  $('filterTabs').addEventListener('click',event=>{
    const button=event.target.closest('[data-filter]');
    if(!button)return;

    activeFilter=button.dataset.filter;

    document.querySelectorAll('.tab').forEach(tab=>{
      tab.classList.toggle('active',tab===button);
    });

    render();
  });

  $('notificationList').addEventListener('click',event=>{
    const item=event.target.closest('[data-id]');
    if(item)openNotification(item.dataset.id);
  });

  $('notificationList').addEventListener('keydown',event=>{
    if(event.key!=='Enter'&&event.key!==' ')return;

    const item=event.target.closest('[data-id]');
    if(!item)return;

    event.preventDefault();
    openNotification(item.dataset.id);
  });

  $('markAllBtn').addEventListener('click',markAllRead);
}

async function initialize() {
  setupEvents();

  const {data,error}=await supabase.auth.getUser();

  if(error||!data?.user){
    $('notificationList').innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">◎</div>
        <h3>Sign in to see your activity</h3>
        <p>Your likes, comments, gifts and new followers will appear here after you sign in.</p>
        <br>
        <a href="auth.html" style="color:#b8a2ff">Sign in →</a>
      </div>`;

    $('markAllBtn').style.display='none';
    return;
  }

  currentUser=data.user;

  await loadNotifications(true);
  setupRealtime();

  refreshTimer=setInterval(()=>{
    loadNotifications(false);
  },60000);
}

window.addEventListener('beforeunload',()=>{
  if(realtimeChannel)supabase.removeChannel(realtimeChannel);
  if(refreshTimer)clearInterval(refreshTimer);
});

initialize();
</script>

</body>
