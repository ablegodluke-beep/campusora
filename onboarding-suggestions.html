<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Suggestions | Campusora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080b18;
  --surface:#101426;
  --border:rgba(255,255,255,.09);
  --text:#f5f6ff;
  --muted:#929bb6;
  --purple:#925bff;
  --blue:#526dff;
  --cyan:#39d7f5;
  --gradient:linear-gradient(110deg,#925bff,#526dff,#39d7f5);
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body {
  min-height:100vh;
  padding:18px 13px 35px;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
}

button,a {
  font:inherit;
}

button {
  cursor:pointer;
}

.progress {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:3px;
  z-index:1000;
  background:transparent;
  overflow:hidden;
}

.progress::after {
  content:"";
  display:block;
  width:35%;
  height:100%;
  background:var(--gradient);
  animation:loading 1.2s ease-in-out infinite;
}

.progress.done {
  opacity:0;
  transition:opacity .3s;
}

.progress.done::after {
  animation:none;
  width:100%;
}

@keyframes loading {
  from {transform:translateX(-110%)}
  to {transform:translateX(300%)}
}

.app {
  width:100%;
  max-width:650px;
  margin:auto;
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 0 17px;
  border-bottom:1px solid var(--border);
}

h1 {
  font-size:23px;
  font-weight:800;
  letter-spacing:-.6px;
}

.skip {
  color:var(--cyan);
  font-size:12px;
  font-weight:700;
  text-decoration:none;
}

.people-list {
  display:flex;
  flex-direction:column;
  margin-top:10px;
}

.person {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:12px 2px;
  border-bottom:1px solid var(--border);
}

.person.featured {
  padding:14px 9px;
  margin-bottom:5px;
  border:1px solid rgba(146,91,255,.35);
  border-radius:12px;
  background:rgba(146,91,255,.08);
}

.avatar-link {
  flex-shrink:0;
  text-decoration:none;
}

.avatar {
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:var(--gradient);
  color:white;
  font-size:18px;
  font-weight:800;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info {
  flex:1;
  min-width:0;
}

.person-name {
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:white;
  font-size:13px;
  font-weight:800;
  text-decoration:none;
}

.username {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.school {
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#aab5d2;
  font-size:10px;
}

.follow-btn {
  flex-shrink:0;
  min-width:85px;
  padding:9px 12px;
  border:0;
  border-radius:9px;
  background:var(--gradient);
  color:white;
  font-size:11px;
  font-weight:800;
}

.follow-btn.following {
  border:1px solid #286477;
  background:#172e36;
  color:#8ce8f3;
}

.follow-btn:disabled {
  opacity:.6;
  cursor:wait;
}

.status {
  padding:35px 15px;
  color:var(--muted);
  text-align:center;
  font-size:12px;
  line-height:1.8;
}

.message-box {
  display:none;
  padding:11px 13px;
  margin-top:12px;
  border-radius:9px;
  font-size:12px;
}

.message-box.success {
  display:block;
  color:#9af1d0;
  background:#10352d;
}

.message-box.error {
  display:block;
  color:#ffb2c0;
  background:#391b29;
}

.finish {
  margin-top:22px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:12px;
  text-align:center;
}

.finish p {
  margin-bottom:12px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.finish a {
  display:block;
  padding:12px;
  border-radius:9px;
  background:var(--gradient);
  color:white;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}

@media(max-width:400px) {
  body {
    padding:15px 10px 25px;
  }

  h1 {
    font-size:21px;
  }

  .avatar {
    width:43px;
    height:43px;
  }

  .follow-btn {
    min-width:76px;
    padding:9px 8px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div class="progress" id="progress"></div>

<main class="app">

  <header class="topbar">
    <h1>Suggestions</h1>
    <a class="skip" href="./home-feed.html">Skip →</a>
  </header>

  <div id="messageBox" class="message-box" role="status"></div>

  <section class="people-list" id="peopleList">
    <div class="status">Finding people across Campusora...</div>
  </section>

  <section class="finish">
    <p>
      Discover more people and build your campus community.
      You can follow more members anytime.
    </p>
    <a href="./home-feed.html">Continue to Home Feed →</a>
  </section>

</main>

<script type="module">
import { supabase } from './supabase.js';

const peopleList = document.getElementById('peopleList');
const messageBox = document.getElementById('messageBox');
const progress = document.getElementById('progress');

const FEATURED_USERNAME = 'Campusora';

let currentUser = null;
let profiles = [];
let followingIds = new Set();
let busyIds = new Set();

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function getName(profile) {
  return profile.full_name || profile.username || 'Campusora Member';
}

function profileURL(profile) {
  return './profile.html?id=' + encodeURIComponent(profile.id);
}

function avatarHTML(profile) {
  const initial = escapeHTML(
    getName(profile).trim().charAt(0).toUpperCase() || 'C'
  );

  if (!profile.avatar_url) {
    return `<div class="avatar">${initial}</div>`;
  }

  return `
    <div class="avatar">
      <img
        src="${escapeHTML(profile.avatar_url)}"
        alt=""
        loading="lazy"
        onerror="this.style.display='none';this.parentElement.textContent='${initial}'"
      >
    </div>
  `;
}

function showMessage(message,type='success') {
  messageBox.textContent = message;
  messageBox.className = 'message-box ' + type;

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(() => {
    messageBox.className = 'message-box';
  },4000);
}

function isFeatured(profile) {
  return String(profile.username || '').toLowerCase() ===
    FEATURED_USERNAME.toLowerCase();
}

function createPersonRow(profile) {
  const following = followingIds.has(profile.id);
  const busy = busyIds.has(profile.id);
  const featured = isFeatured(profile);

  const row = document.createElement('article');

  row.className = 'person' + (featured ? ' featured' : '');

  row.innerHTML = `
    <a class="avatar-link" href="${profileURL(profile)}">
      ${avatarHTML(profile)}
    </a>

    <div class="person-info">
      <a class="person-name" href="${profileURL(profile)}">
        ${escapeHTML(getName(profile))}
      </a>

      <div class="username">
        @${escapeHTML(profile.username || 'member')}
      </div>

      <div class="school">
        ${escapeHTML(profile.school || 'School not added')}
      </div>
    </div>

    <button
      class="follow-btn ${following ? 'following' : ''}"
      data-follow="${escapeHTML(profile.id)}"
      ${busy ? 'disabled' : ''}
    >
      ${busy ? 'Please wait...' : following ? '✓ Following' : '+ Follow'}
    </button>
  `;

  return row;
}

function renderPeople() {
  peopleList.replaceChildren();

  if (!profiles.length) {
    peopleList.innerHTML = `
      <div class="status">
        No members are available to suggest right now.
      </div>
    `;
    return;
  }

  profiles.forEach(profile => {
    peopleList.appendChild(createPersonRow(profile));
  });
}

async function loadPeople() {
  try {
    const { data:userData,error:userError } =
      await supabase.auth.getUser();

    if (userError) throw userError;

    currentUser = userData.user;

    if (!currentUser) {
      window.location.replace('./auth.html?mode=login');
      return;
    }

    const { data:follows,error:followError } = await supabase
      .from('follows')
      .select('following_id')
      .eq('follower_id',currentUser.id);

    if (followError) throw followError;

    followingIds = new Set(
      (follows || []).map(row => row.following_id)
    );

    // Find Official Campusora using its username.
    const { data:featuredData,error:featuredError } = await supabase
      .from('profiles')
      .select('id,full_name,username,school,role,avatar_url')
      .ilike('username',FEATURED_USERNAME)
      .limit(1);

    if (featuredError) throw featuredError;

    const featuredProfile = (featuredData || []).find(
      profile => profile.id !== currentUser.id
    ) || null;

    // Load the remaining profiles.
    const others = [];
    const PAGE_SIZE = 50;
    let offset = 0;

    while (true) {
      const { data,error } = await supabase
        .from('profiles')
        .select('id,full_name,username,school,role,avatar_url')
        .neq('id',currentUser.id)
        .order('id',{ascending:true})
        .range(offset,offset + PAGE_SIZE - 1);

      if (error) throw error;

      const batch = data || [];

      if (!batch.length) break;

      for (const profile of batch) {
        if (
          profile.id !== featuredProfile?.id &&
          !followingIds.has(profile.id)
        ) {
          others.push(profile);
        }
      }

      offset += batch.length;

      if (batch.length < PAGE_SIZE) break;
    }

    // Official Campusora always comes first for other members.
    // It remains visible even after someone follows it.
    profiles = [
      ...(featuredProfile ? [featuredProfile] : []),
      ...others
    ];

    renderPeople();

    if (!featuredProfile) {
      showMessage(
        'Could not find the profile with username Campusora. Please check the profile username.',
        'error'
      );
    }

  } catch (error) {
    console.error('Suggestions error:',error);

    peopleList.innerHTML = `
      <div class="status">
        We couldn't load suggestions.<br>
        Please refresh and try again.
      </div>
    `;

    showMessage(
      error.message || 'Unable to load suggestions.',
      'error'
    );

  } finally {
    progress.classList.add('done');
  }
}

async function followMember(profileId) {
  if (!currentUser || busyIds.has(profileId)) return;

  if (followingIds.has(profileId)) return;

  busyIds.add(profileId);
  renderPeople();

  try {
    const { error } = await supabase
      .from('follows')
      .insert({
        follower_id:currentUser.id,
        following_id:profileId
      });

    if (error) throw error;

    followingIds.add(profileId);

    const profile = profiles.find(
      item => item.id === profileId
    );

    // Keep Official Campusora at the top after following.
    // Other followed members leave the suggestions list.
    if (!profile || !isFeatured(profile)) {
      profiles = profiles.filter(
        item => item.id !== profileId
      );
    }

    showMessage('You are now following this member.');

  } catch (error) {
    console.error('Follow error:',error);

    showMessage(
      error.message || 'Could not follow this member.',
      'error'
    );

  } finally {
    busyIds.delete(profileId);
    renderPeople();
  }
}

peopleList.addEventListener('click',event => {
  const button = event.target.closest('[data-follow]');

  if (button) {
    followMember(button.dataset.follow);
  }
});

loadPeople();
</script>

</body>
</html>
