<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Profile | Campusora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080b18;
  --card:#111629;
  --card2:#171d33;
  --border:#252d48;
  --text:#f4f5ff;
  --muted:#9ca6c5;
  --purple:#8758ff;
  --blue:#448aff;
  --cyan:#42d9f5;
  --gold:#f5ce75;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top left,#171438 0%,transparent 42%),var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}
button,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.topbar{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4%;
  background:rgba(8,11,24,.96);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:19px;
  font-weight:800;
}
.brand img{
  width:34px;
  height:34px;
  object-fit:contain;
  background:transparent;
  border:0;
  box-shadow:none;
  filter:none;
  mix-blend-mode:lighten;
}
.top-actions{display:flex;gap:8px}
.top-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
}
.page{width:min(850px,94%);margin:22px auto 60px}
.profile-card,.post-card{
  background:rgba(17,22,41,.96);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:20px;
}
.cover{
  height:210px;
  background:
    radial-gradient(circle at 20% 20%,#7044d9,transparent 40%),
    linear-gradient(120deg,#151b3d,#302064,#07566c);
  background-position:center;
  background-size:cover;
  position:relative;
}
.cover.has-cover{cursor:zoom-in}
.profile-content{padding:0 25px 22px}
.premium-top-row{
  display:flex;
  justify-content:flex-end;
  margin-top:9px;
}
.premium-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:linear-gradient(135deg,#17130d,#282013);
  color:#f5ce75;
  border:1px solid rgba(245,206,117,.5);
  border-radius:8px;
  padding:7px 11px;
  font-size:10px;
  font-weight:800;
}
.avatar{
  width:108px;
  height:108px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid var(--card);
  background:var(--card2);
}
.profile-avatar{
  margin-top:0;
  position:relative;
  cursor:zoom-in;
  display:block;
}
.profile-heading{margin-top:8px}
.name-line{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}
h1{
  font-size:22px;
  line-height:1.35;
  margin:0;
  overflow-wrap:anywhere;
}
.username-line{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:4px;
}
.username{color:var(--muted);font-size:12px}
.badge{
  display:inline-flex;
  align-items:center;
  background:rgba(135,88,255,.14);
  border:1px solid rgba(135,88,255,.4);
  color:#c8b4ff;
  border-radius:20px;
  padding:3px 6px;
  font-size:9px;
  font-weight:700;
}
.school{
  color:#aeb8d7;
  font-size:12px;
  line-height:1.6;
  margin-top:9px;
  overflow-wrap:anywhere;
}
.bio{
  color:#dce1f7;
  font-size:13px;
  line-height:1.7;
  margin-top:9px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.profile-rank-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:3px 7px;
  border-radius:20px;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}
.rank-queen{
  color:#ffe6a1;
  background:linear-gradient(135deg,#6f4210,#2d1c0b);
  border:1px solid #d9ad55;
}
.rank-king{
  color:#d9f2ff;
  background:linear-gradient(135deg,#174a78,#10233f);
  border:1px solid #66b9f0;
}
.rank-grand-master{
  color:#f4e7ff;
  background:linear-gradient(135deg,#55218a,#211039);
  border:1px solid #c28bff;
}
.premium-badge,.inline-premium{
  display:inline-flex;
  align-items:center;
  background:rgba(245,206,117,.08);
  border:1px solid rgba(245,206,117,.4);
  color:var(--gold);
  border-radius:12px;
  padding:3px 6px;
  font-size:8px;
  font-weight:800;
}
.profile-stats{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
  margin-top:19px;
  padding-top:16px;
}
.stat{
  border:0;
  background:transparent;
  padding:0;
  color:inherit;
  text-align:left;
}
.stat strong{display:block;font-size:17px}
.stat span{color:var(--muted);font-size:11px}
.profile-actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}
.profile-action-btn{
  min-width:105px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px 15px;
  color:white;
  background:var(--card2);
  font-size:11px;
  font-weight:800;
}
.profile-action-btn.primary{
  border:0;
  background:linear-gradient(110deg,#8053f7,#3e8fff,#38cce5);
}
.gift-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:8px 11px;
  border:1px solid rgba(135,88,255,.65);
  border-radius:9px;
  color:#eee8ff;
  background:linear-gradient(120deg,rgba(135,88,255,.28),rgba(66,217,245,.12));
  font-size:10px;
  font-weight:800;
}
.gift-section{
  margin-top:18px;
  padding:13px 0 3px;
  border-top:1px solid var(--border);
}
.gift-section-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.gift-section-title{font-size:12px;font-weight:800}
.gift-section-subtitle{color:var(--muted);font-size:10px}
.gift-row{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 8px;
}
.gift-chip{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px 9px;
  border-radius:12px;
  border:1px solid rgba(135,88,255,.2);
  background:rgba(135,88,255,.09);
}
.gift-chip-icon{font-size:19px}
.gift-chip-count{font-size:11px;font-weight:800}
.gift-chip-name{font-size:8px;color:var(--muted)}
.section-title{font-size:18px;margin:27px 0 14px}
.post-card{padding:18px}
.post-header{display:flex;align-items:center;gap:11px}
.post-avatar{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;background:var(--card2);
  flex-shrink:0;cursor:pointer;
}
.post-author{font-size:13px;font-weight:800}
.post-meta{font-size:10px;color:var(--muted);margin-top:4px}
.post-text{
  font-size:13px;line-height:1.8;
  white-space:pre-wrap;overflow-wrap:anywhere;
  margin:16px 0;
}
.post-image{
  width:100%;max-height:560px;object-fit:contain;
  background:#090c18;border-radius:12px;
  display:block;margin-bottom:14px;cursor:zoom-in;
}
.post-stats{
  display:flex;justify-content:space-between;gap:10px;
  color:var(--muted);font-size:11px;padding:10px 2px;
  border-bottom:1px solid var(--border);
}
.post-actions{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:7px;padding-top:10px;
}
.action-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:0;background:transparent;color:#b8c1df;
  border-radius:10px;padding:10px 4px;font-size:11px;
}
.action-btn:hover{background:var(--card2);color:white}
.action-icon{font-size:18px}
.action-btn.liked,.react-btn.reacted{
  color:#ff6b91;background:rgba(255,99,132,.09);
}
.comments-area{
  border-top:1px solid var(--border);
  margin-top:12px;padding-top:14px;
}
.comment-form{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.comment-input{
  width:100%;min-width:0;resize:vertical;min-height:40px;
  max-height:130px;color:white;background:#0b1020;
  border:1px solid var(--border);border-radius:12px;
  padding:11px;outline:none;font-size:12px;
}
.comment-send{
  background:var(--purple);border:0;color:white;
  border-radius:10px;padding:10px 13px;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.comment{display:flex;gap:9px;margin:13px 0}
.comment-avatar{
  width:32px;height:32px;object-fit:cover;
  border-radius:50%;background:var(--card2);
  flex-shrink:0;cursor:pointer;
}
.comment-body{
  flex:1;min-width:0;background:#0b1020;
  padding:10px 12px;border-radius:12px;
}
.comment-name{
  font-size:11px;font-weight:800;margin-bottom:6px;
  color:#c8b4ff;display:inline-block;
}
.comment-text{
  color:#dce1f7;font-size:12px;line-height:1.6;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.comment-time{font-size:9px;color:var(--muted);margin-top:7px}
.comment-tools{
  display:flex;align-items:center;gap:13px;
  flex-wrap:wrap;margin-top:8px;
}
.small-action{
  border:0;background:transparent;color:var(--muted);
  padding:3px 0;font-size:10px;
}
.replies{
  margin:9px 0 0 12px;padding-left:12px;
  border-left:2px solid var(--border);
}
.reply-form{display:flex;gap:7px;margin-top:10px}
.reply-form .comment-input{min-height:36px;padding:9px}
.reply-form .comment-send{padding:9px 11px}
.reaction-picker{
  display:flex;gap:5px;padding:7px;margin-top:6px;
  width:max-content;max-width:100%;
  background:#202944;border:1px solid var(--border);
  border-radius:30px;box-shadow:0 8px 25px #0008;
}
.reaction-picker button{
  border:0;background:transparent;font-size:20px;padding:3px;
}
.empty,.message{
  background:var(--card);border:1px solid var(--border);
  color:var(--muted);border-radius:14px;padding:24px;
  text-align:center;line-height:1.7;font-size:12px;
}
.message.error{color:#ff9aae;border-color:rgba(255,99,132,.4)}
.loading{text-align:center;padding:45px 15px;color:var(--muted)}
body.premium-active{
  background:
    radial-gradient(ellipse at top left,rgba(101,63,153,.25),transparent 42%),
    radial-gradient(ellipse at top right,rgba(168,121,37,.1),transparent 40%),
    #08090f;
}
body.premium-active .profile-card{
  border-color:rgba(245,206,117,.45);
  box-shadow:0 0 22px rgba(168,121,37,.07);
}
.photo-viewer{
  position:fixed;inset:0;z-index:200;
  background:rgba(2,4,12,.94);display:flex;
  align-items:center;justify-content:center;padding:20px;
}
.photo-viewer-content{
  width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;position:relative;
}
.photo-viewer-image{
  max-width:100%;max-height:85vh;
  object-fit:contain;border-radius:12px;
}
.photo-viewer-close{
  position:absolute;top:4px;right:4px;
  width:42px;height:42px;border-radius:50%;
  background:#171d33;color:white;
  border:1px solid var(--border);font-size:25px;
}
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(3,5,14,.82);display:flex;
  align-items:center;justify-content:center;padding:16px;
}
.premium-modal,.gift-modal{
  width:min(450px,100%);max-height:90vh;overflow-y:auto;
  background:#111629;border:1px solid rgba(245,206,117,.4);
  border-radius:18px;padding:20px;
}
.gift-modal{border-color:rgba(135,88,255,.5)}
.modal-top{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;margin-bottom:8px;
}
.modal-title{margin:0;font-size:18px}
.modal-subtitle{
  color:var(--muted);font-size:11px;
  line-height:1.7;margin:8px 0 16px;
}
.modal-close{
  width:30px;height:30px;border:1px solid var(--border);
  border-radius:9px;background:#171d33;color:white;font-size:17px;
}
.plan-card{
  border:1px solid rgba(245,206,117,.25);
  border-radius:13px;background:rgba(255,255,255,.025);
  padding:14px;margin-top:10px;
}
.plan-top{display:flex;justify-content:space-between;gap:10px}
.plan-name{font-size:12px;font-weight:800}
.plan-description{color:var(--muted);font-size:10px;margin-top:5px}
.plan-price{color:var(--gold);font-size:18px;font-weight:800}
.plan-duration{color:#c3b58e;font-size:9px;text-align:right;margin-top:4px}
.plan-continue,.gift-pay-button{
  width:100%;margin-top:12px;padding:11px;
  border:1px solid rgba(245,206,117,.55);
  border-radius:9px;background:linear-gradient(135deg,#342713,#20190f);
  color:#f5ce75;font-size:11px;font-weight:800;
}
.plan-card.permanent{border-color:rgba(135,88,255,.45)}
.plan-card.permanent .plan-continue{
  background:linear-gradient(110deg,#6641c8,#3b5ac7);
  color:white;border:0;
}
.modal-note{
  margin:14px 0 0;color:#7f89a8;
  font-size:9px;line-height:1.7;text-align:center;
}
.premium-status{
  padding:12px;margin-top:12px;
  background:rgba(245,206,117,.07);
  border:1px solid rgba(245,206,117,.3);
  border-radius:11px;color:#f5ce75;
  font-size:11px;line-height:1.8;
}
.modal-message,.gift-modal-message{
  color:var(--muted);font-size:11px;
  line-height:1.7;margin-top:12px;overflow-wrap:anywhere;
}
.gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.gift-option{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-width:0;min-height:125px;
  padding:12px 8px;border:1px solid var(--border);
  border-radius:13px;background:rgba(255,255,255,.025);color:white;
}
.gift-option.selected{
  border-color:#a98aff;background:rgba(135,88,255,.18);
}
.gift-option-icon{font-size:29px}
.gift-option-name{font-size:11px;font-weight:800;margin-top:5px}
.gift-option-price{color:#c9b5ff;font-size:10px;margin-top:4px}
.gift-pay-button{
  border:0;background:linear-gradient(110deg,#8053f7,#3e8fff,#38cce5);
  color:white;
}
.gift-history{
  margin-top:17px;padding-top:14px;border-top:1px solid var(--border);
}
.gift-history-title{font-size:12px;margin:0 0 10px}
.gift-history-list{display:flex;flex-direction:column;gap:8px}
.gift-history-item{
  display:flex;align-items:center;gap:10px;
  padding:10px;background:rgba(255,255,255,.025);border-radius:10px;
}
.gift-history-icon{font-size:21px}
.gift-history-details{flex:1;min-width:0}
.gift-history-sender{font-size:10px;font-weight:800}
.gift-history-date{color:var(--muted);font-size:9px;margin-top:4px}

@media(max-width:600px){
  .topbar{padding:0 3%;min-height:56px}
  .brand{font-size:17px}
  .brand img{width:30px;height:30px}
  .top-btn{padding:7px 9px;font-size:10px}
  .page{width:94%;margin-top:14px}
  .cover{height:150px}
  .profile-content{padding:0 15px 18px}
  .avatar{width:88px;height:88px}
  h1{font-size:19px}
  .school{font-size:11px}
  .bio{font-size:12px}
  .profile-stats{gap:19px}
  .stat strong{font-size:16px}
  .post-card{padding:13px}
  .action-btn{font-size:10px}
  .replies{margin-left:5px;padding-left:8px}
}
@media(max-width:380px){
  .top-actions{gap:5px}
  .top-btn{padding:7px}
  .profile-action-btn{min-width:95px;padding:8px 10px}
}
</style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="./index.html">
    <img src="./campusora-logo.png" alt="Campusora">
    <span>Campusora</span>
  </a>
  <div class="top-actions">
    <button class="top-btn" id="homeButton" type="button">⌂ Home</button>
    <button class="top-btn" id="createPostButton" type="button">＋ Post</button>
  </div>
</header>

<main class="page">
  <div id="pageMessage" class="message hidden"></div>
  <div id="loading" class="loading">Loading Campusora profile...</div>

  <section id="profileSection" class="profile-card hidden">
    <div id="cover" class="cover" aria-label="View cover photo"></div>

    <div class="profile-content">

      <!-- Premium stays at the top-right, immediately below the cover. -->
      <div class="premium-top-row">
        <button id="premiumButton" class="premium-btn hidden" type="button">
          ✦ Upgrade to Premium
        </button>
      </div>

      <img id="profileAvatar" class="avatar profile-avatar" alt="Profile photo">

      <div class="profile-heading">
        <div class="name-line">
          <h1 id="profileName">Campusora Member</h1>
          <span id="profileRankBadge" class="profile-rank-badge hidden"></span>
        </div>

        <div class="username-line">
          <span id="profileUsername" class="username"></span>
          <span id="profileBadge" class="badge">🎓 Student</span>
          <span id="premiumBadge" class="premium-badge hidden">✦ PREMIUM</span>
        </div>

        <div id="profileSchool" class="school"></div>
        <div id="profileBio" class="bio"></div>
      </div>

      <!-- Statistics come before Follow and Message. -->
      <div class="profile-stats">
        <button class="stat" id="followersStat" type="button">
          <strong id="followerCount">0</strong>
          <span>Followers</span>
        </button>

        <div class="stat">
          <strong id="postCount">0</strong>
          <span>Posts</span>
        </div>

        <button class="stat" id="followingStat" type="button">
          <strong id="followingCount">0</strong>
          <span>Following</span>
        </button>
      </div>

      <div class="profile-actions">
        <button id="followButton" class="profile-action-btn primary hidden" type="button">Follow</button>
        <button id="messageButton" class="profile-action-btn hidden" type="button">Message</button>
        <button id="getRanksButton" class="profile-action-btn hidden" type="button">👑 Get Ranks</button>
      </div>

      <!-- My Gifts is separate from Gifts Received. -->
      <div class="profile-actions">
        <button id="giftButton" class="gift-button" type="button">🎁 Send a Gift</button>
      </div>

      <section id="giftStrip" class="gift-section">
        <div class="gift-section-top">
          <span class="gift-section-title">🎁 Gifts Received</span>
          <span id="giftTotal" class="gift-section-subtitle">0 gifts</span>
        </div>
        <div id="giftCounts" class="gift-row">
          <span>Loading gifts...</span>
        </div>
      </section>

    </div>
  </section>

  <h2 id="postsHeading" class="section-title hidden">Posts</h2>
  <section id="postsContainer"></section>

  <div id="photoViewer" class="photo-viewer hidden" role="dialog" aria-modal="true">
    <div class="photo-viewer-content">
      <button id="closePhotoViewer" class="photo-viewer-close" type="button">×</button>
      <img id="photoViewerImage" class="photo-viewer-image" alt="Expanded photo">
    </div>
  </div>
  </main>

<!-- PREMIUM MEMBERSHIP MODAL -->
<div id="premiumModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" id="closePremiumModal" type="button">×</button>
    <h2>Campusora Premium</h2>
    <p>Unlock more ways to stand out on Campusora.</p>

    <div class="premium-plans">
      <button class="premium-plan" data-plan="monthly" type="button">
        <strong>Monthly Premium</strong>
        <span>Premium access for one month</span>
      </button>

      <button class="premium-plan" data-plan="permanent" type="button">
        <strong>Permanent Premium</strong>
        <span>One-time payment for permanent access</span>
      </button>
    </div>

    <p id="premiumMessage" class="modal-message"></p>
    <button id="premiumPayButton" class="primary-btn" type="button" disabled>
      Select a plan
    </button>
  </div>
</div>

<!-- SEND GIFT MODAL -->
<div id="giftModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" id="closeGiftModal" type="button">×</button>
    <h2>Send a Gift</h2>
    <p id="giftRecipientName">Choose a gift to send.</p>

    <div id="giftCatalog" class="gift-catalog">
      <p>Loading gifts...</p>
    </div>

    <p id="giftMessage" class="modal-message"></p>

    <button id="sendGiftButton" class="primary-btn" type="button" disabled>
      Select a gift
    </button>
  </div>
</div>

<!-- FOLLOWERS / FOLLOWING MODAL -->
<div id="followListModal" class="modal-overlay hidden">
  <div class="modal-box follow-list-box">
    <button class="modal-close" id="closeFollowList" type="button">×</button>
    <h2 id="followListTitle">People</h2>
    <div id="followListContent">
      <p>Loading...</p>
    </div>
  </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

/* =====================================
   PROFILE PAGE STATE
===================================== */

const params = new URLSearchParams(window.location.search);

const requestedProfileId = params.get("id");
const requestedUsername = params.get("username");

let currentUser = null;
let profile = null;
let selectedPremiumPlan = null;
let selectedGift = null;
let giftCatalog = [];
let isFollowing = false;
let currentFollowListType = "followers";

const reactionOptions = [
  { name: "like", icon: "👍" },
  { name: "love", icon: "❤️" },
  { name: "haha", icon: "😂" },
  { name: "wow", icon: "😮" },
  { name: "sad", icon: "😢" },
  { name: "angry", icon: "😡" }
];

const fallbackAvatar =
  "data:image/svg+xml," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
      <rect width="100%" height="100%" fill="#171c32"/>
      <circle cx="80" cy="60" r="28" fill="#777f9c"/>
      <path d="M25 150c5-35 25-52 55-52s50 17 55 52"
        fill="#777f9c"/>
    </svg>
  `);

/* =====================================
   ELEMENT HELPERS
===================================== */

const $ = (id) => document.getElementById(id);

function showMessage(element, message, type = "info") {
  if (!element) return;

  element.textContent = message;
  element.className = `modal-message ${type}`;
}

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function formatDate(dateValue) {
  if (!dateValue) return "";

  return new Date(dateValue).toLocaleDateString("en-NG", {
    day: "numeric",
    month: "short",
    year: "numeric"
  });
}

function formatMoney(amount) {
  return `₦${Number(amount || 0).toLocaleString("en-NG")}`;
}

function getProfileName(person) {
  return person?.full_name || person?.username || "Campusora Member";
}

function getAvatar(person) {
  return person?.avatar_url || fallbackAvatar;
}

function openModal(id) {
  $(id)?.classList.remove("hidden");
}

function closeModal(id) {
  $(id)?.classList.add("hidden");
}

/* =====================================
   PROFILE DISPLAY HELPERS
===================================== */

function setText(id, value) {
  const element = $(id);
  if (element) element.textContent = value ?? "";
}

function setImage(id, source) {
  const element = $(id);
  if (!element) return;

  element.src = source || fallbackAvatar;

  element.onerror = () => {
    element.src = fallbackAvatar;
  };
}

function displayProfile(person) {
  if (!person) return;

  setImage("profileAvatar", getAvatar(person));
  setImage("profileCover", person.cover_url);

  setText("profileName", getProfileName(person));
  setText(
    "profileUsername",
    person.username ? `@${person.username}` : ""
  );

  setText("profileSchool", person.school || "School not added");
  setText("profileBio", person.bio || "No bio added yet.");

  const role = person.role || "General Member";
  setText("profileRole", role);

  const profileLink = $("profileAvatar");
  if (profileLink) {
    profileLink.alt = `${getProfileName(person)} profile photo`;
  }

  document.title = `${getProfileName(person)} | Campusora`;
}

/* =====================================
   AUTHENTICATION
===================================== */

async function getCurrentUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error) {
    console.error("Authentication check:", error);
    return null;
  }

  return data.user || null;
}

/* =====================================
   LOAD PROFILE
===================================== */

async function findProfile() {
  let query = supabase
    .from("profiles")
    .select(`
      id,
      username,
      full_name,
      school,
      role,
      bio,
      avatar_url,
      cover_url,
      created_at
    `);

  if (requestedProfileId) {
    query = query.eq("id", requestedProfileId);
  } else if (requestedUsername) {
    query = query.eq("username", requestedUsername);
  } else if (currentUser) {
    query = query.eq("id", currentUser.id);
  } else {
    return null;
  }

  const { data, error } = await query.maybeSingle();

  if (error) {
    console.error("Profile loading error:", error);
    throw error;
  }

  return data;
}

function showProfileError(message) {
  const container = $("profileContent") || $("profileSection");

  if (container) {
    container.innerHTML = `
      <div class="empty-state">
        <p>${escapeHTML(message)}</p>
      </div>
    `;
  }
}

/* =====================================
   PREMIUM MEMBERSHIP
===================================== */

async function checkPremiumMembership() {
  if (!profile?.id) return false;

  try {
    const { data, error } = await supabase
      .from("premium_memberships")
      .select("plan_type,status,payment_verified,starts_at,expires_at")
      .eq("user_id", profile.id)
      .eq("payment_verified", true)
      .eq("status", "active")
      .order("created_at", { ascending: false })
      .limit(1);

    if (error) {
      console.warn("Premium status could not be checked:", error);
      return false;
    }

    if (!data?.length) return false;

    const membership = data[0];

    if (
      membership.expires_at &&
      new Date(membership.expires_at) < new Date()
    ) {
      return false;
    }

    return true;
  } catch (error) {
    console.error("Premium check failed:", error);
    return false;
  }
}

async function updatePremiumDisplay() {
  const isPremium = await checkPremiumMembership();

  const badge = $("premiumBadge");
  const button = $("premiumButton");

  if (badge) {
    badge.classList.toggle("hidden", !isPremium);
  }

  if (button) {
    button.textContent = isPremium ? "Premium Member" : "Get Premium";
  }

  return isPremium;
}

function openPremiumModal() {
  selectedPremiumPlan = null;

  const payButton = $("premiumPayButton");
  if (payButton) {
    payButton.disabled = true;
    payButton.textContent = "Select a plan";
  }

  document.querySelectorAll(".premium-plan").forEach((button) => {
    button.classList.remove("selected");
  });

  showMessage($("premiumMessage"), "");
  openModal("premiumModal");
}

document.querySelectorAll(".premium-plan").forEach((button) => {
  button.addEventListener("click", () => {
    selectedPremiumPlan = button.dataset.plan;

    document.querySelectorAll(".premium-plan").forEach((item) => {
      item.classList.remove("selected");
    });

    button.classList.add("selected");

    const payButton = $("premiumPayButton");

    if (payButton) {
      payButton.disabled = false;
      payButton.textContent = "Continue to payment";
    }
  });
});

$("premiumButton")?.addEventListener("click", async () => {
  if (!currentUser) {
    alert("Please log in to get Premium.");
    return;
  }

  if (profile?.id !== currentUser.id) {
    return;
  }

  const alreadyPremium = await updatePremiumDisplay();

  if (alreadyPremium) {
    alert("Your Premium membership is active.");
    return;
  }

  openPremiumModal();
});

$("closePremiumModal")?.addEventListener("click", () => {
  closeModal("premiumModal");
});

/* =====================================
   PREMIUM PAYMENT
===================================== */

async function initializePremiumPayment() {
  if (!selectedPremiumPlan || !currentUser) return;

  const button = $("premiumPayButton");

  button.disabled = true;
  button.textContent = "Preparing payment...";

  showMessage($("premiumMessage"), "Connecting to payment service...");

  try {
    const response = await fetch("/api/premium/initialize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        plan_type: selectedPremiumPlan,
        user_id: currentUser.id,
        email: currentUser.email
      })
    });

    const result = await response.json();

    if (!response.ok || !result.authorization_url) {
      throw new Error(result.message || "Could not initialize payment.");
    }

    window.location.href = result.authorization_url;

  } catch (error) {
    console.error("Premium payment error:", error);

    showMessage(
      $("premiumMessage"),
      error.message || "Payment could not be started.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Try again";
  }
}

$("premiumPayButton")?.addEventListener("click", initializePremiumPayment);

/* =====================================
   PREMIUM PAYMENT VERIFICATION
===================================== */

async function verifyPremiumPayment() {
  const reference = params.get("premium_reference");
  const paymentStatus = params.get("premium_payment");

  if (paymentStatus !== "1" || !reference) return;

  try {
    const response = await fetch("/api/premium/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ reference })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Premium payment verification failed.");
    }

    alert("Your Premium payment has been confirmed!");

    params.delete("premium_payment");
    params.delete("premium_reference");

    const cleanUrl =
      window.location.pathname +
      (params.toString() ? `?${params.toString()}` : "");

    window.history.replaceState({}, "", cleanUrl);

  } catch (error) {
    console.error("Premium verification error:", error);
    alert(error.message || "We could not verify your Premium payment.");
  }
}

/* =====================================
   RANK BUTTON
===================================== */

$("getRanksButton")?.addEventListener("click", () => {
  window.location.href = "./profile-ranks.html";
});

/* =====================================
   PROFILE ACTION BUTTONS
===================================== */

$("homeButton")?.addEventListener("click", () => {
  window.location.href = "./index.html";
});

$("createPostButton")?.addEventListener("click", () => {
  window.location.href = "./create-post.html";
});

$("messageButton")?.addEventListener("click", () => {
  if (!profile?.id) return;

  if (!currentUser) {
    alert("Please log in to send a message.");
    return;
  }

  if (profile.id === currentUser.id) {
    alert("You cannot message yourself.");
    return;
  }

  window.location.href =
    `./messages.html?user=${encodeURIComponent(profile.id)}`;
});

/* =====================================
   FOLLOW BUTTON
===================================== */

async function checkFollowStatus() {
  if (!currentUser || !profile || currentUser.id === profile.id) {
    isFollowing = false;
    return;
  }

  const { data, error } = await supabase
    .from("follows")
    .select("follower_id")
    .eq("follower_id", currentUser.id)
    .eq("following_id", profile.id)
    .maybeSingle();

  if (error) {
    console.error("Follow status error:", error);
    return;
  }

  isFollowing = !!data;
  updateFollowButton();
}

function updateFollowButton() {
  const button = $("followButton");
  if (!button) return;

  if (profile?.id === currentUser?.id) {
    button.classList.add("hidden");
    return;
  }

  button.classList.remove("hidden");
  button.textContent = isFollowing ? "Following" : "Follow";
  button.classList.toggle("following", isFollowing);
}

$("followButton")?.addEventListener("click", async () => {
  if (!currentUser) {
    alert("Please log in to follow this member.");
    return;
  }

  if (!profile || currentUser.id === profile.id) return;

  const button = $("followButton");
  button.disabled = true;

  try {
    if (isFollowing) {
      const { error } = await supabase
        .from("follows")
        .delete()
        .eq("follower_id", currentUser.id)
        .eq("following_id", profile.id);

      if (error) throw error;

      isFollowing = false;

    } else {
      const { error } = await supabase
        .from("follows")
        .insert({
          follower_id: currentUser.id,
          following_id: profile.id
        });

      if (error) throw error;

      isFollowing = true;
    }

    updateFollowButton();
    await loadCounts(profile);

  } catch (error) {
    console.error("Follow action failed:", error);
    alert("Could not update follow status. Please try again.");
  } finally {
    button.disabled = false;
  }
});

/* =====================================
   FOLLOWER / FOLLOWING LIST BUTTONS
===================================== */

$("followersCount")?.addEventListener("click", () => {
  openFollowList("followers");
});

$("followingCount")?.addEventListener("click", () => {
  openFollowList("following");
});

$("closeFollowList")?.addEventListener("click", () => {
  closeModal("followListModal");
});
  /* =====================================
   FOLLOWER / FOLLOWING COUNTS
===================================== */

async function loadCounts(person) {
  if (!person?.id) return;

  try {
    const [
      postsResult,
      followersResult,
      followingResult
    ] = await Promise.all([
      supabase
        .from("posts")
        .select("id", { count: "exact", head: true })
        .eq("user_id", person.id),

      supabase
        .from("follows")
        .select("follower_id", { count: "exact", head: true })
        .eq("following_id", person.id),

      supabase
        .from("follows")
        .select("following_id", { count: "exact", head: true })
        .eq("follower_id", person.id)
    ]);

    if (postsResult.error) console.error(postsResult.error);
    if (followersResult.error) console.error(followersResult.error);
    if (followingResult.error) console.error(followingResult.error);

    setText("postsCount", postsResult.count ?? 0);
    setText("followersCount", followersResult.count ?? 0);
    setText("followingCount", followingResult.count ?? 0);

  } catch (error) {
    console.error("Could not load profile counts:", error);
  }
}

/* =====================================
   FOLLOWERS / FOLLOWING LIST
===================================== */

async function openFollowList(type) {
  if (!profile?.id) return;

  currentFollowListType = type;

  setText(
    "followListTitle",
    type === "followers" ? "Followers" : "Following"
  );

  const container = $("followListContent");

  if (container) {
    container.innerHTML = "<p>Loading...</p>";
  }

  openModal("followListModal");

  try {
    const column = type === "followers"
      ? "follower_id"
      : "following_id";

    const { data, error } = await supabase
      .from("follows")
      .select(column)
      .eq(
        type === "followers" ? "following_id" : "follower_id",
        profile.id
      )
      .order("created_at", { ascending: false });

    if (error) throw error;

    const ids = (data || []).map(item => item[column]);

    if (!ids.length) {
      if (container) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No ${type} yet.</p>
          </div>
        `;
      }
      return;
    }

    const { data: people, error: peopleError } = await supabase
      .from("profiles")
      .select("id,username,full_name,avatar_url,school,role")
      .in("id", ids);

    if (peopleError) throw peopleError;

    const orderedPeople = ids
      .map(id => people?.find(person => person.id === id))
      .filter(Boolean);

    if (container) {
      container.innerHTML = orderedPeople.map(person => `
        <a class="follow-list-person"
           href="./profile.html?id=${encodeURIComponent(person.id)}">
          <img src="${escapeHTML(getAvatar(person))}"
               alt=""
               onerror="this.src='${fallbackAvatar}'">
          <div>
            <strong>${escapeHTML(getProfileName(person))}</strong>
            <small>
              ${person.username ? `@${escapeHTML(person.username)}` : ""}
              ${person.school ? ` · ${escapeHTML(person.school)}` : ""}
            </small>
          </div>
        </a>
      `).join("");
    }

  } catch (error) {
    console.error(`Could not load ${type}:`, error);

    if (container) {
      container.innerHTML = `
        <div class="empty-state">
          <p>Could not load this list. Please try again.</p>
        </div>
      `;
    }
  }
}

/* =====================================
   GIFTS
===================================== */

$("myGiftsButton")?.addEventListener("click", () => {
  window.location.href = "./gift-earnings.html";
});

$("sendGiftButton")?.addEventListener("click", sendGift);

$("closeGiftModal")?.addEventListener("click", () => {
  closeModal("giftModal");
});

async function loadGiftCatalog() {
  const container = $("giftCatalog");

  if (!container) return;

  try {
    const { data, error } = await supabase
      .from("campusora_gift_catalog")
      .select("*")
      .eq("is_active", true)
      .order("price", { ascending: true });

    if (error) throw error;

    giftCatalog = data || [];

    if (!giftCatalog.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>No gifts are available right now.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = giftCatalog.map(gift => `
      <button class="gift-option"
              type="button"
              data-gift-id="${escapeHTML(gift.id)}">
        <span class="gift-option-icon">
          ${escapeHTML(gift.icon || gift.emoji || "🎁")}
        </span>
        <strong>${escapeHTML(gift.name || "Gift")}</strong>
        <small>${formatMoney(gift.price)}</small>
      </button>
    `).join("");

    container.querySelectorAll(".gift-option").forEach(button => {
      button.addEventListener("click", () => {
        const gift = giftCatalog.find(
          item => String(item.id) === button.dataset.giftId
        );

        if (!gift) return;

        selectedGift = gift;

        container.querySelectorAll(".gift-option").forEach(option => {
          option.classList.remove("selected");
        });

        button.classList.add("selected");

        const sendButton = $("sendGiftButton");

        if (sendButton) {
          sendButton.disabled = false;
          sendButton.textContent =
            `Send ${gift.name} · ${formatMoney(gift.price)}`;
        }

        showMessage($("giftMessage"), "");
      });
    });

  } catch (error) {
    console.error("Gift catalog error:", error);

    container.innerHTML = `
      <div class="empty-state">
        <p>Could not load gifts. Please try again later.</p>
      </div>
    `;
  }
}

function openGiftModal() {
  if (!currentUser) {
    alert("Please log in to send a gift.");
    return;
  }

  if (!profile || currentUser.id === profile.id) {
    alert("You cannot send a gift to yourself.");
    return;
  }

  selectedGift = null;

  setText(
    "giftRecipientName",
    `Send a gift to ${getProfileName(profile)}`
  );

  const sendButton = $("sendGiftButton");

  if (sendButton) {
    sendButton.disabled = true;
    sendButton.textContent = "Select a gift";
  }

  showMessage($("giftMessage"), "");
  openModal("giftModal");

  loadGiftCatalog();
}

$("sendGiftOpenButton")?.addEventListener("click", openGiftModal);

async function sendGift() {
  if (!currentUser || !profile || !selectedGift) return;

  const button = $("sendGiftButton");

  button.disabled = true;
  button.textContent = "Preparing payment...";

  showMessage($("giftMessage"), "Connecting to payment service...");

  try {
    const response = await fetch("/api/gifts/initialize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        gift_id: selectedGift.id,
        sender_id: currentUser.id,
        recipient_id: profile.id,
        email: currentUser.email
      })
    });

    const result = await response.json();

    if (!response.ok || !result.authorization_url) {
      throw new Error(result.message || "Could not start gift payment.");
    }

    window.location.href = result.authorization_url;

  } catch (error) {
    console.error("Gift payment error:", error);

    showMessage(
      $("giftMessage"),
      error.message || "Could not start payment.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Try again";
  }
}

/* =====================================
   GIFT PAYMENT VERIFICATION
===================================== */

async function verifyGiftPayment() {
  const reference = params.get("gift_reference");
  const paymentStatus = params.get("gift_payment");

  if (paymentStatus !== "1" || !reference) return;

  try {
    const response = await fetch("/api/gifts/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ reference })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Gift payment verification failed.");
    }

    alert("Your gift has been sent successfully!");

    params.delete("gift_payment");
    params.delete("gift_reference");

    const cleanUrl =
      window.location.pathname +
      (params.toString() ? `?${params.toString()}` : "");

    window.history.replaceState({}, "", cleanUrl);

  } catch (error) {
    console.error("Gift verification error:", error);
    alert(error.message || "We could not verify your gift payment.");
  }
}

/* =====================================
   GIFTS RECEIVED
===================================== */

async function loadReceivedGifts() {
  if (!profile?.id) return;

  const container = $("giftsReceived");

  if (!container) return;

  try {
    const { data, error } = await supabase
      .from("campusora_received_gifts")
      .select("*")
      .eq("recipient_id", profile.id)
      .order("created_at", { ascending: false })
      .limit(12);

    if (error) throw error;

    if (!data?.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>No gifts received yet.</p>
        </div>
      `;
      return;
    }

    const senderIds = [
      ...new Set(data.map(gift => gift.sender_id).filter(Boolean))
    ];

    let senders = [];

    if (senderIds.length) {
      const { data: people, error: peopleError } = await supabase
        .from("profiles")
        .select("id,username,full_name,avatar_url")
        .in("id", senderIds);

      if (!peopleError) senders = people || [];
    }

    container.innerHTML = data.map(gift => {
      const sender = senders.find(
        person => person.id === gift.sender_id
      );

      return `
        <div class="received-gift">
          <div class="received-gift-icon">
            ${escapeHTML(gift.gift_icon || gift.emoji || "🎁")}
          </div>
          <div>
            <strong>${escapeHTML(gift.gift_name || "Gift")}</strong>
            <small>
              From ${escapeHTML(
                sender ? getProfileName(sender) : "Campusora Member"
              )}
            </small>
          </div>
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error("Received gifts error:", error);

    container.innerHTML = `
      <div class="empty-state">
        <p>Gifts could not be loaded right now.</p>
      </div>
    `;
  }
}

/* =====================================
   POST REACTIONS
===================================== */

function reactionIcon(reaction) {
  return reactionOptions.find(item => item.name === reaction)?.icon || "👍";
}

async function loadPostReactions(postId, element) {
  const { data, error } = await supabase
    .from("post_reactions")
    .select("user_id,reaction")
    .eq("post_id", postId);

  if (error) {
    console.error("Post reactions error:", error);
    return;
  }

  const count = data?.length || 0;
  const myReaction = data?.find(
    item => item.user_id === currentUser?.id
  );

  const countElement = element.querySelector(".reaction-count");
  const button = element.querySelector(".post-like-button");

  if (countElement) countElement.textContent = count;

  if (button) {
    button.textContent = myReaction
      ? `${reactionIcon(myReaction.reaction)} ${myReaction.reaction}`
      : "👍 Like";

    button.classList.toggle("reacted", !!myReaction);
  }
}

async function savePostReaction(postId, reaction) {
  if (!currentUser) {
    alert("Please log in to react to posts.");
    return;
  }

  const { data: existing, error: findError } = await supabase
    .from("post_reactions")
    .select("id,reaction")
    .eq("post_id", postId)
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (findError) throw findError;

  if (existing?.reaction === reaction) {
    const { error } = await supabase
      .from("post_reactions")
      .delete()
      .eq("id", existing.id);

    if (error) throw error;

  } else if (existing) {
    const { error } = await supabase
      .from("post_reactions")
      .update({ reaction })
      .eq("id", existing.id);

    if (error) throw error;

  } else {
    const { error } = await supabase
      .from("post_reactions")
      .insert({
        post_id: postId,
        user_id: currentUser.id,
        reaction
      });

    if (error) throw error;
  }
}

/* =====================================
   COMMENTS AND REPLIES
===================================== */

async function loadComments(postId, container) {
  const { data: comments, error } = await supabase
    .from("comments")
    .select("id,post_id,user_id,content,created_at,parent_comment_id")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Comments error:", error);
    container.innerHTML = "<p>Could not load comments.</p>";
    return;
  }

  if (!comments?.length) {
    container.innerHTML = "<p class='no-comments'>No comments yet.</p>";
    return;
  }

  const userIds = [...new Set(comments.map(comment => comment.user_id))];

  const { data: people } = await supabase
    .from("profiles")
    .select("id,username,full_name,avatar_url")
    .in("id", userIds);

  const getPerson = id => people?.find(person => person.id === id);

  const roots = comments.filter(comment => !comment.parent_comment_id);

  container.innerHTML = roots.map(comment => {
    const person = getPerson(comment.user_id);

    const replies = comments.filter(
      reply => reply.parent_comment_id === comment.id
    );

    return `
      <div class="comment-item" data-comment-id="${comment.id}">
        <img class="comment-avatar"
             src="${escapeHTML(getAvatar(person))}"
             alt=""
             onerror="this.src='${fallbackAvatar}'">

        <div class="comment-content">
          <strong>${escapeHTML(getProfileName(person))}</strong>
          <p>${escapeHTML(comment.content)}</p>

          <div class="comment-actions">
            <button type="button"
                    class="comment-react-button"
                    data-comment-id="${comment.id}">
              React
            </button>

            <button type="button"
                    class="reply-button"
                    data-comment-id="${comment.id}">
              Reply
            </button>

            <span>${formatDate(comment.created_at)}</span>
          </div>

          <div class="comment-replies">
            ${replies.map(reply => {
              const replyPerson = getPerson(reply.user_id);

              return `
                <div class="reply-item">
                  <strong>${escapeHTML(getProfileName(replyPerson))}</strong>
                  <p>${escapeHTML(reply.content)}</p>
                </div>
              `;
            }).join("")}
          </div>

          <form class="reply-form hidden"
                data-parent-id="${comment.id}">
            <input type="text"
                   name="reply"
                   placeholder="Write a reply..."
                   required>
            <button type="submit">Reply</button>
          </form>
        </div>
      </div>
    `;
  }).join("");

  container.querySelectorAll(".reply-button").forEach(button => {
    button.addEventListener("click", () => {
      if (!currentUser) {
        alert("Please log in to reply.");
        return;
      }

      const form = container.querySelector(
        `.reply-form[data-parent-id="${button.dataset.commentId}"]`
      );

      form?.classList.toggle("hidden");
    });
  });

  container.querySelectorAll(".reply-form").forEach(form => {
    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) return;

      const input = form.querySelector("input[name='reply']");
      const content = input.value.trim();

      if (!content) return;

      const { error } = await supabase
        .from("comments")
        .insert({
          post_id: postId,
          user_id: currentUser.id,
          content,
          parent_comment_id: form.dataset.parentId
        });

      if (error) {
        alert("Could not send reply.");
        console.error(error);
        return;
      }

      await loadComments(postId, container);
    });
  });

  container.querySelectorAll(".comment-react-button").forEach(button => {
    button.addEventListener("click", () => {
      if (!currentUser) {
        alert("Please log in to react.");
        return;
      }

      showCommentReactionPicker(
        button,
        button.dataset.commentId,
        postId,
        container
      );
    });
  });
}

async function showCommentReactionPicker(
  button,
  commentId,
  postId,
  container
) {
  const existing = button.parentElement.querySelector(".reaction-picker");

  if (existing) {
    existing.remove();
    return;
  }

  const picker = document.createElement("div");
  picker.className = "reaction-picker";

  picker.innerHTML = reactionOptions.map(option => `
    <button type="button"
            data-reaction="${option.name}"
            title="${option.name}">
      ${option.icon}
    </button>
  `).join("");

  button.parentElement.appendChild(picker);

  picker.querySelectorAll("button").forEach(optionButton => {
    optionButton.addEventListener("click", async () => {
      try {
        const reaction = optionButton.dataset.reaction;

        const { data: existingReaction, error: findError } =
          await supabase
            .from("comment_reactions")
            .select("id,reaction")
            .eq("comment_id", commentId)
            .eq("user_id", currentUser.id)
            .maybeSingle();

        if (findError) throw findError;

        if (existingReaction?.reaction === reaction) {
          const { error } = await supabase
            .from("comment_reactions")
            .delete()
            .eq("id", existingReaction.id);

          if (error) throw error;

        } else if (existingReaction) {
          const { error } = await supabase
            .from("comment_reactions")
            .update({ reaction })
            .eq("id", existingReaction.id);

          if (error) throw error;

        } else {
          const { error } = await supabase
            .from("comment_reactions")
            .insert({
              comment_id: commentId,
              user_id: currentUser.id,
              reaction
            });

          if (error) throw error;
        }

        picker.remove();

      } catch (error) {
        console.error("Comment reaction error:", error);
        alert("Could not save your reaction.");
      }
    });
  });
}

/* =====================================
   LOAD PROFILE POSTS
===================================== */

async function loadPosts() {
  const container =
    $("postsContainer") ||
    $("profilePosts") ||
    $("postsList");

  if (!container || !profile?.id) return;

  container.innerHTML = "<p class='loading-text'>Loading posts...</p>";

  try {
    const { data: posts, error } = await supabase
      .from("posts")
      .select("id,user_id,content,image_url,video_url,video_name,created_at")
      .eq("user_id", profile.id)
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!posts?.length) {
      container.innerHTML = `
        <div class="empty-state">
          <p>No posts yet.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = posts.map(post => {
      const image = post.image_url
        ? `<img class="post-image"
                src="${escapeHTML(post.image_url)}"
                alt="Post image"
                loading="lazy">`
        : "";

      const video = post.video_url
        ? `
          <video class="post-video"
                 controls
                 playsinline
                 preload="metadata">
            <source src="${escapeHTML(post.video_url)}">
          </video>
          ${post.video_name
            ? `<small>${escapeHTML(post.video_name)}</small>`
            : ""}
        `
        : "";

      return `
        <article class="profile-post" data-post-id="${post.id}">
          <div class="post-author">
            <img src="${escapeHTML(getAvatar(profile))}"
                 alt=""
                 onerror="this.src='${fallbackAvatar}'">

            <div>
              <strong>${escapeHTML(getProfileName(profile))}</strong>
              <small>${formatDate(post.created_at)}</small>
            </div>
          </div>

          ${post.content
            ? `<p class="post-text">${escapeHTML(post.content)}</p>`
            : ""}

          ${image}
          ${video}

          <div class="post-actions">
            <button type="button" class="post-like-button">
              👍 Like
            </button>

            <span class="reaction-count">0</span>

            <button type="button" class="toggle-comments-button">
              💬 Comments
            </button>

            <button type="button" class="post-share-button">
              ↗ Share
            </button>
          </div>

          <div class="post-reaction-picker hidden">
            ${reactionOptions.map(option => `
              <button type="button"
                      data-reaction="${option.name}"
                      title="${option.name}">
                ${option.icon}
              </button>
            `).join("")}
          </div>

          <div class="post-comments hidden">
            <form class="comment-form">
              <input type="text"
                     name="comment"
                     placeholder="Write a comment..."
                     required>
              <button type="submit">Send</button>
            </form>

            <div class="comments-list">
              <p>Loading comments...</p>
            </div>
          </div>
        </article>
      `;
    }).join("");

    for (const post of posts) {
      const article = container.querySelector(
        `[data-post-id="${post.id}"]`
      );

      if (!article) continue;

      await loadPostReactions(post.id, article);

      const commentsArea = article.querySelector(".post-comments");
      const commentsList = article.querySelector(".comments-list");

      article.querySelector(".post-like-button")
        ?.addEventListener("click", () => {
          article.querySelector(".post-reaction-picker")
            ?.classList.toggle("hidden");
        });

      article.querySelectorAll(".post-reaction-picker button")
        .forEach(button => {
          button.addEventListener("click", async () => {
            try {
              await savePostReaction(post.id, button.dataset.reaction);
              await loadPostReactions(post.id, article);

              article.querySelector(".post-reaction-picker")
                ?.classList.add("hidden");

            } catch (error) {
              console.error(error);
              alert("Could not save your reaction.");
            }
          });
        });

      article.querySelector(".toggle-comments-button")
        ?.addEventListener("click", async () => {
          commentsArea.classList.toggle("hidden");

          if (!commentsArea.classList.contains("hidden")) {
            await loadComments(post.id, commentsList);
          }
        });

      article.querySelector(".comment-form")
        ?.addEventListener("submit", async event => {
          event.preventDefault();

          if (!currentUser) {
            alert("Please log in to comment.");
            return;
          }

          const input = event.target.querySelector("input[name='comment']");
          const content = input.value.trim();

          if (!content) return;

          const { error } = await supabase
            .from("comments")
            .insert({
              post_id: post.id,
              user_id: currentUser.id,
              content
            });

          if (error) {
            console.error(error);
            alert("Could not send your comment.");
            return;
          }

          input.value = "";
          await loadComments(post.id, commentsList);
        });

      article.querySelector(".post-share-button")
        ?.addEventListener("click", async () => {
          const shareUrl =
            `${window.location.origin}/profile.html?id=${profile.id}`;

          try {
            if (navigator.share) {
              await navigator.share({
                title: `${getProfileName(profile)} on Campusora`,
                text: post.content || "Check out this post on Campusora.",
                url: shareUrl
              });
            } else if (navigator.clipboard) {
              await navigator.clipboard.writeText(shareUrl);
              alert("Profile link copied.");
            } else {
              prompt("Copy this link:", shareUrl);
            }
          } catch (error) {
            if (error.name !== "AbortError") {
              console.error("Share error:", error);
            }
          }
        });
    }

  } catch (error) {
    console.error("Posts loading error:", error);

    container.innerHTML = `
      <div class="empty-state">
        <p>Could not load posts. Please refresh and try again.</p>
      </div>
    `;
  }
}

/* =====================================
   PHOTO VIEWER
===================================== */

const photoViewer = $("photoViewer");
const photoViewerImage = $("photoViewerImage");

function openPhotoViewer(source) {
  if (!photoViewer || !photoViewerImage) return;

  photoViewerImage.src = source;
  photoViewer.classList.remove("hidden");
}

$("closePhotoViewer")?.addEventListener("click", () => {
  photoViewer?.classList.add("hidden");
});

photoViewer?.addEventListener("click", event => {
  if (event.target === photoViewer) {
    photoViewer.classList.add("hidden");
  }
});

$("profileAvatar")?.addEventListener("click", () => {
  if (profile?.avatar_url) {
    openPhotoViewer(profile.avatar_url);
  }
});

$("profileCover")?.addEventListener("click", () => {
  if (profile?.cover_url) {
    openPhotoViewer(profile.cover_url);
  }
});

/* =====================================
   PAGE INITIALIZATION
===================================== */

async function initializeProfilePage() {
  try {
    currentUser = await getCurrentUser();

    profile = await findProfile();

    if (!profile) {
      showProfileError(
        currentUser
          ? "We could not find this profile."
          : "Please log in to view your profile."
      );
      return;
    }

    displayProfile(profile);

    if (currentUser?.id === profile.id) {
      $("followButton")?.classList.add("hidden");
      $("messageButton")?.classList.add("hidden");
      $("sendGiftOpenButton")?.classList.add("hidden");
    }

    await Promise.all([
      loadCounts(profile),
      checkFollowStatus(),
      updatePremiumDisplay(),
      loadPosts(),
      loadReceivedGifts()
    ]);

    await verifyPremiumPayment();
    await verifyGiftPayment();

  } catch (error) {
    console.error("Profile initialization failed:", error);

    showProfileError(
      "Your profile could not be loaded. Please refresh the page."
    );
  }
}

/* =====================================
   SHARED NAVIGATION
===================================== */

async function loadSharedNavigation() {
  try {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "./shared-nav.css";

    if (!document.querySelector('link[href="./shared-nav.css"]')) {
      document.head.appendChild(css);
    }

    const script = document.createElement("script");
    script.src = "./shared-nav.js";
    script.defer = true;
    document.body.appendChild(script);

  } catch (error) {
    console.error("Shared navigation error:", error);
  }
}

/* =====================================
   START
===================================== */

loadSharedNavigation();
initializeProfilePage();

</script>
