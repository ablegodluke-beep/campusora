<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Spotlight | Campusora</title><style>
:root{
  --bg:#080b18;
  --panel:#11162a;
  --purple:#8b5cf6;
  --blue:#4285ff;
  --cyan:#27d9f2;
  --text:#f5f7ff;
  --muted:#9aa5c2;
  --border:rgba(255,255,255,.1);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
a{color:inherit;text-decoration:none}

.topbar{
  height:52px;position:fixed;inset:0 0 auto;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 11px;background:rgba(8,11,24,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px)
}
.brand{font-size:15px;font-weight:800;letter-spacing:-.4px}
.brand span{color:var(--cyan)}
.top-actions{display:flex;align-items:center;gap:7px}
.small-btn{
  border:1px solid var(--border);background:#11162a;color:white;
  border-radius:9px;padding:8px 9px;font-size:10px
}
.upload-btn{
  background:linear-gradient(120deg,var(--purple),var(--blue));
  border:0;font-weight:700
}

.layout{
  position:fixed;inset:52px 0 0;
  display:flex;justify-content:center
}
.feed{
  width:min(100%,520px);height:100%;overflow-y:auto;
  scroll-snap-type:y mandatory;scrollbar-width:none;background:#050710
}
.feed::-webkit-scrollbar{display:none}
.video-card{
  height:100%;min-height:300px;position:relative;
  scroll-snap-align:start;scroll-snap-stop:always;
  overflow:hidden;background:#050710;isolation:isolate
}
.video-card video{
  width:100%;height:100%;position:absolute;inset:0;
  object-fit:contain;background:#050710
}
.video-card:after{
  content:"";position:absolute;z-index:1;inset:25% 0 0;
  pointer-events:none;
  background:linear-gradient(transparent,rgba(0,0,0,.08) 30%,rgba(0,0,0,.78))
}

.video-top{
  position:absolute;z-index:5;top:12px;left:12px;right:12px;
  display:flex;align-items:center;justify-content:space-between;
  pointer-events:none
}
.video-top>*{pointer-events:auto}
.tag{
  font-size:10px;background:rgba(12,16,32,.72);
  border:1px solid rgba(255,255,255,.14);
  padding:8px 10px;border-radius:20px;backdrop-filter:blur(12px)
}
.sound-btn{
  width:37px;height:37px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(12,16,32,.7);color:white;
  border-radius:50%;font-size:16px;backdrop-filter:blur(12px)
}

/* Compact floating video action panel */
.actions{
  position:absolute;z-index:6;right:8px;bottom:105px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:7px 4px;border:1px solid rgba(255,255,255,.15);
  border-radius:22px;background:rgba(8,11,24,.48);
  box-shadow:0 5px 25px rgba(0,0,0,.15);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:opacity .2s
}
.action{
  width:38px;min-height:40px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  border:0;background:transparent;color:white;padding:3px 0;
  border-radius:12px;transition:transform .18s
}
.action:active{transform:scale(.88)}
.action .icon{font-size:22px;line-height:1.05;text-shadow:0 2px 8px #000}
.action .count{
  font-size:9px;font-weight:700;text-shadow:0 1px 5px #000;
  max-width:43px;text-align:center;overflow-wrap:anywhere
}
.action.liked .icon{color:#ff5486;animation:heartPop .25s ease}
@keyframes heartPop{50%{transform:scale(1.3)}}

.video-info{
  position:absolute;z-index:4;bottom:0;left:0;right:56px;
  padding:16px 11px 16px;pointer-events:none
}
.video-info a,.video-info button{pointer-events:auto}
.creator{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.avatar{
  width:36px;height:36px;border-radius:50%;object-fit:cover;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;
  font-size:12px;font-weight:bold;flex-shrink:0
}
.creator-name{font-size:12px;font-weight:700}
.creator-school{font-size:10px;color:#c1c8dd;margin-top:3px}
.follow-btn{
  font-size:10px;border:1px solid rgba(255,255,255,.4);
  border-radius:7px;background:rgba(8,11,24,.45);color:white;
  padding:6px 8px;margin-left:3px;white-space:nowrap
}
.caption{font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.post-time{font-size:10px;color:#d0d5e6;margin-top:8px}

.empty{
  height:100%;min-height:300px;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:24px
}
.empty-box{max-width:290px}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty h2{font-size:17px;margin:0 0 9px}
.empty p{font-size:12px;line-height:1.7;color:var(--muted)}
.loading{padding:25px;text-align:center;font-size:12px;color:var(--muted)}
.primary{
  border:0;border-radius:9px;
  background:linear-gradient(120deg,var(--purple),var(--blue));
  color:white;padding:11px 15px;font-weight:700;font-size:12px
}

.bottom-nav{
  display:flex;position:fixed;z-index:25;bottom:0;left:0;right:0;
  height:56px;padding-bottom:env(safe-area-inset-bottom);
  background:rgba(8,11,24,.98);border-top:1px solid var(--border);
  align-items:center;justify-content:space-around
}
.nav-link{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:9px
}
.nav-link span{font-size:19px}
.nav-link.active{color:var(--cyan)}

/* Comments backdrop */
.comments-backdrop{
  position:fixed;z-index:39;inset:52px 0 0;
  background:rgba(0,0,0,.55);opacity:0;visibility:hidden;
  transition:opacity .25s,visibility .25s
}
.comments-backdrop.open{opacity:1;visibility:visible}

/* Sliding bottom-sheet comments */
.comments-sheet{
  position:fixed;z-index:40;left:0;right:0;bottom:0;
  height:min(70dvh,600px);
  display:flex;flex-direction:column;
  background:#101529;border:1px solid rgba(255,255,255,.12);
  border-bottom:0;border-radius:20px 20px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.35);
  transform:translateY(105%);visibility:hidden;
  transition:transform .3s ease,visibility .3s;
  padding-bottom:env(safe-area-inset-bottom);
  overflow:hidden
}
.comments-sheet.open{transform:translateY(0);visibility:visible}
.sheet-handle{
  width:38px;height:4px;border-radius:5px;background:#606982;
  margin:9px auto 7px;flex-shrink:0
}
.sheet-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 15px 12px;border-bottom:1px solid var(--border);
  flex-shrink:0
}
.sheet-title{font-size:14px;font-weight:700}
.sheet-subtitle{font-size:10px;color:var(--muted);margin-top:3px}
.sheet-close{
  width:31px;height:31px;border:1px solid var(--border);
  border-radius:50%;background:#1b223b;color:white;font-size:19px
}
.comments-list{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 13px;display:flex;flex-direction:column;gap:16px;
  min-height:0
}
.comment{
  display:flex;gap:9px;align-items:flex-start;
  font-size:12px;line-height:1.5;overflow-wrap:anywhere
}
.comment-avatar-link{flex-shrink:0}
.comment-avatar{width:32px;height:32px}
.comment-body{min-width:0;flex:1}
.comment-name{font-size:11px;font-weight:700;display:block;margin-bottom:3px}
.comment-content{font-size:12px;color:#e8ebf8;white-space:pre-wrap}
.comment-time{font-size:9px;color:var(--muted);margin-top:5px}
.comments-empty{
  margin:auto;text-align:center;max-width:250px;padding:20px 10px;
  color:var(--muted);font-size:12px;line-height:1.7
}
.comments-empty b{display:block;font-size:15px;color:white;margin-bottom:6px}

/* Fixed composer at the bottom of comments */
.comment-composer{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;border-top:1px solid var(--border);
  background:#0c1122;flex-shrink:0
}
.comment-input{
  flex:1;min-width:0;max-height:100px;min-height:39px;
  resize:none;border:1px solid rgba(255,255,255,.12);
  border-radius:19px;background:#171d33;color:white;
  padding:11px 13px;font-size:12px;line-height:1.4;outline:none
}
.comment-input:focus{border-color:var(--purple)}
.comment-send{
  width:40px;height:39px;flex-shrink:0;border:0;border-radius:50%;
  color:white;font-size:17px;
  background:linear-gradient(135deg,var(--purple),var(--blue))
}
.comment-send:disabled{opacity:.4}

/* Upload dialog */
.overlay{
  position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.76);
  display:none;align-items:center;justify-content:center;padding:15px
}
.modal{
  width:min(100%,410px);max-height:85dvh;overflow:auto;
  background:var(--panel);border:1px solid var(--border);
  border-radius:15px;padding:15px
}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:13px
}
.modal-head h3{font-size:15px;margin:0}
.close-btn{border:0;background:transparent;color:white;font-size:23px}
.field{
  width:100%;background:#090d1c;border:1px solid var(--border);
  border-radius:9px;color:white;padding:11px;margin:7px 0 12px;font-size:12px
}
textarea.field{min-height:80px;resize:vertical}
.label{font-size:11px;color:var(--muted)}
.hint{font-size:10px;line-height:1.6;color:var(--muted);margin:0 0 12px}
.progress{
  height:4px;background:#252b43;border-radius:9px;overflow:hidden;
  display:none;margin:10px 0
}
.progress-bar{height:100%;width:0;background:var(--cyan);transition:width .2s}
.toast{
  position:fixed;z-index:100;bottom:68px;left:50%;
  transform:translateX(-50%);background:#202944;
  border:1px solid var(--border);padding:10px 14px;
  border-radius:9px;font-size:11px;max-width:90%;
  display:none;text-align:center
}

@media(min-width:700px){
  .topbar{height:55px}
  .layout{top:55px;bottom:0}
  .feed{border-left:1px solid var(--border);border-right:1px solid var(--border)}
  .video-card{height:100%}
  .comments-backdrop{top:55px}
  .comments-sheet{
    left:50%;right:auto;width:min(100%,520px);
    transform:translate(-50%,105%)
  }
  .comments-sheet.open{transform:translate(-50%,0)}
  .bottom-nav{display:none}
  .toast{bottom:20px}
}

@media(max-width:380px){
  .brand{font-size:13px}
  .small-btn{padding:7px;font-size:9px}
  .comments-sheet{height:75dvh}
}
</style></head><body><header class="topbar">
  <a class="brand" href="index.html">Campusora <span>Spotlight</span></a>
  <div class="top-actions">
    <button class="small-btn" id="refreshBtn">↻ Refresh</button>
    <button class="small-btn upload-btn" id="uploadBtn">＋ Upload</button>
  </div>
</header><main class="layout">
  <section class="feed" id="feed" aria-label="Spotlight videos">

</main><nav class="bottom-nav">

  <a class="nav-link" href="explore.html"><span>⌕</span>Explore</a>
  <a class="nav-link active" href="spotlight.html"><span>▶</span>Spotlight</a>
  <a class="nav-link" href="communities.html"><span>♧</span>Communities</a>
  <a class="nav-link" href="messages.html"><span>✉</span>Messages</a>
</nav><div class="comments-backdrop" id="commentsBackdrop"></div><section class="comments-sheet" id="commentsSheet" aria-label="Video comments">
  <div class="sheet-handle"></div>  <header class="sheet-header">
    <div>
      <div class="sheet-title">Comments <span id="commentCount"></span></div>
      <div class="sheet-subtitle">Join the conversation</div>
    </div>
    <button class="sheet-close" id="closeComments" aria-label="Close comments">×</button>
  </header>  <div class="comments-list" id="commentList">
    <div class="comments-empty">Loading comments…</div>
  </div>  <form class="comment-composer" id="commentForm">
    <textarea class="comment-input" id="commentText"
      maxlength="2000" rows="1" placeholder="Add a comment…" required></textarea>
    <button class="comment-send" id="commentSend" type="submit" aria-label="Send comment">➤</button>
  </form>
</section><div class="overlay" id="uploadOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>＋ Upload to Spotlight</h3>
      <button class="close-btn" data-close="uploadOverlay">×</button>
    </div><form id="uploadForm">
  <label class="label" for="videoFile">Choose a video</label>
  <input class="field" type="file" id="videoFile"
    accept="video/mp4,video/webm,video/quicktime" required>

  <p class="hint">MP4, WebM or MOV. Maximum size: 50 MB.</p>

  <label class="label" for="caption">Caption</label>
  <textarea class="field" id="caption" maxlength="1000"
    placeholder="What's happening on your campus?"></textarea>

  <div class="progress" id="progress">

  <p class="hint" id="uploadStatus">

    Publish video
  </button>
</form>

  </div>
</div><div class="toast" id="toast"></div><script type="module">
import { supabase } from './supabase.js';

const $ = id => document.getElementById(id);
const feed = $('feed');

let currentUser = null;
let videos = [];
let observer = null;
let commentsVideoId = null;
let commentsOpen = false;
const viewedThisSession = new Set();
const likeBusy = new Set();

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.style.display='block';
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.style.display='none',3000);
}

function escapeHTML(value=''){
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function shortNumber(n=0){
  n=Number(n)||0;
  if(n>=1000000)return (n/1000000).toFixed(1)+'m';
  if(n>=1000)return (n/1000).toFixed(1)+'k';
  return String(n);
}

function initials(name='Campusora member'){
  return name.trim().split(/\s+/).slice(0,2)
    .map(part=>part[0]||'').join('').toUpperCase()||'C';
}

function dateLabel(date){
  const elapsed=Date.now()-new Date(date).getTime();
  if(!Number.isFinite(elapsed))return '';
  if(elapsed<60000)return 'Just now';
  if(elapsed<3600000)return Math.floor(elapsed/60000)+'m ago';
  if(elapsed<86400000)return Math.floor(elapsed/3600000)+'h ago';
  return Math.floor(elapsed/86400000)+'d ago';
}

function profileURL(userId){
  return 'profile.html?id='+encodeURIComponent(userId);
}

async function getSession(){
  const {data,error}=await supabase.auth.getSession();
  if(error)throw error;
  currentUser=data.session?.user||null;
}

function requireLogin(){
  if(currentUser)return true;
  toast('Please sign in to use Spotlight.');
  setTimeout(()=>location.href='index.html',1200);
  return false;
}

async function loadVideos(){
  if(observer)observer.disconnect();
  feed.innerHTML='<div class="loading">Loading Spotlight videos…</div>';

  try{
    const {data,error}=await supabase.from('spotlight_videos')
      .select('id,user_id,caption,video_url,thumbnail_url,institution_id,view_count,created_at')
      .order('created_at',{ascending:false}).limit(40);

    if(error)throw error;
    const rows=data||[];

    if(!rows.length){
      feed.innerHTML=`
        <div class="empty"><div class="empty-box">
          <div class="empty-icon">🎬</div>
          <h2>Your Spotlight starts here</h2>
          <p>Share campus moments, talents, funny clips and useful ideas.
          Be the first to upload a video to Campusora Spotlight.</p>
          <button class="primary" id="firstUpload">＋ Upload first video</button>
        </div></div>`;
      $('firstUpload').onclick=openUpload;
      return;
    }

    const userIds=[...new Set(rows.map(v=>v.user_id))];
    const videoIds=rows.map(v=>v.id);

    const [profilesRes,likesRes,mineRes]=await Promise.all([
      supabase.from('profiles')
        .select('id,username,full_name,avatar_url,school,role').in('id',userIds),
      supabase.from('spotlight_likes')
        .select('video_id').in('video_id',videoIds),
      currentUser
        ?supabase.from('spotlight_likes').select('video_id')
          .eq('user_id',currentUser.id).in('video_id',videoIds)
        :Promise.resolve({data:[],error:null})
    ]);

    if(profilesRes.error)throw profilesRes.error;
    if(likesRes.error)throw likesRes.error;
    if(mineRes.error)throw mineRes.error;

    const profileMap=new Map((profilesRes.data||[]).map(p=>[p.id,p]));
    const counts=new Map();

    (likesRes.data||[]).forEach(l=>{
      counts.set(l.video_id,(counts.get(l.video_id)||0)+1);
    });

    const mine=new Set((mineRes.data||[]).map(l=>l.video_id));

    videos=rows.map(v=>({
      ...v,
      profile:profileMap.get(v.user_id)||{},
      likeCount:counts.get(v.id)||0,
      liked:mine.has(v.id)
    }));

    renderVideos();

    /* If a shared link contains a video ID, scroll to that video. */
    if(location.hash){
      const targetId=decodeURIComponent(location.hash.slice(1));
      const target=feed.querySelector(`[data-video-id="${CSS.escape(targetId)}"]`);
      if(target)target.scrollIntoView({behavior:'smooth'});
    }

  }catch(error){
    console.error('Spotlight load error:',error);
    feed.innerHTML=`
      <div class="empty"><div class="empty-box">
        <div class="empty-icon">⚠️</div>
        <h2>Couldn't load Spotlight</h2>
        <p>${escapeHTML(error.message||'Please try again.')}</p>
        <button class="primary" id="retryBtn">Try again</button>
      </div></div>`;
    $('retryBtn').onclick=loadVideos;
  }
}

function renderVideos(){
  if(observer)observer.disconnect();

  feed.innerHTML=videos.map(v=>{
    const p=v.profile||{};
    const name=p.full_name||(p.username?'@'+p.username:'Campusora member');
    const school=p.school||(p.role?p.role[0].toUpperCase()+p.role.slice(1):'Campusora member');

    const avatar=p.avatar_url
      ?`<img class="avatar" src="${escapeHTML(p.avatar_url)}" alt="" loading="lazy">`
      :`<div class="avatar">${escapeHTML(initials(name))}</div>`;

    return `
      <article class="video-card" data-video-id="${escapeHTML(v.id)}">
        <video src="${escapeHTML(v.video_url)}"
          ${v.thumbnail_url?`poster="${escapeHTML(v.thumbnail_url)}"`:''}
          playsinline loop preload="metadata" muted controlslist="nodownload"></video>

        <div class="video-top">
          <span class="tag">✦ CAMPUSORA SPOTLIGHT</span>
          <button class="sound-btn" data-action="sound" aria-label="Toggle sound">🔇</button>
        </div>

        <div class="actions">
          <button class="action ${v.liked?'liked':''}" data-action="like" aria-label="Like">
            <span class="icon">${v.liked?'♥':'♡'}</span>
            <span class="count like-count">${shortNumber(v.likeCount)}</span>
          </button>
          <button class="action" data-action="comments" aria-label="Comments">
            <span class="icon">▢</span><span class="count">Comments</span>
          </button>
          <button class="action" data-action="share" aria-label="Share">
            <span class="icon">↗</span><span class="count">Share</span>
          </button>
          <button class="action" data-action="views" aria-label="Views">
            <span class="icon">◉</span><span class="count view-count">${shortNumber(v.view_count)}</span>
          </button>
        </div>

        <div class="video-info">
          <div class="creator">
            <a href="${profileURL(v.user_id)}" aria-label="Open creator profile">${avatar}</a>
            <div style="min-width:0">
              <a class="creator-name" href="${profileURL(v.user_id)}">${escapeHTML(name)}</a>
              <div class="creator-school">${escapeHTML(school)}</div>
            </div>
            ${currentUser&&currentUser.id!==v.user_id
              ?`<a class="follow-btn" href="${profileURL(v.user_id)}">View profile</a>`:''}
          </div>
          ${v.caption?`<div class="caption">${escapeHTML(v.caption)}</div>`:''}
          <div class="post-time">♫ Original video · ${dateLabel(v.created_at)}</div>
        </div>
      </article>`;
  }).join('');

  setupObserver();
}

function setupObserver(){
  observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video=entry.target.querySelector('video');

      if(entry.isIntersecting&&entry.intersectionRatio>=.65){
        document.querySelectorAll('.video-card video').forEach(other=>{
          if(other!==video)other.pause();
        });
        if(!commentsOpen)video.play().catch(()=>{});
        recordView(entry.target.dataset.videoId,entry.target.querySelector('.view-count'));
      }else{
        video.pause();
      }
    });
  },{root:feed,threshold:[.2,.65,.9]});

  document.querySelectorAll('.video-card').forEach(card=>observer.observe(card));
}

async function recordView(videoId,countElement){
  if(viewedThisSession.has(videoId)||!currentUser)return;
  viewedThisSession.add(videoId);

  try{
    const {data,error}=await supabase.rpc(
      'campusora_increment_spotlight_view',{target_video_id:videoId}
    );
    if(error)throw error;
    if(countElement)countElement.textContent=shortNumber(data);
  }catch(error){
    viewedThisSession.delete(videoId);
    console.warn('Could not record view:',error.message);
  }
}

async function toggleLike(videoId,button){
  if(!requireLogin()||likeBusy.has(videoId))return;
  likeBusy.add(videoId);

  const v=videos.find(item=>item.id===videoId);
  if(!v){likeBusy.delete(videoId);return;}

  const wasLiked=v.liked;
  v.liked=!wasLiked;
  v.likeCount=Math.max(0,v.likeCount+(wasLiked?-1:1));

  button.classList.toggle('liked',v.liked);
  button.querySelector('.icon').textContent=v.liked?'♥':'♡';
  button.querySelector('.like-count').textContent=shortNumber(v.likeCount);

  try{
    if(wasLiked){
      const {error}=await supabase.from('spotlight_likes').delete()
        .eq('video_id',videoId).eq('user_id',currentUser.id);
      if(error)throw error;
    }else{
      const {error}=await supabase.from('spotlight_likes').insert({
        video_id:videoId,user_id:currentUser.id
      });
      if(error)throw error;
    }
  }catch(error){
    v.liked=wasLiked;
    v.likeCount=Math.max(0,v.likeCount+(wasLiked?1:-1));
    button.classList.toggle('liked',v.liked);
    button.querySelector('.icon').textContent=v.liked?'♥':'♡';
    button.querySelector('.like-count').textContent=shortNumber(v.likeCount);
    toast(error.message||'Could not update like.');
  }finally{
    likeBusy.delete(videoId);
  }
}

/* Open the comments sheet and pause the current video. */
async function openComments(videoId){
  if(!requireLogin())return;

  commentsVideoId=videoId;
  commentsOpen=true;

  const card=feed.querySelector(`[data-video-id="${CSS.escape(videoId)}"]`);
  if(card)card.querySelector('video')?.pause();

  $('commentList').innerHTML='<div class="comments-empty">Loading comments…</div>';
  $('commentCount').textContent='';
  $('commentText').value='';

  $('commentsBackdrop').classList.add('open');
  $('commentsSheet').classList.add('open');
  document.body.style.overflow='hidden';

  await loadComments(videoId);

  setTimeout(()=>$('commentText').focus({preventScroll:true}),250);
}

function closeComments(){
  commentsOpen=false;
  commentsVideoId=null;

  $('commentsBackdrop').classList.remove('open');
  $('commentsSheet').classList.remove('open');
  document.body.style.overflow='';

  const card=feed.querySelector('.video-card');
  const video=card?.querySelector('video');

  if(video&&card&&card.getBoundingClientRect().bottom>0&&
     card.getBoundingClientRect().top<window.innerHeight){
    video.play().catch(()=>{});
  }
}

async function loadComments(videoId){
  try{
    const {data,error}=await supabase.from('spotlight_comments')
      .select('id,user_id,content,created_at')
      .eq('video_id',videoId)
      .order('created_at',{ascending:true})
      .limit(100);

    if(error)throw error;

    const comments=data||[];
    $('commentCount').textContent=`(${comments.length})`;

    if(!comments.length){
      $('commentList').innerHTML=`
        <div class="comments-empty">
          <b>No comments yet 💬</b>
          Be the first to share your thoughts on this video.
        </div>`;
      return;
    }

    const ids=[...new Set(comments.map(c=>c.user_id))];

    const {data:profiles,error:profileError}=await supabase.from('profiles')
      .select('id,username,full_name,avatar_url')
      .in('id',ids);

    if(profileError)throw profileError;

    const map=new Map((profiles||[]).map(p=>[p.id,p]));

    $('commentList').innerHTML=comments.map(c=>{
      const p=map.get(c.user_id)||{};
      const name=p.full_name||(p.username?'@'+p.username:'Campusora member');

      const avatar=p.avatar_url
        ?`<img class="avatar comment-avatar" src="${escapeHTML(p.avatar_url)}" alt="">`
        :`<div class="avatar comment-avatar">${escapeHTML(initials(name))}</div>`;

      return `
        <article class="comment">
          <a class="comment-avatar-link" href="${profileURL(c.user_id)}">${avatar}</a>
          <div class="comment-body">
            <a class="comment-name" href="${profileURL(c.user_id)}">${escapeHTML(name)}</a>
            <div class="comment-content">${escapeHTML(c.content)}</div>
            <div class="comment-time">${dateLabel(c.created_at)}</div>
          </div>
        </article>`;
    }).join('');

    $('commentList').scrollTop=$('commentList').scrollHeight;

  }catch(error){
    console.error('Comment loading error:',error);
    $('commentList').innerHTML=`
      <div class="comments-empty">
        <b>Couldn't load comments</b>
        ${escapeHTML(error.message||'Please try again.')}
      </div>`;
  }
}

async function submitComment(event){
  event.preventDefault();

  if(!requireLogin()||!commentsVideoId)return;

  const content=$('commentText').value.trim();
  if(!content)return;

  const videoId=commentsVideoId;
  const button=$('commentSend');

  button.disabled=true;

  try{
    const {error}=await supabase.from('spotlight_comments').insert({
      video_id:videoId,
      user_id:currentUser.id,
      content
    });

    if(error)throw error;

    $('commentText').value='';
    $('commentText').style.height='39px';

    await loadComments(videoId);

  }catch(error){
    toast(error.message||'Could not post comment.');
  }finally{
    button.disabled=false;
    $('commentText').focus({preventScroll:true});
  }
}

async function shareVideo(videoId){
  const url=new URL('spotlight.html',location.href);
  url.hash=videoId;

  try{
    if(navigator.share){
      await navigator.share({
        title:'Campusora Spotlight',
        text:'Watch this video on Campusora',
        url:url.href
      });
    }else if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(url.href);
      toast('Video link copied.');
    }else{
      prompt('Copy this video link:',url.href);
    }
  }catch(error){
    if(error.name!=='AbortError')toast('Could not share this video.');
  }
}

function openUpload(){
  if(!requireLogin())return;
  $('uploadForm').reset();
  $('progress').style.display='none';
  $('progressBar').style.width='0%';
  $('uploadStatus').textContent='Your video will be visible to signed-in Campusora members.';
  $('uploadOverlay').style.display='flex';
}

async function uploadVideo(event){
  event.preventDefault();
  if(!requireLogin())return;

  const file=$('videoFile').files[0];
  const caption=$('caption').value.trim();

  if(!file){toast('Choose a video first.');return;}

  const types={
    'video/mp4':'mp4',
    'video/webm':'webm',
    'video/quicktime':'mov'
  };

  if(!types[file.type]){
    toast('Choose an MP4, WebM or MOV video.');
    return;
  }

  if(file.size>50*1024*1024){
    toast('Your video is larger than 50 MB.');
    return;
  }

  const button=$('publishBtn');
  button.disabled=true;

  $('progress').style.display='block';
  $('progressBar').style.width='10%';
  $('uploadStatus').textContent='Uploading video… Please keep this page open.';

  const path=`${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${types[file.type]}`;
  let uploadedPath=null;

  try{
    const {data,error}=await supabase.storage.from('campusora-videos')
      .upload(path,file,{
        contentType:file.type,
        upsert:false,
        cacheControl:'3600'
      });

    if(error)throw error;
    uploadedPath=data.path;

    $('progressBar').style.width='75%';
    $('uploadStatus').textContent='Saving video details…';

    const {data:publicData}=supabase.storage.from('campusora-videos').getPublicUrl(path);

    const {error:insertError}=await supabase.from('spotlight_videos').insert({
      user_id:currentUser.id,
      caption,
      video_url:publicData.publicUrl
    });

    if(insertError)throw insertError;

    $('progressBar').style.width='100%';
    $('uploadOverlay').style.display='none';
    toast('Your video is live on Spotlight!');

    await loadVideos();
    feed.scrollTo({top:0,behavior:'smooth'});

  }catch(error){
    console.error('Upload error:',error);

    if(uploadedPath){
      const {error:cleanupError}=await supabase.storage.from('campusora-videos').remove([uploadedPath]);
      if(cleanupError)console.warn(cleanupError.message);
    }

    $('uploadStatus').textContent=error.message||'Upload failed. Please try again.';
    toast(error.message||'Could not upload video.');

  }finally{
    button.disabled=false;
  }
}

feed.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');
  if(!button)return;

  const card=button.closest('.video-card');
  if(!card)return;

  const videoId=card.dataset.videoId;

  if(button.dataset.action==='like'){
    await toggleLike(videoId,button);
  }

  if(button.dataset.action==='comments'){
    await openComments(videoId);
  }

  if(button.dataset.action==='share'){
    await shareVideo(videoId);
  }

  if(button.dataset.action==='sound'){
    const video=card.querySelector('video');
    video.muted=!video.muted;
    button.textContent=video.muted?'🔇':'🔊';
    if(!video.muted)video.play().catch(()=>{});
  }
});

feed.addEventListener('dblclick',event=>{
  const card=event.target.closest('.video-card');

  if(!card||event.target.closest('button')||event.target.closest('a'))return;

  const video=videos.find(v=>v.id===card.dataset.videoId);
  const button=card.querySelector('[data-action="like"]');

  if(video&&!video.liked)toggleLike(video.id,button);
});

$('uploadBtn').addEventListener('click',openUpload);
$('refreshBtn').addEventListener('click',loadVideos);
$('uploadForm').addEventListener('submit',uploadVideo);
$('commentForm').addEventListener('submit',submitComment);

$('closeComments').addEventListener('click',closeComments);
$('commentsBackdrop').addEventListener('click',closeComments);

document.querySelectorAll('[data-close]').forEach(button=>{
  button.addEventListener('click',()=>{
    $(button.dataset.close).style.display='none';
  });
});

$('commentText').addEventListener('input',event=>{
  const input=event.target;
  input.style.height='39px';
  input.style.height=Math.min(input.scrollHeight,100)+'px';
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    closeComments();
    $('uploadOverlay').style.display='none';
  }
});

/* Swipe down on the comments sheet to close it. */
let touchStartY=0;

$('commentsSheet').addEventListener('touchstart',event=>{
  touchStartY=event.touches[0].clientY;
},{passive:true});

$('commentsSheet').addEventListener('touchend',event=>{
  const endY=event.changedTouches[0].clientY;
  const distance=endY-touchStartY;

  if(distance>100&&$('commentList').scrollTop<=0){
    closeComments();
  }
},{passive:true});

async function init(){
  try{
    await getSession();
    await loadVideos();

    supabase.auth.onAuthStateChange((_event,session)=>{
      currentUser=session?.user||null;
      loadVideos();
    });

  }catch(error){
    console.error(error);

    feed.innerHTML=`
      <div class="empty"><div class="empty-box">
        <h2>Connection issue</h2>
        <p>${escapeHTML(error.message||'Could not connect to Campusora.')}</p>
        <button class="primary" id="retryBtn">Try again</button>
      </div></div>`;

    $('retryBtn').onclick=init;
  }
}

init();
