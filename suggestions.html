<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>Suggestions | Campusora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="shared-nav.css">

<style>
:root {
  --bg:#080b18;
  --surface:#101426;
  --surface2:#171d32;
  --border:rgba(255,255,255,.09);
  --text:#f5f6ff;
  --muted:#929bb6;
  --purple:#925bff;
  --blue:#526dff;
  --cyan:#39d7f5;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 15% 0%,#21164a 0,transparent 38%),
    var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
}

button,input {
  font:inherit;
}

button {
  cursor:pointer;
}

.page {
  width:min(100%,1100px);
  margin:auto;
  padding:12px 16px 35px;
}

/* SMALL TOP AREA */

.top-line {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  margin-bottom:13px;
  min-height:36px;
}

.tagline {
  color:#aeb9d4;
  font-size:11px;
  font-style:italic;
  font-weight:500;
  text-align:right;
  line-height:1.4;
}

.search-toggle {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 12px;
  border:1px solid rgba(146,91,255,.4);
  border-radius:10px;
  background:#17172e;
  color:white;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.search-toggle span {
  color:var(--cyan);
  font-size:16px;
}

.search-panel {
  display:none;
  margin-bottom:14px;
}

.search-panel.open {
  display:block;
}

.search-panel input {
  width:100%;
  height:43px;
  padding:0 14px;
  border:1px solid rgba(146,91,255,.4);
  border-radius:11px;
  outline:none;
  background:var(--surface);
  color:white;
  font-size:13px;
}

.search-panel input:focus {
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(57,215,245,.09);
}

/* PEOPLE */

.people-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.person-card {
  min-width:0;
  padding:15px;
  border:1px solid var(--border);
  border-radius:15px;
  background:linear-gradient(145deg,#171d33,#101426);
  animation:appear .25s ease both;
}

.person-top {
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.avatar-link {
  flex-shrink:0;
  text-decoration:none;
}

.avatar {
  width:53px;
  height:53px;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--blue),var(--cyan));
  color:white;
  font-size:19px;
  font-weight:800;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info {
  min-width:0;
}

.person-name {
  display:block;
  overflow-wrap:anywhere;
  color:white;
  font-size:13px;
  font-weight:800;
  text-decoration:none;
}

.person-name:hover {
  color:var(--cyan);
}

.username {
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  overflow-wrap:anywhere;
}

.role-badge {
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:7px;
  background:#34265e;
  color:#c9b9ff;
  font-size:10px;
  font-weight:700;
}

.role-badge.alumni {
  background:#16473e;
  color:#7df0c6;
}

.role-badge.general {
  background:#203951;
  color:#8dd7ff;
}

/* SCHOOL */

.school {
  display:flex;
  align-items:flex-start;
  gap:7px;
  min-height:35px;
  margin:15px 0 13px;
  padding:8px 10px;
  border:1px solid rgba(57,215,245,.14);
  border-radius:9px;
  background:rgba(57,215,245,.045);
  color:#b8c6e0;
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.school-icon {
  flex-shrink:0;
  color:var(--cyan);
  font-size:14px;
}

/* ACTIONS */

.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.action-btn {
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding:10px 6px;
  border:1px solid #373f56;
  border-radius:9px;
  background:#1b2234;
  color:white;
  font-size:11px;
  font-weight:800;
  text-align:center;
  text-decoration:none;
}

.action-btn.follow {
  border-color:transparent;
  background:linear-gradient(110deg,var(--purple),var(--blue));
}

.action-btn.following {
  background:#172e36;
  border-color:#286477;
  color:#8ce8f3;
}

.action-btn.message {
  background:transparent;
  border-color:rgba(57,215,245,.35);
  color:var(--cyan);
}

.action-btn:disabled {
  opacity:.6;
  cursor:wait;
}

/* STATUS */

.status {
  grid-column:1/-1;
  padding:35px 15px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  color:var(--muted);
  text-align:center;
  font-size:12px;
  line-height:1.8;
}

.status-icon {
  display:block;
  margin-bottom:9px;
  color:var(--cyan);
  font-size:25px;
}

.progress-text {
  margin-top:9px;
  color:#9eacd0;
  font-size:11px;
}

.message-box {
  display:none;
  padding:11px 13px;
  margin-bottom:12px;
  border-radius:10px;
  font-size:12px;
}

.message-box.success {
  display:block;
  color:#9af1d0;
  background:#10352d;
  border:1px solid #216b56;
}

.message-box.error {
  display:block;
  color:#ffb2c0;
  background:#391b29;
  border:1px solid #79344b;
}

.refresh-area {
  display:flex;
  justify-content:center;
  margin:18px 0;
}

.refresh-btn {
  padding:9px 15px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:white;
  font-size:11px;
  font-weight:700;
}

.refresh-btn:disabled {
  opacity:.5;
}

.login-link {
  display:inline-block;
  margin-top:10px;
  color:var(--cyan);
  text-decoration:none;
  font-weight:700;
}

@keyframes appear {
  from {
    opacity:0;
    transform:translateY(6px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:650px) {
  .page {
    padding:10px 11px 25px;
  }

  .people-grid {
    grid-template-columns:1fr;
    gap:10px;
  }

  .person-card {
    padding:14px;
  }

  .tagline {
    font-size:10px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body data-page-title="Suggestions">

<main class="page">

  <div class="top-line">
    <div class="tagline">
      Connect with students, alumni and friends
    </div>

    <button class="search-toggle" id="searchToggle" type="button">
      <span>⌕</span>
      Search Users
    </button>
  </div>

  <div class="search-panel" id="searchPanel">
    <input
      id="searchInput"
      type="search"
      placeholder="Search by name, username or school..."
      autocomplete="off"
    >
  </div>

  <div id="messageBox" class="message-box"></div>

  <section class="people-grid" id="peopleList">
    <div class="status">
      <span class="status-icon">✦</span>
      Loading Campusora members...
    </div>
  </section>

  <div class="refresh-area">
    <button class="refresh-btn" id="refreshBtn" type="button">
      ↻ Refresh suggestions
    </button>
  </div>

</main>

<script defer src="shared-nav.js"></script>

<script type="module">
import { supabase } from './supabase.js';

const peopleList = document.getElementById('peopleList');
const searchInput = document.getElementById('searchInput');
const searchToggle = document.getElementById('searchToggle');
const searchPanel = document.getElementById('searchPanel');
const refreshBtn = document.getElementById('refreshBtn');
const messageBox = document.getElementById('messageBox');

const PAGE_SIZE = 50;

let currentUser = null;
let profiles = [];
let followingIds = new Set();
let busyIds = new Set();
let loading = false;

function escapeHTML(value = '') {
  return String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function getName(profile) {
  return profile.full_name || profile.username || 'Campusora Member';
}

function getInitial(profile) {
  return getName(profile).trim().charAt(0).toUpperCase() || 'C';
}

function profileURL(profile) {
  return 'profile.html?id=' + encodeURIComponent(profile.id);
}

function roleBadge(role) {
  const safeRole = ['student','alumni','general'].includes(
    String(role || '').toLowerCase()
  ) ? String(role).toLowerCase() : 'general';

  const labels = {
    student:'Student',
    alumni:'Alumni',
    general:'General Member'
  };

  return `
    <span class="role-badge ${safeRole}">
      ${labels[safeRole]}
    </span>
  `;
}

function avatarHTML(profile) {
  const initial = escapeHTML(getInitial(profile));

  if (!profile.avatar_url) {
    return `<div class="avatar">${initial}</div>`;
  }

  return `
    <div class="avatar">
      <img
        src="${escapeHTML(profile.avatar_url)}"
        alt=""
        loading="lazy"
        onerror="this.style.display='none';this.parentElement.textContent='${initial}'"
      >
    </div>
  `;
}

function showMessage(message,type='success') {
  messageBox.textContent = message;
  messageBox.className = 'message-box ' + type;

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(() => {
    messageBox.className = 'message-box';
  },4000);
}

function renderPeople() {
  const search = searchInput.value.trim().toLowerCase();

  const results = profiles.filter(profile => {
    if (!search) return true;

    const searchable = [
      profile.full_name,
      profile.username,
      profile.school,
      profile.role
    ].filter(Boolean).join(' ').toLowerCase();

    return searchable.includes(search);
  });

  if (!results.length) {
    peopleList.innerHTML = `
      <div class="status">
        <span class="status-icon">◎</span>
        No matching users found.
      </div>
    `;
    return;
  }

  peopleList.innerHTML = results.map(profile => {
    const isFollowing = followingIds.has(profile.id);
    const isBusy = busyIds.has(profile.id);

    return `
      <article class="person-card">

        <div class="person-top">

          <a class="avatar-link" href="${profileURL(profile)}">
            ${avatarHTML(profile)}
          </a>

          <div class="person-info">

            <a class="person-name" href="${profileURL(profile)}">
              ${escapeHTML(getName(profile))}
            </a>

            <div class="username">
              ${profile.username
                ? '@' + escapeHTML(profile.username)
                : 'Campusora member'}
            </div>

            ${roleBadge(profile.role)}

          </div>
        </div>

        <div class="school">
          <span class="school-icon">◆</span>
          <span>${escapeHTML(profile.school || 'School not added')}</span>
        </div>

        <div class="actions">

          <button
            class="action-btn ${isFollowing ? 'following' : 'follow'}"
            data-follow="${escapeHTML(profile.id)}"
            ${isBusy ? 'disabled' : ''}
          >
            ${isBusy
              ? 'Please wait...'
              : isFollowing
                ? '✓ Following'
                : '+ Follow'}
          </button>

          <a
            class="action-btn message"
            href="messages.html?user=${encodeURIComponent(profile.id)}"
          >
            Message
          </a>

        </div>

      </article>
    `;
  }).join('');
}

/* LOAD ALL USERS IN BATCHES */

async function loadAllUsers() {
  if (!currentUser || loading) return;

  loading = true;
  refreshBtn.disabled = true;

  profiles = [];
  peopleList.innerHTML = `
    <div class="status">
      <span class="status-icon">✦</span>
      Finding people across Campusora...
      <div class="progress-text">Loading profiles...</div>
    </div>
  `;

  try {
    let offset = 0;
    let loadedCount = 0;

    while (true) {
      const { data, error } = await supabase
        .from('profiles')
        .select('id, full_name, username, school, role, avatar_url')
        .neq('id', currentUser.id)
        .order('id', { ascending:true })
        .range(offset, offset + PAGE_SIZE - 1);

      if (error) throw error;

      const batch = data || [];

      if (batch.length === 0) break;

      const eligibleUsers = batch.filter(profile =>
        !followingIds.has(profile.id)
      );

      profiles.push(...eligibleUsers);

      loadedCount += batch.length;
      offset += batch.length;

      renderPeople();

      if (batch.length < PAGE_SIZE) break;

      // Brief pause between batches.
      await new Promise(resolve => setTimeout(resolve,30));
    }

    if (profiles.length === 0) {
      peopleList.innerHTML = `
        <div class="status">
          <span class="status-icon">◎</span>
          No new members to suggest right now.
        </div>
      `;
    }

    if (loadedCount > 0) {
      showMessage(
        'Loaded ' + profiles.length + ' people you can discover.'
      );
    }

  } catch (error) {
    console.error('Suggestions loading error:',error);

    if (profiles.length === 0) {
      peopleList.innerHTML = `
        <div class="status">
          <span class="status-icon">!</span>
          We couldn't load Campusora members.<br>
          Please try again.
        </div>
      `;
    }

    showMessage(
      error.message || 'Unable to load users.',
      'error'
    );

  } finally {
    loading = false;
    refreshBtn.disabled = false;
  }
}

/* FOLLOW AND UNFOLLOW */

async function toggleFollow(profileId) {
  if (!currentUser || busyIds.has(profileId)) return;

  const wasFollowing = followingIds.has(profileId);

  busyIds.add(profileId);
  renderPeople();

  try {
    if (wasFollowing) {
      const { error } = await supabase
        .from('follows')
        .delete()
        .eq('follower_id',currentUser.id)
        .eq('following_id',profileId);

      if (error) throw error;

      followingIds.delete(profileId);

      showMessage('You unfollowed this member.');

    } else {
      const { error } = await supabase
        .from('follows')
        .insert({
          follower_id:currentUser.id,
          following_id:profileId
        });

      if (error) throw error;

      followingIds.add(profileId);

      profiles = profiles.filter(profile =>
        profile.id !== profileId
      );

      showMessage('You are now following this member.');
    }

  } catch (error) {
    console.error('Follow error:',error);

    showMessage(
      error.message || 'Could not update your follow.',
      'error'
    );

  } finally {
    busyIds.delete(profileId);
    renderPeople();
  }
}

peopleList.addEventListener('click',event => {
  const button = event.target.closest('[data-follow]');

  if (button) {
    toggleFollow(button.dataset.follow);
  }
});

/* SEARCH */

searchToggle.addEventListener('click',() => {
  searchPanel.classList.toggle('open');

  if (searchPanel.classList.contains('open')) {
    searchInput.focus();
  } else {
    searchInput.value = '';
    renderPeople();
  }
});

searchInput.addEventListener('input',renderPeople);

/* REFRESH */

refreshBtn.addEventListener('click',loadAllUsers);

/* INITIALIZE */

async function initializeSuggestions() {
  try {
    const { data,error } = await supabase.auth.getUser();

    if (error) throw error;

    currentUser = data.user;

    if (!currentUser) {
      peopleList.innerHTML = `
        <div class="status">
          <span class="status-icon">◎</span>
          Please log in to discover Campusora members.
          <br>
          <a class="login-link" href="auth.html?mode=login">
            Log in to Campusora →
          </a>
        </div>
      `;

      refreshBtn.disabled = true;
      return;
    }

    const { data:follows,error:followError } = await supabase
      .from('follows')
      .select('following_id')
      .eq('follower_id',currentUser.id);

    if (followError) throw followError;

    followingIds = new Set(
      (follows || []).map(row => row.following_id)
    );

    await loadAllUsers();

  } catch (error) {
    console.error('Suggestions initialization error:',error);

    peopleList.innerHTML = `
      <div class="status">
        <span class="status-icon">!</span>
        Something went wrong while opening Suggestions.
      </div>
    `;

    showMessage(
      error.message || 'Could not open Suggestions.',
      'error'
    );
  }
}

initializeSuggestions();
</script>

</body>
  </html>
