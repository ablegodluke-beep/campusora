<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campusora Key Generator</title>
<style>
body{background:#080b18;color:white;font-family:Arial;padding:20px}
button{background:#7655ee;color:white;border:0;padding:14px;border-radius:9px;width:100%;margin:12px 0}
textarea{width:100%;height:75px;background:#151a30;color:white;border:1px solid #555;border-radius:8px;margin:8px 0;box-sizing:border-box;padding:10px}
</style>
</head>
<body>
<h2>Campusora Notification Keys</h2>
<p>Generate your keys once. Keep the private key secret.</p>
<button onclick="generate()">Generate Keys</button>
<p>Public Key</p>
<textarea id="pub" readonly></textarea>
<p>Private Key — Keep Secret</p>
<textarea id="priv" readonly></textarea>
<script>
function b64url(bytes){
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function generate(){
  try{
    const pair=await crypto.subtle.generateKey(
      {name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']
    );
    const publicKey=await crypto.subtle.exportKey('raw',pair.publicKey);
    const privateJwk=await crypto.subtle.exportKey('jwk',pair.privateKey);
    document.getElementById('pub').value=b64url(publicKey);
    document.getElementById('priv').value=privateJwk.d;
  }catch(e){
    alert('Open this page using Acode Preview or a secure browser page, then try again.');
  }
}
</script>
</body>
</html>
